及时完成工程签证，对变更或新增子项及时确定结算原则并按规定履行审核程序。","answer":"A","difficulty":"易","options":{"A":"过程结算","B":"进度结算","C":"竣工结算","D":"竣工决算","E":""},"explanation":"第十二条合同管理方（按管理权限，具体合同管理方是二级单位或项目单位）应及时组织开展过程结算，包括及时完成工程签证，对变更或新增子项及时确定结算原则并按规定履行审核程序。二级单位对项目单位按管理权限报送的结算事宜应及时审核批复。"},{"id":"161","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，当发现已签署的过程结算资料中有错、漏或重复问题时，合同管理方应组织有关各方及时复核并提出修正意见，在（）中予以修正。","answer":"A","difficulty":"易","options":{"A":"当期或下一期过程结算","B":"定期过程结算","C":"不定期过程结算","D":"双方签字盖章的合同结算书","E":""},"explanation":"第十三条当发现已签署的过程结算资料中有错、漏或重复问题时，合同管理方应组织有关各方及时复核并提出修正意见，在当期或下一期过程结算中予以修正。"},{"id":"162","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，完工结算应按规定时限完成。工程类合同，需在合同完工验收后（）个月内完成。","answer":"C","difficulty":"易","options":{"A":"1","B":"2","C":"3","D":"6","E":""},"explanation":"第十五条完工结算应按规定时限完成。工程类合同，需在合同完工验收后3 个月内完成；货物类、服务类合同应在合同约定工作内容实施完成后1 个月内完成。"},{"id":"163","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，完工结算应按规定时限完成。货物类、服务类合同应在合同约定工作内容实施完成后（）个月内完成。","answer":"A","difficulty":"易","options":{"A":"1","B":"2","C":"3","D":"6","E":""},"explanation":"第十五条完工结算应按规定时限完成。工程类合同，需在合同完工验收后3 个月内完成；货物类、服务类合同应在合同约定工作内容实施完成后1 个月内完成。"},{"id":"164","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，完工结算因特殊情况需推迟的，合同管理方须编制完工结算计划，明确阶段工作要求，（）向上级单位报告工程结算完成情况，并不得影响工程竣工决算报告编制的进度。","answer":"A","difficulty":"易","options":{"A":"每月","B":"每季度","C":"每半年","D":"不定期","E":""},"explanation":"第十六条完工结算因特殊情况需推迟的，合同管理方须编制完工结算计划，明确阶段工作要求（工程量清理、甲供材核销、一般变更及索赔补偿类审核、较大争议事项等），每月向上级单位报告工程结算完成情况（详见附件2），并不得影响工程竣工决算报告编制的进度。"},{"id":"165","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，项目第一台机组投产后，二级单位应组织项目单位在（）个月内完成工程竣工结算报告编制大纲，明确工作原则、任务分工及工作计划；项目全部机组投产后，在规定时间内应完成工程竣工结算报告。","answer":"A","difficulty":"易","options":{"A":"1","B":"2","C":"3","D":"6","E":""},"explanation":"第二十二条项目第一台机组投产后，二级单位应组织项目单位在1 个月内完成工程竣工结算报告编制大纲，明确工作原则、任务分工及工作计划；项目全部机组投产后，在规定时间内应完成工程竣工结算报告。"},{"id":"166","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，竣工结算报告中，已签订合同的按（）计列，收尾项目和预留费用（）计列。","answer":"A","difficulty":"易","options":{"A":"合同结算金额、按规定的审批情况","B":"合同金额、按规定的审批情况","C":"合同结算金额、合同金额","D":"合同结算金额、预计金额","E":""},"explanation":"第二十三条竣工结算报告中，已签订合同的按合同结算金额计列，收尾项目和预留费用按规定的审批情况计列。"},{"id":"167","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，竣工结算报告是考核造价管理和计列收尾项目投资计划的依据。全部机组投产超过（）年的，收尾项目投资计划以报备的竣工结算报告为基础；竣工结算金额超过集团公司批准设计概算，未经审批的以批准设计概算作为投资、资金预算上限，已经审批的按审批金额作为投资、资金预算上限。","answer":"B","difficulty":"易","options":{"A":"0.5","B":"1","C":"1.5","D":"2","E":""},"explanation":"第二十四条竣工结算报告是考核造价管理和计列收尾项目投资计划的依据。全部机组投产超过1 年的，收尾项目投资计划以报备的竣工结算报告为基础；竣工结算金额超过集团公司批准设计概算，未经审批的以批准设计概算作为投资、资金预算上限，已经审批的按审批金额作为投资、资金预算上限。"},{"id":"168","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，工程结算违反国家有关法律法规、企业内部规章制度，造成（）的，按《中国华能集团有限公司违规经营投资责任追究管理办法》追究管理责任。","answer":"A","difficulty":"易","options":{"A":"资产损失","B":"严重超概","C":"预备费超概","D":"投资浪费","E":""},"explanation":"第二十九条工程结算违反国家有关法律法规、企业内部规章制度，造成资产损失的，按《中国华能集团有限公司违规经营投资责任追究管理办法》追究管理责任。"},{"id":"169","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，造价咨询单位不替代基层企业的造价管理责任。（）的主要职责包括按照管理权限组织或参与造价咨询服务的采购管理。","answer":"C","difficulty":"易","options":{"A":"造价单位","B":"建设单位","C":"项目单位","D":"上级公司","E":""},"explanation":"第八条项目单位是火电工程造价咨询执行的责任主体，负责具体管理造价咨询单位。造价咨询单位不替代基层企业的造价管理责任。主要职责包括：（一）按照管理权限组织或参与造价咨询服务的采购管理。\n（二）组织编制火电工程造价咨询工作要求，明确造价咨询范围、工作内容及工作进度等。\n（三）根据管理权限，审查、批准造价咨询单位提交的造价咨询工作实施方案和计划，审核造价咨询单位的成果文件。\n（四）根据咨询成果，落实相关造价管理措施。\n（五）提供与造价咨询相关的基础资料和文件，组织协调现场参建单位配合造价咨询单位开展工作。\n（六）定期组织整理典型项目处理案例，并报二级单位。\n（七）定期对造价咨询单位工作情况进行考核评价，并向二级单位报告考核评价信息。"},{"id":"170","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，火电工程完成（）程序后，即可组织采购和开展基建期造价咨询。","answer":"A","difficulty":"中","options":{"A":"投资决策","B":"初设批复","C":"开工批复","D":"项目核准","E":""},"explanation":"第十条火电工程完成投资决策程序后，即可组织采购和开展基建期造价咨询。"},{"id":"171","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，基建期的全过程造价咨询范围不得随意增加工程造价咨询专业以外的内容。项目单位调整全过程造价咨询服务范围（包括增减），须取得（）的确认。","answer":"D","difficulty":"易","options":{"A":"造价单位","B":"建设单位","C":"项目单位","D":"二级单位","E":""},"explanation":"第十五条基建期的全过程造价咨询范围不得随意增加工程造价咨询专业以外的内容。项目单位调整全过程造价咨询服务范围（包括增减），须取得二级单位的确认。"},{"id":"172","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，造价咨询成果的内容、深度及提交时间等应满足对项目（）的要求。","answer":"B","difficulty":"难","options":{"A":"造价管理","B":"造价管控","C":"项目建设","D":"节约资金","E":""},"explanation":"第十九条造价咨询成果的内容、深度及提交时间等应满足对项目造价管控的要求。"},{"id":"173","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，造价咨询成果经（）确认前，不得向咨询合同以外的单位或人员透露。","answer":"C","difficulty":"难","options":{"A":"造价单位","B":"项目单位","C":"合同管理方","D":"施工方","E":""},"explanation":"第二十条造价咨询成果经合同管理方确认前，不得向咨询合同以外的单位或人员透露。"},{"id":"174","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，因造价咨询单位工作质量、工作纪律等原因，对项目造价管理造成重大不良影响的，造价咨询（）有权解除合同，并按集团公司供应商管理的相关规定进行处理。","answer":"D","difficulty":"难","options":{"A":"造价单位","B":"项目单位","C":"施工方","D":"合同管理方","E":""},"explanation":"第二十四条因造价咨询单位工作质量、工作纪律等原因，对项目造价管理造成重大不良影响的，造价咨询合同管理方有权解除合同，并按集团公司供应商管理的相关规定进行处理。"},{"id":"175","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定，（）是火电工程概算执行分析管理的责任主体，负责审核概算执行分析报告，提出审核意见和组织落实管理措施，并将审核后的概算执行分析报告报送集团公司备案。","answer":"A","difficulty":"易","options":{"A":"二级单位","B":"造价单位","C":"项目单位","D":"施工单位","E":""},"explanation":"第八条二级单位是火电工程概算执行分析管理的责任主体，负责审核概算执行分析报告，提出审核意见和组织落实管理措施，并将审核后的概算执行分析报告报送集团公司备案。"},{"id":"176","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定，（）是火电工程概算执行的责任主体，负责具体开展概算执行分析工作，并编制概算执行分析报告，对其真实性、准确性、合规性负责。","answer":"C","difficulty":"易","options":{"A":"二级单位","B":"造价单位","C":"项目单位","D":"施工单位","E":""},"explanation":"第九条项目单位是火电工程概算执行的责任主体，负责具体开展概算执行分析工作，并编制概算执行分析报告，对其真实性、准确性、合规性负责；定期召开概算执行专题会，分析实施阶段造价与概算的差异和原因；讨论和研究概算执行中的重点难点问题；制定针对性管理措施，并在工程建设中督促落实。"},{"id":"177","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定，（）定期召开概算执行专题会，分析实施阶段造价与概算的差异和原因；讨论和研究概算执行中的重点难点问题；制定针对性管理措施，并在工程建设中督促落实。","answer":"C","difficulty":"易","options":{"A":"二级单位","B":"造价单位","C":"项目单位","D":"施工单位","E":""},"explanation":"第九条项目单位是火电工程概算执行的责任主体，负责具体开展概算执行分析工作，并编制概算执行分析报告，对其真实性、准确性、合规性负责；定期召开概算执行专题会，分析实施阶段造价与概算的差异和原因；讨论和研究概算执行中的重点难点问题；制定针对性管理措施，并在工程建设中督促落实。"},{"id":"178","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定，当预计造价未超初设概算时，重点与初设概算、（）进行对比分析；当预计造价超过初设概算时，须增加与投资决策阶段投资的对比分析。","answer":"B","difficulty":"中","options":{"A":"批复概算","B":"管理概算","C":"成本概算","D":"设计概算","E":""},"explanation":"第十一条当预计造价未超初设概算时，重点与初设概算、管理概算进行对比分析；当预计造价超过初设概算时，须增加与投资决策阶段投资的对比分析。"},{"id":"179","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定，涉及单项超概或结余达到对应初设概算（）%以上的，应对相关子项的设计变更、工程量变化等偏差原因进行深入分析。","answer":"B","difficulty":"难","options":{"A":"5","B":"10","C":"15","D":"20","E":""},"explanation":"第十二条涉及单项超概或结余达到对应初设概算10%以上的，应对相关子项的设计变更、工程量变化等偏差原因进行深入分析。"},{"id":"180","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定， 对建设工期（）年及以上项目，项目单位须按照时间节点编制概算执行分析报告。","answer":"D","difficulty":"难","options":{"A":"0.5","B":"1","C":"1.5","D":"2","E":""},"explanation":"第十五条对建设工期2 年及以上项目，项目单位须在以下时间节点编制概算执行分析报告。\n（一）初设收口后1 个月。分析报告主要对实施情况或预测量价与初设概算、投资决策投资进行对比，分析存在的差异和原因，提出相应的管理措施。\n（二）初设收口6 个月后或每年9 月底。分析报告需增加实施情况或预测量价与管理概算的对比分析，并增加造价动态管理台账、设计变更台账等内容（包括附表和专项分析表）。\n结合下年度投资计划，预测造价总体情况。\n（三）首台（套）机组投产当月。分析报告应结合首台（套）机组投产情况，预测工程造价。\n（四）全部机组投产后3 个月。分析报告应结合工程投产后的结算情况，增加工程竣工结算的计划安排和进展情况，基本达到工程竣工结算报告的深度。\n每年9 月底提交的分析报告与以上要求的节点时间重合或前后间隔1 个月内的，可合并编写。"},{"id":"181","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定， 初设收口后（） 个月。分析报告主要对实施情况或预测量价与初设概算、投资决策投资进行对比，分析存在的差异和原因，提出相应的管理措施。","answer":"A","difficulty":"难","options":{"A":"1","B":"2","C":"3","D":"6","E":""},"explanation":"第十五条对建设工期2 年及以上项目，项目单位须在以下时间节点编制概算执行分析报告。\n（一）初设收口后1 个月。分析报告主要对实施情况或预测量价与初设概算、投资决策投资进行对比，分析存在的差异和原因，提出相应的管理措施。\n（二）初设收口6 个月后或每年9 月底。分析报告需增加实施情况或预测量价与管理概算的对比分析，并增加造价动态管理台账、设计变更台账等内容（包括附表和专项分析表）。\n结合下年度投资计划，预测造价总体情况。\n（三）首台（套）机组投产当月。分析报告应结合首台（套）机组投产情况，预测工程造价。\n（四）全部机组投产后3 个月。分析报告应结合工程投产后的结算情况，增加工程竣工结算的计划安排和进展情况，基本达到工程竣工结算报告的深度。\n每年9 月底提交的分析报告与以上要求的节点时间重合或前后间隔1 个月内的，可合并编写。"},{"id":"182","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定，初设收口（）。分析报告需增加实施情况或预测量价与管理概算的对比分析，并增加造价动态管理台账、设计变更台账等内容（包括附表和专项分析表）。结合下年度投资计划，预测造价总体情况","answer":"A","difficulty":"难","options":{"A":"6 个月后或每年9 月底","B":"3个月后或每年6 月底","C":"3 个月后或每年9 月底","D":"6 个月后或每年6 月底","E":""},"explanation":"第十五条对建设工期2 年及以上项目，项目单位须在以下时间节点编制概算执行分析报告。\n（一）初设收口后1 个月。分析报告主要对实施情况或预测量价与初设概算、投资决策投资进行对比，分析存在的差异和原因，提出相应的管理措施。\n（二）初设收口6 个月后或每年9 月底。分析报告需增加实施情况或预测量价与管理概算的对比分析，并增加造价动态管理台账、设计变更台账等内容（包括附表和专项分析表）。结合下年度投资计划，预测造价总体情况。\n（三）首台（套）机组投产当月。分析报告应结合首台（套）机组投产情况，预测工程造价。\n（四）全部机组投产后3 个月。分析报告应结合工程投产后的结算情况，增加工程竣工结算的计划安排和进展情况，基本达到工程竣工结算报告的深度。\n每年9 月底提交的分析报告与以上要求的节点时间重合或前后间隔1 个月内的，可合并编写。"},{"id":"183","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定， 全部机组投产后（） 个月。分析报告应结合工程投产后的结算情况，增加工程竣工结算的计划安排和进展情况，基本达到工程竣工结算报告的深度。","answer":"A","difficulty":"难","options":{"A":"3","B":"6","C":"9","D":"1年","E":""},"explanation":"第十五条对建设工期2 年及以上项目，项目单位须在以下时间节点编制概算执行分析报告。\n（一）初设收口后1 个月。分析报告主要对实施情况或预测量价与初设概算、投资决策投资进行对比，分析存在的差异和原因，提出相应的管理措施。\n（二）初设收口6 个月后或每年9 月底。分析报告需增加实施情况或预测量价与管理概算的对比分析，并增加造价动态管理台账、设计变更台账等内容（包括附表和专项分析表）。\n结合下年度投资计划，预测造价总体情况。\n（三）首台（套）机组投产当月。分析报告应结合首台（套）机组投产情况，预测工程造价。\n（四）全部机组投产后3 个月。分析报告应结合工程投产后的结算情况，增加工程竣工结算的计划安排和进展情况，基本达到工程竣工结算报告的深度。\n每年9 月底提交的分析报告与以上要求的节点时间重合或前后间隔1 个月内的，可合并编写。"},{"id":"184","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定， （）编制的概算执行分析报告上报二级单位审核，二级单位审核后报集团公司备案。","answer":"A","difficulty":"易","options":{"A":"项目单位","B":"施工单位","C":"建设单位","D":"造价单位","E":""},"explanation":"第十九条项目单位编制的概算执行分析报告报送二级单位审核，二级单位审核后报集团公司备案。备案频次与本细则第十五条要求一致。"},{"id":"185","question":"根据《中国华能集团有限公司火电基本建设工程施工准备及开工管理办法》，主体设计单位招标条件。投资建议书已经（）审议通过。","answer":"B","difficulty":"易","options":{"A":"集团公司董事会","B":"集团公司投资委员会","C":"总经理办公会","D":"工程管理部","E":""},"explanation":"第八条主体设计单位招标条件。项目已列入国家或所在省（直辖市、自治区）电力发展规划及年度建设规模；可行性研究报告已经审批单位批准；投资建议书已经集团公司投资委员会审议通过。"},{"id":"186","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，基本预备费的计算基准不包含以下哪一项？","answer":"C","difficulty":"中","options":{"A":"建筑工程费","B":"设备购置费","C":"价差预备费","D":"其他费用","E":""},"explanation":"基本预备费以建筑工程费、安装工程费、设备购置费及其他费用之和为计算基准。价差预备费属于动态费用，不在此基准内。"},{"id":"187","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，生产职工培训及提前进厂费属于（ ）。","answer":"C","difficulty":"中","options":{"A":"项目建设管理费","B":"建筑工程费","C":"生产准备费","D":"建设场地占用及清理费","E":""},"explanation":"根据2018年版编规，生产职工培训及提前进厂费是为了保障电厂投产后能正常运行而发生的费用，归属于生产准备费。"},{"id":"188","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，社会保险费属于建筑安装工程费中的（ ）。","answer":"B","difficulty":"易","options":{"A":"措施费","B":"规费","C":"企业管理费","D":"人工费","E":""},"explanation":"建安工程费中的社会保险费（包括养老、失业、医疗、生育、工伤保险）和住房公积金属于规费。"},{"id":"189","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，安全文明施工费在计价时（ ）。","answer":"A","difficulty":"易","options":{"A":"必须按国家或有关部门规定计算，不得作为竞争性费用","B":"可以由投标人根据自身情况自主报价","C":"应作为竞争性费用进行下浮","D":"可以包含在综合单价中进行报价","E":""},"explanation":"安全文明施工费、规费和税金作为国家强制性规定，不得作为竞争性费用。"},{"id":"190","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程施工期间导致的人工费、材料费等增加，如果是因为发包人原因造成的工程延期，则这部分增加的费用应当由（ ）承担。","answer":"A","difficulty":"易","options":{"A":"发包人","B":"承包人","C":"监理人","D":"设计人","E":""},"explanation":"因发包人原因造成的工程延期及费用增加，应由发包人承担并给予承包人相应的费用补偿。"},{"id":"191","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，火电工程中，项目法人管理费的计算基准通常是（ ）。","answer":"B","difficulty":"中","options":{"A":"建筑工程费","B":"建筑工程费+安装工程费","C":"静态投资","D":"建筑工程费+安装工程费+设备购置费","E":""},"explanation":"根据2018版编规，项目法人管理费一般以建筑工程费、安装工程费之和为计算基准乘以对应费率计算。"},{"id":"192","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，工器具及办公家具购置费属于（ ）。","answer":"B","difficulty":"易","options":{"A":"项目建设管理费","B":"生产准备费","C":"建设场地占用费","D":"设备购置费","E":""},"explanation":"生产准备费包括 管理车辆购置费、工器具及办公家具购置费、生产职工培训及提前进厂费。"},{"id":"193","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，火力发电建设工程中，建设场地占用及清理费不包括（ ）。","answer":"D","difficulty":"中","options":{"A":"土地征用及补偿费","B":"施工场地租用费","C":"场地清理及绿化补偿费","D":"大型机械进出场及安拆费","E":""},"explanation":"大型机械进出场及安拆费属于建筑安装工程费中的措施项目费，不属于建设场地占用及清理费。"},{"id":"194","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，暂列金额应由（ ）掌握使用。","answer":"B","difficulty":"中","options":{"A":"承包人","B":"发包人","C":"监理人","D":"造价咨询人","E":""},"explanation":"暂列金额是招标人在工程量清单中暂定并包括在合同价款中的一笔款项，由发包人掌握使用。"},{"id":"195","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，静态投资的构成中不包括（ ）。","answer":"C","difficulty":"易","options":{"A":"安装工程费","B":"其他费用","C":"建设期利息","D":"基本预备费","E":""},"explanation":"静态投资包括建筑工程费、安装工程费、设备购置费、其他费用、基本预备费。建设期利息属于动态费用。"},{"id":"196","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，整套启动试运费属于火电工程建设预算费用类别中的（ ）。","answer":"B","difficulty":"中","options":{"A":"安装工程费","B":"其他费用","C":"设备购置费","D":"建筑工程费","E":""},"explanation":"其他费用是指为完成工程项目建设所必需的 但不属千建筑工程费、安装工程费、设备购置费 基本预备费的其他相关费用。包括建设场地征用及清理费、项目建设管理费、项目建设技术服务费、整套启动试运费、生产准备费、大件运输措施费。"},{"id":"197","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在招标投标阶段，用于支付必然发生但暂时不能确定价格的材料、工程设备的单价以及专业工程的金额是（ ）。","answer":"B","difficulty":"难","options":{"A":"暂列金额","B":"暂估价","C":"计日工","D":"总承包服务费","E":""},"explanation":"暂估价是指招标人在工程量清单中提供的用于支付必然发生但暂时不能确定价格的材料等的单价以及专业工程的金额。"},{"id":"198","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，单机试运转发生的费用通常计入（ ）。","answer":"C","difficulty":"中","options":{"A":"基本预备费","B":"项目建设管理费","C":"安装工程费","D":"生产准备费","E":""},"explanation":"单机试车（试运转）是安装施工全过程的一个环节，其费用通常包含在安装工程费中。"},{"id":"199","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），分部分项工程量清单的项目编码应采用（ ）位阿拉伯数字表示。","answer":"C","difficulty":"中","options":{"A":"9","B":"10","C":"12","D":"14","E":""},"explanation":"我国工程量清单计价规范统一规定，项目编码采用12位阿拉伯数字表示。"},{"id":"200","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，对于实行招标的电力建设工程，其基准日通常确定为（ ）。","answer":"B","difficulty":"难","options":{"A":"招标文件发出之日","B":"投标截止日前28天","C":"中标通知书发出之日","D":"合同签订之日","E":""},"explanation":"为了公平分配风险，招标工程的计价规范通用规定是以投标截止日前28天作为基准日。"},{"id":"201","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，工程监理费属于（ ）。","answer":"A","difficulty":"易","options":{"A":"项目建设管理费","B":"建筑工程费","C":"安装工程费","D":"生产准备费","E":""},"explanation":"工程监理费是聘请监理单位进行工程质量、进度、投资控制的费用，属于其他费中的项目建设管理费。"},{"id":"202","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），发包人在工程量清单中暂定并包括在合同价款中，用于施工合同签订时尚未确定或者不可预见的所需材料、工程设备、服务的采购，施工中可能发生的工程变更等的费用称为（ ）。","answer":"C","difficulty":"中","options":{"A":"暂估价","B":"计日工","C":"暂列金额","D":"预备费","E":""},"explanation":"该定义是清单计价规范对暂列金额的标准定义。"},{"id":"203","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程费的人工费中不包含的内容是（ ）。","answer":"D","difficulty":"中","options":{"A":"计时工资或计件工资","B":"奖金及津贴补贴","C":"加班加点工资","D":"工会经费","E":""},"explanation":"工会经费属于企业管理费的范畴，不直接计算在生产工人的建安人工费单价中。"},{"id":"204","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，工程初步设计及概算文件的编制费用属于（ ）。","answer":"D","difficulty":"易","options":{"A":"建筑工程费","B":"设备购置费","C":"项目建设管理费","D":"勘察设计费","E":""},"explanation":"勘察设计费属于其他费用中的独立一项，主要包含勘察费、设计费及相关文件的编制费用。"},{"id":"205","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，因不可抗力事件导致承包人自有施工机具的损坏及停工损失，应由（ ）承担。","answer":"B","difficulty":"中","options":{"A":"发包人","B":"承包人","C":"发承包双方共同","D":"监理人","E":""},"explanation":"根据清单计价规范及通用合同条款，因不可抗力导致的承包人施工机械设备的损坏及停工损失，由承包人承担。"},{"id":"206","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下不属于基本预备费使用范围的是（ ）。","answer":"D","difficulty":"易","options":{"A":"一般自然灾害造成的损失","B":"设计变更增加的工程费用","C":"为预防自然灾害所采取的措施费","D":"设备和材料的价差预备费","E":""},"explanation":"基本预备费不包括因物价变动或汇率变化引起的价差预备费，价差预备费在动态费用中单列。"},{"id":"207","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在火电工程建设预算中，随主设备一次购进的备品备件费用通常应计入（ ）。","answer":"A","difficulty":"易","options":{"A":"设备购置费","B":"安装工程费","C":"生产准备费","D":"其他费用","E":""},"explanation":"随主设备一次购进且为保证投产初期正常运行的首套备品备件及专用工具，应计算在设备购置费中。"},{"id":"208","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当因工程量偏差引起的对应清单项目的工程量增加超过（ ）时，其综合单价应予以调整。","answer":"C","difficulty":"中","options":{"A":"0.05","B":"0.1","C":"0.15","D":"0.2","E":""},"explanation":"工程量清单计价规范通常规定，当工程量偏差超过15%时，发承包双方应调整综合单价以分担风险。"},{"id":"209","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，施工场地租用费归类于（ ）。","answer":"B","difficulty":"中","options":{"A":"项目建设管理费","B":"建设场地占用及清理费","C":"施工企业管理费","D":"建筑安装工程费的措施费","E":""},"explanation":"属于发包人为了获取建设场地和保证正常施工所发生的费用，归列在其他费用中的建设场地占用及清理费中。"},{"id":"210","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，如果某项清单工程量增加超过了15%，在进行该部分工程量结算时，其增加部分工程量的综合单价通常应（ ）。","answer":"B","difficulty":"难","options":{"A":"予以调高","B":"予以调低","C":"保持原价不变","D":"重新按市场价计算","E":""},"explanation":"为限制承包人因工程量大幅增加而获得超额不合理利润，当工程量增加超过15%时，增加部分的综合单价应予以调低。"},{"id":"211","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在火力发电工程预算中，用于劳动安全卫生的评价费用属于（ ）。","answer":"A","difficulty":"中","options":{"A":"项目建设技术服务费","B":"项目建设管理费","C":"生产准备费","D":"勘察设计费","E":""},"explanation":"劳动安全卫生评价费、环境影响评价费等属于前期及建设期发生的技术支持与评估费用，归于项目建设技术服务费。"},{"id":"212","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，投标人的投标报价不得低于（ ）。","answer":"C","difficulty":"易","options":{"A":"标底","B":"招标控制价","C":"工程成本","D":"预算定额基价","E":""},"explanation":"《招标投标法》及计价规范均明确要求，投标报价不得低于工程成本，以此防范恶性低价竞争和“豆腐渣”工程。"},{"id":"213","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，安装工程的冬雨季施工增加费的计算基数是（ ）。","answer":"A","difficulty":"中","options":{"A":"人工费","B":"人工费+施工机具使用费","C":"直接工程费","D":"人工费+材料费","E":""},"explanation":"根据建筑安装工程费计算标准，冬雨季施工增加费和夜间施工增加费等措施项目费用，均以人工费为计算基准乘以相应费率。"},{"id":"214","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装企业缴纳的印花税通常包含在建安工程费用的（ ）之中。","answer":"C","difficulty":"中","options":{"A":"规费","B":"税金（增值税）","C":"企业管理费","D":"措施费","E":""},"explanation":"施工企业发生的企业所得税、印花税、城市维护建设税等属于企业管理费，不应与工程计价单独单列的“税金”（如增值税）混淆。"},{"id":"215","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，安装工程的夜间施工增加费的计算基准通常为（ ）。","answer":"A","difficulty":"中","options":{"A":"人工费","B":"直接费","C":"人工费+机械费","D":"建安工程总价","E":""},"explanation":"夜间施工增加费是为保证夜间施工质量和安全而发生的照明等费用，按现行编规，此类措施费以人工费或直接工程费为基数计算。"},{"id":"216","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，某电力工程在施工期间因国家相关税收法律发生变化导致工程造价增加，根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，此项增加的风险和费用应由（ ）承担。","answer":"B","difficulty":"易","options":{"A":"承包人","B":"发包人","C":"发承包双方均摊","D":"政府税务部门","E":""},"explanation":"法律、法规及国家政策变化引发的工程造价波动属于不可预见的外部政策风险，按规定由发包人承担。"},{"id":"217","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，大件运输措施费属于（ ）。","answer":"B","difficulty":"中","options":{"A":"设备购置费","B":"其他费用","C":"建筑安装工程费中的措施费","D":"项目建设技术服务费","E":""},"explanation":"大件设备的运输进场及超限设备所采取的桥梁加固等技术措施费用，属于建安工程费中的措施费范畴。"},{"id":"218","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程保修期自（ ）之日起计算。","answer":"C","difficulty":"中","options":{"A":"工程完工交付","B":"提交竣工结算文件","C":"竣工验收合格","D":"试运行结束","E":""},"explanation":"工程质量保修期从工程实际竣工验收合格、发包方正式接收标的物之日起开始计算。"},{"id":"219","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当出现已标价工程量清单中没有适用也没有类似于变更工程项目的单价时，其新增项目单价应（ ）。","answer":"A","difficulty":"难","options":{"A":"由承包人提出，经发包人确认后执行","B":"由监理人直接确定","C":"按行业指导价或预算定额强制执行","D":"由造价管理部门裁定","E":""},"explanation":"按清单计价规范的变更处理原则，无适用或类似单价时，应由承包人根据市场价格或成本加利润原则提出，发包人确认后作为结算依据。"},{"id":"220","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），用于编制初步设计概算的核心定额依据是（ ）。","answer":"C","difficulty":"易","options":{"A":"施工定额","B":"预算定额","C":"概算定额","D":"估算指标","E":""},"explanation":"初步设计阶段图纸深度有限，应采用相匹配的“概算定额”进行工程造价文件的编制。"},{"id":"221","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下属于建筑工程费的是（ ）。","answer":"A","difficulty":"中","options":{"A":"主厂房基础及上部结构工程","B":"发电机组设备采购","C":"变压器安装工程","D":"联合试运转工程","E":""},"explanation":"建筑工程费主要包括构成各项工程实体的费用，主厂房基础及上部结构属于典型的建筑工程。选项B属于设备费，选项C属于安装费，选项D属于其他费用。"},{"id":"222","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人在工程量清单中暂定并包括在合同价款中，用于支付必然发生但暂时不能确定价格的材料单价属于（ ）。","answer":"C","difficulty":"中","options":{"A":"暂列金额","B":"计日工","C":"暂估价","D":"总承包服务费","E":""},"explanation":"暂估价是指招标人在工程量清单中提供的用于支付必然发生但暂时不能确定价格的材料和工程设备单价以及专业工程金额。"},{"id":"223","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，设备购置费由设备原价和（ ）构成。","answer":"B","difficulty":"易","options":{"A":"采购保管费","B":"设备运杂费","C":"检验试验费","D":"运输保险费","E":""},"explanation":"设备购置费是指为工程建设项目购置或自制的达到固定资产标准的设备所发生的费用，由设备原价和设备运杂费组成。"},{"id":"224","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，招标工程量清单必须作为（ ）的组成部分，其准确性和完整性由招标人负责。","answer":"A","difficulty":"易","options":{"A":"招标文件","B":"投标文件","C":"施工合同","D":"竣工图纸","E":""},"explanation":"招标工程量清单是招标文件的组成部分，招标人对其准确性和完整性负责，这是清单计价的基本原则。"},{"id":"225","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，火力发电工程建设中，施工企业办公费应计入（ ）。","answer":"C","difficulty":"中","options":{"A":"人工费","B":"措施费","C":"企业管理费","D":"规费","E":""},"explanation":"施工企业办公费属于企业管理费，是建筑安装企业组织施工生产和经营管理所需发生的费用。"},{"id":"226","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人建议的工程变更若引起竣工日期延误，则（ ）。","answer":"D","difficulty":"难","options":{"A":"由发包人承担全部费用但不顺延工期","B":"由承包人承担违约责任","C":"发承包双方共同承担损失","D":"发包人应承担增加的费用和延误的工期","E":""},"explanation":"发包人提出工程变更导致工期延误的，属于发包人责任，不仅应当承担增加的工程费用，还应当顺延相应的工期。"},{"id":"227","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，安装工程的特殊地区施工增加费的计算基础一般为（ ）。","answer":"A","difficulty":"中","options":{"A":"人工费","B":"直接工程费","C":"人工费加施工机具使用费","D":"建筑安装工程费","E":""},"explanation":"高海拔、极寒等特殊地区施工增加费，同属于措施费类别，其安装工程的计算基准一般为人工费。"},{"id":"228","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程索赔中，承包人必须在知道或应当知道索赔事件发生后（ ）天内，向监理人递交索赔意向通知书。","answer":"C","difficulty":"中","options":{"A":"7","B":"14","C":"28","D":"42","E":""},"explanation":"按照通用合同条款及清单计价规范索赔程序，承包人应在索赔事件发生后28天内发出索赔意向通知，逾期则丧失索赔权利。"},{"id":"229","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，火力发电工程中，项目建设期末进行整套启动试运行所发生的空负荷试运费用属于（ ）。","answer":"B","difficulty":"中","options":{"A":"安装工程费","B":"其他费用","C":"基本预备费","D":"生产准备费","E":""},"explanation":"整套启动试运转及带负荷试运转的支出和收入差额属于联合试运转费，该费用在预算中单列于其他费用之中。"},{"id":"230","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于投标报价的编制原则，下列说法错误的是（ ）。","answer":"D","difficulty":"易","options":{"A":"必须以招标工程量清单为依据","B":"不得低于工程成本","C":"规费和税金不得作为竞争性费用","D":"安全文明施工费可以作为竞争性费用自主下浮","E":""},"explanation":"安全文明施工费属于国家强制性规定收取的费用，在投标报价时必须按规定计算，绝对不可作为竞争性费用进行下浮或变相降低。"},{"id":"231","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，工程结算审核费一般在（ ）中列支。","answer":"A","difficulty":"中","options":{"A":"项目建设管理费","B":"项目建设技术服务费","C":"基本预备费","D":"企业管理费","E":""},"explanation":"工程结算审核等造价咨询服务费用属于项目法人为管理项目所发生的费用，归列在其他费中的项目建设管理费项下。"},{"id":"232","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发承包双方确认的施工过程结算报告是（ ）的组成部分。","answer":"C","difficulty":"难","options":{"A":"招投标文件","B":"合同协议书","C":"竣工结算文件","D":"审计报告","E":""},"explanation":"根据DL/T 5745-2021的新增规定，施工过程结算文件经发承包双方确认后，即作为工程竣工结算文件的有效组成部分，竣工结算时不再重新复核。"},{"id":"233","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，计算建设期利息时，通常假设当年借款在年中支用，因此当年借款按（ ）计息。","answer":"B","difficulty":"易","options":{"A":"全年","B":"半年","C":"不计息","D":"季度","E":""},"explanation":"根据财务评价和预算编制规范，由于借款在年内均衡发生，为了简化计算，当年借款额按半年计算建设期利息，以前年度借款按全年计息。"},{"id":"234","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，最高投标限价（招标控制价）如果超过批准的概算，应当（ ）。","answer":"D","difficulty":"中","options":{"A":"自行调低限价","B":"向投标人说明原因","C":"宣布废标","D":"报原概算审批部门重新审核","E":""},"explanation":"当招标控制价超过批准的概算时，招标人应将其报原概算审批部门审核，不能擅自进行招标以防投资失控。"},{"id":"235","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，火力发电工程预算中，用于补偿施工企业在特定环境下搭设临时设施的费用计入（ ）。","answer":"A","difficulty":"易","options":{"A":"临时设施费","B":"施工企业管理费","C":"场地占用费","D":"安全文明施工费","E":""},"explanation":"临时设施费属于建筑安装工程措施费之一，用于施工企业为进行建筑安装工程施工所必须的生活和生产用的临时建筑物的搭设与摊销。"},{"id":"236","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程量清单的每一个子目都必须具有（ ）的项目编码。","answer":"B","difficulty":"中","options":{"A":"唯一","B":"全国统一规范","C":"企业内部自定义","D":"地区统一","E":""},"explanation":"按照清单计价规范要求，分部分项工程量清单的项目编码应采用十二位阿拉伯数字，且在同一个工程量清单中必须是唯一的。"},{"id":"237","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，项目法人发生的前期工作费属于（ ）。","answer":"B","difficulty":"易","options":{"A":"建筑工程费","B":"其他费用","C":"安装工程费","D":"基本预备费","E":""},"explanation":"前期工作费是指工程项目在正式立项前进行初步可行性研究及有关论证等发生的费用，列入建设预算的其他费用中。"},{"id":"238","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，缺陷责任期最长不超过（ ）。","answer":"C","difficulty":"中","options":{"A":"6个月","B":"12个月","C":"24个月","D":"36个月","E":""},"explanation":"按国家及行业现行有关规定，工程缺陷责任期从工程通过竣工验收之日起计算，最长不超过24个月（即2年）。"},{"id":"239","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，火力发电工程中，施工用水用电系统的建设及运行维护费用应主要考虑在（ ）中。","answer":"D","difficulty":"难","options":{"A":"企业管理费","B":"水土保持费","C":"建设场地占用费","D":"临时设施费","E":""},"explanation":"施工单位在现场构建的生活及生产用的水、电等临时系统及其摊销，属于建筑安装工程措施项目中的临时设施费。"},{"id":"240","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，清单计价模式下，工程索赔费用的确认应以（ ）为首要原则。","answer":"A","difficulty":"易","options":{"A":"合同约定","B":"造价管理部门解释","C":"经验法则","D":"施工方实际成本","E":""},"explanation":"发承包双方在处理工程索赔及价款调整时，必须首要遵循合同条款的约定，这体现了契约精神和清单计价的基本准则。"},{"id":"241","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程费中“利润”的计算基数是（ ）。","answer":"B","difficulty":"中","options":{"A":"人工费","B":"人工费与施工机具使用费之和","C":"直接费与间接费之和","D":"人工费与材料费之和","E":""},"explanation":"根据2018年版编规，建筑安装企业利润的计算基准是以直接费与间接费之和为基数乘以相应费率计算。"},{"id":"242","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人累计扣留的质量保证金通常不得超过工程价款结算总额的（ ）。","answer":"B","difficulty":"易","options":{"A":"0.02","B":"0.03","C":"0.05","D":"0.1","E":""},"explanation":"清单计价规范及国家相关建设工程质保金管理办法明确规定，发包人扣留的质量保证金不得超过工程价款结算总额的3%。"},{"id":"243","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），编制初步设计概算时，应当以（ ）作为价格水平的基准日期。","answer":"B","difficulty":"易","options":{"A":"初步设计文件交付日","B":"概算编制基准期","C":"施工图设计审查日","D":"工程开工日","E":""},"explanation":"初步设计概算是静态投资的控制基准，其各项费用计算（除动态费用外）均应以规定的概算编制基准期为时间节点的价格水平为准。"},{"id":"244","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，关于基本预备费的作用，下列说法正确的是（ ）。","answer":"D","difficulty":"中","options":{"A":"包括施工图设计产生的设备材料价差","B":"用于支付项目建设期利息","C":"包含建设期内汇率变动造成的损失","D":"用于初步设计范围内未预见工程及一般自然灾害损失","E":""},"explanation":"基本预备费主要用于在初步设计范围内未预见工程的费用增加，以及一般自然灾害造成的损失和预防自然灾害所采取的措施费用。选项A、C属于价差预备费，B属于动态费用。"},{"id":"245","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在施工过程结算时，对于发承包双方已确认的索赔、现场签证等变更费用，应（ ）。","answer":"B","difficulty":"中","options":{"A":"在竣工结算时一并统一支付","B":"在当期工程进度款中同期支付","C":"留待工程全容量并网后支付","D":"单独签订补充协议延期支付","E":""},"explanation":"为了保障承包人资金流转并体现施工过程结算的意义，已确认的索赔和签证费用应计入当期进度款中同期支付。"},{"id":"246","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，工程竣工图文件编制费属于（ ）。","answer":"B","difficulty":"中","options":{"A":"建筑工程费","B":"勘察设计费","C":"项目建设管理费","D":"项目建设技术服务费","E":""},"explanation":"竣工图文件编制费属于勘察设计费。"},{"id":"247","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），编制工程量清单时，以“吨（t）”为单位的工程量，其数值应保留的小数位数是（ ）。","answer":"A","difficulty":"易","options":{"A":"三位","B":"两位","C":"一位","D":"取整数","E":""},"explanation":"规范规定：以“t”为单位，应保留小数点后三位数字，第四位小数四舍五入；以“m3”、“m2”、“m”为单位的保留两位数字。"},{"id":"248","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在火力发电工程建设中，机组整套启动试运转期间消耗的燃料、水、电等费用应计入（ ）。","answer":"A","difficulty":"中","options":{"A":"整套启动试运费","B":"生产准备费","C":"安装工程费的系统调试费","D":"基本预备费","E":""},"explanation":"联合试运转费是指机组投产前进行整套启动和带负荷试运期间的支出和收入的差额。试运期间消耗的燃料水电等属于该支出的重要部分。"},{"id":"249","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于暂估价的规定，下列说法正确的是（ ）。","answer":"D","difficulty":"难","options":{"A":"暂估价是不可竞争费用，不需要在结算时调整","B":"发包人有权自行决定暂估价材料的实际采购价格","C":"暂估价中的专业工程不包含企业管理费和利润","D":"依法必须招标的暂估价项目由发承包双方依法组织招标选择供应商","E":""},"explanation":"对于依法必须招标的暂估价材料或专业工程，必须由发承包双方依法依规组织招标确定最终价格，并以此取代原暂估价调整合同价款。"},{"id":"250","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，大中型施工机械的安拆费及轨道铺拆费应计入（ ）。","answer":"B","difficulty":"中","options":{"A":"施工机具使用费","B":"建筑安装工程的措施费","C":"企业管理费","D":"其他费用","E":""},"explanation":"大中型机械设备的安拆及轨道铺拆费属于措施费。"},{"id":"251","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当承包人未在合同约定的时间内提交竣工结算文件时，发包人（ ）。","answer":"A","difficulty":"中","options":{"A":"可根据已有资料自行编制结算文件并作为结算依据","B":"必须无限期等待承包人提交","C":"有权直接没收全部履约保证金","D":"按暂估概算总价进行最终支付","E":""},"explanation":"为防止承包人拖延结算，规范明确若承包人经催告后仍未在规定期限内提交竣工结算文件，发包人可根据已有资料自行编制并作为最终结算依据。"},{"id":"252","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，施工企业为职工缴纳的防暑降温费和冬季取暖费应计入建筑安装工程费的（ ）。","answer":"D","difficulty":"中","options":{"A":"规费","B":"人工费","C":"措施费","D":"企业管理费","E":""},"explanation":"职工的防暑降温、冬季取暖及劳动保护费等属于企业为了管理和组织施工生产发生的间接费用，归列于企业管理费。"},{"id":"253","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），工程初步设计概算的动态投资中不包括的内容是（ ）。","answer":"C","difficulty":"易","options":{"A":"价差预备费","B":"建设期利息","C":"基本预备费","D":"以上均不包括","E":""},"explanation":"基本预备费是由于初步设计深度不足而预留的费用，属于静态投资的组成部分。动态投资主要由价差预备费和建设期利息组成。"},{"id":"254","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人签发工程进度款支付证书后，应按规定时间支付，该进度款的支付比例原则上不得低于（ ）。","answer":"B","difficulty":"中","options":{"A":"0.5","B":"0.6","C":"0.7","D":"0.8","E":""},"explanation":"清单计价通用规则及国家部委相关规定均明确，工程进度款的支付比例原则上不得低于60%，且通常不高于90%。"},{"id":"255","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在火力发电工程建设中，由于工程地质勘察深度不够导致施工中实际开挖量大幅增加，其增加的工程费用原则上应从（ ）中支出。","answer":"B","difficulty":"中","options":{"A":"企业管理费","B":"基本预备费","C":"价差预备费","D":"勘察设计费","E":""},"explanation":"基本预备费的用途之一就是解决在初步设计范围内因设计深度不够或不可预见工程所引起的费用增加。"},{"id":"256","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在合同履行期间，因不可抗力导致工程本身的损害及因工程损害导致第三方财产损失，应由（ ）承担。","answer":"B","difficulty":"难","options":{"A":"承包人","B":"发包人","C":"发承包双方按比例分担","D":"工程保险公司垫付后向过错方追偿","E":""},"explanation":"根据工程风险分担的基本原则，不可抗力造成的工程本身损害、第三方人员伤亡及财产损失，均由发包人承担。"},{"id":"257","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在编制建设预算时，安装工程的住房公积金的计算基数通常是（ ）。","answer":"A","difficulty":"易","options":{"A":"人工费","B":"人工费加施工机具使用费","C":"建筑安装工程总直接费","D":"直接工程费","E":""},"explanation":"规费中的社会保险费及住房公积金（即“五险一金”），以建安工程的人工费或直接工程费为计算基数乘以国家或地方规定的费率计算。"},{"id":"258","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于计日工的说法，符合《电力建设工程工程量清单计价规范》的是（ ）。","answer":"A","difficulty":"中","options":{"A":"计日工主要是为了解决合同范围外零星、不可预见工程的计价","B":"计日工表中的人工单价不包含企业管理费和利润","C":"计日工数量由承包人实际填报并可直接以此结算","D":"计日工的单价由发包人在招标文件中强制给定","E":""},"explanation":"计日工是针对施工图纸以外的零星项目或工作，其单价应包含企业管理费和利润，并在投标时由投标人自主填报单价，结算时按发包人签证确认的数量计算。"},{"id":"259","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，设备运杂费通常以（ ）为测算基准。","answer":"B","difficulty":"易","options":{"A":"设备出厂含税价","B":"设备原价","C":"离岸价(FOB)","D":"到岸价(CIF)","E":""},"explanation":"设备购置费由设备原价和设备运杂费组成。设备运杂费通常以设备原价为计算基数乘以相应的运杂费率进行计算。"},{"id":"260","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，如果工程发包时图纸不全，导致部分专业工程无法准确计算工程量，招标人在工程量清单中可将该部分工程作为（ ）列项。","answer":"A","difficulty":"中","options":{"A":"暂估价专业工程","B":"暂列金额","C":"计日工","D":"总承包服务费","E":""},"explanation":"当图纸不全但该专业工程又必然发生时，为了确保招标的完整性，招标人应以“暂估价（专业工程暂估价）”的形式列项，待施工期间图纸完善后再行招标或确认。"},{"id":"261","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列各项中不属于基本预备费开支范围的是（ ）。","answer":"D","difficulty":"中","options":{"A":"在初步设计范围内未预见的工程增加费","B":"一般自然灾害造成的损失","C":"为预防自然灾害采取的措施费","D":"施工期间国家政策调整导致的人工费上涨","E":""},"explanation":"基本预备费主要用于解决初步设计阶段难以预见的工程费用以及一般自然灾害损失等。因国家政策调整、物价波动引起的人工费上涨属于价差预备费的开支范围。"},{"id":"262","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，对于采用单价合同的工程，发包人在进行工程款支付时，其计量依据应是（ ）。","answer":"D","difficulty":"易","options":{"A":"招标工程量清单中列出的工程量","B":"承包人主观上报的工程量","C":"设计图纸上的理论工程量","D":"发包人或监理人核实确认的实际完成工程量","E":""},"explanation":"单价合同的特点是“单价优先，按实结算”，实际支付工程款时必须以现场发包方或监理方核实确定的实际完成工程量为准。"},{"id":"263","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），初步设计概算的项目建设总费用由（ ）构成。","answer":"A","difficulty":"易","options":{"A":"静态投资和动态费用","B":"建筑工程费和设备安装费","C":"工程费用和预备费","D":"静态投资和建设期利息","E":""},"explanation":"项目建设总费用是初步设计概算的总盘子，它由静态投资和动态费用两大部分构成。"},{"id":"264","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），钢筋工程量的清单计算单位通常是（ ）。","answer":"B","difficulty":"易","options":{"A":"kg","B":"t","C":"m","D":"m3","E":""},"explanation":"规范中明确规定，金属结构工程及钢筋工程的工程量清单计算，应以“t（吨）”为单位计算，并保留小数点后三位。"},{"id":"265","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，安全文明施工费不包括（ ）。","answer":"D","difficulty":"中","options":{"A":"环境保护费","B":"文明施工费","C":"安全施工费","D":"临时设施费","E":""},"explanation":"2018版编规中，安全文明施工费仅包含环境保护、文明施工、安全施工三项。临时设施费作为单独的一项建安工程措施费单列，不混同于安全文明施工费。"},{"id":"266","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，投标报价时，若投标人发现招标工程量清单中存在漏项，应当（ ）。","answer":"B","difficulty":"中","options":{"A":"自行在清单中补充并进行报价","B":"按招标人提供的原清单填报价格，漏项留待施工时按变更处理","C":"拒绝投标","D":"向招标人提出异议并拒绝填报该部分单价","E":""},"explanation":"投标人必须按招标人提供的工程量清单填报价格，清单的准确性和完整性由招标人负责。投标人不能自行修改或增删招标清单项目。"},{"id":"267","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，某火电工程在建设期间，为满足工程需要由项目法人委托进行的有关工程设计重大修改的试验研究费用，应计入（ ）。","answer":"B","difficulty":"难","options":{"A":"勘察设计费","B":"项目建设技术服务费","C":"项目建设管理费","D":"基本预备费","E":""},"explanation":"工程专项评价及专项研究费（含委托的重大试验研究等技术支持费用）属于其他费用中的项目建设技术服务费。"},{"id":"268","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，包工包料工程的预付款支付比例原则上不得低于合同金额（扣除暂列金额）的（ ）。","answer":"A","difficulty":"中","options":{"A":"0.1","B":"0.2","C":"0.3","D":"0.4","E":""},"explanation":"根据相关计价规范及国家部委关于工程结算的规定，工程预付款的比例原则上不低于合同金额（扣除暂列金额）的10%，且不高于30%。"},{"id":"269","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），推荐的概算计价模式主要包括（ ）。","answer":"C","difficulty":"中","options":{"A":"仅限传统定额计价模式","B":"仅限工程量清单计价模式","C":"综合单价计价模式和传统（定额）计价模式","D":"费率计价模式","E":""},"explanation":"新版导则为了适应市场化要求和逐步与清单计价接轨，在保留传统的定额计价模式的同时，新增推荐了综合单价计价模式。"},{"id":"270","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下各项中不属于“规费”的是（ ）。","answer":"D","difficulty":"易","options":{"A":"养老保险费","B":"失业保险费","C":"医疗保险费","D":"财产保险费","E":""},"explanation":"规费主要包括国家强制缴纳的“五险一金”（养老、失业、医疗、工伤、生育保险及住房公积金）。财产保险费通常由企业自愿或按需缴纳，属于企业管理费或工程保险费范畴。"},{"id":"271","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于工程质量保证金，根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，若发包人在退还期限届满后迟延退还的，承包人有权要求发包人（ ）。","answer":"B","difficulty":"中","options":{"A":"支付双倍违约金并返还质保金","B":"承担自逾期之日起的违约金或利息","C":"无限期顺延缺陷责任期","D":"无偿继续维修工程","E":""},"explanation":"依据合同法及清单规范，发包人未按期退还质保金，即构成违约，应承担自逾期之日起的违约责任（通常包含利息或约定的违约金）。"},{"id":"272","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在编制工程量清单结算时，若实际施工的项目特征与招标清单中描述的项目特征不符，发承包双方应（ ）。","answer":"C","difficulty":"中","options":{"A":"按原清单综合单价执行","B":"由承包人自行承担相关损失","C":"按照实际施工的项目特征重新确定综合单价","D":"向造价管理部门申请仲裁","E":""},"explanation":"清单计价规范明确：若实际施工的项目特征与招标工程量清单项目特征描述不符，原综合单价不再适用，发承包双方应按实际施工的项目特征重新协商确定综合单价。"},{"id":"273","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，施工机具使用费不包括（ ）。","answer":"D","difficulty":"难","options":{"A":"折旧费","B":"大修理费","C":"仪器仪表使用费","D":"机械设备操作人员的意外伤害保险费","E":""},"explanation":"施工机具使用费包括施工机械使用费（含折旧、大修、安拆及场外运费、人工、燃料动力、税费等）和仪器仪表使用费。操作人员的意外伤害保险通常属于规费或企业管理费。"},{"id":"274","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，对于工程规模较小、技术难度较低，且图纸齐备、工期较短的电力建设工程，最适合采用的合同类型是（ ）。","answer":"B","difficulty":"易","options":{"A":"单价合同","B":"总价合同","C":"成本加酬金合同","D":"暂估价合同","E":""},"explanation":"工期短、技术难度低、工程图纸齐备的项目，工程量变化风险小，适合采用总价合同以简化结算程序。"},{"id":"275","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），土石方工程中“挖基础土方”清单项目工程量的计算规则是（ ）。","answer":"B","difficulty":"难","options":{"A":"按设计图示尺寸以建筑物首层建筑面积计算","B":"按设计图示尺寸以基础垫层底面积乘挖土深度计算","C":"按实际开挖土方体积加放坡系数计算","D":"按放坡开挖截面积乘挖深计算","E":""},"explanation":"工程量清单计算规范中，基础土方的工程量均按设计图示尺寸的“净量”（即垫层底面积乘以挖土深度）计算，施工所需的放坡及工作面费用由投标人综合考虑在单价中。"},{"id":"276","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用中不属于“勘察设计费”的是（ ）。","answer":"A","difficulty":"中","options":{"A":"建设项目前期工作费","B":"初步设计费","C":"施工图设计费","D":"工程勘察费","E":""},"explanation":"在其他费用的构成中，“建设项目前期工作费”和“勘察设计费”是两项相互独立的平行费用项目。"},{"id":"277","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，因发包人原因导致工程工期延误时，若合同中没有特殊约定，延期期间物价大幅上涨造成的价差风险由（ ）承担。","answer":"B","difficulty":"中","options":{"A":"承包人","B":"发包人","C":"发承包双方平摊","D":"造价咨询单位","E":""},"explanation":"风险共担原则规定：因发包人原因造成的工期延误，在此延误期间发生的人工、材料等物价上涨风险应由发包人承担。"},{"id":"278","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，火力发电工程中，特大型设备的超限运输费用，如果在设备原价和常规运杂费中未予包含，则应在（ ）中列项计算。","answer":"B","difficulty":"中","options":{"A":"建安工程措施费","B":"其他费用","C":"基本预备费","D":"项目建设技术服务费","E":""},"explanation":"依据2018版编规，特大、超限设备的特殊运输措施及运输费用，在建设预算中通常在“其他费用”的专项费用（如大件设备运输措施费）中单独列项。"},{"id":"279","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），当采用综合单价法计价时，综合单价由人工费、材料费、施工机具使用费、企业管理费、（ ）以及一定范围内的风险费用组成。","answer":"C","difficulty":"易","options":{"A":"规费","B":"税金","C":"利润","D":"措施费","E":""},"explanation":"清单及概算综合单价法的定义标准：综合单价包含人工、材料、机械、管理费和利润，并考虑风险因素。规费和税金作为不可竞争费用单独列项计取。"},{"id":"280","question":"根据《国家发展改革委 国家能源局关于建立煤电容量电价机制的通知》（发改价格〔2023〕1501号），煤电由单一制电价调整为（    ）。","answer":"B","difficulty":"易","options":{"A":"一部制电价","B":"两部制电价","C":"三部制电价","D":"多部制电价","E":""},"explanation":"文件原文：“当前阶段，适应煤电功能加快转型需要，将现行煤电单一制电价调整为两部制电价”。"},{"id":"281","question":"根据《国家发展改革委 国家能源局关于建立煤电容量电价机制的通知》（发改价格〔2023〕1501号），地煤电容量电费纳入系统运行费用，每月由（    ）按当月用电量比例分摊，由电网企业按月发布、滚动清算。","answer":"D","difficulty":"中","options":{"A":"发电企业","B":"电网企业","C":"居民用户","D":"工商业用户","E":""},"explanation":"文件原文：“各地煤电容量电费纳入系统运行费用，每月由工商业用户按当月用电量比例分摊，由电网企业按月发布、滚动清算”。"},{"id":"282","question":"根据《国家发展改革委 国家能源局关于建立煤电容量电价机制的通知》（发改价格〔2023〕1501号），电量电价的形成方式是（    ）。","answer":"C","difficulty":"易","options":{"A":"政府定价","B":"网间协商","C":"市场化形成","D":"竞价上网","E":""},"explanation":"文件原文：“其中电量电价通过市场化方式形成，灵敏反映电力市场供需、燃料成本变化等情况”。"},{"id":"283","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），经济增加值（EVA）计算中，调整后资本计算公式中不包括（    ）。","answer":"B","difficulty":"中","options":{"A":"平均所有者权益","B":"平均短期借款","C":"平均负债合计","D":"平均无息流动负债","E":""},"explanation":"公式3.4.1-3：调整后资本 = 平均所有者权益 + 平均负债合计 - 平均无息流动负债 - 平均在建工程"},{"id":"284","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），盈亏平衡分析中，盈亏平衡点越低，表示项目适应产品变化的（   ）越大。","answer":"A","difficulty":"易","options":{"A":"能力","B":"利润","C":"成本","D":"速度","E":""},"explanation":"3.3.2 当项目收入等于总成本费用时，恰好盈亏平衡，盈亏平衡点越低，表示项目适应产品变化的能力越大，抗风险能力越强。"},{"id":"285","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），100万千瓦级机组的材料费为（    ）元/(MW·h)。","answer":"A","di 备费费率分别为5%、3%。"},{"id":"454","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，人工费中未包括的内容是（   ）。","answer":"C","difficulty":"易","options":{"A":"工资性补贴","B":"职工福利费","C":"社会保险费","D":"生产人员劳动保护费","E":""},"explanation":"人工费是指支付给直接从事建筑安装工程施工作业的生产人员的各项费用。包括基本工资、工资性补贴、辅助工资、职工福利费、生产人员劳动保护费。"},{"id":"455","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列建筑安装工程费中，为可竞争性费用的是（  ）。","answer":"D","difficulty":"中","options":{"A":"规费","B":"安全文明施工费","C":"税金","D":"施工机械使用费","E":""},"explanation":"建筑安装工程费中，为不可竞争性费用的是税金、规费、安全文明施工费。"},{"id":"456","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下恶劣天气不属于不可抗力的是（  ）。","answer":"D","difficulty":"易","options":{"A":"台风","B":"暴雨","C":"暴风雪","D":"寒潮","E":""},"explanation":"台风、暴雨、暴风雪等极恶略天气属于不可抗力。"},{"id":"457","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，项目建设单位是火电工程造价执行的责任主体。负责组织投资估算、设计概算（  ）。","answer":"B","difficulty":"易","options":{"A":"审批","B":"编制","C":"审核","D":"核定","E":""},"explanation":"《中国华能集团有限公司火电工程造价管理工作指引》\n第五部分 中国华能集团有限公司火电工程造价管理工作指引\n项目建设单位是火电工程造价执行的责任主体。负责组织投资估算、设计概算编制；划分标段，组织编制招标文件、技术规范书、标段对应概算、投标限价、管理概算；定期组织编制概算执行情况分析；负责合同价款、过程结算、合同结算和竣工结算管理，编制、报送竣工结算报告；配合上级单位委派的项目审计工作；负责组织整理和编制工程结算典型案例等。"},{"id":"458","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，前期阶段，项目建设单位组织设计单位对项目选址、技术方案、设备方案、工程方案等进行优化比选，重点落实项目建设边界条件，充分考虑（  ）对收益率的影响，准确评价项目盈利能力，投资估算裕度适当、风险可控。","answer":"D","difficulty":"易","options":{"A":"项目选址","B":"技术方案","C":"设备方案","D":"边界条件","E":""},"explanation":"《中国华能集团有限公司火电工程造价管理工作指引》，项目建设单位组织设计单位对项目选址、技术方案、设备方案、工程方案等进行优化比选，重点落实项目建设边界条件，充分考虑边界条件对收益率的影响，准确评价项目盈利能力，投资估算裕度适当、风险可控。"},{"id":"459","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，设计单位编制初设原则并经二级单位组织审核后，报集团公司工程部审查，技经中心配合提出审查意见。二级单位组织项目建设单位、设计单位逐条答复、落实集团公司审查意见，形成技术文件，（  ）内报集团公司备案。","answer":"C","difficulty":"易","options":{"A":"7天","B":"10天","C":"14天","D":"15天","E":""},"explanation":"《中国华能集团有限公司火电工程造价管理工作指引》\n第五部分 中国华能集团有限公司火电工程造价管理工作指引\n设计单位编制初设原则并经二级单位组织审核后，报集团公司工程部审查，技经中心配合提出审查意见。二级单位组织项目建设单位、设计单位逐条答复、落实集团公司审查意见，形成技术文件，14天内报集团公司备案。"},{"id":"460","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，二级单位应在初设外审后（  ）内，组织项目建设单位、设计单位完成初 关质量合格证明等验收材料。"},{"id":"467","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，项目建设单位应及时处理结算争议事项，要求（  ）内完成合同结算书的整体审核工作。","answer":"B","difficulty":"易","options":{"A":"1个月","B":"2个月","C":"3个月","D":"6个月","E":""},"explanation":"依据《华能集团火电基本建设项目工作指引》，项目建设单位应及时处理结算争议事项，要求2个月内完成合同结算书的整体审核工作。"},{"id":"468","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，监理单位在收到合同结算书及结算支持性资料后（  ）内完成审核，并提交项目建设单位计划部。","answer":"A","difficulty":"易","options":{"A":"14天","B":"15天","C":"28天","D":"30天","E":""},"explanation":"依据《华能集团火电基本建设项目工作指引》，监理单位在收到合同结算书及结算支持性资料后14天内完成审核，并提交项目建设单位计划部。"},{"id":"469","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，火电工程应在机组通过168小时试运行考核（  ）内完成尾款支付工作，之后不再下达年度基建资金预算，退出基建管理序列。","answer":"C","difficulty":"易","options":{"A":"一年","B":"两年","C":"三年","D":"五年","E":""},"explanation":"依据《华能集团火电基本建设项目工作指引》，火电工程应在机组通过168小时试运行考核三年内完成尾款支付工作，之后不再下达年度基建资金预算，退出基建管理序列。"},{"id":"470","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，尾工项目和预留费用投资额原则上不得超过设计概算静态投资的（  ）。","answer":"B","difficulty":"易","options":{"A":"0.03","B":"0.05","C":"7.0000000000000007E-2","D":"0.09","E":""},"explanation":"依据《华能集团火电基本建设项目工作指引》，尾工项目和预留费用投资额原则上不得超过设计概算静态投资的5%。"},{"id":"471","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，主体工程的尾工项目和预留费用应在收尾工作启动后一年内完成，配套热网工程（或类似开发周期较长的配套单项工程）应在（  ）内完成。","answer":"B","difficulty":"易","options":{"A":"一年","B":"两年","C":"三年","D":"6个月","E":""},"explanation":"依据《华能集团火电基本建设项目工作指引》，主体工程的尾工项目和预留费用应在收尾工作启动后一年内完成，配套热网工程（或类似开发周期较长的配套单项工程）应在两年内完成。"},{"id":"472","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，投标保证金金额不超过项目估算价的（  ），且不高于80万元。","answer":"D","difficulty":"易","options":{"A":"0.03","B":"5.0000000000000001E-3","C":"0.01","D":"0.02","E":""},"explanation":"依据《华能集团火电基本建设项目工作指引》，投标保证金金额不超过项目估算价的2%，且不高于80万元。"},{"id":"473","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，安全生产措施费用提取不得低于直接工程费的（  ）或最新电力定额总站发布的安全生产措施费标准（以高者为准）。","answer":"A","difficulty":"中","options":{"A":"3.1899999999999998E-2","B":"2.63E-2","C":"2.5999999999999999E-2","D":"3.9100000000000003E-2","E":""},"explanation":"依据《华能集团火电基本建设项目工作指引》，安全生产措施费用提取不得低于直接工程费的3.19%或最新电力定额总站发布的安全生产措施费标准（以高者为准）。"},{"id":"474","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），建设项目投产初期，（  ）主要用于购买燃料、生产消耗材料、生产用备品备件和支付工资所需的周转性自有资金。","answer":"A","difficulty":"易","options":{"A":"铺底流动资金","B":"其他费用","C":"基本预备费","D":"动态费用","E":""},"explanation":"出自《火力发电工程建设预算编制与计算规定使用指南（2018年版）》3.3.3 铺底流动资金是指建设项目投产初期所需，为保证项目建成后进行试运转和初期正常生产运行所必须的流动资金。铺底流动资金主要用于购买燃料、生产消耗材料、生产用备品备件和支付工资所需的周转性自有资金。"},{"id":"475","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），直接费由（  ）组成？","answer":"A","difficulty":"易","options":{"A":"直接工程费和措施费","B":"人工费、材料费、施工机械使用费、规费","C":"人工费、材料费、施工机械使用费","D":"直接工程费和规费","E":""},"explanation":"出自《火力发电工程建设预算编制与计算规定使用指南（2018年版）》4.3.1 直接费是指施工过程中直接耗用于建筑、安装工程产品的各项费用总合，包括直接工程费和措施费。"},{"id":"476","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），措施费中包含的安全文明施工费的计算公式是什么（  ）？","answer":"D","difficulty":"中","options":{"A":"安全文明施工费=间接费×1.5%","B":"安全文明施工费=人工费×1.5%","C":"安全文明施工费=直接费×2.6%","D":"安全文明施工费=直接工程费×2.63%","E":""},"explanation":"出自《火力发电工程建设预算编制与计算规定使用指南（2018年版）》4.3.1 安全文明施工费=直接工程费×2.63%。"},{"id":"477","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），按照费率计算的余物清理费包括运距在 （  ）及以内的运输和装卸费。","answer":"C","difficulty":"易","options":{"A":"1km","B":"2km","C":"5km","D":"10km","E":""},"explanation":"出自《火力发电工程建设预算编制与计算规定使用指南（2018年版）》 余物清理费包括运距在5km及以内的运输和装卸费。"},{"id":"478","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），以下费用可列入安装工程费中的是（  ）。","answer":"A","difficulty":"中","options":{"A":"冷却塔内的钢制循环水管道","B":"采暖加热站设备","C":"采暖锅炉房管道","D":"厂区采暖管道","E":""},"explanation":"出自《火力发电工程建设预算编制与计算规定使用指南（2018年版）》采暖加热站(制冷站)设备及管道、采暖锅炉房设备及管道、厂区采暖管道可列入建筑工程费。"},{"id":"479","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），根据电力建设工程建筑安装工程费用构成，施工工具用具使用费属于（  ）。","answer":"C","difficulty":"易","options":{"A":"项目建设管理费","B":"企业管理费","C":"措施费","D":"施工机械费用","E":""},"explanation":"《火力发电工程建设预算编制与计算规定》中，施工工具用具使用费属于措施费。"},{"id":"480","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），单机容量1000MW燃煤发电机组项目前期工作费费率取值（）%。","answer":"C","difficulty":"易","options":{"A":"2.31","B":"1.71","C":"1.34","D":"4.13","E":""},"explanation":"《火力发电工程建设预算编制与计算规定使用指南》（2018年版）规定，单机容量1000MW燃煤发电机组项目前期工作费费率1.34."},{"id":"481","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），招标费以（  ）为取费基数？","answer":"C","difficulty":"易","options":{"A":"建筑工程费+安装工程费","B":"设备费","C":"建筑工程费+安装工程费+设备费","D":"项目建设技术服务费","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），招标费=（建筑工程费+安装工程费+设备费）×费率。"},{"id":"482","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下费用不属于土地征用费的是（  ）？","answer":"C","difficulty":"中","options":{"A":"耕地开垦费","B":"征地管理费","C":"土地复垦费","D":"证书费","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版）规定，土地征用费包括土地补偿费、安置补助费、耕地开垦费、勘测定界费、征地管理费、证书费、手续费以及各种基金和税金。"},{"id":"483","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），土石方定额中不包括（  ）的费用，发生时另行计算。","answer":"A","difficulty":"难","options":{"A":"施工降水、排水","B":"人力车、汽车在重车上坡时的降效","C":"人工清土、修坡","D":"工作面排水","E":""},"explanation":"预算定额中，土石方定额中不包括施工降水、排水的费用，发生时可按照降排水子目执行，无法参考时按照有关规定另行计算。"},{"id":"484","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列地基处理工程量计算的说法，正确的是（ ）","answer":"B","difficulty":"难","options":{"A":"换填垫层按设计图示尺寸以面积计算","B":"旋喷桩复合地基按设计图示尺寸以桩长计算","C":"预压地基按设计图示处理范围以体积计算","D":"水泥土搅拌桩复合地基按设计图示处理范围以面积计算","E":""},"explanation":"A选项错误，换填垫层，按设计图示尺寸以体积计算。\nC选项错误，预压地基、强夯地基、振冲密实地基（不填料），按设计图示处理范围以面积计算\nD选项错误，水泥土搅拌桩复合地基，按设计图示桩体尺寸以体积计算。"},{"id":"485","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列关于工程计量时不同计量单位工程量数据汇总后的计取方法，正确的是（ ）。","answer":"B","difficulty":"易","options":{"A":"以“t”为单位，应取整数","B":"以“m、m\n2”为单位，应保留小数点后两位数字，第三位小数四舍五入","C":"以“m、kg”为单位，应保留小数点后三位数字，第四位小数四舍五入","D":"以“个、根”为单位，应保留小数点后两位数字，第三位小数四舍五入","E":""},"explanation":"（1）以“t、km”为单位，应保留小数点后三位数字，第四位小数四舍五入。\n（2）以“m、m2、m3、kg”为单位，应保留小数点后两位数字，第三位小数四舍五入。\n（3）以“个、件、根、系统”为单位，应取整数。"},{"id":"486","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），关于基坑、沟槽划分描述正确的有（ ）。","answer":"A","difficulty":"中","options":{"A":"底宽（设计图示垫层或基础的底宽，下同）≤7m且底长＞3倍底宽为沟槽","B":"底长≤3倍底宽，且底面积≤100m2为基坑","C":"底宽≤7m且底长＞3倍底宽为沟槽","D":"底长≤3倍底宽，且底面积≤150m2为基坑","E":""},"explanation":"沟槽、基坑、一般土石方的划分：底宽（设计图示垫层或基础的底宽，下同）≤7m且底长＞3倍底宽为沟槽；底长≤3倍底宽，且底面积≤150㎡为基坑；超出上述范围又非平整场地的，为一般土石方。"},{"id":"487","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，项目法人单位负责招标订购的设备在到场之前所发生的催交催运费用应计入（   ）。","answer":"A","difficulty":"易","options":{"A":"项目法人管理费","B":"企业管理费","C":"设备材料监造费","D":"设备购置费","E":""},"explanation":"项目法人管理费是指项目法人在项目管理工作中发生的机构开办费及日常管理性费用，其中项目管理工作经费包括工作人员的基本工资、工资性补贴、辅助工资、职工福利费、劳动保护费、社会保险费、住房公积金，采暖及防暑降温费，日常办公费用，差旅交通费，技术图书资料费，教育及工会经费；固定资产使用费、工具用具使用费，水电费；工程档案管理费;合同订立与公证费、法律顾问费咨询费，工程信息化管理费，工程审计费；工程会议费，业务接待费;消防治安费，设备材料的催交、验货费，印花税、房产税、车船税费、车辆保险费：建设项目劳动安全验收评价费，工程竣工交付使用的清理费及验收费等。"},{"id":"488","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，可研估算文件编制过程中不属于项目法人提供的资料是（   ）。","answer":"D","difficulty":"易","options":{"A":"各投资方出资比例","B":"建设场地征地费","C":"业主外委设计项目的投资估算文件","D":"材料价格","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，可研估算文件编制过程中，项目法人应提供以下资料:  (1)项目开办及经营方式，各投资方出资比例，币种、分利方式及分利水平;融资方式、融资币种、融资利率、融资费用、还款方式、还款年限及宽限期等。\n(2) 建设场地的费用规定及依据文件。\n(3)外委设计项目的投资估、概算文件资料(如铁路、公路码头、航道等)。\n(4)估算编制中需提供的其他有关资料。"},{"id":"489","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，不属于建筑工程费税金取费基数的是（   ）。","answer":"B","difficulty":"易","options":{"A":"直接费","B":"价差预备费","C":"间接费","D":"编制基准期价差","E":""},"explanation":"税金的计算公式为：税金=（直接费+间接费+利润+编制基准期价差）×税率，其取费基数不含价差预备费。"},{"id":"490","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用不属于建筑工程的是（  ）。","answer":"C","difficulty":"易","options":{"A":"冷却塔内部的淋水装置","B":"建筑物的防腐设施","C":"燃气-蒸汽联合循环电厂余热锅炉炉顶布置的余热锅炉烟囱及旁路烟道","D":"燃气-蒸汽联合循环电厂独立布置的余热锅炉烟囱","E":""},"explanation":"建（构）筑物的防腐设施，冷却塔内部的配水管、托架、淋水装置、除水装置及结构；燃气-蒸汽联合循环电厂独立布置的余热锅炉烟囱均属于建筑工程；燃气-蒸汽联合循环电厂余热锅炉炉顶布置的余热锅炉烟囱及旁路烟道属于安装工程。"},{"id":"491","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，根据工程在特殊地区施工的实际情况，建筑工程特殊地区施工增加费费率略有上调。安全文明施工费费率由2.6%调整为（   ）。","answer":"B","difficulty":"中","options":{"A":"1.4999999999999999E-2","B":"3. 19%","C":"2.7300000000000001E-2","D":"0.03","E":""},"explanation":"根据工程在特殊地区施工的实际情况，建筑工程特殊地区施工增加费费率略有上调。安全文明施工费费率由2.6%调整为3.19%。"},{"id":"492","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，不同设计阶段基本预备费费率不同，根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，可研、初设、施工图预算三阶段的基本预备费费率分别为(    )","answer":"D","difficulty":"易","options":{"A":"3%、2%、1.5%","B":"4%、2%、1.5%","C":"5%、3%、2%","D":"5%、3%、1.5%","E":""},"explanation":"可研、初设、施工图预算三阶段的基本预备费费率分别为5%、3%、1.5%。"},{"id":"493","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，根据现行工程量清单计价规范，需在招标工程量清单列出总金额的其他项目是()。","answer":"D","difficulty":"中","options":{"A":"设备暂估价","B":"计日工","C":"总承包服务费","D":"暂列金额","E":""},"explanation":"暂列金额由招标人填写其项目名称、计量单位、暂定金额等，若不能详列，也可只列暂定金额总额。"},{"id":"494","question":"根据《电力建设工程施工机械台班费用定额》（2018年版），已知某施工机械采购原值 5 万元，寿命期内检修次数为 3 次，检修间隔台班 400 台班，机械的残值率为 5%，则该台施工机械的台班折旧费为（ ）元/台班。","answer":"A","difficulty":"中","options":{"A":"29.69","B":"31.25","C":"39.58","D":"41.67","E":""},"explanation":"检修周期=检修次数+1=3+1=4\n耐用总台班=折旧年限×年工作台班=检修间隔台班×检修周期=400×4=1600，\n台班折旧费=50000×(1-5%)÷1600=29.69 元/台班"},{"id":"495","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，某拟建项目，建筑安装工程费为 11.2 亿元，设备及工器具购置费为 33.6 亿元，工程建设其他费为 8.4 亿元，建设单位管理费为 3 亿元，基本预备费费率为 5%，则拟建项目基本预备费为（ ）亿元。","answer":"C","difficulty":"易","options":{"A":"0.56000000000000005","B":"2.2400000000000002","C":"2.66","D":"2.81","E":""},"explanation":"工程费用+工程建设其他费=11.2+33.6+8.4=53.2 亿；基本预备费=53.2×5%=2.66 亿"},{"id":"496","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，关于单位工程概算的费用组成，下列表述中正确的是（ ）。","answer":"C","difficulty":"易","options":{"A":"由直接费、企业管理费、利润、规费组成","B":"由直接费、企业管理费、利润、规费、税金组成","C":"由直接费、企业管理费、利润、规费、税金、设备及工器具购置费组成","D":"由直接费、企业管理费、利润、规费、税金、设备及工器具购置费、工程建设其他费组成","E":""},"explanation":"单位工程概算的费用由直接费、企业管理费、利润、规费、税金、设备及工器具购置费组成"},{"id":"497","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列清单项目中，投标人不得自主报价的是（）","answer":"C","difficulty":"易","options":{"A":"总价措施项目","B":"总承包服务费","C":"专业工程暂估价","D":"计日工","E":""},"explanation":"本题考查的是最高投标限价的编制。专业工程暂估价按招标文件提供金额计列。"},{"id":"498","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列因工程变更引起的价款调整，需考虑承包人报价浮动率的是（ ）。","answer":"C","difficulty":"中","options":{"A":"已标价工程量清单中有适用于变更工程项目的桩基增量工程","B":"已标价工程量清单中有适用于变更工程项目的脚手架增量工程","C":"已标价工程量清单中没有类似于变更工程项目的桩基增量工程","D":"已标价工程量清单中有类似于变更工程项目的脚手架增量工程","E":""},"explanation":"本题考查的是工程变更类合同价款调整事项。已标价工程量清单中没有适用也没有类似于变更工程项目的，需考虑的因素中包含有承包人报价浮动率。"},{"id":"499","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于招标工程量清单中分部分项工程量清单的编制，下列说法正确的是（ ）。","answer":"C","difficulty":"易","options":{"A":"所列项目应该是施工过程中以其本身构成工程实体的分项工程或可以精确计量的措施分项项目","B":"拟建施工图纸有体现，但专业工程量计算规范附录中没有相对应项目的，则必须编制这些分项工程的补\n充项目","C":"补充项目的工程量计算规则，应符合“计算规则要具有可计算性”且“计算结果要具有唯一性”的原则","D":"采用标准图集的分项工程，其特征描述应直接采用“详见 XX 图集”方式","E":""},"explanation":"选项 A 错误，在分部分项工程项目清单中所列出的项目，应是在单位工程的施工过程中以其本身构成该单位工程实体的分项工程。选项 B 错误，当在拟建工程的施工图纸中有体现，并且在专业工程量计算规范附录中也有相对应的项目时，则根据附录中的规定直接列项，计算工程量，确定其项目编码。应当在拟建工程的施工图纸中有体现，但在专业工程量计算规范附录中没有相对应的项目，并且在附录项目的\"项目特征\"或\"工程内容\"中也没有提示时，则必须编制针对这些分项工程的补充项目，在清单中单独列项并在清单的编制说明中注明。对补充项的工程量计算规则必须符合下述原则:一是其计算规则要具有可计算性，二是计算结果要具有唯一性。选项 D 错误，若采用标准图集或施工图纸能够全部或部分满足项目特征描述的要求，项目特征描述可直接采用\"详见 XX 图集\"或\"X X 图号\"的方式。对不能满足项目特征描述要求的部分，仍应用文字描述。"},{"id":"500","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列哪一项费用不属于规费中的社会保险费（）。","answer":"B","difficulty":"易","options":{"A":"养老保险费","B":"住房公积金","C":"生育保险费","D":"工伤保险费","E":""},"explanation":"社会保险费包括养老保险费、失业保险费、医疗保险费、生育保险费和工伤保险费"},{"id":"501","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，（ ）是火电工程造价咨询执行的责任主体，负责具体管理造价咨询单位。造价咨询单位（ ）基层企业的造价管理责任。","answer":"C","difficulty":"易","options":{"A":"二级单位，不替代","B":"二级单位，替代","C":"项目单位，不替代","D":"项目单位，替代","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程造价咨询管理细则》中指出，项目单位是火电工程造价咨询执行的责任主体，负责具体管理造价咨询单位。造价咨询单位不替代基层企业的造价管理责任。"},{"id":"502","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，在设计概算批复后（ ）个月内完成管理概算编制。","answer":"A","difficulty":"易","options":{"A":"2","B":"3","C":"5","D":"6","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程安全监督检查管理细则》中，在设计概算批复后2个月内完成管理概算编制。"},{"id":"503","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，建安工程费管理概算计列标准，已招标的按招标价格计列（不计备用金及暂定金额），未招标的按设计概算下浮（ ）计列。","answer":"C","difficulty":"易","options":{"A":"0.01","B":"0.02","C":"0.05","D":"0.1","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程概算管理细则》中，已招标的按招标价格计列（不计备用金及暂定金额），未招标的按设计概算下浮5%计列。"},{"id":"504","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算的编制综合考虑设计概算、招标价格、设计变更等因素，建筑、安装主体工程预留费用分别按不超过招标的（ ）和（ ）计列。","answer":"B","difficulty":"中","options":{"A":"5%；10%","B":"10%；5%","C":"5%；15%","D":"15%；5%","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程概算管理细则》中，管理概算的编制综合考虑设计概算、招标价格、设计变更等因素，建筑、安装主体工程预留费用分别按不超过招标的10%和5%计列。"},{"id":"505","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，工程类合同，需在合同完工验收后（ ）个月内完成；货物类、服务类合同应在合同约定工作内容实施完成后（ ）个月内完成。","answer":"B","difficulty":"易","options":{"A":"1；3","B":"3；1","C":"3；3","D":"1；1","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程结算管理细则》中，工程类合同，需在合同完工验收后3个月内完成；货物类、服务类合同应在合同约定工作内容实施完成后1个月内完成。"},{"id":"506","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，全部机组投产超过（ ）年的，收尾项目投资计划以报备的竣工结算报告为基础。","answer":"A","difficulty":"易","options":{"A":"1","B":"2","C":"3","D":"4","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程结算管理细则》中，全部机组投产超过1年的，收尾项目投资计划以报备的竣工结算报告为基础。"},{"id":"507","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，全部机组投产超过1年的，收尾项目投资计划以报备的（ ）为基础。","answer":"C","difficulty":"易","options":{"A":"设计概算","B":"审批金额","C":"竣工结算报告","D":"批准设计概算","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程结算管理细则》中，全部机组投产超过1年的，收尾项目投资计划以报备的竣工结算报告为基础。"},{"id":"508","question":"根据《中国华能集团有限公司火电工程分标概算审核意见汇编》分标概算中，烟风煤管道装置性材料费一般按预算价的多少系数计取？","answer":"B","difficulty":"难","options":{"A":"0.5-0.7","B":"0.6-0.8","C":"0.7-0.9","D":"0.8-1.0","E":""},"explanation":"《分标概算审核意见汇编》第一篇（五）分析与评判：可按装置性材料预算价的0.6-0.8系数计取。"},{"id":"509","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算基本预备费中，2×1000MW级机组取多少比例？","answer":"B","difficulty":"中","options":{"A":"1.0%～1.5%","B":"1.5%～2%","C":"2%～2.5%","D":"2.5%～3%","E":""},"explanation":"《概算管理细则》第17条（四）：2×1000MW级机组取1.5%～2%。"},{"id":"510","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定，对于建设工期2年及以上的项目，首次概算执行分析报告应在何时编制？","answer":"A","difficulty":"中","options":{"A":"初设收口后1个月","B":"初设收口后3个月","C":"项目开工后1个月","D":"项目开工后3个月","E":""},"explanation":"《概算执行分析实施细则》第15条（一）：初设收口后1个月。"},{"id":"511","question":"根据《中国华能集团有限公司火电基本建设工程概算执行分析实施细则》规定，概算执行分析应遵循什么原则？","answer":"A","difficulty":"易","options":{"A":"合法依规、准确客观","B":"动态管理、持续改进","C":"安全第一、预防为主","D":"实事求是、科学合理","E":""},"explanation":"《概算执行分析实施细则》第2条：应遵循合法依规、准确客观的原则。"},{"id":"512","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，造价管理的主要目标不包括？","answer":"D","difficulty":"易","options":{"A":"控制在批准投资以内","B":"行业对标领先","C":"不发生投资损失和浪费","D":"缩短建设工期","E":""},"explanation":"《造价管理细则》第4条：目标为控制在批准投资以内、行业对标领先、不发生投资损失和浪费。"},{"id":"513","question":"根据《中国华能集团有限公司火电工程分标概算审核意见汇编》分标概算中，冷却塔人字柱支墩应套用什么定额？","answer":"B","difficulty":"难","options":{"A":"人字柱定额","B":"冷却塔基础定额","C":"一般混凝土定额","D":"支墩专用定额","E":""},"explanation":"《分标概算审核意见汇编》第一篇（四）案例1：\"冷却塔人字柱支墩...套用冷却塔基础定额更为合理。\""},{"id":"514","question":"根据《中国华能集团有限公司火电工程分标概算审核意见汇编》分标概算中，单根管道敷设时，管道建筑定额应乘以多少系数？","answer":"C","difficulty":"难","options":{"A":"0.5","B":"0.6","C":"0.7","D":"0.8","E":""},"explanation":"《分标概算审核意见汇编》第一篇（四）案例4：\"当工程为单根管道敷设时，相应管道建筑定额需乘以0.7系数。\""},{"id":"515","question":"根据《中国华能集团有限公司火电工程分标概算审核意见汇编》分标概算中，当皮带机为头尾双驱动时，相应定额乘以多少系数？","answer":"C","difficulty":"难","options":{"A":"1.2","B":"1.3","C":"1.4","D":"1.5","E":""},"explanation":"《分标概算审核意见汇编》第一篇（四）案例6：\"当皮带机为头尾双驱动时，按相应定额乘以系数1.4调整。\""},{"id":"516","question":"根据《电力工程造价从业人员职业能力培训教材—发电建筑工程》（2021版），下列建筑结构中，不属于火力发电厂主体建筑的是（  ）。","answer":"D","difficulty":"中","options":{"A":"汽机房","B":"锅炉房","C":"主控楼","D":"办公楼","E":""},"explanation":"根据《发电建筑工程（2021版）》，火力发电厂主体建筑包括汽机房、锅炉房、主控楼、碎煤机室、输煤栈桥等，办公楼属于辅助建筑。"},{"id":"517","question":"根据《电力工程造价从业人员职业能力培训教材—发电建筑工程》（2021版），电力变压器安装工程中，变压器干燥工作的费用应计入（  ）。","answer":"B","difficulty":"难","options":{"A":"设备原价","B":"安装工程费","C":"其他费用","D":"预备费","E":""},"explanation":"根据《电气设备安装工程（2021版）》，变压器干燥工作属于安装工程的一部分，其费用应计入安装工程费，不包含在设备原价中。"},{"id":"518","question":"根据《电力工程造价从业人员职业能力培训教材—热力设备安装工程》（2021版），锅炉安装工程中，锅炉本体管道安装的工程量计算单位是（  ）。","answer":"C","difficulty":"易","options":{"A":"台","B":"套","C":"m","D":"t","E":""},"explanation":"根据《热力设备安装工程（2021版）》，锅炉本体管道安装的工程量计算单位是长度单位米（m），按设计图示管道中心线长度计算。"},{"id":"519","question":"根据《电力工程造价从业人员职业能力培训教材—发电建筑工程》（2021版），火力发电厂冷却塔混凝土浇筑工程中，模板工程量的计算应按（  ）计算。","answer":"D","difficulty":"难","options":{"A":"混凝土体积","B":"冷却塔表面积","C":"模板实际用量","D":"模板与混凝土接触面积","E":""},"explanation":"根据《发电建筑工程（2021版）》，混凝土模板工程量计算规则为按模板与混凝土接触面积计算，不包括不与混凝土接触的模板面积。"},{"id":"520","question":"根据《电力工程造价从业人员职业能力培训教材—发电建筑工程》（2021版），高压电缆敷设工程中，电缆头制作安装的费用应（  ）。","answer":"A","difficulty":"中","options":{"A":"单独计算，不包含在电缆敷设费用中","B":"包含在电缆敷设费用中，不单独计算","C":"包含在电缆原价中","D":"包含在其他费用中","E":""},"explanation":"根据《电气设备安装工程（2021版）》，高压电缆敷设与电缆头制作安装是两个独立的定额子目，电缆头制作安装费用应单独计算，不包含在电缆敷设费用中。"},{"id":"521","question":"根据《电力工程造价从业人员职业能力培训教材—热力设备安装工程》（2021版），汽轮机安装工程中，汽轮机本体安装的工作内容不包括（  ）。","answer":"C","difficulty":"中","options":{"A":"汽轮机本体就位","B":"汽轮机找平找正","C":"汽轮机润滑油系统安装","D":"汽轮机本体附件安装","E":""},"explanation":"根据《热力设备安装工程（2021版）》，汽轮机润滑油系统安装属于单独的定额子目，不包含在汽轮机本体安装工作内容中。"},{"id":"522","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，电力建设工程预算费用按性质划分，不包括（  ）。","answer":"D","difficulty":"易","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"流动资金","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定（2018年版）》，电力建设工程预算费用按性质分为建筑工程费、安装工程费、设备购置费、其他费用、预备费、建设期利息，不包括流动资金。"},{"id":"523","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），电力建设项目经济评价应包括（  ）和国民经济评价。","answer":"A","difficulty":"易","options":{"A":"财务评价","B":"技术评价","C":"环境评价","D":"社会评价","E":""},"explanation":"根据《火力发电工程经济评价导则》（DLT5435-2019），电力建设项目经济评价应包括财务评价和国民经济评价两部分，必要时可进行社会评价和环境影响经济评价。"},{"id":"524","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程量清单应由（  ）编制。","answer":"B","difficulty":"易","options":{"A":"投标人","B":"招标人或受其委托的工程造价咨询人","C":"监理单位","D":"政府造价管理部门","E":""},"explanation":"根据《电力建设工程工程量清单计价规范 火力发电工程》，工程量清单应由招标人或受其委托具有相应资质的工程造价咨询人编制。"},{"id":"525","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），初步设计概算的编制深度应满足（  ）的要求。","answer":"C","difficulty":"难","options":{"A":"施工招标","B":"施工图设计","C":"确定建设项目投资、控制施工图预算","D":"工程结算","E":""},"explanation":"根据《火力发电工程初步设计概算编制导则》，初步设计概算的编制深度应满足确定建设项目投资、控制施工图预算、考核设计经济合理性的要求。"},{"id":"526","question":"根据《电力建设工程概算定额》（2018年版），概算定额的编制基础是（  ）。","answer":"B","difficulty":"中","options":{"A":"施工定额","B":"预算定额","C":"企业定额","D":"估算指标","E":""},"explanation":"根据《电力建设工程概算定额（2018年版）》编制说明，概算定额是以预算定额为基础，结合初步设计的深度要求编制的，是编制初步设计概算的依据。"},{"id":"527","question":"根据《电力建设工程施工机械台班费用定额》（2018年版），施工机械台班单价中，属于第一类费用的是（  ）。","answer":"A","difficulty":"难","options":{"A":"折旧费","B":"人工费","C":"燃料动力费","D":"其他费用","E":""},"explanation":"根据《电力建设工程施工机械台班费用定额（2018年版）》，施工机械台班费用分为第一类费用（不变费用）和第二类费用（可变费用），第一类费用包括折旧费、大修理费、经常修理费、安拆费及场外运费。"},{"id":"528","question":"根据《电力建设工程装置性材料综合预算价格（2018年版）》，装置性材料综合预算价格的组成不包括（  ）。","answer":"D","difficulty":"中","options":{"A":"材料原价","B":"运杂费","C":"采购及保管费","D":"材料检验试验费","E":""},"explanation":"根据《电力建设工程装置性材料综合预算价格（2018年版）》，装置性材料综合预算价格包括材料原价、运杂费、运输损耗费、采购及保管费，材料检验试验费属于企业管理费。"},{"id":"529","question":"根据《火电工程限额设计参考造价指标》，限额设计的核心是（  ）。","answer":"B","difficulty":"易","options":{"A":"提高设计质量","B":"控制工程造价在批准的投资限额内","C":"加快设计进度","D":"优化设计方案","E":""},"explanation":"根据《火电工程限额设计参考造价指标》，限额设计是以批准的投资估算为限额，控制初步设计；以批准的初步设计概算为限额，控制施工图设计，核心是控制工程造价。"},{"id":"530","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），下列费用中，属于其他费用的是（  ）。","answer":"C","difficulty":"中","options":{"A":"脚手架搭拆费","B":"施工机械使用费","C":"建设单位管理费","D":"混凝土浇筑费","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），其他费用包括建设单位管理费、土地征用及迁移补偿费、勘察设计费等，选项A、B、D属于建筑安装工程费。"},{"id":"531","question":"根据《火力发电厂技术经济指标计算方法》（DL/T 904-2015），火力发电厂的厂用电率是指（  ）占发电量的百分比。","answer":"A","difficulty":"易","options":{"A":"厂用电量","B":"上网电量","C":"线损电量","D":"备用电量","E":""},"explanation":"根据《火力发电厂技术经济指标计算方法》，厂用电率=厂用电量/发电量×100%，是衡量火力发电厂能源利用效率的重要指标。"},{"id":"532","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），工程量清单计价中的暂列金额应计入（  ）。","answer":"C","difficulty":"中","options":{"A":"分部分项工程费","B":"措施项目费","C":"其他项目费","D":"总价措施项目费","E":""},"explanation":"根据《电力建设工程工程量清单计算规范 火力发电工程》，工程量清单计价中的其他项目费包括暂列金额、暂估价、计日工、总承包服务费等。"},{"id":"533","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），混凝土工程的定额含量已考虑（  ）的损耗。","answer":"B","difficulty":"难","options":{"A":"1%","B":"1.5%","C":"2%","D":"3%","E":""},"explanation":"根据《电力建设工程预算定额（2018年版）》建筑工程分册说明，混凝土工程的定额含量已考虑1.5%的施工损耗，编制预算时无需另行计算。"},{"id":"534","question":"根据《电力建设工程概算定额》（2018年版），概算定额与预算定额的区别在于（  ）。","answer":"A","difficulty":"中","options":{"A":"项目划分更粗，精度更低","B":"项目划分更细，精度更高","C":"编制依据不同","D":"适用阶段相同","E":""},"explanation":"根据《电力建设工程概算定额（2018年版）》编制说明，概算定额项目划分比预算定额更粗，综合程度更高，精度相对较低，适用于初步设计阶段；预算定额适用于施工图设计阶段。"},{"id":"535","question":"根据《电力建设工程装置性材料综合预算价格（2018年版）》，装置性材料预算价格的编制原则是（  ）。","answer":"C","difficulty":"中","options":{"A":"市场调节价","B":"政府定价","C":"以市场价格为基础，结合行业实际情况","D":"企业自主定价","E":""},"explanation":"根据《电力建设工程装置性材料预算价格（2018年版）》编制说明，装置性材料预算价格以市场价格为基础，结合电力行业工程建设实际情况编制，作为电力建设工程计价的参考依据。"},{"id":"536","question":"根据《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》相关规定，边界条件参数的选取中，关于60万千瓦级机组修理费的选取比例为（   ）。","answer":"B","difficulty":"易","options":{"A":"0.01","B":"1.4999999999999999E-2","C":"0.02","D":"2.5000000000000001E-2","E":""},"explanation":"《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》（HNJJ-ZY09-2025），修理费：30万千瓦级机组2%，60万千瓦级机组1.5%，100万千瓦级机组1.5%，以固定资产原值（扣除建设期利息）为基数。"},{"id":"537","question":"根据《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》中规定，煤电项目经济评价主要指标是（   ）。","answer":"B","difficulty":"易","options":{"A":"资本金内容收益率","B":"全投资税前内部收益率","C":"总投资收益率","D":"经济增加值","E":""},"explanation":"《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》（HNJJ-ZY09-2025），经济评价主要指标是全投资税前内部收益率。"},{"id":"538","question":"根据《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》中规定，以本省消纳为主的煤电项目，经营期前五年利用小时数原则上不高于（   ）小时。","answer":"B","difficulty":"易","options":{"A":"4000","B":"4500","C":"5000","D":"5500","E":""},"explanation":"《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》（HNJJ-ZY09-2025），以本省消纳为主的煤电项目，经营期前五年利用小时数应根据可研报告项目所在省份电力电量平衡情况确定，原则上不高于4500小时，经营期后十五年利用小时应考虑逐步下降。"},{"id":"539","question":"根据《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》中规定，发电标煤耗取值原则：可研设计100%负荷率上浮（   ）与50%负荷率孰高原则。","answer":"B","difficulty":"中","options":{"A":"0.03","B":"0.05","C":"0.08","D":"0.1","E":""},"explanation":"《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》（HNJJ-ZY09-2025），发电标煤耗应由设计单位提供机组不同负荷率工况下的设计发电标煤耗，原则上按照可研设计100%负荷率工况发电标煤耗上浮5%、可研设计50%负荷率工况发电标煤耗孰高原则取值。"},{"id":"540","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，火电工程造价管理主要目标控制在（   ）批准的概算投资以内。","answer":"A","difficulty":"易","options":{"A":"项目决策阶段","B":"初步设计阶段","C":"施工图设计阶段","D":"招投标阶段","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程造价管理细则》（HN-03-HDXM042-2024），造价管理主要目标，控制在项目投资决策阶段批准的概算投资以内，行业对标领先，不发生投资损失和浪费。"},{"id":"541","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，合同（或预中标）金额原则上应控制在（   ）以内。","answer":"B","difficulty":"易","options":{"A":"投标报价","B":"对应概算","C":"预算成本","D":"最高投标限价","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程造价管理细则》（HN-03-HDXM042-2024），合同（或预中标）金额原则上应控制在对应概算以内，如超概，二级单位应组织项目单位对合同（或预中标）价格的合理性及超概原因作出分析说明。"},{"id":"542","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，2*1000MW级机组管理概算基本预备费取费标准为（   ）。","answer":"A","difficulty":"易","options":{"A":"1.5%~2%","B":"2.5000000000000001E-2","C":"2.5%~3%","D":"3%~5%","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程概算管理细则》（HN-03-HDXM043-2024），基本预备费。以管理概算建安工程费、设备购置费和其他费用为基数，2*1000MW级机组取1.5%~2%。"},{"id":"543","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算中建筑主体工程预留费用不超过招标价的（   ）。","answer":"B","difficulty":"易","options":{"A":"0.05","B":"0.1","C":"0.15","D":"0.2","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程概算管理细则》（HN-03-HDXM043-2024），综合考虑设计概算、招标价格、设计变更等因素，建筑、安装主体工程预留费用分别按不超过招标价的10%和5%计列。"},{"id":"544","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，合同清单中无适用于变更工作的项目时，变更估价应采用（   ）。","answer":"C","difficulty":"中","options":{"A":"市场询价","B":"合同规定单价","C":"参考类似项目单价","D":"定额重新组价","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程结算管理细则》（HN-03-HDXM055-2024），合同清单中无适用于变更工作的项目时，应在合理的范围内参考类似项目单价（价格）进行估价，经协商确定 后进行结算。"},{"id":"545","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，建设期贷款利息计入工程竣工结算的截止时点是（   ）。","answer":"B","difficulty":"易","options":{"A":"工程竣工验收","B":"机组投产并正式移交生产","C":"竣工结算完成","D":"竣工决算批复","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程结算管理细则》（HN-03-HDXM055-2024），建设期贷款利息按财务发生数计列，机组投产并正式移交生产后的利息不再计入工程竣工结算。"},{"id":"546","question":"根据《中国华能集团有限公司火电基本建设施工准备及开工管理办法》中规定，项目开展施工准备的必备条件不包括（   ）。","answer":"C","difficulty":"中","options":{"A":"已取得集团公司投资决策批复","B":"已列入省级及以上电力发展规划","C":"已取得建筑工程施工许可证","D":"用地和林地占用通过预审并签订协议","E":""},"explanation":"《中国华能集团有限公司火电基本建设工程施工准备及开工管理办法》（HN-03-HDXM044-2024），项目开展施工准备必备条件：\n（一）项目已取得集团公司投资决策批复。\n（二）项目已列入国家或所在省（自治区、直辖市）电力发展规划及年度建设规模。\n（三）项目初步设计原则已经审定，总平面布置已基本确定。\n（四）建设用地和林地占用已通过当地政府部门预审并签订用地协议。"},{"id":"547","question":"根据《中国华能集团有限公司火电基本建设施工准备及开工管理办法》中规定，主机设备招标的前提不包括（   ）。 :"施工方案确定数量","E":""},"explanation":"规范规定，无损检测按设计图示或规范要求检测的数量计算。"},{"id":"616","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），工程量清单编制时，以下关于暂列金额的说法正确的是（ ）。","answer":"D","difficulty":"中","options":{"A":"招标人可随意填写","B":"投标人必须填写","C":"属于竞争性费用","D":"招标人根据工程复杂程度估算","E":""},"explanation":"规范规定，暂列金额由招标人根据工程复杂程度、设计深度等估算确定。"},{"id":"617","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，造价管理工作的主要目标之一是（ ）。","answer":"B","difficulty":"易","options":{"A":"项目收益最大化","B":"控制在项目投资决策阶段批准的概算投资以内，行业对标领先","C":"施工图预算不超设计概算","D":"竣工结算不超施工图预算","E":""},"explanation":"指引“三、总体要求”第1条：造价管理主要目标：控制在项目投资决策阶段批准的概算投资以内，行业对标领先，不发生投资损失和投资浪费。"},{"id":"618","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，集团公司火电基本建设管理遵循（ ）级管理模式。","answer":"C","difficulty":"易","options":{"A":"二级","B":"四级","C":"三级","D":"五级","E":""},"explanation":"指引“二、工程造价管理职责”中建设单位职责部分：集团公司火电基本建设管理遵循“集团公司、二级单位、项目建设单位”三级管理模式。"},{"id":"619","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，（ ）是火电工程造价管理的责任主体。","answer":"B","difficulty":"易","options":{"A":"集团公司","B":"二级单位","C":"项目建设单位","D":"造价咨询单位","E":""},"explanation":"指引“二、工程造价管理职责”第（一）条：二级单位是火电工程造价管理的责任主体。"},{"id":"620","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，（ ）是火电工程造价执行的责任主体。","answer":"C","difficulty":"易","options":{"A":"集团公司","B":"二级单位","C":"项目建设单位","D":"施工单位","E":""},"explanation":"指引“二、工程造价管理职责”第（一）条：项目建设单位是火电工程造价执行的责任主体。"},{"id":"621","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，单项增加投资（ ）万元以上的生产性概算外项目和任何非生产性概算外项目须报集团公司审批。","answer":"D","difficulty":"中","options":{"A":"200","B":"500","C":"800","D":"1000","E":""},"explanation":"指引“四、概（估）算管理”第1.1条：单项增加投资1000万元以上的生产性概算外项目和任何非生产性概算外项目须报集团公司审批。"},{"id":"622","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，发生下列情况之一，集团公司不予调整设计概算，其中不包括（ ）。","answer":"D","difficulty":"中","options":{"A":"未按管理权限履行程序，擅自扩大规模、提高标准、变更方案增加投资的","B":"由于勘察、设计、施工、制造、监理等单位过失、管理不善、失职渎职等原因增加投资的","C":"基本预备费可以解决增加投资的","D":"国家政策、法律法规发生变化","E":""},"explanation":"指引“四、概（估）算管理”第2.1条：发生以下情况之一不予调整概算，包括A、B、C；D项国家政策法律法规变化属于可调整情形。"},{"id":"623","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，合同外的零星委托项目和工作，原则上（ ）万元及以上报二级单位审批。","answer":"C","difficulty":"中","options":{"A":"50","B":"100","C":"200","D":"500","E":""},"explanation":"指引“五、合同管理”第2.2条：分级审批的权限：原则上50万元以下（不含）由项目建设单位分管领导审批，50万元及以上由项目建设单位主要领导审批，200万元及以上报二级单位审批。"},{"id":"624","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，工程类合同需在合同完工验收后（ ）个月内完成结算。","answer":"C","difficulty":"易","options":{"A":"1","B":"2","C":"3","D":"6","E":""},"explanation":"根据《中国华能集团有限公司火电工程造价管理工作指引》，“五、合同管理”第3.1条：工程类合同需在合同完工验收后3个月内完成结算。"},{"id":"625","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，物资类、服务类合同应在合同约定工作内容实施完成后（ ）个月内完成结算。","answer":"A","difficulty":"易","options":{"A":"1","B":"2","C":"3","D":"6","E":""},"explanation":"指引“五、合同管理”第3.1条：物资类、服务类合同应在合同约定工作内容实施完成后1个月内完成结算。"},{"id":"626","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，施工单位在合同完工验收合格后（ ）天内，应向监理单位和项目建设单位提交完工结算文件。","answer":"B","difficulty":"中","options":{"A":"14","B":"28","C":"35","D":"42","E":""},"explanation":"指引“五、合同管理”第3.2条：施工单位在合同完工验收合格后28天内，在发承包双方确认的过程结算文件的基础上，根据合同约定及相关规定编制完工结算文件，并向监理单位和项目建设单位提交。"},{"id":"627","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，当预付款+进度款已支付到合同总价的（ ）时，如没有进行工程结算，本合同原则停止付款。","answer":"C","difficulty":"中","options":{"A":"0.5","B":"0.7","C":"0.85","D":"0.9","E":""},"explanation":"指引附录“第二部分：合同条款及格式”附件18第3条：当预付款+进度款已支付到合同总价的85%时，如没有进行工程结算，本合同原则停止付款。"},{"id":"628","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，本指引适用于集团公司投资新建、扩建火电建设项目（ ）范围内的工程及服务类招标文件审查工作。","answer":"D","difficulty":"易","options":{"A":"所有采购","B":"二级集采","C":"三级集采","D":"一级集采","E":""},"explanation":"指引“第一部分 总则”第一条规定：本工作指引适用于集团公司投资新建、扩建火电建设项目主体及其配套工程一级集采范围内的工程及服务类招标文件审查工作。"},{"id":"629","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，勘察设计招标文件审查应满足的条件之一是项目燃用煤（气）质已取得集团公司（ ）的批复（适用于勘察设计招标文件审查）。","answer":"C","difficulty":"中","options":{"A":"战新部","B":"供应链管理部","C":"生产环保部","D":"工程管理部","E":""},"explanation":"指引“第三部分 工作程序”第（一）条第1款第（4）项：项目燃用煤（气）质已取得集团公司生产环保部的批复。"},{"id":"630","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，招标文件统一由（ ）报送至工程技经中心。","answer":"B","difficulty":"易","options":{"A":"项目单位","B":"二级单位","C":"工程管理部","D":"招标公司","E":""},"explanation":"指引“第三部分 工作程序”第（二）条：招标文件统一由二级单位报送至工程技经中心。"},{"id":"631","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，工程技经中心在收到申请且满足审查条件后（ ）周内组织召开招标文件审查会。","answer":"B","difficulty":"易","options":{"A":"1","B":"2","C":"3","D":"4","E":""},"explanation":"指引“第三部分 工作程序”第（二）条：工程技经中心在收到申请且满足审查条件后2周内组织召开招标文件审查会。"},{"id":"632","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，二级单位应督促并指导项目单位对照审查会议纪要对招标文件进行修改，于审查会结束后（ ）个工作日内完成修改并形成修改说明。","answer":"A","difficulty":"中","options":{"A":"5","B":"7","C":"10","D":"14","E":""},"explanation":"指引“第三部分 工作程序”第（四）条第1款：于审查会结束后5个工作日内完成修改并形成修改说明（会议纪要答复）。"},{"id":"633","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，项目单位在审查会结束后完成工程量清单修改的时间要求是（ ）个工作日内。","answer":"C","difficulty":"中","options":{"A":"5","B":"7","C":"10","D":"14","E":""},"explanation":"指引“第三部分 工作程序”第（四）条第1款：于审查后10个工作日内完成工程量清单的修改。"},{"id":"634","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，工程技经中心对招标文件进行复审，在（ ）个工作日内出具复审意见并反馈二级单位及项目单位。","answer":"B","difficulty":"中","options":{"A":"3","B":"5","C":"7","D":"10","E":""},"explanation":"指引“第三部分 工作程序”第（四）条第2款：工程技经中心对招标文件进行复审，在5个工作日内出具复审意见并反馈二级单位及项目单位。"},{"id":"635","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，项目单位收集投标单位提出的问题并组织形成澄清回复，澄清回复经（ ）审核后报送工程技经中心审定。","answer":"C","difficulty":"易","options":{"A":"工程管理部","B":"项目单位","C":"二级单位","D":"招标公司","E":""},"explanation":"指引“第三部分 工作程序”第（五）条第2款：澄清回复经二级单位审核后报送工程技经中心审定。"},{"id":"636","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，招标文件审查应遵循的原则不包括（ ）。","answer":"D","difficulty":"易","options":{"A":"依法合规","B":"实事求是","C":"科学合理","D":"低价优先","E":""},"explanation":"指引“第四部分 审查要求”第1条：遵循“依法合规、实事求是、科学合理、客观公正”的原则。低价优先不属于审查原则。"},{"id":"637","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，经审定的招标文件，若技术方案、工程范围、工程量、概算金额等内容与集团公司审定的方案发生重大变更的，应（ ）。","answer":"C","difficulty":"中","options":{"A":"直接修改后发布","B":"报工程部备案后发布","C":"重新履行审查程序","D":"经二级单位审批后发布","E":""},"explanation":"指引“第四部分 审查要求”第7条：若技术方案、工程范围、工程量、概算金额等内容与集团公司审定的方案发生重大变更的，应重新履行审查程序。"},{"id":"638","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，主体施工招标文件审查应具备的条件之一是项目已获得（ ）。","answer":"A","difficulty":"易","options":{"A":"核准","B":"备案","C":"批复","D":"立项","E":""},"explanation":"指引“第三部分 工作程序”第（一）条第2款第（1）项：项目已获得核准。"},{"id":"639","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，主体施工招标文件审查应具备的条件之一是初步设计方案已通过集团公司内审和（ ）评审并取得审查意见或纪要。","answer":"D","difficulty":"中","options":{"A":"二级单位","B":"项目单位","C":"专家","D":"外审单位","E":""},"explanation":"指引“第三部分 工作程序”第（一）条第2款第（4）项：初步设计方案已通过集团公司内审和外部评审并取得审查意见或纪要。"},{"id":"640","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，勘察设计服务期限应从合同生效之日起至项目（ ）并完成项目创优工作为止。","answer":"C","difficulty":"中","options":{"A":"通过168小时试运行","B":"完成竣工结算","C":"达标投产、竣工验收","D":"通过达标投产考核","E":""},"explanation":"指引“第五部分 审查要点”第（一）条第1款第3项：勘察设计服务期限应从合同生效之日起至项目达标投产、竣工验收并完成项目创优工作为止。"},{"id":"641","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，乙供材料品牌短名单应明确，原则上不少于（ ）家。","answer":"D","difficulty":"易","options":{"A":"1","B":"2","C":"4","D":"3","E":""},"explanation":"指引“第五部分 审查要点”第（三）条第2款第4项：乙供材料品牌短名单应明确，原则上不少于三家。"},{"id":"642","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，通用合同原则上不进行修改，结合项目实际情况对通用合同条款进行的具体阐明、修改或补充应在（ ）中对应体现。","answer":"B","difficulty":"中","options":{"A":"合同协议书","B":"专用合同条款","C":"合同附件","D":"投标人须知","E":""},"explanation":"指引“第五部分 审查要点”第（一）条第1款第8项、第（二）条第1款第6项、第（三）条第1款第6项均规定：对通用合同条款进行的具体阐明、修改或补充在专用合同条款中对应体现。"},{"id":"643","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，监理服务标招标文件审查中，暂定监理服务期内（ ）应按工程规模、建设工期合理设置。","answer":"A","difficulty":"易","options":{"A":"人月数","B":"人数","C":"月数","D":"服务天数","E":""},"explanation":"指引“第五部分 审查要点”第（二）条第2款第1项：暂定监理服务期内人月数应按工程规模、建设工期合理设置。"},{"id":"644","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，招标文件审查会会议纪要应由（ ）负责记录并形成初稿。","answer":"D","difficulty":"中","options":{"A":"二级单位","B":"监理单位","C":"造价咨询单位","D":"设计单位或项目建设单位","E":""},"explanation":"指引“第三部分 工作程序”第（三）条第3款：设计单位或项目建设单位负责审查过程记录，合并分组评审意见并形成会议纪要初稿。"},{"id":"645","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，主体施工招标文件审查应具备的条件之一是采购需求已列入集团公司年度（ ）计划。","answer":"C","difficulty":"中","option
