""},"explanation":"集团公司批准建设的火电项目应在最后一台机组移交生产后18个月内完成竣工验收。"},{"id":"678","question":"根据《中国华能集团有限公司火电基本建设工程竣工验收管理办法》（HN-03-HDXM046-2024 ），集团公司负责组织（  ）及以上煤电、 9F级及以上燃机工程竣工验收工作。","answer":"A","difficulty":"易","options":{"A":"300MW","B":"500MW","C":"600MW","D":"900MW","E":""},"explanation":"集团公司负责组织300MW及以上煤电、 9F级及以上燃机工程竣工验收工作。"},{"id":"679","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，火电项目管理概算由（  ）审批。","answer":"C","difficulty":"易","options":{"A":"集团公司工程部","B":"集团公司技经中心","C":"二级单位","D":"项目单位","E":""},"explanation":"二级单位是火电工程概算管理的责任主体， 负责设计概算的初步审查； 负责管理概算的审批和报备； 监督概算执行， 组织概算执行分析工作； 汇总报送所属项目概算信息。"},{"id":"680","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，二级单位委托具备资质的咨询单位组织设计概算外部评审（设计概算与初步设计同步） ，在初步设计外审后（  ）个月内完成设计概算收口并报集团公司。","answer":"B","difficulty":"易","options":{"A":"3","B":"6","C":"9","D":"12","E":""},"explanation":"二级单位委托具备资质的咨询单位组织设计概算外部评审（ 设计概算与初步设计同步） ， 在初步设计外审后 6 个月内完成设计概算收口并报集团公司。"},{"id":"681","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，已招标的建安工程按招标价格计列（ 不计备用金及暂定金额），未招标的按（  ） 计列。","answer":"C","difficulty":"易","options":{"A":"设计概算","B":"设计概算下浮 2％","C":"设计概算下浮 5％","D":"设计概算下浮 10％","E":""},"explanation":"管理概算计列标准：\n（一） 设备购置费。已招标的设备按招标价格计列，未招标的设备原则上按设计概算计列。\n（二） 建安工程费。已完工的按结算金额（ 或预计结算金额）计列；已招标的按招标价格计列（不计备用金及暂定金额），未招标的按设计概算下浮 5％ 计列。"},{"id":"682","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，完工结算是指承、发包双方根据合同约定，对已完工并经验收的合同所有价款进行计算、调整和确认，其成品文件为合同结算书，合同结算书是合同最终付款的重要依据。完工结算应按规定时限完成。工程类合同，需在合同完工验收后 （  ）个月内完成。","answer":"B","difficulty":"易","options":{"A":"1","B":"3","C":"5","D":"7","E":""},"explanation":"完工结算是指承、发包双方根据合同约定，对已完工并经验收的合同所有价款进行计算、调整和确认，其成品文件为合同结算书，合同结算书是合同最终付款的重要依据。完工结算应按规定时限完成。工程类合同，需在合同完工验收后3个月内完成。"},{"id":"683","question":"依据《中国华能集团有限公司火电基本建设工程设计管理办法》，设计变更指初步设计文件批复后，由（  ）提出有关设计方案的变更。","answer":"A","difficulty":"易","options":{"A":"设计单位","B":"项目单位","C":"施工单位","D":"监理单位","E":""},"explanation":"设计变更指初步设计文件批复后，由设计单位提出有关设计方案的变更。"},{"id":"684","question":"依据《中国华能集团有限公司火电基本建设工程设计管理办法》，火电工程中，设计变更和变更设计统称设计变更。设计变更按性质划分为重大设计变更、重要设计变更和一般设计变更。单项变更费用增减超过（  ）视为重大设计变更。","answer":"D","difficulty":"易","options":{"A":"100 万元","B":"200 万元","C":"500 万元","D":"1000 万元","E":""},"explanation":"设计变更和变更设计统称设计变更。设计变更按性质划分为重大设计变更、重要设计变更和一般设计变更。单项变更费用增减超过 1000 万元视为重大设计变更。"},{"id":"685","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，风电工程类合同，满足以下条件后，合同管理方应及时办理完工结算：已按施工承包合同的约定完成所有项目施工，并通过合同（    ）。","answer":"C","difficulty":"易","options":{"A":"过程结算","B":"进度结算","C":"完工验收","D":"竣工验收","E":""},"explanation":"风电工程类合同，满足以下条件后，合同管理方应及时办理完工结算：已按施工承包合同的约定完成所有项目施工，并通过合同完工验收。"},{"id":"686","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列属于招标工程量清单编制依据的是(     )。","answer":"B","difficulty":"易","options":{"A":"分部分项工程清单","B":"拟定的招标文件","C":"最高投标限价","D":"潜在招标人的潜质和能力","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版） 规定，招标工程量清单编制依据主要有：（1）电力建设工程工程量清单计算规范；（2）国家、电力行业建设主管部门颁发的计价依据和办法；(3)电力建设工程设计文件、初步设计图纸等；（4）电力建设工程项有关的标准、规范、技术资料；（5）拟定的招标文件；（6）施工现场情况、工程特点及常规、施工方案；（7）其他相关资料。"},{"id":"687","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于招标工程量清单中分部分项工程量清单的编制，下面不属于招标工程量清单编制依据的是（  ）。","answer":"C","difficulty":"易","options":{"A":"国家标准","B":"行业标准","C":"可行性研究报告","D":"施工现场实际情况","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版） 规定，招标工程量清单编制依据主要有：（1）电力建设工程工程量清单计算规范；（2）国家、电力行业建设主管部门颁发的计价依据和办法；(3)电力建设工程设计文件、初步设计图纸等；（4）电力建设工程项目有关的标准、规范、技术资料；（5）拟定的招标文件；（6）施工现场情况、工程特点及常规施工方案；（8）其他相关资料。"},{"id":"688","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于工程量清单中分部分项工程量清单的编制，下列说法中错误的是（  ）。","answer":"A","difficulty":"易","options":{"A":"招标人只负责项目编码、项目名称、计量单位和工程量四项内容的填写","B":"同一招标工程的项目编码不得有重码","C":"工程量清单项目及计算规则分初步设计和施工图两个阶段，作为不同阶段发承包的编制依据","D":"当清单计算规范附录\n中有两个计量单位\n时，应根据实际情况\n选择其中一个","E":""},"explanation":"根据《《电力建设工程工程量清单计价规范》（2021版）规定，分部分项工程量清单应根据附录规定的项目编码、项目名称、项目特征、计量单位和工程量计算规则进行编制。"},{"id":"689","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人应在收到最终结清支付申请后的（  ）内予以核实，向承包人签发最终结清支付证书。","answer":"C","difficulty":"易","options":{"A":"24h","B":"7天","C":"14天","D":"28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版） ，发包人应在收到承包人提交的最终结清申请单后 14天内完成审批并向承包人签发最终结清支付证书。"},{"id":"690","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，承包人在收到发包人提出的核实意见后的（  ）内,不确认也未提出异议的,应视为发包人提出的核实意见已被承包人认可，竣工结算办理完毕。","answer":"D","difficulty":"易","options":{"A":"24h","B":"7天","C":"14天","D":"28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版） ，承包人在收到发包人提出的核实意见后的28天内,不确认也未提出异议的,应视为发包人提出的核实意见已被承包人认可，竣工结算办理完毕。"},{"id":"691","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人没有按时支付安全文明施工费、临时设施费的，承包人可以催告发包人支付发包人在付款期满后的（  ）内仍未支付的，若发生安全事故的，发包人应承担连带责任。","answer":"B","difficulty":"易","options":{"A":"24h","B":"7天","C":"14天","D":"28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版） ，发包人没有按时支付安全文明施工费、临时设施费的，承包人可以催告发包人支付发包人在付款期满后的7天内仍未支付的，若发生安全事故的，发包人应承担连带责任。"},{"id":"692","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，现场签证工作完成后的（  ）内，承包人应按照现场签证内容计算价款，报送发包人确认后，作为增加合同价款，与工程进度款同期支付。","answer":"B","difficulty":"易","options":{"A":"24h","B":"7天","C":"14天","D":"28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版） ，现场签证工作完成后的7天内，承包人应按照现场签证内容计算款，报送发包人确认后，作为增加合同价款，与工程进度款同期支付。"},{"id":"693","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，承包人在合同履行期间，出现设计图纸（含设计变更）与招标工程量清单任一（  ）描述不符，且该变化引起该项目的工程造价增减变化的，按照实际施工的项目特征重新确定相应工程量清单项目的全费用综合单价，调整合同价款。","answer":"A","difficulty":"易","options":{"A":"项目特征","B":"计量单位","C":"工程数量","D":"工程内容","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版） ，承包人应按照发包人提供的设计图纸实施合同工程，若在合同履行期间，出现设计图纸（含设计变更）与招标工程量清单任一项目的特征描述不符，且该变化引起该项目的工程造价增减变化的，按照实际施工的项目特征重新确定相应工程量清单项目的全费用综合单价，调整合同价款。"},{"id":"694","question":"根据《电力工程造价从业人员职业能力培训教材—发电建筑工程》（2021版），下列哪项属于发电建筑工程中土石方工程定额的计价特点？（ ）","answer":"C","difficulty":"中","options":{"A":"按照土方类别分类计价，不区分挖填方式","B":"按挖填平衡原则整体计价","C":"土方类别、挖深、运距、施工方法均影响定额计价","D":"运距可忽略不计，只按土方体积计价","E":""},"explanation":"根据《发电建筑工程》（2021版）教材，土石方工程定额的计价综合考虑了土方类别（按土质分类）、挖土深度、装运方式、运距以及施工方法等因素，不同条件下选用不同定额子目。详情参见电力工程造价培训教材相关章节。"},{"id":"695","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，不得作为竞争性费用的是（   )。","answer":"B","difficulty":"中","options":{"A":"人工费","B":"安全文明施工费","C":"材料费","D":"施工机具使用费","E":""},"explanation":"根据《电力建设工程工程量清单计价规范（2021版）相关规定，安全文明施工费、临时设施费必须按国家或省级、行业建设主管部门的规定计算，不得作为竞争性费用。"},{"id":"696","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当最高投标限价复查结论与原公布的最高投标限价误差大于（  ）的，应当责成招标人改正。","answer":"B","difficulty":"中","options":{"A":"±3%","B":"±5%","C":"±10%","D":"±15%","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，当最高投标限价经有关招标监督部门或有该工程管辖权的电力工程造价管理机构复查，其结论与原公布的最高投标限价误差超过士5%时，招标人应当改正。"},{"id":"697","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列属于招标工程量清单编制依据的是（   ）。","answer":"B","difficulty":"中","options":{"A":"分部分项工程清单","B":"拟定的招标文件","C":"最高投标限价","D":"潜在招标人的潜质和能力","E":""},"explanation":"根据《电力建设工程工程量清单计算规范》（2021版） 规定，招标工程量清单编制依据主要有：（1）电力建设工程工程量清单计算规范；（2）国家、电力行业建设主管部门颁发的计价依据和办法；(3)电力建设工程设计文件、初步设计图纸等；（4）电力建设工程项目有关的标准、规范、技术资料；（5）拟定的招标文件；（6）施工现场情况、工程特点及常规施工方案；（7）其他相关资料。"},{"id":"698","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，相关规定，招标工程一般以投标截止日前(   )天作为基准日期。","answer":"D","difficulty":"易","options":{"A":"合同签订前28天","B":"投标截止日后28天","C":"合同签订后28天","D":"投标截止日前28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范（2021版）相关规定，招标工程以投标截止日前 28 天、非招标工程以合同签订前 28 天为基准日，其后因法律法规与政策发生变化引起工程造价增减变化的，发承包双方应按照省级或行业建设主管部门或其授权的工程造价管理机构据此发布的规定调整合同价格。"},{"id":"699","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，由承包单位负责编制，能反映工程项目实际造价的是（ ）。","answer":"B","difficulty":"易","options":{"A":"投标价","B":"工程结算价","C":"概算价","D":"工程决算价","E":""},"explanation":"结算价是指在工程施工过程和竣工验收阶段，按合同调价范围和调价方法，对实际发生的工程量增减、设备和材料价差等进行调整后计算和确定的价格，反映的是工程项目实际造价。决算价反应项目从筹建开始到项目竣工交付使用为止的全部建设费用，是站在甲方的角度上估算，范围比工程造价广。"},{"id":"700","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列有关工程计价及其特征的说法，正确的是（ ）。","answer":"A","difficulty":"易","options":{"A":"建筑产品的单件性特点决定了每项工程都必须单独计算造价","B":"合同价等同于最终决算的实际工程造价","C":"计算工程估算、施工图预算的方法有单价法和实物法","D":"竣工决算一般是由承包单位编制","E":""},"explanation":"本题考查的是工程计价的特征。工程计价的特征，应注意的是：(1)工程计价方法具有多样性特征，投资估算方法有设备系数法、生产能力指数估算法等。概预算方法有单价法和实物法等。(2)合同价不等同于最终决算的实际工程造价。(3)竣工决算价一般是由建设单位编制。"},{"id":"701","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列关于建设单位管理费的说法错误是（ ）。","answer":"C","difficulty":"易","options":{"A":"是指项目建设单位从项目筹建之日起至办理竣工财务决算之日止发生的管理性质的支出","B":"委托第三方行使部分管理职能的，其技术服务费列入技术服务费项目","C":"实行代建制管理的项目，计列代建管理费不等同建设单位管理费，需同时计列建设单位管理费","D":"建设单位管理费=工程费用*建设单位管理费费率","E":""},"explanation":"实行代建制管理的项目，计列代建管理费等同建设单位管理费，不得同时计列建设单管理费。"},{"id":"702","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列关于概算定额的说法，正确的是（   ）。","answer":"B","difficulty":"易","options":{"A":"概算定额手册内容基本上是由文字说明和定额项目表组成","B":"概算定额用于设计概算的编制","C":"概算定额应该贯彻社会先进水平和简明适用的原则","D":"文字说明是概算定额手册的主要内容，包括总说明和分部说明","E":""},"explanation":"选项A,概算定额手册内容基本上是由文字说明、定额项目表和附录三个部分组成。选项C,概算定额应该贯彻社会平均水平和简明适用的原则。选项D,定额项目表是概算定额手册的主要内容，由若干分节定额组成。"},{"id":"703","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，采用概算定额法编制设计概算的过程中，确定各分部分项工程费时使用的单价内容应包括（   ）。","answer":"B","difficulty":"易","options":{"A":"人工费、材料费、施工机具使用费、管理费和利润","B":"人工费、材料费、施工机具使用费、管理费、利润、规费和税金","C":"人工费、材料费、施工机具使用费、管理费、利润和风险费","D":"人工费、材料费和施工机具使用费","E":""},"explanation":"采用概算定额法编制设计概算过程中，工程量计算完毕后，逐项套用各子目的综合单价，各子目的综合单价应包括人工费、材料费、施工机具使用费、管理费、利润、规费和税金。"},{"id":"704","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列定额中，定额水平应反映社会平均先进水平的是(   ) 。","answer":"A","difficulty":"易","options":{"A":"施工定额","B":"预算定额","C":"概算定额","D":"概算指标","E":""},"explanation":"本题考查的是工程定额体系。施工定额反映社会平均先进水平。"},{"id":"705","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，电力建设工程中，（ ）是初步设计阶段工程概算编制的依据;是初步设计阶段工程招标标底、最高投标限价、投标报价编制的参考依据;是编制投资估算指标的基础;是调解处理工程造价纠纷、鉴定工程造价的参考依据。","answer":"B","difficulty":"易","options":{"A":"预算定额","B":"概算定额","C":"消耗量定额","D":"施工定额","E":""},"explanation":"概算定额是初步设计阶段工程概算编制的依据;是初步设计阶段工程招标标底、最高投标限价、投标报价编制的参考依据;是编制投资估算指标的基础;是调解处理工程造价纠纷、鉴定工程造价的参考依据"},{"id":"706","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，根据现行工程量清单计价规范，需在招标工程量清单列出总金额的其他项目是()。","answer":"D","difficulty":"中","options":{"A":"设备暂估价","B":"计日工","C":"总承包服务费","D":"暂列金额","E":""},"explanation":"暂列金额由招标人填写其项目名称、计量单位、暂定金额等，若不能详列，也可只列暂定金额总额。"},{"id":"707","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列清单项目中，投标人不得自主报价的是（）","answer":"C","difficulty":"易","options":{"A":"总价措施项目","B":"总承包服务费","C":"专业工程暂估价","D":"计日工","E":""},"explanation":"本题考查的是最高投标限价的编制。专业工程暂估价按招标文件提供金额计列。"},{"id":"708","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，单价合同计量，按（    ）计算。","answer":"B","difficulty":"中","options":{"A":"招标清单工程量","B":"实际完成工程量","C":"承包人报送工程量","D":"监理核定工程量","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第8.2.1 条，工程计量时，若发现招标工程量清单中出现缺项、工程量偏差，或因工程变更引起工程量的增减，应按承包人在履行合同过程中实际完成的工程量计算。"},{"id":"709","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），以下属于知识产权转让与研究试验费的是（）。","answer":"A","difficulty":"易","options":{"A":"本工程使用的专项技术","B":"本工程使用的新产品试质费","C":"本工程使用的中间试验费","D":"本工程使用的重要科学研究补助费","E":""},"explanation":"知识产权转让费与研究实验费不包括应该由科技三项费用（既新产品试质费、中间试验费、重要科学研究补助费）开支的项目。"},{"id":"710","question":"根据《电力建设工程工程量清单计算规范》（DL/T 5745-2021），关于分部分项工程项目清单的编制造价，下列说法正确的是（）。","answer":"A","difficulty":"中","options":{"A":"同一标段工程的项目编码不得有重码","B":"常规工程的项目特征无需描述","C":"项目特征描述不得直接采用“详见××图号”的方式","D":"工程量应在实体工程量基础上增加施工损耗量","E":""},"explanation":"工程量清单的项目特征是确定一个清单项目综合单价不可缺少的重要依据，在编制工程量清单时，必须对项目特征进行准确和全面的描述。\n若采用标准图集或施工图纸能够全部或部分满足项目特征描述的要求，项目特征描述可直接采用\"详见××图集\"或\"××图号\"的方式。\n分部分项工程项目清单中所列工程量应按专业工程量计算规范规定的工程量计算规则计算，不考虑施工损耗量。"},{"id":"711","question":"根据《压缩空气储能电站经济评价导则》（DL/T 2921-2025），压缩空气储能电站项目运营期可按多少年计算（  ）。","answer":"C","difficulty":"中","options":{"A":"15年","B":"20年","C":"25年","D":"30年","E":""},"explanation":"根据导则附录E，压缩空气储能电站项目运营期可按 25 年计算。"},{"id":"712","question":"根据《压缩空气储能电站经济评价导则》（DL/T 2921-2025），压缩空气储能的修理费提存率为多少（  ）。","answer":"B","difficulty":"难","options":{"A":"0.5%-1.0%","B":"1%-1.5%","C":"1.5%-2.0%","D":"首年1%，每5年增加0.5%","E":""},"explanation":"根据导则附录E，修理费提存率可按 1.0%～1.5%计提。"},{"id":"713","question":"根据《国家发展改革委 国家能源局关于建立煤电容量电价机制的通知》（发改价格〔2023〕1501号），关于未纳入受电省份电力电量平衡的跨省跨区外送煤电机组的容量电费，以下说法正确的是（  ）。","answer":"A","difficulty":"中","options":{"A":"由送电省份承担其容量电费","B":"由受电省份承担其容量电费","C":"由送电省份和受电省份协商分摊其容量电费","D":"无容量电费","E":""},"explanation":"根据《国家发展改革委 国家能源局关于建立煤电容量电价机制的通知》（发改价格〔2023〕1501号），对未纳入受电省份电力电量平衡的跨省跨区外送煤电机组，由送电省份承担其容量电费。"}],"multi":[{"id":"1","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），隔墙、天棚吊顶定额中工作内容不包括（ ）。","answer":"CDE","difficulty":"中","options":{"A":"收边","B":"压条","C":"面层抹灰","D":"面层油漆","E":"面层饰面"},"explanation":"隔墙、天棚吊顶定额中包括安装后填缝、收边、压条等工作内容，不包括面层抹灰、油漆、饰面。"},{"id":"2","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），设备基础工程包括的工作内容有（  ）。","answer":"ABCD","difficulty":"中","options":{"A":"预埋螺栓孔","B":"浇制基础","C":"配合安装螺栓固定架","D":"二次灌浆","E":"弹簧支座"},"explanation":"设备基础工程包括清理基层、浇制混凝土垫层、浇制基础、预埋螺栓孔、配合安装螺栓固定支架、铁件制作与预埋、二次灌浆、安拆脚手架等工作内容。设备基础中不含弹簧支座。"},{"id":"3","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），关于砖砌围墙概算工程量计算规则，正确的说法是（ ）。","answer":"ACE","difficulty":"中","options":{"A":"按照围墙面积计算工程量","B":"按照围墙体积计算工程量","C":"砖围墙定额按照 240mm 厚编制","D":"石墙定额按照 370mm 厚编制","E":"围墙基础是按照1.5m 埋深（室外整平标高至基础底标高）考虑的"},"explanation":"围墙概算工程量计算规则：按照围墙面积计算工程量，砖围墙定额按照 240mm 厚编制，石墙定额按照 350mm 厚编制，围墙基础是按照1.5m 埋深（室外整平标高至基础底标高）考虑的。"},{"id":"4","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），以下费用在2018年版《电力建设工程预算定额》的定额基价中没有包括的是（ ）。","answer":"BCE","difficulty":"难","options":{"A":"施工机械操作工人的人工费","B":"材料的到场检验费","C":"施工现场管理人员的人工费","D":"施工机械的大修费","E":"施工现场排污费"},"explanation":"定额直接费=人工费+计价材料费+施工机械使用费"},{"id":"5","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），采暖、通风、空调、除尘、照明、防雷接地、特殊消防工程的定额中不包含哪些费用（  ）。","answer":"AB","difficulty":"中","options":{"A":"设备费","B":"设备运杂费","C":"系统调试费","D":"单体调试费","E":"设备的安装费"},"explanation":"采暖、通风、空调、除尘、照明、防雷接地、特殊消防工程的定额中不包含设备费与设备运杂费。"},{"id":"6","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），建筑工程给排水（含常规水消防）中，属于材料的是（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"水表","B":"阀门","C":"水泵接合器","D":"生活消防水箱","E":"水泵"},"explanation":"建筑工程给排水（含常规水消防）中，水表、流量计、压力表、阀门、卫生器具、室内消火栓、水泵接合器、生活消防水箱等定义为材料；水泵、稳压器、水处理装置、水处理装置、水净化装置定义为设备。"},{"id":"7","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），建筑工程采暖工程中，属于设备的是（ ）。","answer":"DE","difficulty":"中","options":{"A":"散热器","B":"疏水器","C":"蒸汽分气缸","D":"电暖气","E":"暖风机"},"explanation":"建筑工程采暖工程中，散热器、疏水器、蒸汽分气缸、集器罐、伸缩节、流量计、温度计、压力表、阀门被定义为材料；电暖气、电热水器、暖风机、热风幕等定义为设备。"},{"id":"8","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），接地工程工作内容包括（ ）。","answer":"ABE","difficulty":"难","options":{"A":"接地极制作与安装","B":"接地母线敷设","C":"降阻剂换填","D":"阴极保护接地","E":"避雷带（网）安装"},"explanation":"接地工程包括接地极制作与安装、接地母线敷设、接地跨接线、避雷针制作与安装、引下线敷设、避雷带（网）安装、接地测试、安装接地极或敷设接地母线时土方开挖与回填、安装脚手架等工作内容。不包括接地降阻剂换填、阴极保护接地。"},{"id":"9","question":"根据《电力建设工程预算定额—热力设备安装工程》（2018年版）中，下列属于锅炉本体平台扶梯的安装工作内容的有（ ）。","answer":"ABC","difficulty":"中","options":{"A":"平台、支撑、扶梯的清点、组合、安装","B":"栏杆及围护板配置、安装","C":"全炉平台、扶梯、栏杆的工艺性校正","D":"锅炉之间及锅炉与主厂房之间的连接平台、扶梯的安装","E":"锅炉本体平台扶梯油漆工程"},"explanation":"锅炉本体平台扶梯的工作内容包括：平台、支撑、扶梯的清点、组合、安装，栏杆及围护板配置、安装，全炉平台、扶梯、栏杆的工艺性校正。"},{"id":"10","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，电缆防火材料有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"阻火堵料","B":"防火隔板","C":"防火涂料","D":"阻火包","E":"纯棉制品"},"explanation":"防火材料包括防火隔板、防火涂料、阻火包、阻火堵料。"},{"id":"11","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，SF6全封闭组合电气（GIS）安装工作内容包括（  ）。","answer":"ACDE","difficulty":"中","options":{"A":"本体安装","B":"无尘化设施安装","C":"充SF6气体","D":"分支母线安装","E":"设备本体电缆安装"},"explanation":"SF6全封闭组合电气（GIS）安装工作内容包括本体安装，真空处理，充SF6气体，分支母线安装，设备本体电缆安装，接地，单体调试。"},{"id":"12","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，共箱电缆母线安装定额工作内容不包括（ ）。","answer":"ABCE","difficulty":"难","options":{"A":"终端头安装","B":"中间头安装","C":"T接头的制作安装","D":"电缆导体外壳安装","E":"电缆导体敷设"},"explanation":"共箱电缆母线安装定额工作内容仅包括电缆导体外壳安装。"},{"id":"13","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，钢制电缆桥架工程量中包含（ ）重量。","answer":"ABC","difficulty":"易","options":{"A":"桥架","B":"横担","C":"立柱","D":"防火涂料","E":"防腐涂料"},"explanation":"钢制电缆桥架工程量中包含桥架、横担、立柱等重量。"},{"id":"14","question":"根据《电力建设工程预算定额—电气设备安装工程》（2018年版）中，变压器安装的工作内容包括（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"开箱检查","B":"本体安装","C":"附件安装","D":"补漆","E":"中性点设备安装"},"explanation":"变压器安装工作内容：本体安装，端子箱、控制箱安装、设备本体电缆安装，引下线安装，铁构件制作安装，油过滤，接地，单体调试，不包括中性点设备安装。"},{"id":"15","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建设预算文件一般包括（  ）","answer":"ABC","difficulty":"中","options":{"A":"投资估算书","B":"初步设计概算书","C":"施工图预算书","D":"施工图概算","E":"总平面设计图"},"explanation":"建设预算文件一般包括投资估算书、初步设计概算书、施工图预算书。"},{"id":"16","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，根据特殊地区施工增加费的定义，以下属于特殊地区的是（    ）。","answer":"ACE","difficulty":"中","options":{"A":"新疆吐鲁番地区","B":"名胜风景区","C":"北纬45度以北地区","D":"平均海拔高度2500米的地区","E":"平均海拔高度3500米的地区"},"explanation":"特殊地区包括：高海拔地区（平均海拔高度3000米以上的地区），高纬度寒冷地区（即北纬45度以北地区），酷热地区（面积在1万k㎡以上的沙漠地区，以及新疆吐鲁番地区）"},{"id":"17","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，临时设施费包括（  ）费用。","answer":"ABC","difficulty":"中","options":{"A":"施工企业职工宿舍","B":"工棚","C":"厂区围墙范围内的临时施工道路","D":"进场施工铁路专用线","E":"施工、生活用380V变压器高压侧以外的装置及路线"},"explanation":"临时设施包括:职工宿舍，办公、生活、文化、福利等公用房屋，仓库、加工厂、工棚、围墙等建、构筑物，厂区围墙范围内的临时施工道路及水、电(含380V降压变压器)、通信的分支管线，建设期间的临时隔墙等。"},{"id":"18","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，设备材料监造费中，材料监造的范围是（  ）。","answer":"AE","difficulty":"易","options":{"A":"四大管道及管件","B":"高压加热器","C":"循环水泵","D":"磨煤机","E":"钢结构"},"explanation":"设备材料监造费中，属于材料监造的是四大管道及管件、钢结构、6kV及以上电缆。"},{"id":"19","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列选项中，不属于建设工程项目静态投资的有（ ）。","answer":"CD","difficulty":"易","options":{"A":"基本预备费","B":"因工程量误差所增加的工程造价","C":"涨价预备费","D":"建设期贷款利息","E":"设备购置费"},"explanation":"静态投资包括:建筑安装工程费、设备和工器具购置费、工程建设其他费、基本预备费，以及因工程量误差而引起的工程造价增减值等。"},{"id":"20","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列费用中，为不可竞争性费用的是（  ）。","answer":"BCD","difficulty":"中","options":{"A":"人工费","B":"税金","C":"规费","D":"安全文明施工费","E":"材料费"},"explanation":"建筑安装工程费中，为不可竞争性费用的是税金、规费、安全文明施工费。"},{"id":"21","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，直接工程费中，属于定额直接费的是（ ）。","answer":"ACD","difficulty":"难","options":{"A":"定额人工费","B":"定额材料费","C":"定额机械使用费","D":"材料费中已进入定额计价的消耗性材料费","E":"管理费"},"explanation":"人工费、材料费中已进入定额基价的消耗性材料费、施工机械使用费之和称为定额直接费"},{"id":"22","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下恶劣天气属于不可抗的的是（  ）。","answer":"CDE","difficulty":"易","options":{"A":"大风","B":"风沙","C":"台风","D":"暴雨","E":"暴风雪"},"explanation":"台风、暴雨、暴风雪等极恶略天气属于不可抗力。发承包双方在签订合同时不可预见 ，在合同履行过程中不能避免且不能克服的自然灾害和社会性 突发事件。"},{"id":"23","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，编制工程预算时，项目法人应提供的资料有（  ）。","answer":"ABCD","difficulty":"易","options":{"A":"工程预算编制原则","B":"扩大供货范围相应的图纸及工程量资料","C":"合同及协议文件","D":"需要的设计图纸","E":"经项目经理批准的特殊施工措施方案"},"explanation":"编制工程预算时，项目法人应提供的资料如下:1.提供工程预算编制原则。2.提供设备、主要材料订货、到货价格资料。3.提供委托外部设计、施工项目及自营项目的工程预算。4.提供建设项目发生的其他费用相关资料，如合同及协议文件等。5.提供需要的设计图纸或工程量资料，扩大供货范围相应的图纸和工程量资料。"},{"id":"24","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建设预算编制基准期价格水平一般可将时点确定为（  ）。","answer":"ABCD","difficulty":"易","options":{"A":"年","B":"半年","C":"季","D":"月","E":"周"},"explanation":"建设预算编制基准期价格水平一般可将时点确定为年、半年、季、月。"},{"id":"25","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），火力发电工程初步设计概算附件应包括（  ）内容。","answer":"BCDE","difficulty":"中","options":{"A":"铺底流动资金计算表","B":"材料价差计算表","C":"价差预备费计算表","D":"建设期利息计算表","E":"机械价差计算表"},"explanation":"火力发电工程初步设计概算附件应包括外委设计项目的概算书(如铁路、公路、码头等)、特殊项目的依据性文件及概算书等内容，附表应包括人工、材料、机械价差计算表，价差预备费计算表，建设期利息计算表等内容。"},{"id":"26","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列属于设计文件评审费的包括（  ）。","answer":"ABC","difficulty":"易","options":{"A":"可行性研究文件评审费","B":"初步设计文件评审费","C":"施工图文件审查费","D":"施工过程造价咨询及竣工结算审核费","E":"项目后评价费"},"explanation":"设计文件评审费是指项目法人根据国家和行业有关规定，对工程项目的设计文件进行评审所发生的费用，包括可行性研究文件评审费、初步设计文件评审费、施工图文件审查费。"},{"id":"27","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，基本预备费的计费基数包括（  ）。","answer":"ABCD","difficulty":"易","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"其他费用","E":"建设期贷款利息"},"explanation":"基本预备费=（建筑工程费+安装工程费+设备购置费+其他费用）*基本预备费费率"},{"id":"28","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，项目法人管理费的计费基数包括（  ）。","answer":"AB","difficulty":"易","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"其他费用","E":"建设期贷款利息"},"explanation":"项目法人管理费=（建筑工程费+安装工程费）*费率"},{"id":"29","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，招标费的计费基数包括（  ）。","answer":"ABC","difficulty":"易","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"其他费用","E":"建设期贷款利息"},"explanation":"招标费=（建筑工程费+安装工程费+设备购置费）*费率"},{"id":"30","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，工器具及办公家具购置费的计费基数包括（  ）。","answer":"AB","difficulty":"易","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"其他费用","E":"建设期贷款利息"},"explanation":"工器具及办公家具购置费=（建筑工程费+安装工程费）*费率"},{"id":"31","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，生产职工培训及提前进厂费的计费基数包括（  ）。","answer":"AB","difficulty":"易","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"其他费用","E":"建设期贷款利息"},"explanation":"工器具及办公家具购置费=（建筑工程费+安装工程费）*费率"},{"id":"32","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）设备与材料费用性质划分，在配电系统中，下列属于设备费的有（    ）。","answer":"AE","difficulty":"中","options":{"A":"断路器","B":"封闭母线","C":"共箱母线","D":"绝缘子","E":"隔离开关"},"explanation":"配电系统的断路器、电抗器、电流互感器、电压互感器、隔离开关属于设备；封闭母线、共箱母线、管型母线、软母线、绝缘子、金属等属于材料。"},{"id":"33","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）设备与材料费用性质划分，在热工控制系统中，下列属于装置性材料费的有（  ）。","answer":"BCE","difficulty":"难","options":{"A":"热工控制检测仪表","B":"仪表阀门","C":"电磁阀","D":"配电箱","E":"汇线桥架"},"explanation":"热工控制钢管、合金管、管缆、仪表加工件及配件、仪表阀门、电磁阀、汇线桥架、电缆、补偿导线、接线盒等属于材料。"},{"id":"34","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，编制及送审初步设计概算时，项目法人应提供的资料包括（   ）。","answer":"ABDE","difficulty":"难","options":{"A":"主要设备、材料的供货价格及供货范围","B":"建设场地征用及清理费的费用规定及依据文件或协议","C":"特殊施工措施方案及费用","D":"项目前期工作的各项费用","E":"外委设计项目的正式概算"},"explanation":"项目法人应提供的资料包括：主要设备、材料的供货价格及供货范围；建设场地征用及清理费的费用规定及依据文件或协议；外委设计项目的正式概算、如铁路、公路、码头、航道、水库等；项目前期工作的各项费用；当期购电单价；需要提供的其他有关材料。"},{"id":"35","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，可行性研究阶段项目前期工作费的计费基数包括（    ）。","answer":"AB","difficulty":"易","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"其他费用","E":"建设期贷款利息"},"explanation":"项目前期工作费=（建筑工程费+安装工程费）*费率"},{"id":"36","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，设备材料监造费的计费基数包括（  ）","answer":"CD","difficulty":"易","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"装置性材料费","E":"其他费用"},"explanation":"设备材料监造费=（设备购置费+装置性材料费）* 费率"},{"id":"37","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，施工过程造价咨询及竣工结算审核费的计费基数包括（ ）。","answer":"AB","difficulty":"易","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"装置性材料费","E":"其他费用"},"explanation":"造价咨询及竣工结算审核费=（建筑工程费+安装工程费）*费费率"},{"id":"38","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，知识产权转让与研究试验费不包括以下哪些费用：（  ）","answer":"BCD","difficulty":"难","options":{"A":"项目法人在本工程中使用专项研究成果、先进技术所支付的一次性转让费用。","B":"应该由管理费开支的鉴定、检查和试验费；","C":"应该由勘察设计费开支的项目","D":"应该由科技三项费用（即新产品试制费、中间试验费和重要科学研究补助费）开支的项目；","E":"为本建设项目提供或验证设计数据进行必要的研究试验所发生的费用，以及设计规定的施工过程中心必须进行的研究试验所发生的费用。"},"explanation":"知识产权转让与研究试验费不包括以下哪些费用：应该由科技三项费用（即新产品试制费、中间试验费和重要科学研究补助费）开支的项目；应该由管理费开支的鉴定、检查和试验费；应该由勘察设计费开支的项目。"},{"id":"39","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，配套的定额有（  ）。","answer":"ABE","difficulty":"难","options":{"A":"电力建设工程预算定额","B":"电力建设工程概算定额","C":"项目所在地定额","D":"水电定额","E":"电力建设工程估算指标"},"explanation":"《火力发电工程建设预算编制与计算规定》是火力发电工程投资估算、初步设计概算、施工图预算、工程量清单编制和费用计算的依据，应于电力建设工程估算指标、概算定额、预算定额配套使用。"},{"id":"40","question":"根据《火电工程限额设计参考造价指标》，给出了调整模块，对单个调整模块的造价指标描述正确的是（  ）。","answer":"ABE","difficulty":"难","options":{"A":"静态投资指标","B":"含模块界限内的建筑、设备、安装费用","C":"动态投资指标","D":"含其他费用","E":"不含基本预备费"},"explanation":"模块造价为静态投资，含模块界限内的建筑、设备、安装费用，不含其它费用、材料价差及基本预备费。"},{"id":"41","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），设备基础按照设备基础体积计算工程量，计算体积时，下列说法正确的是（   ）。","answer":"AC","difficulty":"难","options":{"A":"不扣除螺栓孔所占体积","B":"扣除螺栓孔所占体积","C":"不计算基础垫层体积","D":"计算基础垫层体积","E":"扣除含在基础中的过梁"},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），设备基础按照设备基础体积计算工程量，计算体积时，不扣除螺栓孔所占体积,不计算基础垫层体积；浇制混凝土基础计算体积时，不扣除含在基础中的过梁。"},{"id":"42","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），关于变压器基础油池计算工程量，正确的是（   ）。","answer":"ACD","difficulty":"难","options":{"A":"按照变压器基础油池容积计算工程量","B":"扣除油篦子所占体积","C":"不扣除卵石所占体积","D":"不扣除设备及其基础","E":"按照变压器基础油池外轮廓计算工程量"},"explanation":"变压器基础油池按照基础油池容积计算工程量。计算油池容积时，不扣除设备及其基础、油篦子、卵石等所占的体积。容积=净空高度（结构）×净空面积（结构）。"},{"id":"43","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），规定规定，地下与地面设施根据地面面层材质，按照建筑轴线尺寸面积分别计算工程量，下列说法正确的是（   ）。","answer":"ACD","difficulty":"难","options":{"A":"不扣除设备基础所占面积","B":"扣除洞口所占面积","C":"不扣除墙体作战米那就","D":"不扣除地面伸缩缝","E":"扣除沟道所占面积"},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），地下与地面设施根据地面面层材质，按照建筑轴线尺寸面积分别计算工程量，不扣除设备基础、洞口、地坑、池井、沟道、墙体、柱、零米梁板、地面伸缩缝等所占的面积。"},{"id":"44","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，电力建设工程招标时，工程量清单文件一般由（   ）组成。","answer":"ABCE","difficulty":"中","options":{"A":"分部分项工程项目清单","B":"措施项目清单","C":"其他项目清单","D":"规费税金清单","E":"招标人采购材料及设备表"},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）相关规定，电力建设工程招标时，工程量清单文件一般由分部分项工程项目清单、措施项目清单、其他项目清单、投标人采购材料及设备表、招标人采购材料及设备表组成。"},{"id":"45","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当出现（   ）产生的计价风险，应由发包人承担并应及时调整相应合同价款工期。","answer":"ABCD","difficulty":"难","options":{"A":"法律法规发生变化","B":"政策发生变化","C":"工程变更","D":"发包人要求提前竣工的","E":"发生不可抗力"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列因素出现产生的计价风险,应由发包人承担,并应及时调整相应的合同价款和工期。1.法律法规与政策发生变化；2.工程变更；3.发包人要求提前竣工的。"},{"id":"46","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人提供的材料和设备(以下简称甲供材料)应在招标文中按照规定填写《招标人采购材料及设备表》，写明甲供材料的（   ）等。","answer":"ABCE","difficulty":"中","options":{"A":"材料（设备）名称","B":"型号规格","C":"交货方式","D":"质量证明文件","E":"数量"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人提供的材料和设备(以下简称甲供材料)应在招标文中按照规定填写《招标人采购材料及设备表》，写明甲供材料的名称、规格、数量、交货方式、交货地点、交货时间等。"},{"id":"47","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，采用计日工计价的任何一项变更工作，关于承包人应在该项变更工作实施过程中向发包人提交材料或凭证的说法正确的是（   ）。","answer":"ACDE","difficulty":"难","options":{"A":"需注明工作名称、内容、数量","B":"仅需注明投入该共工作人员姓名，无需注明工种","C":"需注明施工设备型号与耗用台班","D":"投入该工作的材料名称和数量","E":"无需提供现场签证"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，采用计日工计价的任何一项变更工作，承包人应在该项变更工作实施过程中，按合同约定提交下列报表和有关凭证报送发包人复核：1.工作名称、内容和数量。2.投入该工作所有人员的姓名、工种、级别和耗用工时。3.投入该工作的材料名称、类别和数量。4.投入该工作的施工设备型号、台数和耗用台时。5.发包人要求提交的其他资料和凭证。"},{"id":"48","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），以下单位采用应保留小数点后三位数字的是（   ）。","answer":"AD","difficulty":"易","options":{"A":"t","B":"m","C":"kg","D":"km","E":"㎡"},"explanation":"根据《电力建设工程工程量清单计算规范火力发电工程》（2021版）相关规定，工程量计算时每一项目汇总的有效位数应遵守下列规定:1.以“t”、“km”为单位，应保小点后三位数字，第四位小数四舍五入。2.以“m”、“㎡”、“m³”、“kg”为单位，应保留小数点后两位数字，第三位小数四舍五入。3.以“个”、“根”、“件”、“系统”为单位，应取整数。"},{"id":"49","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），适用于新建、扩建的单机容量50MW~1000MW级机组燃煤发电工程及燃气-蒸汽联合循环发电工程（    ）阶段的计价活动。","answer":"CDE","difficulty":"中","options":{"A":"预可研阶段","B":"可行性研究阶段","C":"初步设计阶段","D":"施工图设计阶段","E":"项目实施阶段"},"explanation":"《电力建设工程工程量清单计算规范火力发电工程》（2021版）用于新建扩建的单机容50MW~1000MW组燃煤发电程及气-汽联合1.0.2循环发电工程初步设计、施图设计两阶的发承包及其实阶的计价活动。"},{"id":"50","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），火力发电建筑工程初步设计阶段，关于基础与地基处理工程工程量计算说法正确的是（   ）。","answer":"BDE","difficulty":"中","options":{"A":"变压器油池含钢筋制作、按照","B":"钢筋混凝土设备基础不含钢筋制作、安装","C":"混凝土灌注桩不含钢筋制作、安装","D":"地圈梁含钢筋制作、安装","E":"砖基础含钢筋制作、安装"},"explanation":"根据《电力建设工程工程量清单计算规范火力发电工程》（2021版）相关规定，初步设计阶段，火力发电工程钢筋混凝土基础、变压器油池、钢筋混凝土设备基础中不含钢筋制作、安装；砖基础、毛石基础、毛石混凝土基础、混凝土灌注桩、地下连续墙、地圈梁含钢筋制作、安装。"},{"id":"51","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程费包括建筑工程费和安装工程费，下列属于建筑安装工程费的组成部分的是（   ）。","answer":"ABDE","difficulty":"难","options":{"A":"税金","B":"利润","C":"价差预备费","D":"直接费","E":"间接费"},"explanation":"建筑安装工程费包括建筑工程费和安装工程费，由直接费、间接费、利润和税金组成。"},{"id":"52","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，材料预算价格中包括的内容有（   ）。","answer":"BCDE","difficulty":"难","options":{"A":"材料价差","B":"材料原价","C":"运输损耗费","D":"采购及保管费","E":"保险保价费"},"explanation":"材料预算价格是工程所需材料在施工现场仓库或堆放地点的出库价格。包括材料原价(或供应价格)、材料运输费、保险保价费、运输损耗费、采购及保管费。"},{"id":"53","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用包括在勘察设计费中的是（   ）。","answer":"BCD","difficulty":"中","options":{"A":"可行性研究设计费","B":"初步设计概算编制费","C":"施工图预算编制费","D":"竣工图文件编制费","E":"竣工结算审核费"},"explanation":"勘察设计费是指对工程建设项目进行勘察设计所发生的费用，包括项目的各项勘探、勘察费用，初步设计费、施工图设计费、竣工图文件编制费，施工图预算编制费，以及设计代表的现场技术服务费。"},{"id":"54","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列属于初设概算编制依据的是（   ）。","answer":"ABD","difficulty":"中","options":{"A":"项目所在地造价管理机构发布的建筑材料价格信息","B":"概算定额","C":"预算定额","D":"电力行业定额管理机构发布的设备信息价","E":"估算指标"},"explanation":"预算定额是施工图预算的编制依据，估算指标是在可行性研究阶段采用的一种扩大的技术经济指标。其他选项均为初设概算的编制依据。"},{"id":"55","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用中，属于基本预备费的是（   ）。","answer":"ABD","difficulty":"易","options":{"A":"因设计变更（含施工过程中工程量增减、设备改型、材料代用）而增加的费用","B":"一般自然灾害可能造成的损失","C":"建设期间由于价格等变化引起工程造价变化的预测预留费用","D":"预防自然灾害所采取的临时措施费用","E":"编制基准期价差"},"explanation":"基本预备费是指为因设计变更(含施工过程中工程量增减、设备改型、材料代用)增加的费用、一般自然灾害可能造成的损失和预防自然灾害所采取的临时措施费用，以及其他不确定因素可能造成的损失而预留的工程建设资金。"},{"id":"56","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用属于项目工程建设检测费的有（   ）。","answer":"BCD","difficulty":"易","options":{"A":"设备材料监造费","B":"电力工程质量检测费","C":"特种设备安全监测费","D":"桩基检测费","E":"试桩费"},"explanation":"工程建设检测费是指根据国家行政主管部门及电力行业的有关规定，对工程质量、环境保护、水土保持设施、特种设备(消防、电梯、锅炉、压力容器等) 安装进行检验、检测所发生的费用。包括电力工程质量检测费、特种设备安全监测费、环境监测及环境保护验收费、水土保持监测及验收费、桩基检测费。"},{"id":"57","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，编制工程竣工结算的依据有（   ）。","answer":"ABCE","difficulty":"难","options":{"A":"现行电力行业工程量清单计价规范","B":"工程合同","C":"招标文件","D":"承包人已确认的工程量和追加的合同价款","E":"投标文件"},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，竣工结算按照下列依据进行编制与复核:\n(1)本规范和现行电力行业工程量清单计算规范。\n(2)工程合同及补充协议。\n(3)发承包双方已确认的施工过程结算价款。\n(4)发承包双方实施过程中已确认的工程量及其结算的合同价款。(5)发承包双方实施过程中已确认调整后追加 (减)的合同价款\n（6）建设工程设计文件及相关资料。\n（7）工程招投标文件。\n（8）其他相关依据。"},{"id":"58","question":"根据《电力建设工程概算定额》（2018年版），共包括（   ）。","answer":"ABCD","difficulty":"难","options":{"A":"建筑工程","B":"热力设备安装工程","C":"电气设备安装工程","D":"调试工程","E":"通信工程"},"explanation":"《电力建设工程概算定额》（2018年版）包括建筑工程、热力设备安装工程、电气设备安装工程与调试工程四册。"},{"id":"59","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，发电机电气部分包括（    ）。","answer":"AB","difficulty":"易","options":{"A":"发电机检查接线","B":"发电机励磁电阻器安装","C":"变压器安装","D":"断路器安装","E":"发电机本体安装"},"explanation":"《电力建设工程概算定额》（2018年版）中，发电机电气包括发电机本体检查接线，静态励磁系统、电压互感器及避雷器柜、中性点变压器柜、回路电流互感器、端子箱安装，发电机出线箱安装，发电机小间的铁构件、网门制作安装，接地，单体调试。"},{"id":"60","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），基础与地基处理工程中，地基处理的换填工程包括（）。","answer":"ABCE","difficulty":"难","options":{"A":"基坑土方开挖","B":"土方运输","C":"换填材料敷设、密实","D":"回填桩孔","E":"基地夯实"},"explanation":"《电力建设工程概算定额》（2018年版）基础与地基处理工程中，地基处理的换填工程包括基坑土方开挖、土方运输、基底夯实、换填材料铺设、密实等工作内容。"},{"id":"61","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），钢筋混凝土结构工程，定额中的钢筋量是完成定额子目工程量所需的钢筋用量，包括（    ）。","answer":"ABCD","difficulty":"难","options":{"A":"正常施工条件下所需的s钢筋、马凳钢筋、拉结钢筋","B":"结构钢筋","C":"构造钢筋","D":"钢筋连接用量","E":"其他各种钢筋"},"explanation":"定额中的钢筋量是完成定额子目工程量所需的钢筋用量，包括结构钢筋、构造钢筋、施工措施钢筋（指正常施工条件下所需的S钢筋、马凳钢筋、拉结钢筋等）、钢筋链接用量。"},{"id":"62","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，属于编制最高投标限价的计价依据的是（   ）。","answer":"ABCD","difficulty":"难","options":{"A":"国家、行业或地方相关管理部门颁发的计价定额和计价办法","B":"工程造价管理机构发布的工程造价信息；没有发布的参照市场价","C":"与建设项目相关的标准、规范、技术资料","D":"施工现场情况、工程特点及常规施工方案","E":"为项目重大节点可能提前实现的特殊赶工措施方案"},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）规定，最高投标限价应根据下列依据进行编制与复核:\n（1）本规范和现行电力行业工程清单计算规范；\n（2）国家或省级、行业建设主管部门颁发的计价依据及其计价办法；              （3）电力建设工程设计文件及相关资料；\n（4）拟定的招标文件及招标工程量清单；\n（5）与电力建设项目相关的标准、规范、技术资料；\n（6）施工现场情况、工程特点及常规施工方案；\n（7）工程造价信息或市场价格信息；\n（8）其他的相关资料。"},{"id":"63","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，造价管理的主要任务（）。","answer":"ACDE","difficulty":"易","options":{"A":"合理确定概算","B":"严控建设标准","C":"竞争形成价格","D":"有效降低投资","E":"控制建设成本"},"explanation":"第五条造价管理主要任务。合理确定概算，严格控制变更；竞争形成价格，有效降低投资；依法合规结算，控制建设成本。"},{"id":"64","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，设计概算应客观真实反映造价水平，并作为（）的依据。","answer":"BDE","difficulty":"易","options":{"A":"投资控制","B":"竣工决算","C":"造价绩效考核","D":"竣工审计","E":"竣工验收"},"explanation":"第十三条设计概算应客观真实反映造价水平，并作为竣工决算、竣工审计和竣工验收的依据。"},{"id":"65","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，招标文件应依据集团公司招标文件范本、技术规范书范本、合同范本编制，合理确定合同承包方式、供货范围、()()()()等主要内容。","answer":"ABCD","difficulty":"易","options":{"A":"报价依据及报价要求","B":"价格调整条款及报价风险","C":"合同支付条款","D":"合同结算条款","E":""},"explanation":"第十九条招标文件应依据集团公司招标文件范本、技术规范书范本、合同范本编制，合理确定合同承包方式、供货范围、报价依据及报价要求、价格调整条款及报价风险、合同支付条款、合同结算条款等主要内容。"},{"id":"66","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》， 工程结算应按照严格遵守合同、（）的原则。","answer":"BCDE","difficulty":"易","options":{"A":"合情合理","B":"依法依规","C":"诚实守信","D":"客观准确","E":"合作共赢"},"explanation":"第二十三条工程结算应严格遵守合同、依法合规、诚实守信、客观准确、合作共赢的原则办理。"},{"id":"67","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，（      ）以及不符合《中国华能集团有限公司基本建设财务管理办法》等有关制度的费用不得列入建设成本和竣工决算。","answer":"AB","difficulty":"易","options":{"A":"未按规定履行审批程序的变更","B":"设计概算外项目","C":"三重一大项目","D":"非生产项目","E":"科技项目"},"explanation":"第二十八条项目单位应严格控制建设成本的范围和标准。未按规定履行审批程序的变更、设计概算外项目以及不符合《中国华能集团有限公司基本建设财务管理办法》等有关制度的费用不得列入建设成本和竣工决算。"},{"id":"68","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，设计概算是项目（）的依据。","answer":"ABC","difficulty":"易","options":{"A":"竣工决算","B":"竣工决算审计","C":"竣工验收","D":"竣工付款","E":"投资决策"},"explanation":"第二条本细则所称设计概算是指按照初步设计方案和《火力发电工程建设预算编制与计算规定》等计算的工程投资。设计概算是项目竣工决算、竣工决算审计和竣工验收的依据。"},{"id":"69","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，设计概算应与（）工程进行对标，分析说明造价差异情况和主要原因。","answer":"AB","difficulty":"易","options":{"A":"行业限额指标","B":"同期、同地区、同类型工程","C":"同类型工程","D":"同期类似工程","E":"同期类似造价最低工程"},"explanation":"第十二条设计概算应与行业限额指标及同期、同地区、同类型工程进行对标，分析说明造价差异情况和主要原因。"},{"id":"70","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算需在设计概算基础上，综合考虑市场行情、企业标准和管理成果，遵循客观合理、先进适度的原则编制。管理概算应控制在设计概算之内。主要编制依据（）","answer":"ACDE","difficulty":"难","options":{"A":"批准设计概算及审查意见","B":"已签主机、辅机和主体工程施工合同","C":"集团公司批准的重大设计变更和专项费用","D":"集团公司工程造价指标和费用标准","E":"二级单位批准的重要设计变更"},"explanation":"第十六条管理概算需在设计概算基础上，综合考虑市场行情、企业标准和管理成果，遵循客观合理、先进适度的原则编制。管理概算应控制在设计概算之内。主要编制依据如下：\n（一）批准设计概算及审查意见。\n（二）主机、主要辅机和主体工程施工合同。\n（三）集团公司批准的重大设计变更和专项费用。\n（四）集团公司工程造价指标和费用标准。\n（五）二级单位批准的重要设计变更。"},{"id":"71","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算计列标准中，建设期贷款利息按（）计列。","answer":"ADE","difficulty":"易","options":{"A":"管理概算静态投资","B":"管理概算动态投资","C":"工程实际进度","D":"工程进度计划","E":"当期利率测算"},"explanation":"第十七条管理概算计列标准\n（五）建设期贷款利息。按管理概算静态投资、工程进度计划和当期利率测算计列。"},{"id":"72","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算计列标准中，工程设计、采购、施工应执行批准的初步设计方案和建设标准。发生设计变更应按集团公司有关规定履行审批程序；发生概算外项目应按业务属性履行集团公司相关审批程序。未经批准的设计变更和概算外项目不得列支工程决算。须报集团公司审批的事项（）。","answer":"ABD","difficulty":"易","options":{"A":"重大设计变更","B":"单项增加投资1000万元以上的生产性概算外项目","C":"单项增加投资2000万元以上的生产性概算外项目","D":"任何非生产性概算外项目","E":"任何概算外项目"},"explanation":"第二十条工程设计、采购、施工应执行批准的初步设计方案和建设标准。发生设计变更应按集团公司有关规定履行审批程序；发生概算外项目应按业务属性履行集团公司相关审批程序。未经批准的设计变更和概算外项目不得列支工程决算。\n（一）须报集团公司审批的事项如下：\n1.重大设计变更。\n2.单项增加投资1000 万元以上的生产性概算外项目。\n3.任何非生产性概算外项目。\n（二）二级单位和项目单位须明确各自对设计变更、概算外项目的审批权限和审批程序。"},{"id":"73","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，发生（）情况之一，对工程投资影响较大并超出基本预备费，结合概算执行的总体情况可调整设计概算。","answer":"ABCD","difficulty":"易","options":{"A":"国家政策、法律法规发生变化","B":"发生不可抗力因素","C":"工程建设条件、方案、标准和规模发生重大变化","D":"集团公司批复的专题专项费用","E":"设计变更和概算外项目"},"explanation":"第二十三条发生下列情况之一，对工程投资影响较大并超出基本预备费，结合概算执行的总体情况可调整设计概算：\n（一）国家政策、法律法规发生变化。\n（二）发生不可抗力因素。\n（三）工程建设条件、方案、标准和规模发生重大变化。\n（四）集团公司批复的专题专项费用。"},{"id":"74","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，发生（）情况之一，不予调整设计概算。","answer":"ABC","difficulty":"易","options":{"A":"未按管理权限履行程序，擅自扩大规模、提高标准、变更方案增加投资的","B":"由于勘察、设计、施工、制造、监理等单位过失、管理不善、失职渎职等原因增加投资的","C":"基本预备费可以解决增加投资的","D":"发生不可抗力因素","E":"工程建设条件、方案、标准和规模发生重大变化"},"explanation":"第二十四条发生下列情况之一，不予调整设计概算：\n（一）未按管理权限履行程序，擅自扩大规模、提高标准、变更方案增加投资的。\n（二）由于勘察、设计、施工、制造、监理等单位过失、管理不善、失职渎职等原因增加投资的。\n（三）基本预备费可以解决增加投资的。"},{"id":"75","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，擅自发生（）等导致超概算投资的，按有关制度追究管理责任。","answer":"ABCE","difficulty":"难","options":{"A":"重大设计变更","B":"超规模建设","C":"超标准建设","D":"超预算建设","E":"概算外项目"},"explanation":"第二十八条擅自发生重大设计变更、超规模、超标准建设和概算外项目等导致超概算投资的，按有关制度追究管理责任。"},{"id":"76","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，二级单位主要职责（）。","answer":"ABCD","difficulty":"中","options":{"A":"负责按照国家、行业及集团公司火电工程结算管理有关要求，结合本单位实际，制定火电工程结算管理相关制度","B":"组织、指导、检查火电工程合同结算；审批超出合同条款规定的结算调整事项；审批两级集采合同的结算，并在本单位实施要求中明确二级单位和项目单位的具体权限","C":"组织审核涉及政策性调整的工程结算重大事项，并提出审核意见，并负责审批","D":"按规定审批工程的预留费用","E":"核定竣工结算报告，批复后并报集团公司备案"},"explanation":"第八条二级单位主要职责\n（一）负责按照国家、行业及集团公司火电工程结算管理有关要求，结合本单位实际，制定火电工程结算管理相关制度。\n（二）组织、指导、检查火电工程合同结算；审批超出合同条款规定的结算调整事项；审批两级集采合同的结算，并在本单位实施要求中明确二级单位和项目单位的具体权限。\n（三）组织审核涉及政策性调整的工程结算重大事项，并提出审核意见，并负责审批。\n（四）按规定审批工程的预留费用。\n（五）核定竣工结算报告，并报集团公司备案。"},{"id":"77","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，项目单位主要职责（）。","answer":"ABCE","difficulty":"中","options":{"A":"负责按照国家、行业及上级单位火电工程结算管理有关要求，制定适合于本项目的结算管理实施要求","B":"负责工程建设全过程结算具体工作","C":"负责办理合同结算","D":"负责编制竣工结算报告，分析设计概算执行情况，报送集团公司审核","E":"负责组织整理和编制工程结算典型案例"},"explanation":"第九条项目单位主要职责\n（一）负责按照国家、行业及上级单位火电工程结算管理有关要求，制定适合于本项目的结算管理实施要求。\n（二）负责工程建设全过程结算具体工作。\n（三）负责办理合同结算。\n（四）负责编制竣工结算报告，分析设计概算执行情况，报送二级单位审核。\n（五）负责组织整理和编制工程结算典型案例。"},{"id":"78","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，过程结算的办理时间须按合同约定；约定不明确的，可（）作为时间节点办理。","answer":"ABD","difficulty":"难","options":{"A":"按月","B":"按季度","C":"每半年","D":"按形象面貌","E":"不定期"},"explanation":"第十一条过程结算的办理时间须按合同约定；约定不明确的，可按月、季度或形象面貌作为时间节点办理。"},{"id":"79","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，结算经办部门和人员（包括工程、造价、财务、物资等部门）按其职责对结算及支持性文件的（）负责。","answer":"ABCD","difficulty":"中","options":{"A":"真实性","B":"合法性","C":"有效性","D":"准确性","E":"时效性"},"explanation":"第十八条结算经办部门和人员（包括工程、造价、财务、物资等部门）按其职责对结算及支持性文件的真实性、合法性、有效性、准确性负责。"},{"id":"80","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，竣工结算报告包括（）。","answer":"AB","difficulty":"难","options":{"A":"工程结算情况","B":"概算执行分析情况","C":"工程决算情况","D":"过程结算情况","E":"工程竣工验收情况"},"explanation":"第二十一条竣工结算报告包括工程结算情况和概算执行分析情况。概算执行分析应结合投产后的概算执行分析报告及完工结算情况综合说明。"},{"id":"81","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，造价咨询管理主要目标（）。","answer":"ABCD","difficulty":"易","options":{"A":"投资控制在批准概算以内","B":"工程结算与建设进度同步","C":"竣工结算在规定时限内完成","D":"不发生投资损失和浪费","E":"过程结算与建设进度同步"},"explanation":"第三条造价咨询管理主要目标。投资控制在批准概算以内，工程结算与建设进度同步，竣工结算在规定时限内完成，不发生投资损失和浪费。"},{"id":"82","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，造价咨询单位不替代基层企业的造价管理责任。主要职责包括按照管理权限组织或参与造价咨询服务的采购管理、（）。","answer":"ACDE","difficulty":"中","options":{"A":"组织编制火电工程造价咨询工作要求，明确造价咨询范围、工作内容及工作进度等","B":"根据管理权限，审查、批准造价咨询单位提交的造价咨询工作实施方案和计划，无需审核造价咨询单位的成果文件","C":"根据管理权限，审查、批准造价咨询单位提交的造价咨询工作实施方案和计划，审核造价咨询单位的成果文件","D":"根据咨询成果，落实相关造价管理措施","E":"提供与造价咨询相关的基础资料和文件，组织协调现场参建单位配合造价咨询单位开展工作"},"explanation":"第八条项目单位是火电工程造价咨询执行的责任主体，负责具体管理造价咨询单位。造价咨询单位不替代基层企业的造价管理责任。主要职责包括：（一）按照管理权限组织或参与造价咨询服务的采购管理。\n（二）组织编制火电工程造价咨询工作要求，明确造价咨询范围、工作内容及工作进度等。\n（三）根据管理权限，审查、批准造价咨询单位提交的造价咨询工作实施方案和计划，审核造价咨询单位的成果文件。\n（四）根据咨询成果，落实相关造价管理措施。\n（五）提供与造价咨询相关的基础资料和文件，组织协调现场参建单位配合造价咨询单位开展工作。\n（六）定期组织整理典型项目处理案例，并报二级单位。\n（七）定期对造价咨询单位工作情况进行考核评价，并向二级单位报告考核评价信息。"},{"id":"83","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，造价咨询单位按照合同约定，对造价咨询服务成果负责。主要职责包括（）以及咨询成果提交后，参与进一步复核、谈判或评审等相关工作。接受项目单位和二级单位对造价咨询服务工作质量、廉洁自律等方面的监督和考核评价。","answer":"ABCD","difficulty":"中","options":{"A":"根据合同要求，派驻稳定且具有相应资格水平的项目负责人、专业工程师等咨询人员，做好相关人员的日常管理、培训和考核","B":"深入了解项目建设动态，并根据工程建设节点及相关工程资料，编制针对性和操作性强的造价咨询合同实施方案及阶段工作计划（分阶段，如主体施工标招标前、实施到投产前、投产后到审计前）","C":"发挥咨询公司整体专业优势和技经管理经验，按照合同约定及项目单位认可的造价咨询服务方案和计划，开展造价咨询业务，提交咨询成果","D":"定期梳理、编制典型项目处理案例，并报项目单位。如：索赔补偿典型案例，计量与计价争议处理典型案例，较大及以上额度的变更处理典型案例等","E":"根据咨询成果，落实相关造价管理措施"},"explanation":"第九条造价咨询单位按照合同约定，对造价咨询服务成果负责。主要职责包括：\n（一）根据合同要求，派驻稳定且具有相应资格水平的项目负责人、专业工程师等咨询人员，做好相关人员的日常管理、培训和考核。\n（二）深入了解项目建设动态，并根据工程建设节点及相关工程资料，编制针对性和操作性强的造价咨询合同实施方案及阶段工作计划（分阶段，如主体施工标招标前、实施到投产前、投产后到审计前）。\n（三）发挥咨询公司整体专业优势和技经管理经验，按照合同约定及项目单位认可的造价咨询服务方案和计划，开展造价咨询业务，提交咨询成果。\n（四）定期梳理、编制典型项目处理案例，并报项目单位。如：索赔补偿典型案例，计量与计价争议处理典型案例，较大及以上额度的变更处理典型案例等。\n（五）咨询成果提交后，参与进一步复核、谈判或评审等相关工作。\n（六）接受项目单位和二级单位对造价咨询服务工作质量、廉洁自律等方面的监督和考核评价。"},{"id":"84","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，基建期的造价咨询分为（）造价咨询。","answer":"ABC","difficulty":"中","options":{"A":"全过程","B":"阶段性","C":"专题","D":"进度","E":"代管理"},"explanation":"第十二条基建期的造价咨询分为全过程造价咨询、阶段性造价咨询和专题造价咨询，其中包括全过程造价咨询是覆盖项目自初步设计开始至竣工验收为止的基建期造价咨询服务；阶段性造价咨询是对项目建设部分阶段开展的造价咨询服务；专题造价咨询是对造价管控涉及的部分专题或专项的咨询服务。基建期的全过程造价咨询具体内容与范围原则上参照本细则附件的约定。"},{"id":"85","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，造价咨询合同须明晰和界定各方管理责任，明确工作成果深度、（）等涉及费用的处理原则。","answer":"BCDE","difficulty":"中","options":{"A":"工作成果广度","B":"提交时间","C":"对工程延期","D":"对工程减少或增加工作量","E":"考核评价"},"explanation":"第十三条造价咨询合同须明晰和界定各方管理责任，明确工作成果深度、提交时间，以及对工程延期、减少或增加工作量、考核评价等涉及费用的处理原则。"},{"id":"86","question":"根据《中国华能集团有限公司火电基本建设工程造价咨询管理细则》规定，造价咨询工作实施方案（含阶段性工作计划）由合同管理方组织造价咨询单位编制，内容包括但不限于：咨询时段的工程内容，工程特点，造价管理风险点和难点，（），咨询工作所要达到的目标等内容。","answer":"BCDE","difficulty":"中","options":{"A":"造价管理费用","B":"咨询原则与依据","C":"咨询工作程序","D":"咨询重点工作方法、措施计划","E":"咨询人员配备情况"},"explanation":"第十七条造价咨询工作实施方案（含阶段性工作计划）由合同管理方组织造价咨询单位编制，内容包括但不限于咨询时段的工程内容，工程特点，造价管理风险点和难点，咨询原则与依据，咨询工作程序，咨询重点工作方法、措施计划，咨询人员配备情况，咨询工作所要达到的目标等内容。"},{"id":"87","question":"根据《中国华能集团有限公司火电基本建设工程施工准备及开工管理办法》，属于主机设备招标条件的有（）。","answer":"ABCD","difficulty":"中","options":{"A":"项目已获得核准","B":"已列入集团公司年度投资计划","C":"已取得集团公司投资决策批复","D":"采购需求已列入集团公司年度一级集采计划","E":"初步设计已通过集团公司审核"},"explanation":"第九条主机设备招标条件。项目已获得核准；已列入集团公司年度投资计划；已取得集团公司投资决策批复；初步设计原则已通过集团公司内审；已取得集团公司生产环保部关于燃用煤（气）质批复；采购需求已列入集团公司年度一级集采计划。"},{"id":"88","question":"根据《中国华能集团有限公司火电基本建设工程施工准备及开工管理办法》，属于主体施工单位招标条件的有（）。","answer":"ABCD","difficulty":"中","options":{"A":"项目已获得核准","B":"已列入集团公司年度投资计划","C":"已取得集团公司投资决策批复","D":"采购需求已列入集团公司年度一级集采计划","E":"初步设计原则已通过集团公司内审"},"explanation":"第十条主体施工单位招标条件。项目已获得核准；已列入集团公司年度投资计划；已取得集团公司投资决策批复；初步设计已通过集团公司内审和外部评审；采购需求已列入集团公司年度一级集采计划。"},{"id":"89","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下费用中属于企业管理费的是（ ）。","answer":"AD","difficulty":"中","options":{"A":"城市维护建设税","B":"增值税","C":"住房公积金","D":"工程排污费","E":""},"explanation":"营改增后，城市维护建设税、教育费附加等属于企业管理费中的税金项；增值税作为独立的税金列项；住房公积金属于规费、工程排污规费属于企业管理费中的其他费用。"},{"id":"90","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下各项中属于火力发电工程建设静态投资构成部分的有（ ）。","answer":"ABD","difficulty":"易","options":{"A":"建筑工程费","B":"基本预备费","C":"建设期利息","D":"设备购置费","E":"价差预备费"},"explanation":"静态投资包括建筑工程费、安装工程费、设备购置费、其他费用以及基本预备费。价差预备费和建设期利息属于动态费用。"},{"id":"91","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，安全文明施工费包括（ ）。","answer":"ABC","difficulty":"中","options":{"A":"环境保护费","B":"文明施工费","C":"安全施工费","D":"临时设施费","E":"夜间施工增加费"},"explanation":"在2018版编规中，安全文明施工费专项包含了环境保护费、文明施工费和安全施工费三项。临时设施费及夜间施工增加费是与其他措施项目并列的独立费用项目。"},{"id":"92","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程费中的规费主要包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"养老保险费","B":"失业保险费","C":"医疗保险费","D":"住房公积金","E":"危险作业意外伤害保险费"},"explanation":"规费指政府和有关权力部门规定必须缴纳的费用，主要包含“五险一金”（养老、失业、医疗、生育、工伤保险费及住房公积金）。危险作业意外伤害险一般计入企业管理费或工程保险。"},{"id":"93","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在火电工程设备预算价格中，设备运杂费的构成一般包括（ ）。","answer":"BCDE","difficulty":"中","options":{"A":"设备出厂含税价格","B":"水陆交通运输费","C":"装卸费","D":"采购保管费","E":"包装及绑扎费"},"explanation":"设备运杂费是指设备由厂家交货地点运至施工现场指定交货地点所发生的费用，包含运输费、调车费、装卸费、包装及绑扎费、采购保管费等。设备出厂含税价格属于设备原价范畴。"},{"id":"94","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，分部分项工程量清单的综合单价应当包含（ ）。","answer":"ABDE","difficulty":"中","options":{"A":"人工费","B":"材料费","C":"规费","D":"企业管理费","E":"利润"},"explanation":"综合单价是指完成一个规定清单项目所需的人工费、材料费、施工机具使用费、企业管理费和利润，并考虑一定范围内的风险费用。规费和税金单列，不包含在综合单价中。"},{"id":"95","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在电力工程造价管理中，下列属于不得作为竞争性费用的有（ ）。","answer":"ACD","difficulty":"易","options":{"A":"安全文明施工费","B":"夜间施工增加费","C":"规费","D":"增值税（税金）","E":"总承包服务费"},"explanation":"清单计价规范强制规定：安全文明施工费、规费、税金均必须按照国家或省级、行业建设主管部门的规定计算，不得作为竞争性费用下浮。"},{"id":"96","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，火力发电工程项目建设总费用中，“动态费用”主要包括（ ）。","answer":"AB","difficulty":"易","options":{"A":"价差预备费","B":"建设期利息","C":"基本预备费","D":"联合试运转费","E":"铺底流动资金"},"explanation":"项目建设总费用由静态投资和动态费用两部分组成。动态费用特指在建设期内由于宏观经济因素变动而增加的投资，仅包括价差预备费和建设期利息。"},{"id":"97","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当工程量清单漏项或工程变更引起工程量增减时，关于综合单价的调整原则，正确的有（ ）。","answer":"ABC","difficulty":"难","options":{"A":"已标价清单中有适用项目的，按适用项目单价执行","B":"已标价清单中有类似项目的，参照类似项目单价执行","C":"无适用或类似项目的，由承包人提出，经发包人确认后执行","D":"无论偏差多大，原综合单价一律不得调整","E":"增加工程量超过合同约定幅度（通常15%）的，增加部分的单价应予以调高"},"explanation":"单价调整的三原则：有适用按适用，有类似参照类似，没有适用或类似的由承包人按成本加利润原则提出并经发包人确认。且工程量增加超过15%时，增加部分单价一般应予调低，而非调高。"},{"id":"98","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，属于“其他费用”范畴的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"项目建设管理费","B":"勘察设计费","C":"建设场地占用及清理费","D":"生产准备费","E":"基本预备费"},"explanation":"其他费用包含建设场地占用及清理费、项目建设管理费、项目建设技术服务费、勘察设计费、生产准备费等。基本预备费是与“其他费用”平级的静态投资独立组成部分。"},{"id":"99","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，编制工程竣工结算文件的有效依据包括（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"工程合同及补充协议","B":"发承包双方已确认的施工过程结算价款","C":"发承包双方已确认的工程量及其结算的合同价款","D":"建设工程设计文件及相关资料","E":"当地政府发布的现行指导价"},"explanation":"竣工结算应以合同为基准，依据招投标文件、工程图纸及发承包双方在施工过程中确认的签证、索赔、过程结算等资料进行编制，不能随意使用事后发布的当地指导价覆盖已约定的合同条款。"},{"id":"100","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程索赔成立必须同时具备的前提条件有（ ）。","answer":"ABC","difficulty":"难","options":{"A":"与合同对照，事件已造成了承包人工程项目成本的额外支出或直接工期损失","B":"造成费用增加或工期损失的原因，按合同约定不属于承包人的行为责任或风险责任","C":"承包人按合同规定的程序和时间提交索赔意向通知和索赔报告","D":"发包人在此期间未提出反索赔","E":"监理人出具了支持索赔的会议纪要"},"explanation":"索赔成立的三大条件缺一不可：确有客观损失发生、非承包方责任（或风险边界外）、遵循了索赔的时效和法定程序。"},{"id":"101","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列属于建筑安装工程费中“企业管理费”的有（ ）。","answer":"ABD","difficulty":"中","options":{"A":"管理人员工资","B":"办公及差旅费","C":"工程设备采购费","D":"劳动保护费","E":"增值税销项税额"},"explanation":"企业管理费包含管理人员工资、办公费、差旅费、固定资产使用费、工具用具使用费、劳动保险和职工福利费、劳动保护费等。工程设备采购属于设备费，增值税单列。"},{"id":"102","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，暂列金额的主要用途包括（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"用于施工合同签订时尚未确定或者不可预见的所需材料的采购","B":"用于不可预见的工程设备的采购","C":"用于施工中可能发生的工程变更费用","D":"用于施工中可能发生的合同约定的索赔费用","E":"用于支付必然发生但暂时不能确定单价的材料款"},"explanation":"暂列金额是为不可预见的变更、索赔及未定材料采购预留的金额。选项E“支付必然发生但暂不能定价的材料单价”属于暂估价的定义。"},{"id":"103","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），关于工程量清单的计量单位与有效位数，正确的是（ ）。","answer":"ABC","difficulty":"中","options":{"A":"以“t”为单位，应保留小数点后三位数字","B":"以“m”为单位，应保留小数点后两位数字","C":"以“m2”或“m3”为单位，应保留小数点后两位数字","D":"以“kg”为单位，必须保留小数点后三位数字","E":"以“个”、“项”为单位，应保留小数点后两位数字"},"explanation":"计算规范明确：吨(t)保留三位小数；米(m)、平方米(m2)、立方米(m3)保留两位小数；“个”、“件”、“根”、“系统”等按整数计算。"},{"id":"104","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），初步设计概算文件的正文组成部分应包括（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"编制说明","B":"总概算表","C":"各专业汇总概算表","D":"各单位工程概算表","E":"招标文件草案"},"explanation":"初设概算文件主要由编制说明、概算表（包括总表、专业汇总表、单位工程表）以及相关附件组成。招标文件不属于初步设计概算的组成部分。"},{"id":"105","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在火电工程建设预算中，属于“生产准备费”范畴的有（ ）。","answer":"ABC","difficulty":"中","options":{"A":"生产职工培训及提前进厂费","B":"办公和生活家具购置费","C":"管理及生产用交通运输车辆购置费","D":"机组整套启动试运转费","E":"首套备品备件购置费"},"explanation":"生产准备费是为确保电厂建成后顺利移交生产而发生的费用，含人员培训、办公家具及车辆等。机组整套试运转费属于其他费中的联合试运转费；首套备品备件费属于设备购置费。"},{"id":"106","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程量清单投标报价编制的原则包括（ ）。","answer":"ABC","difficulty":"易","options":{"A":"投标报价不得低于工程成本","B":"投标报价必须以招标文件中提供的工程量清单为依据","C":"不可竞争费用应按照规定计取，不得自主下浮","D":"安全文明施工费可以由投标人视自身管理水平适当下浮","E":"暂估价可以由投标人根据供应商报价自行修改"},"explanation":"招投标法及清单规范均明确：报价不能低于成本、必须响应招标清单、不可竞争费必须按规定全额计取。暂估价必须按招标人给定的金额填报，不得修改。"},{"id":"107","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于计日工，下列说法符合电力工程量清单计价规范的有（ ）。","answer":"BCE","difficulty":"难","options":{"A":"计日工表中的数量由发包人在招标时确定，结算时不能更改","B":"计日工主要用于解决施工图纸以外的零星项目或工作","C":"投标人填报的计日工单价应当包含企业管理费和利润","D":"计日工费用属于不可竞争费用","E":"结算时，计日工费用应按发包人实际签证确认的数量和合同约定的单价计算"},"explanation":"计日工暂定数量由招标人给定，但结算时必须按发包人签证确认的实际数量计算。计日工单价包含了人工/材料费用及管理费和利润，属于可竞争报价范畴。"},{"id":"108","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列关于“冬雨季施工增加费”的说法，正确的有（ ）。","answer":"ACE","difficulty":"中","options":{"A":"安装工程的冬雨季施工增加费的计算基准为人工费","B":"该费用属于规费的一部分","C":"该费用属于建筑安装工程费中的措施费","D":"不论施工地点气候如何，各地区的费率标准完全一致","E":"该费用用于补偿冬雨季施工期间施工效率的降低及需采取的特殊防护措施费"},"explanation":"冬雨季施工增加费属于措施费，以直接工程费或人工费为计算基数。不同地区因气候条件不同，其费率系数也相应划分了不同的区间档次。"},{"id":"109","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，因不可抗力事件导致的损害及其费用增加，根据《电力建设工程工程量清单计价规范》风险分担原则，应由发包人承担的有（ ）。","answer":"ABC","difficulty":"难","options":{"A":"工程本身的损害","B":"因工程损害导致的第三方财产损失","C":"发包方人员的伤亡损失","D":"承包人的施工机械设备损坏","E":"承包人停工期间留在现场的管理人员费用及停工损失"},"explanation":"不可抗力风险的分担原则：工程损害、第三方损失及发包方人员伤亡由发包人承担；承包人的施工机械损坏及人员伤亡由承包人承担；停工损失通常由承包人自行承担或在合同中另行约定。"},{"id":"110","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程费按造价形成进行划分，其主要组成部分包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"分部分项工程费","B":"措施项目费","C":"其他项目费","D":"规费","E":"基本预备费"},"explanation":"按照造价形成划分，建筑安装工程费由分部分项工程费、措施项目费、其他项目费、规费和税金组成。基本预备费属于独立于建安工程费的静态投资。"},{"id":"111","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程材料费的构成包含（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"材料原价","B":"材料运杂费","C":"运输损耗费","D":"采购及保管费","E":"检验试验费"},"explanation":"材料费是指施工过程中耗费的原材料、辅助材料等的费用，由材料原价、运杂费、运输损耗费、采购及保管费组成。建安工程费中的“检验试验费”归属于企业管理费，不包含在材料费中。"},{"id":"112","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用中属于建筑安装工程费“措施项目费”的有（ ）。","answer":"ABC","difficulty":"中","options":{"A":"安全文明施工费","B":"夜间施工增加费","C":"冬雨季施工增加费","D":"工程排污费","E":"企业管理费"},"explanation":"安全文明施工费、夜间施工增加费、冬雨季施工增加费、特殊地区施工增加费、临时设施费等均属于措施项目费。工程排污费属于规费，企业管理费属于间接费。"},{"id":"113","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，关于“企业管理费”的组成，下列各项中符合2018版火电编规规定的有（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"管理人员工资","B":"办公费及差旅费","C":"工会经费","D":"劳动保险和职工福利费","E":"失业保险费"},"explanation":"企业管理费包含管理人员工资、办公费、差旅费、固定资产使用费、工具用具使用费、工会经费、劳动保险和职工福利费等。失业保险费属于国家强制缴纳的规费（五险一金之一）。"},{"id":"114","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在火力发电工程预算中，属于“项目建设技术服务费”的选项有（ ）。","answer":"ABC","difficulty":"中","options":{"A":"项目技术经济评价费","B":"工程设备监造费","C":"性能试验费","D":"工程监理费","E":"勘察设计费"},"explanation":"项目建设技术服务费包含技术经济评价费、工程设备监造费、性能试验费及工程建设检测费等。工程监理费属于“项目建设管理费”，勘察设计费是与它们平行的“其他费用”子项。"},{"id":"115","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，引进国外设备时，进口设备原价（设备抵岸价）通常由多个部分构成，下列属于其构成部分的有（ ）。","answer":"ABCD","difficulty":"难","options":{"A":"设备离岸价（FOB）","B":"国际运费及运输保险费","C":"进口关税及增值税","D":"外贸手续费及银行财务费","E":"国内设备安装费"},"explanation":"进口设备原价（抵岸价）包括离岸价（FOB）、国际运费、国际运输保险费、银行财务费、外贸手续费、关税、增值税及海关监管手续费等。国内设备安装费属于建安工程费。"},{"id":"116","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），编制分部分项工程量清单时必须具备的要素有（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"项目编码","B":"项目名称","C":"项目特征描述","D":"计量单位及工程量","E":"施工方案"},"explanation":"工程量清单的“五要素”为：项目编码、项目名称、项目特征、计量单位和工程量。施工方案是投标人编制投标报价及施工组织设计的依据，不在清单基本要素内。"},{"id":"117","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于招标控制价（最高投标限价）的说法，正确的有（ ）。","answer":"ABC","difficulty":"中","options":{"A":"招标控制价必须在招标文件中予以公布","B":"不得只公布招标控制价总价，应同时公布各组成部分的详细明细","C":"招标控制价超过批准的概算时，应报原概算审批部门审核","D":"招标控制价可以根据市场情况进行上浮或下调","E":"投标人的投标报价高于招标控制价的，可以视情况接受"},"explanation":"招标控制价是最高限价，必须公布且不得上浮或下调，超过批准概算必须重新报批。投标报价若高于招标控制价，其投标应被予以拒绝（废标）。"},{"id":"118","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，因工程变更引起已标价工程量清单项目或其工程数量发生变化时，关于综合单价的调整原则，正确的有（ ）。","answer":"ABC","difficulty":"难","options":{"A":"已标价工程量清单中有适用项目的，按适用项目单价执行","B":"已标价工程量清单中有类似项目的，参照类似项目单价执行","C":"没有适用也没有类似项目的，由承包人提出综合单价，经发包人确认后执行","D":"无论增加多少工程量，综合单价一律不得调整","E":"工程量减少超过15%时，剩余部分工程量的综合单价应予调低"},"explanation":"清单单价调整原则：有适用按适用，有类似按类似，无适用无类似由承包人按成本加利润提出并经确认。当工程量减少超过15%时，为补偿承包商的固定成本分摊，剩余部分综合单价一般应予调高而非调低。"},{"id":"119","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），初步设计概算文件的正文组成应当包含（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"编制说明","B":"总概算表","C":"各专业汇总概算表","D":"各单位工程概算表","E":"施工图预算表"},"explanation":"概算文件正文由编制说明和概算表构成，概算表自上而下包含总概算表、专业汇总表和单位工程概算表。施工图预算表不属于初步设计概算范畴。"},{"id":"120","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，基本预备费的开支范围主要包括（ ）。","answer":"ABC","difficulty":"中","options":{"A":"在初步设计范围内未预见的工程费","B":"一般自然灾害造成的损失","C":"为预防自然灾害采取的必要措施费","D":"设备和材料的价差","E":"建设期利息"},"explanation":"基本预备费主要用于设计深度不足导致的工程量增加，以及防范和弥补一般自然灾害损失。设备材料价差属于价差预备费，建设期利息属于单独的动态费用。"},{"id":"121","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列各项费用中归属于“生产准备费”的有（ ）。","answer":"ABC","difficulty":"易","options":{"A":"生产职工培训及提前进厂费","B":"办公和生活家具购置费","C":"管理及生产用交通运输车辆购置费","D":"机组联合试运转费","E":"首套备品备件购置费"},"explanation":"生产准备费用于保障投产后的正常运营，包含人员培训及前期进厂、家具、交通车辆购置费。联合试运转费在其他费用中单列，首套备品备件计入设备购置费。"},{"id":"122","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，“建设场地占用及清理费”包括（ ）。","answer":"ABC","difficulty":"中","options":{"A":"土地征用及补偿费","B":"施工场地租用费","C":"场地清理及绿化补偿费","D":"临时设施费","E":"大型机械进出场及安拆费"},"explanation":"建设场地占用及清理费包含土地征用、场地租用、旧有设施迁移及场地绿化等发包方发生的前期费用。临时设施费和大型机械进出场属于承包方的建安工程措施费。"},{"id":"123","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，现行火电工程预算编制规定中，建筑安装工程费的“规费”包含（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"养老保险费","B":"医疗保险费","C":"工伤保险费","D":"住房公积金","E":"企业年金"},"explanation":"规费是指政府和有关权力部门规定必须交纳的费用，具体包括养老保险、失业保险、医疗保险、生育保险、工伤保险及住房公积金。企业年金为企业自愿建立的补充养老保险，不属于强制规费。"},{"id":"124","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，承包方向发包方申请索赔时，必须满足的条件有（ ）。","answer":"ABC","difficulty":"难","options":{"A":"事件已造成了承包人工程项目成本的额外支出或直接工期损失","B":"造成损失的原因按合同约定不属于承包人的行为责任或风险责任","C":"承包人按合同规定的程序和时间提交索赔意向通知和索赔报告","D":"索赔事件必须得到造价管理部门的审批","E":"发包人在此期间没有提出任何反索赔"},"explanation":"索赔成立的三大核心要素：实际发生了客观的额外费用或工期损失、该损失不属于承包方应承担的风险、且承包方严格履行了索赔的时效与书面提报程序。"},{"id":"125","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，新增的“施工过程结算”，下列说法正确的有（ ）。","answer":"ABCE","difficulty":"中","options":{"A":"施工过程结算可以按节点或按月进行编制与确认","B":"发承包双方确认的过程结算文件是工程竣工结算文件的有效组成部分","C":"已确认的过程结算金额在竣工结算时原则上不再重新复核","D":"施工过程结算完全替代了竣工阶段的最终结算清算","E":"推行施工过程结算有利于防范拖欠工程款及化解结算纠纷"},"explanation":"施工过程结算旨在变“事后算账”为“事中算账”，经双方确认的结算文件直接作为竣工结算的依据且不再重新复核。但竣工结算时仍需对未进行过程结算的部分及整体尾款进行最终汇总清算，不可完全替代。"},{"id":"126","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，计算项目建设期利息时，其主要依据或基数包括（ ）。","answer":"ACD","difficulty":"中","options":{"A":"当期借款额","B":"铺底流动资金","C":"前期已结转的借款本息累计","D":"贷款年利率","E":"项目资本金（自有资金）"},"explanation":"建设期利息的计算基数为建设期间的债务资金（即银行贷款本金及已产生的利息累计）。铺底流动资金和项目自有资本金不产生建设期利息费用。"},{"id":"127","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，编制工程竣工结算文件应当依据的资料包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"建设工程合同及补充协议","B":"发承包双方实施过程中已确认的工程量及其结算价款","C":"国家或行业现行的清单计价规范和计算规范","D":"工程招投标文件及设计文件","E":"承包人单方面做出的有利于自身利润的施工图变更记录"},"explanation":"竣工结算必须基于发承包双方共同确认的合法合规文件，包括招投标文件、合同、设计图纸、规范标准以及经双方签证确认的过程结算款项，不能单凭承包方单方面的记录结算。"},{"id":"128","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，电力工程建设项目按其组成和范围大小，通常划分为（ ）等层级。","answer":"ABCD","difficulty":"易","options":{"A":"单项工程","B":"单位工程","C":"分部工程","D":"分项工程","E":"隐蔽工程"},"explanation":"我国建设工程项目层级统一划分为单项工程、单位工程、分部工程和分项工程四个层级。隐蔽工程是工程施工过程中的一个质检验收概念，不属于项目的系统划分层级。"},{"id":"129","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下属于主厂房建筑工程费用的有（ ）。","answer":"ABCE","difficulty":"易","options":{"A":"主厂房基础工程","B":"主厂房上部结构工程","C":"主厂房建筑照明配套设施","D":"汽轮发电机本体安装","E":"主厂房采暖通风设施"},"explanation":"主厂房建筑工程费包含基础及上部结构、各类配套建筑设施（如照明、给排水、采暖通风等）。汽轮发电机组本体的吊装和就位属于安装工程费范畴。"},{"id":"130","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，采用单价合同时，关于工程风险的分担原则，下列应由发包人承担的风险有（ ）。","answer":"ABD","difficulty":"中","options":{"A":"国家法律法规变化引起的费用增加","B":"省级政府部门发布的政策性人工费调整","C":"承包商自身管理不善导致的窝工","D":"未知地下障碍物导致的设计变更与工期延误","E":"施工机械操作失误造成的机械损坏"},"explanation":"政策法规变化、不可预见的地质条件及不可抗力等属于发包人承担的客观风险。承包商管理不善引起的窝工和自身机械损坏均由承包商自行承担。"},{"id":"131","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，项目建设管理费主要包括（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"项目法人管理费","B":"招标费","C":"工程监理费","D":"工程结算审核费","E":"建设项目前期工作费"},"explanation":"项目建设管理费包含项目法人管理费、招标费、工程监理费、工程结算审核费等用于项目法人日常管理的费用。建设项目前期工作费是与其他费用并列的单独项目，不属于项目建设管理费。"},{"id":"132","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于工程进度款的支付，发承包双方在合同中约定的内容应包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"支付的周期（如按月或按节点）","B":"计量与支付的程序","C":"进度款的支付比例","D":"迟延支付的违约责任","E":"将安全文明施工费全额无条件转入履约保证金"},"explanation":"工程进度款支付协议应明确支付周期、程序、比例及违约责任。安全文明施工费必须按要求足额拨付并专款专用，绝对不能被变相扣留或转为履约保证金。"},{"id":"133","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，计算价差预备费时需要考虑的因素有（ ）。","answer":"ABD","difficulty":"难","options":{"A":"静态投资的分年度资金使用计划","B":"价格上涨指数","C":"建设期利息的复利","D":"建设期的年限","E":"施工图设计深化的工程量差"},"explanation":"价差预备费的计算公式主要依赖于静态投资的分年度拨付计划、价格上涨指数及对应的建设期年限。建设期利息和设计深度导致的工程量差不在此公式的计算因素内。"},{"id":"134","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发生不可抗力事件后，根据电力工程计价规范及合同原则，以下费用应由发包人承担的有（ ）。","answer":"ACD","difficulty":"中","options":{"A":"已经运至施工现场待安装的工程设备的损害","B":"承包人的施工机械损坏","C":"留在现场的保卫人员的合理费用","D":"工程修复及清理现场的费用","E":"承包人停工期间的预期利润损失"},"explanation":"不可抗力导致的工程本身及工程设备损害、第三方损失、清理现场费用及留在现场必需的保卫人员费用由发包人承担。承包人的机械损坏和利润损失由承包人自行承担。"},{"id":"135","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程费的“人工费”主要包含生产工人的（ ）。","answer":"ABC","difficulty":"中","options":{"A":"计时工资或计件工资","B":"奖金","C":"津贴补贴","D":"养老保险费","E":"劳动保护费"},"explanation":"建安人工费包括生产工人的计时或计件工资、奖金、津贴补贴、加班加点工资以及特殊情况下支付的工资。养老保险费属于规费，劳动保护费属于企业管理费。"},{"id":"136","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），采用综合单价法编制概算时，建筑工程综合单价应包含的内容有（ ）。","answer":"ABD","difficulty":"易","options":{"A":"人工费","B":"材料费和施工机具使用费","C":"措施项目费","D":"企业管理费和利润","E":"规费和税金"},"explanation":"根据导则规定，综合单价由人工费、材料费、施工机具使用费、企业管理费和利润组成，并考虑一定的风险费用。措施项目费、规费和税金作为独立费用单列，不直接计入综合单价。"},{"id":"137","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，引起合同价款调整的常见客观情形有（ ）。","answer":"ABDE","difficulty":"中","options":{"A":"法律法规及国家政策变化","B":"工程变更及签证","C":"施工机具由于缺乏维护导致效率降低","D":"工程量清单缺项","E":"物价波动超过合同约定的风险幅度"},"explanation":"引起价款调整的客观因素包含法律法规变化、工程变更、清单缺项、工程量偏差、物价波动、不可抗力等。因承包方自身原因（如机械缺乏维护）造成的费用增加属于承包人风险，不予调整。"},{"id":"138","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在编制火电工程初步设计概算时，关于基本预备费，下列说法正确的有（ ）。","answer":"ACE","difficulty":"中","options":{"A":"主要用于解决设计深度不足造成的工程量增加","B":"计算基数包含价差预备费和建设期利息等动态费用","C":"可用于防范一般自然灾害造成的损失","D":"用于支付由于物价上涨引起的人工费差价","E":"基本预备费属于静态投资的组成部分"},"explanation":"基本预备费属于静态投资，计算基数不含动态费用；其用途主要为应对设计深度不足导致的工程变更和一般自然灾害的防范恢复。因物价上涨引起的价差属于价差预备费的保障范围。"},{"id":"139","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），关于现浇混凝土工程量的计算，下列说法正确的有（ ）。","answer":"ABC","difficulty":"中","options":{"A":"以“m3”为清单计量单位","B":"通常按设计图示尺寸以体积计算","C":"不扣除构件内钢筋、预埋铁件所占体积","D":"应强制扣除构件内所有钢筋所占的微小体积","E":"必须扣除不论大小的所有孔洞所占体积"},"explanation":"现浇混凝土清单工程量以立方米计量，按设计图示体积计算。按照通用规则，不扣除构件内的钢筋、预埋铁件及螺栓所占体积，同时对于小于规定面积的孔洞也不予扣除。"},{"id":"140","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列属于火力发电工程“项目建设技术服务费”的有（ ）。","answer":"BCE","difficulty":"中","options":{"A":"建设项目前期工作费","B":"设备监造费","C":"建设期各类工程技术检测与试验费","D":"勘察设计费","E":"环境影响评价及劳动安全评价等专项评价费"},"explanation":"项目建设技术服务费包含专项评价费（环评、安评等）、设备监造费、检测与试验费及技术经济评价费等。前期工作费与勘察设计费都是独立于技术服务费的“其他费用”子目。"},{"id":"141","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，编制招标工程量清单时，必须遵循的统一定义原则包含（ ）。","answer":"ABDE","difficulty":"易","options":{"A":"统一项目编码","B":"统一项目名称","C":"暂估价随意报价","D":"统一计量单位","E":"统一工程量计算规则"},"explanation":"招标工程量清单编制必须遵循全国统一规范的原则，即：统一项目编码、统一项目名称、统一计量单位、统一工程量计算规则以及统一的项目特征描述规范。暂估价不得随意报价。"},{"id":"142","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于电力工程计价规范中的“暂估价”，下列描述正确的有（ ）。","answer":"ABD","difficulty":"中","options":{"A":"暂估价包括材料暂估单价、工程设备暂估单价和专业工程暂估金额","B":"暂估价必须在招标文件中给定明细及具体金额","C":"投标人可以根据自己的采购渠道调低材料暂估单价进行报价","D":"对于依法必须招标的暂估价项目，由发承包双方依法组织招标确认最终价格","E":"材料暂估价在投标时可以不填报，留待施工结算时直接确认"},"explanation":"暂估价包括材料、设备及专业工程暂估价，必须按招标文件给定的金额完整填报在投标报价中，投标人不得随意更改或遗漏。对于必须招标的暂估价项目，按规定需发承包双方依法组织招标确认最终供应商及价格。"},{"id":"143","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，计算火电工程建设期利息时，需要明确的基本测算条件包括（ ）。","answer":"ABCD","difficulty":"难","options":{"A":"项目的总投资规模及静态投资","B":"资本金比例及分年度资金投入计划","C":"债务资金（贷款）的分年度借款计划","D":"贷款银行的执行年利率","E":"项目建成投产后的预期年化内部收益率"},"explanation":"建设期利息的测算依赖于静态总投资、资本金投入比例、债务资金借款计划（通常假设当年按半年均衡借款，以前年度按全年计息）以及贷款利率。建成后的收益率属于投产后的经济评价范畴，不参与建设期利息的计算。"},{"id":"144","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，特殊地区施工增加费主要针对在特定严酷自然环境下施工所增加的费用，这些地区通常包括（ ）。","answer":"ABE","difficulty":"易","options":{"A":"高海拔地区","B":"极寒（高寒）地区","C":"酷热地区","D":"市区繁华地段","E":"沙漠及戈壁地区"},"explanation":"特殊地区施工增加费是指在高海拔、酷热、严寒等地区施工因特殊自然条件影响而需额外增加的施工费用。"},{"id":"145","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，因不可抗力导致合同无法履行而最终解除时，发包人应向承包人支付的款项和补偿包括（ ）。","answer":"ABCE","difficulty":"难","options":{"A":"承包人已完成并经签认的工程价款","B":"承包人为工程订购的并已交付给发包人的材料、设备款","C":"承包人撤离现场所需的最少且合理的遣散费用","D":"承包人因合同提前解除而蒙受的所有后续预期利润损失","E":"发包人要求承包人留在现场的安保及看管人员费用"},"explanation":"合同解除后的最终结算应本着公平与损失共担原则。已完工程款、已移交材料设备款、合理的退场遣散费及留守费用均应由发包人支付。不可抗力属于免责条款，导致的预期利润损失不予赔偿。"},{"id":"146","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在工程施工过程中，现场签证是处理工程价款调整的重要依据，现场签证通常可以涵盖的事项包括（ ）。","answer":"ABD","difficulty":"中","options":{"A":"施工图设计未包含的零星工程","B":"发包人要求的非承包人责任的赶工措施费","C":"承包人为了加快自身进度自行决定增加的夜间施工措施费","D":"施工现场遭遇不可预见地质条件造成的隐蔽工程增加","E":"承包人违规操作导致的返工及材料浪费费用"},"explanation":"现场签证主要针对合同外发生的零星工程、非承包人责任的额外措施（如发包方原因导致的赶工）以及不可预见的客观条件变化。承包人自行决定增加的赶工成本或违规返工费不能作为签证要求追加价款。"},{"id":"147","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在火电工程中，下列属于“安装工程费”范畴的有（ ）。","answer":"ABD","difficulty":"易","options":{"A":"汽轮发电机组本体的吊装就位","B":"锅炉钢架及受热面的组对与吊装","C":"主变压器及高压厂用变压器的设备采购费","D":"全厂动力及控制电缆敷设及接线","E":"附属生产建筑的砌筑工程"},"explanation":"A、B、D均属于典型的发电设备安装及电气安装工程内容。C选项（变压器采购）属于设备购置费；E选项（附属建筑砌筑）属于建筑工程费。"},{"id":"148","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于工程竣工结算的编制和复核，下列说法正确的有（ ）。","answer":"ABD","difficulty":"中","options":{"A":"竣工结算文件应由承包人负责编制，发包人负责复核","B":"竣工结算文件必须由具备相应资格的注册造价工程师签字并加盖执业印章","C":"发包人对结算有异议，只能直接向法院起诉，不得自行扣减","D":"若承包人未按规定时间提交结算文件，发包人可根据已有资料编制并作为最终依据","E":"已进行施工过程结算并经双方确认的部分，在竣工结算时应全盘推翻重新核对"},"explanation":"发包方与承包方对竣工结算有异议的，可以委托工程造价咨询机构复核或按合同约定的争议解决方式处理（如调解、仲裁），并非只能起诉；已进行过程结算确认的部分，在竣工结算时原则上不再重新复核。"},{"id":"149","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），初步设计概算文件的组成主要包括（ ）。","answer":"ABC","difficulty":"中","options":{"A":"编制说明","B":"概算表","C":"附件","D":"施工组织设计草案","E":"全部施工图纸"},"explanation":"初步设计概算文件由编制说明、概算表及必要的附件三部分组成。施工组织设计草案和施工图纸是设计阶段及施工准备阶段的文件，不属于概算造价文件的组成部分。"},{"id":"150","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程材料单价的组成要素包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"材料原价","B":"材料包装费","C":"材料运杂费及运输损耗费","D":"采购及保管费","E":"材料在施工现场内部的二次搬运费"},"explanation":"建筑安装工程的材料单价由材料原价（含包装费）、运杂费、运输损耗费以及采购及保管费组成。施工现场内部的二次搬运费属于建筑安装工程的措施费。"},{"id":"151","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列各项中属于火力发电工程措施项目清单的有（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"安全文明施工","B":"大件设备运输措施","C":"冬雨季施工增加","D":"临时设施","E":"主变压器系统本体调试"},"explanation":"安全文明施工、大件设备运输、冬雨季施工及临时设施等均属于为完成工程施工而发生的非工程实体的措施项目。主变压器系统调试属于实体安装工程中的系统调试分部分项工程。"},{"id":"152","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，承包人提交的工程竣工结算文件应当包括的主要内容有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"工程竣工结算编制说明","B":"竣工结算汇总表","C":"分部分项工程及措施项目等各项结算明细表","D":"实际发生的工程量及价款调整签证与索赔资料","E":"下一年度项目的初步投资计划书"},"explanation":"竣工结算文件是最终办理工程价款清算的依据，必须包含编制说明、汇总表、明细表以及作为结算依据的签证、变更和索赔等证明资料。下一年度投资计划不属于当前工程的结算文件。"},{"id":"153","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，基本预备费不能用于支付（ ）。","answer":"CD","difficulty":"难","options":{"A":"设计变更增加的工程费用","B":"为预防自然灾害采取的措施费","C":"国家政策性调整导致的人工费和材料费大幅上涨","D":"建设期内汇率波动造成的资金损失","E":"一般自然灾害造成的损失"},"explanation":"基本预备费是针对设计深度不足及一般自然灾害预留的静态投资。由于政策调整、物价大幅波动引起的人工材机价差属于价差预备费范畴；汇率波动等财务风险则通常不包含在基本预备费内。"},{"id":"154","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于投标报价的编制要求，正确的有（ ）。","answer":"ABCE","difficulty":"中","options":{"A":"投标报价不得低于工程成本","B":"必须严格按照招标人提供的工程量清单及项目特征填报","C":"暂估价必须按照招标文件中列出的金额填写","D":"安全文明施工费可根据企业良好的管理水平作适当下浮","E":"规费和税金应按国家和省级有关部门的强制性规定计算"},"explanation":"投标报价必须以招标清单为准、不得低于成本，且暂估价、规费、税金均不得自主更改。安全文明施工费属于国家规定的不可竞争费用，绝对禁止下浮。"},{"id":"155","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，施工机具使用费包含的内容有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"施工机械折旧费及大修理费","B":"常规施工机械的安拆费及场外运费","C":"施工机械操作人员的人工费","D":"施工机械运行所需的燃料动力费","E":"大中型施工机械的进出场及安拆措施费（作为单列措施费）"},"explanation":"施工机具使用费包括折旧费、大修费、经常修理费、安拆及场外运费（除单独列项的大型机械外）、机上人工、燃料动力及相关税费。单列的大型机械进出场费属于措施费。"},{"id":"156","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于工程计量下列说法正确的有（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"工程量必须按有关工程量计算规范规定的计算规则进行计算","B":"工程计量应以发承包双方共同确认的施工图纸为基本依据","C":"监理人对承包人已完成工程量的核实确认是计量支付的重要环节","D":"对因承包人自身原因造成的返工工程量不予计量","E":"承包人提报的所有工程量即使未经验收也应全额无条件拨付进度款"},"explanation":"工程计量必须基于规范规则和确认的图纸，且必须经过监理或发包方的核实验收。未经验收合格或因承包商自身原因返工的工程量均不得予以计量和支付。"},{"id":"157","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），在编制火电工程初步设计概算计算建设期利息时，下列资金来源中不计取建设期利息的有（ ）。","answer":"ABE","difficulty":"中","options":{"A":"国家或地方政府投入的资本金","B":"企业自身留存收益作为项目的自有资金投入","C":"商业银行发放的长期固定资产贷款","D":"发行企业债券募集并用于该建设项目的债务资金","E":"项目法人股东直接投入的股本金"},"explanation":"建设期利息仅针对项目建设期间筹措的债务性资金（如银行贷款、企业债券等）计取。项目资本金、自有资金及股本金均不属于债务资金，不产生建设期利息费用。"},{"id":"158","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），关于金属结构工程清单工程量的计算规则，正确的有（ ）。","answer":"ABDE","difficulty":"难","options":{"A":"以吨（t）为单位计算工程量","B":"按照设计图示尺寸以理论质量计算","C":"所有钢板的面积必须一律按最大外接矩形面积计算质量","D":"焊条及铆钉等材料的重量通常不另增加而包含在综合单价中","E":"不扣除孔眼及切角的质量"},"explanation":"金属结构按设计图示尺寸的理论质量以吨计算，不扣除孔眼、切角质量，焊条、铆钉等附加材料不单独计量。钢板一般按图示几何面积乘以厚度及密度计算，不一定按外接矩形计算。"},{"id":"159","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于工程预付款的拨付与扣回，下列说法正确的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"预付款主要用于承包人购买工程所需的材料设备及组织施工进场","B":"预付款的比例通常不低于合同金额（扣除暂列金额）的10%","C":"发包人迟延支付预付款的，承包人可按规定程序发出通知甚至暂停施工并索赔","D":"预付款在后续工程进度款拨付时按合同约定的比例或时间节点逐步扣回","E":"发包人有权在签订合同前直接将预付款冲抵承包人的履约保证金"},"explanation":"预付款是发包人为帮助承包人启动工程而提前拨付的资金，有明确的比例要求和扣回机制。预付款必须专款专用，绝不可用来冲抵履约保证金。"},{"id":"160","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，全面实施了“营改增”，下列关于增值税计价的说法中，正确的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"建筑安装工程费按“价税分离”的原则进行计价","B":"建筑安装工程费中的材料费机具费等均应以不含增值税进项税额的价格作为计算基数","C":"增值税销项税额作为独立的税金项目列入工程造价","D":"城市维护建设税及教育费附加等从以往的税金项目中移至企业管理费内","E":"项目法人必须统一按照3%的简易计税方法计算全部增值税"},"explanation":"营改增后工程计价实行“价税分离”，各项费用基准均为不含税价，增值税销项单独作为税金列项，且城建税等移至企业管理费。一般纳税人采用一般计税方法，非统一强制使用简易计税法。"},{"id":"161","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，过程中发生工程造价争议时，可以通过下列哪些方式合法解决？（ ）","answer":"ABCD","difficulty":"易","options":{"A":"双方本着诚实信用原则进行友好协商","B":"提请当地或行业工程造价管理机构进行调解","C":"按照合同约定的仲裁条款向仲裁委员会申请仲裁","D":"向有管辖权的人民法院提起诉讼","E":"承包人单方面强行扣押发包人的已安装设备抵债"},"explanation":"解决争议的正规途径包括协商、调解、仲裁和诉讼。强行扣押设备属于非法途径，不受法律和计价规范的保护。"},{"id":"162","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建设项目前期工作费涵盖的内容主要包括（ ）。","answer":"ABE","difficulty":"中","options":{"A":"项目初步可行性研究及有关论证费用","B":"可行性研究文件的编制费用","C":"工程施工图设计费","D":"工程初步设计的编制费用","E":"项目立项前的前期评估及评审费用"},"explanation":"前期工作费指工程立项前发生的预可研、可研编制及相关评审等费用。初步设计费和施工图设计费均属于“勘察设计费”的范畴。"},{"id":"163","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当招标文件中存在专业工程暂估价时，关于其计价及结算处理，下列说法符合清单计价规范的有（ ）。","answer":"ACD","difficulty":"难","options":{"A":"投标时投标人应按招标人列出的金额计入综合总价","B":"该金额包含在暂列金额中不单独列项","C":"依法必须招标的专业工程应由发承包双方依法组织招标选定分包人及价格","D":"不属于依法必须招标的专业工程可按承包人与分包人依法协商确定的价格计算","E":"结算时应将专业工程暂估价直接作为承包人的最终纯利润予以确认"},"explanation":"专业工程暂估价必须按给定金额报价，并根据是否必须招标采取不同的最终定价流程。该款项应用于支付实际发生的分包工程款，而非直接作为总承包人的纯利润。"},{"id":"164","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，火力发电工程的“安装工程费”主要包括哪些具体工程项目？（ ）","answer":"ABCE","difficulty":"易","options":{"A":"锅炉机组及汽轮发电机组本体的安装工程","B":"全厂热力系统管道及相关设备的安装","C":"电气控制及保护盘柜的安装与接线","D":"脱硫脱硝系统主设备的采购费","E":"水处理系统的设备就位与管道连接"},"explanation":"安装工程费包含各类机电设备的装配、就位、接线、管路连接等。脱硫脱硝系统主设备的采购费用归属于“设备购置费”，而非安装费。"},{"id":"165","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在合同履行期间因国家相关法律法规或政策发生变化引起工程造价变动时，关于调整原则的说法正确的有（ ）。","answer":"ACD","difficulty":"难","options":{"A":"发承包双方应按照国家及有关部门的规定调整相应的合同价款","B":"因承包人自身原因导致工期延误的，延误期间发生的法规变化引起的变动一律不予调整","C":"因发包人原因导致工期延误的，延误期间的有利政策变化调减合同价款不利变动增加款项由发包人承担","D":"因承包人原因导致工期延误的，在延误期间的法规政策变化所引起的价款变动应只调减不调增","E":"所有的法规政策变化均由造价咨询单位单方面决定是否调整"},"explanation":"法律法规变化属于客观风险。发包人原因延误的，风险由发包人承担；承包人原因延误的，基于惩罚及不获利原则，法规变化导致造价增加的不予调增，造价减少的应予以调减。"},{"id":"166","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，某新建火力发电工程，其“生产准备费”预算中应包含的具体项目有（ ）。","answer":"ABC","difficulty":"中","options":{"A":"管理及生产用交通运输车辆的购置费","B":"满足初期运营的办公和生活家具购置费","C":"生产职工的培训及提前进厂实习费用","D":"建设场地的征用及清理费","E":"机组投产前的联合试运转费"},"explanation":"生产准备费用于确保电厂移交后的正常生产办公，含培训、家具、车辆等。场地占用费和联合试运转费均属于与生产准备费平行的其他独立费用项目。"},{"id":"167","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，计算设备运杂费时不同种类设备的运杂费率存在差异。通常区分费率的主要设备类别包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"汽轮发电机组主设备","B":"锅炉本体及相关配套设备","C":"一般辅机及机电设备","D":"通信及计算机信息系统设备","E":"临时施工搭建的板房材料"},"explanation":"设备运杂费率通常根据设备的性质、体积和运输难易程度进行分类区分，主要包括三大主机、一般机电设备、通信计算机设备等。临时板房材料属于施工临时设施，不在设备购置费范畴内。"},{"id":"168","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程发承包双方在签订合同时，应当在合同中明确约定的造价相关条款包括（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"预付款的数额支付时间及抵扣方式","B":"工程进度款的支付周期程序及比例","C":"工程量核实确认及价款调整的程序和方法","D":"索赔与争议解决的具体程序和期限","E":"强制要求分包商接受发包方指定的劣质材料清单"},"explanation":"合同必须明确有关款项的支付、调整、计量以及索赔争议等核心条款，以防范结算风险。发包方不得强制要求分包或强行指定不合格的劣质材料，这违反了建筑法及相关质量法规。"},{"id":"169","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列工程项目属于“安装工程费”而不是“设备购置费”的有（ ）。","answer":"ABCE","difficulty":"难","options":{"A":"厂用变压器的就位与接线","B":"全厂控制电缆的敷设","C":"发电机本体的组装与吊装","D":"DCS系统硬件设备的采购","E":"锅炉本体钢架的组对与吊装"},"explanation":"选项A、B、C、E均属于机电设备的装配、就位及管线敷设，是典型的安装工程。选项D的DCS系统硬件采购属于设备购置费。"},{"id":"170","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，总承包服务费主要用于补偿总承包人为配合及协调发包人进行的（ ）等所发生的费用。","answer":"ABE","difficulty":"中","options":{"A":"发包人发包的专业工程","B":"发包人自行采购的设备","C":"承包人自行分包的劳务工程","D":"监理方的日常办公及差旅","E":"发包人自行采购的材料及工程竣工资料交接"},"explanation":"总承包服务费是为了解决总包单位对发包方自行分包的专业工程、自行供应的材料设备进行协调、管理以及竣工资料汇总整理而产生的服务管理费用。承包人自行分包的工程管理费已包含在其企业管理费中。"},{"id":"171","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，其他费用中的“项目法人管理费”主要包括（ ）。","answer":"ABD","difficulty":"难","options":{"A":"项目法人的业务招待费","B":"项目法人的竣工验收费","C":"工程质量监督检测费","D":"项目法人的董事会费","E":"施工现场保安费"},"explanation":"项目法人管理费是指项目建设法人在建设期内发生的各项管理性质费用，包括业务招待费、竣工验收费、董事会费、开办费等。质量监督检测属技术服务费，现场保安由施工方负责。"},{"id":"172","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），关于管道工程的计量规则，下列说法正确的有（ ）。","answer":"ACD","difficulty":"中","options":{"A":"按设计图示管道中心线长度计算","B":"必须扣除管路上阀门所占的长度","C":"不扣除管件（如三通、弯头）所占的长度","D":"清单计量单位通常以“m”表示","E":"必须扣除所有附属构筑物所占的长度"},"explanation":"管道工程量的通用计算规则是按设计图示中心线长度以“m”计算，不扣除阀门、管件及其附属构筑物所占长度，相关接头及阀门通常单独列项或综合在单价内。"},{"id":"173","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在合同履行期间，若施工材料价格发生大幅波动，根据《电力建设工程工程量清单计价规范》的风险分担原则，下列说法正确的有（ ）。","answer":"ABE","difficulty":"中","options":{"A":"承包人应承担合同约定幅度（如5%）以内的材料价格波动风险","B":"超过规定风险幅度的价格变动可以根据合同约定进行造价调整","C":"风险幅度内的全部价格下跌收益由发包人享有","D":"承包人必须完全承担无论多大幅度的所有材料价格暴涨风险","E":"发生不可抗力时，已运至现场准备安装的材料损坏由发包人承担"},"explanation":"清单计价倡导风险共担，材料价格风险通常设定一个幅度（如5%），幅度内由承包人承担或享有收益，超出幅度部分由发包人承担或享有收益。不可抗力造成的工程材料损失由发包方承担。"},{"id":"174","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），编制建筑工程概算时常用的计价方法包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"概算定额法","B":"概算指标法","C":"类似工程预算法","D":"综合单价法","E":"施工图预算法"},"explanation":"初步设计概算由于图纸深度限制，通常采用概算定额法、概算指标法、类似工程预算法，且新版导则推荐了综合单价法。施工图预算法适用于施工图设计阶段，不适用于初设阶段。"},{"id":"175","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程的“安全文明施工费”中的环境保护费包括（ ）。","answer":"ABD","difficulty":"中","options":{"A":"施工现场防尘及降噪设施费","B":"施工现场建筑垃圾的清运与消纳费","C":"发包方编制的水土保持方案费","D":"施工现场污水排放处理及防污染设施费","E":"项目竣工环保验收评价费"},"explanation":"环境保护费属于施工企业的措施项目费，包括防尘、降噪、建筑垃圾清运、污水处理等保障现场环境的设施和措施。发包方发生的水土保持和竣工环保验收评价属于“其他费用”范畴。"},{"id":"176","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列情形中承包人有权提出工期延长索赔的有（ ）。","answer":"ABDE","difficulty":"难","options":{"A":"施工期间遭遇异常恶劣的气候条件导致停工","B":"发包人未能按时提供施工图纸导致无法开工","C":"承包人的关键施工机械发生严重故障导致停工","D":"发包人未能按合同约定支付预付款导致施工迟延","E":"监理人发出的错误指令导致工程返工及延误"},"explanation":"非承包人原因造成的工期延误（如发包人责任、不可抗力、异常恶劣气候、监理错误指令等），承包人均有权索赔工期。承包人自身机械故障属于其管理风险，不能索赔。"},{"id":"177","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，引进国外设备时，其“到岸价（CIF）”的构成因素包括（ ）。","answer":"ABC","difficulty":"中","options":{"A":"设备离岸价（FOB）","B":"国际运输费","C":"国际运输保险费","D":"进口关税及增值税","E":"国内运输费"},"explanation":"CIF价"},{"id":"178","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，可以引起措施项目费发生调整的客观情形有（ ）。","answer":"ACD","difficulty":"中","options":{"A":"发包人提出工程变更导致相应的措施费增加","B":"承包人为追求提前竣工奖励自行决定增加的夜间施工费","C":"非承包人原因引起的工程量大量增减导致相应措施项目的变动","D":"国家有关法律、法规发生变化强制要求增加的安全防护费","E":"承包人为了节约成本擅自降低安全标准导致的措施费变动"},"explanation":"措施费的调整必须基于非承包人原因产生的变更，包括发包人指令、不可预见的工程量大幅变化以及国家法律法规的强制性要求。承包人自行赶工或擅自改变方案导致的变动由其自行承担。"},{"id":"179","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），关于保温隔热工程量的计算规则，下列说法正确的有（ ）。","answer":"BCE","difficulty":"难","options":{"A":"一律按设计图示表面积以“m2”计算","B":"通常按设计图示尺寸以体积计算","C":"清单计量单位通常为“m3”","D":"管道保温必须扣除所有阀门和管件的面积","E":"通常不扣除管道表面局部凸出物所占的体积"},"explanation":"电力工程中的保温隔热工程通常按照设计图示尺寸以体积（m3）计算，且计算时不扣除局部凸出物或小孔洞所占体积，阀门及管件的保温通常单独列项或综合考虑。"},{"id":"180","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，“整套启动试运费”的开支范围不包括（ ）。","answer":"ABE","difficulty":"易","options":{"A":"单台设备的单机试车费用","B":"生产人员提前进厂培训费","C":"整套启动联合试运转期间的燃料及水费","D":"整套启动试运期间的电费消耗","E":"为保证首期运转购置的首套备品备件费"},"explanation":"整套启动试运费仅针对机组整套启动及带负荷试运期间的支出与收入差额。单机试车属于安装费；人员培训属于生产准备费；备品备件属于设备购置费。"},{"id":"181","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于工程缺陷责任期与质量保证金，正确的有（ ）。","answer":"ABCE","difficulty":"难","options":{"A":"缺陷责任期一般为1年，最长不超过2年","B":"质量保证金预留比例不得高于工程价款结算总额的3%","C":"缺陷责任期自工程实际竣工验收合格之日起计算","D":"发包方按期退还质保金后，承包人即刻免除终身所有保修责任","E":"在缺陷责任期内由承包人原因造成的缺陷，其修复费用由承包人承担"},"explanation":"缺陷责任期到期并退还质保金，并不代表法定保修责任的终结。根据《建筑法》等规定，在合理使用寿命内的地基基础和主体结构等法定保修义务，承包人仍须承担。"},{"id":"182","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，水土保持项目的相关费用具备以下哪些特征？（ ）","answer":"ABC","difficulty":"中","options":{"A":"归属于建设预算的“其他费用”类别","B":"包括水土保持设施补偿费","C":"包括水土保持方案编制及评审费","D":"它是建筑安装工程费中的环境保护费的直接组成部分","E":"属于承包商为施工场地平整必须采取的临时措施费"},"explanation":"水土保持费（含方案编制、补偿、监测及设施工程验收等）属于项目法人为了满足国家环保政策而发生的前期与过程费用，单独列入“其他费用”中，不属于承包商的建安环保措施费。"},{"id":"183","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，由于不可抗力导致工程无法继续，发承包双方决定解除合同。根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人在此情况下应当承担及支付的款项有（ ）。","answer":"ABDE","difficulty":"难","options":{"A":"发包人应支付承包人已完成且经确认的工程款","B":"发包人应支付承包人已定购并交付现场的材料设备款","C":"发包人应全额赔偿承包人因工程终止而丧失的预期利润","D":"发包人应承担承包人人员合理合法的遣散费用","E":"双方互不承担由于不可抗力造成的对方违约赔偿责任"},"explanation":"不可抗力是法定免责事由，发包方须清算已发生的客观成本及遣散善后费用，但无需赔偿承包商的“预期利润损失”。"},{"id":"184","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），概算总投资中的“动态投资（费用）”专指（ ）。","answer":"CD","difficulty":"易","options":{"A":"建筑安装工程费","B":"基本预备费","C":"价差预备费","D":"建设期利息","E":"铺底流动资金"},"explanation":"项目建设总费用分为静态投资和动态费用。动态费用特指在建设期内由于时间价值和宏观经济变动而产生的费用，仅包含价差预备费和建设期利息两项。"},{"id":"185","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，“基本预备费”的主要作用和开支范围包括（ ）。","answer":"ABC","difficulty":"中","options":{"A":"由于初步设计深度不够而在施工图设计阶段增加的工程费用","B":"施工过程中由于地质条件不可预见变化造成的工程量增加","C":"为了防范一般自然灾害而采取的措施费及灾后恢复费","D":"建设期内因国家汇率政策大幅调整造成的资金损失","E":"由于银行贷款利率上调造成的建设期利息增加"},"explanation":"基本预备费针对的是“静态”的不可预见因素（如工程量漏项、地质变化、一般自然灾害）。因汇率、利率、物价变动等“动态”财务或宏观经济风险引发的增加不在此列。"},{"id":"186","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），关于金属表面刷油防腐工程的工程量计算规则，正确的有（ ）。","answer":"AB","difficulty":"易","options":{"A":"按设计图示尺寸以面积计算","B":"清单计量单位通常采用“m2”","C":"通常按金属构件的实际质量以“t”为单位计算","D":"综合单价内不允许包含除锈工作，必须单独列项计量","E":"计算时必须扣除所有金属附着物所占的微小面积"},"explanation":"刷油防腐通常按表面展开面积以“m2”为单位计算，综合单价中往往已经包含了基层清理和除锈的工序工作内容（根据项目特征描述确定），且一般不扣除微小附着物面积。"},{"id":"187","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当发承包双方对工程竣工结算存在争议时，下列处理方式合规的有（ ）。","answer":"ABD","difficulty":"中","options":{"A":"争议部分可按合同约定的方式申请仲裁或诉讼","B":"对于无争议部分的工程款，发包人应按期先行拨付","C":"发包人可以以存在部分结算争议为由，无限期拒付全部结算款项","D":"双方可共同提请当地或行业的工程造价管理机构进行调解","E":"承包人有权绕过法律程序直接强行拆除已建工程抵债"},"explanation":"规范规定，结算中存在争议的部分可通过协商、调解、仲裁等合法途径解决，但对于发承包双方已无异议的部分工程款，发包人必须依约支付，不能以偏概全拒付全款。"},{"id":"188","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，一份完整的火力发电工程建设预算文件（如初步设计概算或施工图预算），其正文和表格通常应当包含（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"编制说明","B":"建设项目总概算（预算）表","C":"各专业汇总表","D":"各单位工程概算（预算）明细表","E":"详细的施工网络进度计划及施工组织设计图"},"explanation":"完整的造价文件自上而下由编制说明、总表、专业汇总表及单位工程明细表构成。施工网络计划和组织设计图属于施工管理和技术文件，并非预算造价表单本身。"},{"id":"189","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），煤电项目财务评价中，经营成本包括（   ）。","answer":"ACE","difficulty":"易","options":{"A":"燃料费","B":"折旧费","C":"工资及福利费","D":"财务费用","E":"保险费"},"explanation":"3.1.17 经营成本是项目财务评价中所使用的特定概念，包括燃料费、用水费、材料费、工资及福利费、修理费、脱硫剂费用、脱硝剂费用、环境保护税、其他费用及保险费。应按下式计算：经营成本 =总成本费用-折旧费-摊销费-财务费用"},{"id":"190","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），仅通过项目投资现金流量表可直接计算（   ）。","answer":"ACE","difficulty":"易","options":{"A":"项目投资财务内部收益率（所得税前）","B":"偿债备付率","C":"项目投资财务净现值（所得税前）","D":"利息备付率","E":"项目投资回收期（所得税后）"},"explanation":"3.2.2 第1条：项目投资现金流量表用来进行项目融资前分析，即在不考虑债务筹措的条件下进行盈利能力分析，应分别计算所得税前与税后的项目投资财务内部收益率、项目投资财务净现值和项目投资回收期。"},{"id":"191","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），下列费用属于火力发电工程总成本费用中“其他费用”的有（   ）。","answer":"BD","difficulty":"中","options":{"A":"折旧费","B":"工会经费","C":"燃料费","D":"房产税","E":"脱硫剂费用"},"explanation":"《导则》第9页：其他费用应为不属于以上各项而应计入生产成本的其他成本，主要包括公司经费、工会经费、职工教育经费、董事会费、咨询费、聘请中介机构费、诉讼费、业务招待费、房产税、车船使用税、土地使用税、印花税、研究与开发费及由企业缴付的医疗保险费、养老保险费、失业保险费等社会保障费和住房公积金等。"},{"id":"192","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），下列属于可变成本的有（    ）。","answer":"ABC","difficulty":"中","options":{"A":"燃料费","B":"用水费","C":"材料费","D":"折旧费","E":"摊销费"},"explanation":"第6页：可变成本应为随电、热产量变化而变化的成本，主要包括燃料费、用水费、材料费、脱硫剂费用、脱硝剂费用、环境保护税、排污权有偿使用费。"},{"id":"193","question":"根据《火力发电工程经济评价导则》（DL/T5435-2019）和《火力发电厂技术经济指标计算方法》（DL/T 904-2015），某煤电项目年耗用标准煤量140万吨，到厂标煤价800元/吨，年发电量50亿kWh，发电标煤耗及燃料成本分别为（   ）。","answer":"AD","difficulty":"难","options":{"A":"280g/kWh","B":"290g/kWh","C":"10.3亿元","D":"11.2亿元","E":"300g/kWh"},"explanation":"发电标煤耗=140×10^6×10^4/50×10^8=280g/kWh；燃料成本=11.2亿元"},{"id":"194","question":"根据《公司煤电基本建设项目经济评价复核工作指引》，下列哪些属于煤电项目经济评价中成本参数的取费标准？（   ）","answer":"ABD","difficulty":"中","options":{"A":"30万千瓦级机组修理费率2%","B":"60万千瓦级机组修理费率1.5%","C":"100万千瓦级机组修理费率2%","D":"30万千瓦级机组材料费6元/MWh","E":"60万千瓦级机组材料费4元/MWh"},"explanation":"30万千瓦级机组修理费率2%，60万千瓦级1.5%，100万千瓦级1.5%；材料费：30万千瓦级6元/MWh，60万千瓦级5元/MWh，100万千瓦级4元/MWh。A、B、D正确。"},{"id":"195","question":"根据《公司煤电基本建设项目经济评价复核工作指引》，某煤电项目年发电量50亿kWh，厂用电率5%，材料费5元/MWh，其他费用10元/MWh，年材料费和其他费用分别为（  ）。","answer":"BD","difficulty":"中","options":{"A":"年材料费2375万元","B":"年材料费2500万元","C":"年其他费用4750万元","D":"年其他费用5000万元","E":"其他费用都不对"},"explanation":"年材料费=50×10^5×5/10^4=2500万元。\n年其他费用=50×10^5×10/10^4=5000万元。"},{"id":"196","question":"按照《中国华能集团有限公司火储联合调频改造项目技经复核工作指引》，火储项目价格信息需做（）修正","answer":"AB","difficulty":"中","options":{"A":"适用性","B":"时效性","C":"合理性","D":"合规性","E":""},"explanation":"按照《中国华能集团有限公司火储联合调频改造项目技经复核工作指引》，做适用性与时效性修正"},{"id":"197","question":"按照《中国华能集团有限公司技改项目技经管理办法》，技改项目估概算编制依据有（）","answer":"ABCE","difficulty":"中","options":{"A":"行业定额","B":"集采价格","C":"市场询价","D":"企业定额","E":"信息价"},"explanation":"按照《中国华能集团有限公司技改项目技经管理办法》，编制依据：行业定额、框采价格、集采价格、信息价格、 on":"按照《中国华能集团有限公司煤场封闭项目投资复核工作指引》，煤场封闭消防系统包含（）","answer":"AB","difficulty":"中","options":{"A":"消防工程","B":"消防炮","C":"喷淋","D":"雾炮","E":"电气"},"explanation":"按照《中国华能集团有限公司煤场封闭项目投资复核工作指引》，含消防工程、消防炮"},{"id":"233","question":"按照《中国华能集团有限公司火储联合调频改造项目技经复核工作指引》，火储项目收益构成包括（）","answer":"ABC","difficulty":"中","options":{"A":"一次调频收益","B":"AGC收益","C":"考核返还","D":"征地补贴","E":"营业外收入"},"explanation":"按照《中国华能集团有限公司火储联合调频改造项目技经复核工作指引》，含一次调频、AGC、考核返还"},{"id":"234","question":"按照《中国华能集团有限公司火储联合调频改造项目技经复核工作指引》，火储项目设备费复核要点包括（）","answer":"ABC","difficulty":"中","options":{"A":"型号","B":"数量","C":"价格","D":"重量","E":"厂家"},"explanation":"按照《中国华能集团有限公司火储联合调频改造项目技经复核工作指引》，复核型号、数量、价格"},{"id":"235","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），建筑安装工程间接费中，企业管理费是指建筑安装施工企业为组织施工生产和经营管理所发生的费用，由（  ）组成。","answer":"CDE","difficulty":"中","options":{"A":"住房公积金","B":"社会保险费","C":"差旅交通费","D":"工会经费","E":"固定资产使用费"},"explanation":"建筑安装工程间接费中，企业管理费是指建筑安装施工企业为组织施工生产和经营管理所发生的费用，其费用内容包括：管理人员工资、办公经费、差旅交通费、固定资产使用费、工具用具使用费、劳动补贴费、工会经费、职工教育经费、危险作业意外伤害保险费、财产保险费、财务费、税金及其他费用等。"},{"id":"236","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），夜间施工增加费是工程必须在夜间连续施工所发生的（  ）费用。","answer":"ABE","difficulty":"易","options":{"A":"夜班补助","B":"夜间施工照明设备摊销","C":"赶工费","D":"二次搬运费","E":"夜间施工绩效"},"explanation":"夜间施工增加费是工程必须在夜间连续施工所发生的夜班补助、夜间施工绩效、夜间施工照明设备摊销及照明用电等费用。"},{"id":"237","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），冬雨季施工增加费的计算应考虑以下哪些因素（  ）？","answer":"AC","difficulty":"中","options":{"A":"冬季低温施工导致的施工效率降低","B":"暴风雪等极端天气引发的停工损失","C":"雨季连续降雨对施工进度的一般性影响","D":"暴雨引发的临时设施损毁及抢险费用","E":"台风引发的各种损失"},"explanation":"冬雨季施工增加费中没有考虑台风、暴雨、暴风雪等恶劣天气影响，原因是台风、暴雨、暴风雪等恶劣天气属于不可抗力。"},{"id":"238","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），按费用性质划分，下列费用中属于建筑工程费的有（  ）。","answer":"ABDE","difficulty":"中","options":{"A":"建（构）筑物的平台扶梯工程费用","B":"建筑物的避雷接地装置工程费用","C":"工艺专业出图的设备基础框架工程费用","D":"涵洞工程费用","E":"采暖锅炉房设备及管道"},"explanation":"建筑工程费除包括建筑工程的本体费用之外，以下项目也列入建筑工程费中：\n1.建筑物的给排水、采暖、通风、空调、照明设施。\n2.建（构）筑物的平台扶梯。\n3.建筑物照明配电箱，建筑物的避雷接地装置。\n4.消防设施，包括气体消防、水喷雾系统设备、喷头及其探测报警装置。\n5.采暖加热站（制冷站）设备及管道、采暖锅炉房设备及管道、厂区采暖管道。\n6.混凝土或石材砌筑的文丘里除尘器、箱、罐、池等。\n7.建筑物用电梯的设备及其安装，工业用电梯井的建筑结构部分。\n8.各种直埋设施的土方、垫层、支墩，各种沟道的土方、垫层、支墩、结构、盖板，各种涵洞，各种顶管措施。\n9.建筑物的金属网门、栏栅，独立的避雷针、塔。\n10.屋外配电装置的金属构架、支架、避雷针塔、栏栅。\n11.建（构）筑物的防腐设施，混凝土沟、槽、池、箱、罐等的防腐设施。\n12.冷却塔内部的配水管、托架、淋水装置、除水装置及其结构等。\n13.水工结构、水工建筑、预应力钢筋混凝土管、顶管措施、岸边水泵房引水管道。\n14.燃气-蒸汽联合循环电厂独立布置的余热锅炉烟囱。\n15.建筑专业出图的厂区工业管道。\n16.建筑专业出图的设备基础框架、地脚螺栓。\n17.凡建筑工程建设预算定额中已明确规定列入建筑工程的项目，按定额中的规定执行，例如二次灌浆均列入建筑工程等。"},{"id":"239","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），按费用性质划分，下列费用中属于安装工程费的有（  ）。","answer":"ACDE","difficulty":"中","options":{"A":"设备、管道的保温油漆费用","B":"采暖锅炉房设备及管道工程费用","C":"锅炉砌筑工程费用","D":"设备的维护平台及扶梯工程费用","E":"施工现场加工配制组装的金属外壳文丘里除尘器"},"explanation":"安装工程费除包括工艺系统的各类设备、管道、线缆及其辅助装置的组合、装配，以及其材料费用之外，以下项目也列入安装工程费中：\n1.各种设备、管道的保温油漆。\n2.设备的维护平台及扶梯。\n3.电缆、电缆桥（支）架及其安装，电缆防火。\n4.发电机出线间的金属构架、支架、金属网门。\n5.厂用屋内配电装置及发电机出线小间的金属结构、金属支架、金属网门。\n6.锅炉砌筑工程、灰沟镶板砌筑。\n7.施工现场加工配制组装的金属外壳文丘里除尘器、水膜式除尘器。\n8.混凝土水膜式除尘器、箱、罐的内部加热装置、搅拌装置。\n9.化学水处理系统金属管道的内外防腐。\n10.冷却塔内的钢制循环水管道。\n11.循环水系统、补给水系统、厂区及厂外除灰系统（包括灰水回收系统）的工艺设备、管道及其内衬，包括各种钢管、铸石管、铸铁管、钢闸板门、闸槽及启闭机。\n12.设备本体照明、道路、屋外区域（如变压器区、配电装置区、管道区、储煤场、油罐区等）的照明。\n13.厂区接地工程的接地极、降阻剂、焦炭等。\n14.消防水泵房设备、管道，消防车辆。\n15.集中控制系统中的消防控制装置、空调系统的自动控制装置安装。\n16.工业用电梯及其设备安装。\n17.生活污水处理系统的设备、管道及其安装。\n18.燃气-蒸汽联合循环电厂余热锅炉炉顶布置的余热锅炉烟囱及旁路烟道。\n19.工艺专业出图的厂区工业管道。\n20.工艺专业出图的设备基础框架、地脚螺栓。\n21.凡设备安装工程建设预算定额中已明确规定列入安装工程的项目，按定额中的规定执行。"},{"id":"240","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，工程变更（ 包括设计变更和变更设计） 引起的费用变化，合同规定不允许调整的部分已在合同价格结算中一并考虑， 不再另行调整结算； 合同规定允许调整的部分，若合同清单中无类似项目可供参考时， 应根据施工图工程量， 按施工合同约定的（  ）进行结算。","answer":"BCE","difficulty":"中","options":{"A":"概算定额","B":"预算定额","C":"综合取费费率","D":"工程系数","E":"下浮系数"},"explanation":"工程变更（ 包括设计变更和变更设计） 引起的费用变化，合同规定不允许调整的部分已在合同价格结算中一并考虑， 不再另行调整结算； 合同规定允许调整的部分，若合同清单中无类似项目可供参考时， 应根据施工图工程量， 按施工合同约定的预算定额、 综合取费费率和下浮系数进行结算。"},{"id":"241","question":"依据《中国华能集团有限公司火电基本建设工程设计管理办法》，设计变更指初步设计文件批复后，由设计单位提出有关设计方案的变更；变更设计指由项目单位或施工单位提出有关设计的变更，以上统称设计变更。设计变更按性质划分为（  ）。","answer":"ACD","difficulty":"易","options":{"A":"重大设计变更","B":"较大设计变更","C":"重要设计变更","D"
