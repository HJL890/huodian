"answer":"（1）增量净现金流 A = 年节约额 - 新增维护费 = 400 - 50 = 350万元/年。\nΔFNPV = -2000 + 350×(P/A,7%,12) = -2000 + 350×7.9427 = -2000 + 2779.95 = 779.95万元。\n因为 ΔFNPV = 779.95万元 > 0，改造方案在经济上可行。\n\n（2）令 ΔFNPV = 0，即 (P/A,ΔFIRR,12) = 2000 ÷ 350 ≈ 5.7143。\n查表：i=13% 时系数为5.9176，i=14% 时系数为5.6603，目标系数5.7143介于两者之间。\n采用内插法：\nΔFIRR = 13% + (5.9176 - 5.7143) / (5.9176 - 5.6603) × 1%\n= 13% + (0.2033 / 0.2573) × 1% ≈ 13% + 0.79% = 13.79%\nΔFIRR = 13.79% > 基准收益率7%，故改造方案在经济上可行。","difficulty":"难","category":"技经管理","explanation":""},{"id":"11","background":"","question":"背景：已有《火电工程限额设计参考造价指标》中400MW等级燃气－蒸汽联合循环机组设备参考价格（9F）如下表所示：\n\n\n\n\n\n\n\n\n\n\n\n\n\n问题：某电厂准备扩建2台套9F级1拖1机组，在编制可研估算时，请根据以上资料，简要分析机组配置方式，分步骤计算主机设备估算至少为多少万元？","answer":"1.燃机采用2台SGT5—4000F，17900×2=35800万元\n2.余热锅炉2台，8100×2=16200万元\n3.蒸汽轮机2台，6100×2=12200万元\n4.发电机2台，5300×2=10600万元（单轴方案）\n合计7.48亿元。","difficulty":"难","category":"技经管理","explanation":""},{"id":"12","background":"","question":"一、背景：某发电企业计划对一台300MW燃煤热电联产机组进行灵活性改造（深度调峰），采用热电解耦+热水储罐方案。现需根据以下参数，编制该标段的工程造价。\n二、已知条件\n（一）改造目标：新增60MW深度调峰能力（最低负荷从50%降至30%）。\n（二）主要工程量\n\n\n\n\n\n\n\n\n\n（三）造价计价参考\n1.设备及材料价格：热水储罐：按重量估算，碳钢储罐单价约12,000元/吨；DN400管道安装（含保温、支吊架）：综合单价8,500元/米；板式换热器（500m²）：30万元/台；阀门及仪表：按固定总价500万元计列。\n2.建筑工程（土建）单价：钢筋混凝土（含基础、垫层、钢筋）：2,500元/m³。\n3.安装工程费：按设备及主材费的15%计取。\n4.其他费用：包括勘察设计费、监理费、项目管理费等，按安装工程费与建筑工程费之和的12%计取。\n5.基本预备费：计算公式：基本预备费 = (设备及工器具购置费 + 建筑安装工程费 + 其他费用) × 基本预备费率，基本预备费率：1.5%。\n三、问题：\n1.计算各项费用明细：计算设备及主材费（万元）、计算安装工程费（万元）、计算建筑工程费（万元）、计算小计（工程费用）（万元）、计算其他费用（工程建设其他费）（万元）、计算基本预备费（万元）、计算总造价（万元）。\n2.计算单位造价：按新增调峰容量（60MW）计算单位造价（元/kW）。","answer":"1.计算各项费用明细\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n2.计算单位造价\n总造价=2,132.92万元=21,329,200元\n新增调峰容量=60MW=60,000kW\n单位造价=21,329,20元÷60,000kW=355.4元/kW","difficulty":"","category":"技经管理","explanation":""},{"id":"13","background":"","question":"一、背景：某发电企业拟对一台600MW超临界燃煤发电机组进行烟气超低排放改造，采用“SCR脱硝提效改造+电除尘器优化改造+湿法脱硫高效协同除尘改造”技术路线。改造采用工程量清单计价模式，现需根据以下条件进行造价计算。\n二、已知条件\n（一）分部分项工程量清单\n\n\n\n\n\n\n\n\n（二）脱硝反应器综合单价计算参数\n1.人工费：320元/工日 × 850工日；\n2.材料费：钢结构主体：180万元/座（含采购保管费2%）；催化剂模块：450万元/座；密封材料及辅材：25万元/座。\n3.施工机具使用费：35万元/座；4.企业管理费：按（人工费+施工机具使用费）的18%计算；5.利润：按（人工费+施工机具使用费+企业管理费）的10%计算；6.风险费：按人工费的8%计算。\n（三）措施项目费\n1.安全文明施工费：分部分项工程费，费率3.5%；2.夜间施工增加费：定额人工费（分部分项人工费总额的25%），费率2.0%；3.二次搬运费：分部分项工程费，费率0.8%；4.脚手架搭拆费：分部分项工程费，费率1.2%。\n（四）其他项目费\n1.暂列金额：按分部分项工程费的10%估算；2.专业工程暂估价：DCS控制系统改造暂估价280万元；3.计日工：暂估35万元（其中人工15万元、材料12万元、机械8万元）；4.总承包服务费：按专业工程暂估价的3%计算。\n（五）规费和税金\n1.规费：分部分项工程费+措施项目费+其他项目费，费率5.8%；2.增值税：分部分项工程费+措施项目费+其他项目费+规费，费率9%。\n三、问题：1.计算SCR脱硝反应器安装的综合单价：根据上述参数，计算SCR脱硝反应器安装（含催化剂）的综合单价（元/座），并列出计算步骤。\n2.计算分部分项工程费合计：将第一题计算结果代入清单，计算所有分部分项工程的费用合计（万元）。\n3.计算措施项目费：根据措施项目费费率表，计算各项措施项目费（万元）。\n4.计算其他项目费：根据其他项目费表格，计算各项其他项目费（万元）。\n5.计算单位工程招标控制价：计算该改造工程的招标控制价（万元）。","answer":"第一题：SCR脱硝反应器安装的综合单价\n①人工费：320元/工日×850工日=272,000元\n②材料费：1,800,000+4,500,000+250,000=6,550,000元\n③施工机具使用费：350,000=350,000元\n④企业管理费：(①+③)×18%=(272,000+350,000)×18%=111,960元\n⑤利润：(①+③+④)×10%=(272,000+350,000+111,960)×10%=73,396元\n⑥风险费：①×8% =272,000×8%=21,760元\n综合单价：①+②+③+④+⑤+⑥=7,379,116元\n第二题：分部分项工程费合计\n1.SCR脱硝反应器安装：1座（工程量）×7,379,116元（综合单价）=737.91万元（合价）\n2.高频电源改造：4套×450,000元=180.00万元\n3 湿法脱硫喷淋层新增：1层×1,200,000元=120.00万元\n4 引风机改造：2台×680,000元=136.00万元\n5 烟道制作安装：120吨×18,500 元=222.00万元\n合计：1,395.91万元\n第三题：措施项目费：定额人工费=分部分项工程费中人工费总额=272,000元=27.20万元\n1.安全文明施工费=1,395.91万元×3.5%=48.86\n2.夜间施工增加费=27.20万元×25%×2.0%=0.14\n3.二次搬运费=1,395.91万元×0.8%=11.17\n4.脚手架搭拆费=1,395.91 × 1.2%=16.75\n合计：76.92万元\n第四题：其他项目费\n1.暂列金额=1,395.91×10%=139.59万元\n2 专业工程暂估价=280.00（已知）=280.00万元\n3 计日工=35.00（已知）=35.00万元\n4 总承包服务费=280.00×3%=8.40万元\n合计：462.99万元\n第五题：单位工程招标控制价\n1.分部分项工程费=1,395.91万元\n2.措施项目费=76.92万元\n3.其他项目费=462.99万元\n4.规费（①+②+③）×5.8%=(1,395.91+76.92+462.99)×5.8%=112.27万元\n5.增值税（①+②+③+④）×9%=(1,395.91+76.92+462.99+112.27)×9%=184.33万元\n6.招标控制价合计：2,232.42万元","difficulty":"难","category":"技经管理","explanation":""},{"id":"14","background":"#NAME?","question":"一、背景：某发电企业拟对一台600MW火电机组的锅炉尾部烟道进行改造，以降低烟气阻力、提高引风机效率。改造内容为：拆除原烟道120吨（含保温层），重新制作安装碳钢烟道150吨，并增加烟气余热回收装置1套。该工程采用工程量清单计价模式，现需编制招标控制价。\n二、已知条件\n（一）工程量清单\n1.烟道制作安装（碳钢）：150吨；2.旧烟道拆除：120吨；3.烟气余热回收装置安装：1套。\n（二）烟道制作安装综合单价计算参数\n1.人工费：根据《电力建设工程预算定额》，烟道制作安装定额人工消耗为12工日/吨，人工单价按320元/工日计算（六类地区）。\n2.材料费：（1）钢材主材：碳钢板材综合单价4,800元/吨（含采购保管费2%）；（2）焊接材料：380元/吨；（3）防腐涂料：520元/吨；（4）保温材料：650元/吨；（5）其他辅材：按主材费的3%计算。\n3.施工机械使用费：定额机械台班消耗为0.8台班/吨，台班单价为850元/台班。4.企业管理费：按（人工费+施工机械使用费）的18%计算。5.利润：按（人工费+施工机械使用费+企业管理费）的10%计算。6.风险费：按人工费的5%计算。\n（三）旧烟道拆除综合单价\n旧烟道拆除综合单价按新安装单价的40%计算（含回收残值抵扣）。\n（四）烟气余热回收装置安装综合单价计算参数\n1.人工费：85,000元/套；2.材料费（含装置本体）：680,000元/套；3.施工机械使用费：45,000元/套；4.企业管理费：按（人工费+施工机械使用费）的18%计算；5.利润：按（人工费+施工机械使用费+企业管理费）的8%计算；6.风险费：按人工费的5%计算。\n（五）措施项目费\n1.安全文明施工费：分部分项工程费，费率3.5%；2.夜间施工增加费：定额人工费×25%，费率2.0%；3.二次搬运费：分部分项工程费，费率0.8%；4.脚手架搭拆费：分部分项工程费），费率1.2%；5.临时设施费：分部分项工程费（计算基数），费率4.0%。\n（六）其他项目费\n1.暂列金额：按分部分项工程费的8%估算；2.计日工：暂估15万元（其中人工5万元、材料6万元、机械4万元）。\n（七）规费和税金\n1.规费：分部分项工程费+措施项目费+其他项目费，费率5.8%；2.增值税：分部分项工程费+措施项目费+其他项目费+规费，费率9%。\n（八）工程量偏差调整条件\n施工过程中发生设计变更，烟道制作安装的工程量由原清单的150吨变更为180吨（增加30吨）。合同约定：1.当工程量偏差超过15%时，超出部分的综合单价调整为原单价的0.95倍。2.原综合单价为经第一题计算得出的综合单价。\n三、问题：\n第一题：计算烟道制作安装的综合单价：根据上述参数，计算烟道制作安装（碳钢）的综合单价（元/吨），保留两位小数。\n第二题：计算各项分部分项工程费合计：将第一题计算结果代入清单，计算所有分部分项工程的费用合计（万元）。\n第三题：计算措施项目费：根据措施项目费费率表，计算各项措施项目费（万元）。\n第四题：计算其他项目费：根据其他项目费表格，计算各项其他项目费（万元）。\n第五题：计算单位工程招标控制价：计算该改造工程的招标控制价（万元）。\n第六题：计算工程量偏差调整后的结算价款：烟道制作安装由原清单150吨变更为180吨（增加30吨），需进行工程量偏差调整。","answer":"第一题：计算烟道制作安装的综合单价\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n注： 材料费计算过程：主材4,800 +焊接材料380 +防腐涂料520+保温材料650=6350元/吨；其他辅材=6,350×3%=190.50元/吨；材料费合计=6,350+190.50=6,540.50元/吨。","difficulty":"难","category":"技经管理","explanation":""},{"id":"15","background":"","question":"一、背景：某发电企业拟对一台已运行12年的600MW亚临界燃煤发电机组进行锅炉受热面技术改造。该改造属于技术改造范畴——在原有企业基础上，对现有技术装备和生产工艺进行更新改造。改造内容包括更换部分受热面管屏，并同步进行燃烧器低氮改造。\n二、已知条件\n（一）改造内容与工程量\n\n\n\n\n\n\n\n\n\n\n\n（二）预算定额基价（基本建设项目）\n参考《电力建设工程预算定额（2013年版）》第二册《热力设备安装工程》，600MW机组锅炉本体安装定额基价如下：\n\n\n\n\n\n\n\n\n\n\n（三）技改工程调整系数\n由于技改工程在有限空间内施工、需与运行设备隔离、存在交叉作业等因素，施工效率低于新建项目，需在定额基价基础上进行调整：\n1.人工费调整系数：技改工程人工费在定额基价基础上乘以1.20。\n2.机械费调整系数：技改工程机械费在定额基价基础上乘以1.10。\n3.材料费调整系数：材料费不调整。\n4.拆除工程计价：旧管排拆除按新安装人工费与机械费之和的50%计算（含回收残值抵扣）。拆除工程的材料费为0。\n5.交叉作业降效系数：因与运行机组隔离施工，整体定额工日乘以系数1.05。\n（四）措施项目费\n\n\n\n\n\n\n\n\n（五）企业管理费、利润、规费、增值税\n\n\n\n\n\n\n\n\n三、问题要求\n第一题：判断项目性质及定额套用规则\n判断以下说法是否正确，并说明理由：\n1.技改项目的定额套用可以直接采用基建定额基价，无需任何调整。\n2.技改工程中，旧管排拆除应单独计价，并按新安装费用的一定比例计算。\n第二题：计算技改调整后的直接工程费（新装部分）\n根据定额基价和调整系数，计算各新装项目的技改调整后直接工程费，并汇总。\n第三题：计算拆除工程直接工程费\n旧管排拆除共715吨，按新安装人工费与机械费之和的50%计算。\n第四题：计算措施项目费\n根据措施项目费费率表，计算各项措施项目费。\n第五题：编制技改工程预算汇总表\n根据以上计算结果，完成该锅炉受热面技改工程的预算费用汇总表。","answer":"第一题：判断项目性质及定额套用规则","difficulty":"难","category":"技经管理","explanation":""},{"id":"16","background":"","question":"一、背景：\n某发电企业对其一台300MW燃煤供热机组进行灵活性改造（深度调峰），采用“热电解耦+蓄热储能”技术路线。工程采用工程量清单计价模式，合同约定措施项目费按总价（系数）计算。施工过程中发生设计变更，导致部分措施项目发生变化，现需根据合同约定和相关规定进行措施项目费的调整计算。\n二、已知条件\n（一）原合同措施项目费（投标报价）\n\n\n\n\n\n\n\n\n\n\n\n\n\n注：原合同分部分项工程费为1,200万元，定额人工费总额为240万元。\n（二）变更情况\n施工过程中发生以下变更：\n变更1：蓄热储能系统基础加固\n因地质条件变化，蓄热储能系统基础需由原设计的独立基础改为筏板基础，导致土方开挖量增加、模板工程量增加。\n变更后，分部分项工程费增加180万元。\n该变更引起施工方案改变：需增加深基坑支护措施，增加钢板桩支护费用15万元；因基坑面积扩大，临时排水措施费用增加5万元。\n变更2：管道安装路径调整\n因现场发现地下管线与设计图纸不符，DN400供热管道需绕行，管道长度由原设计的800米增加至920米。\n变更后，分部分项工程费增加68万元。\n该变更未引起施工方案改变，但脚手架搭拆工作量相应增加。\n（三）合同约定及相关规定\n根据合同约定及《建设工程工程量清单计价规范》（GB50500-2013）的规定：\n1.安全文明施工费：按实际发生变化的措施项目调整，不得浮动（属于不可竞争费用）。\n2.按总价（或系数）计算的措施项目费：按实际发生的措施项目调整，但应考虑承包人报价浮动率。\n3.报价浮动率计算公式（招标工程）： \n承包人报价浮动率L = (1 - 中标价/招标控制价) × 100% \n（四）其他已知数据\n\n\n\n\n\n\n\n\n\n\n三、问题要求\n第一题：计算承包人报价浮动率\n根据已知数据，计算该工程的承包人报价浮动率L。\n第二题：判断各项措施项目费是否需要调整\n根据变更情况及合同约定，逐项判断以下措施项目是否需要调整，并说明理由：\n\n\n\n\n\n\n\n\n\n\n第三题：计算变更后各项措施项目费\n根据合同约定及相关规定，计算变更后各项措施项目费的调整金额（万元）。需考虑报价浮动率的因素。\n已知：\n变更后分部分项工程费：1,448万元；变更后定额人工费总额：302万元；承包人报价浮动率L：7.69%；安全文明施工费：按实际发生调整，不得浮动。\n1. 安全文明施工费（不得浮动）\n变更1新增深基坑支护费用15万元，临时排水费用5万元。\n2. 临时设施费（按系数计算，考虑浮动率）\n3. 夜间施工增加费（按系数计算，考虑浮动率）\n4. 二次搬运费（按系数计算，考虑浮动率）\n5. 脚手架搭拆费（按系数计算，考虑浮动率）\n第四题：编制措施项目费调整汇总表\n根据以上计算结果，编制措施项目费调整汇总表。","answer":"第一题：计算承包人报价浮动率\n计算：L = (1 - 4,800/5,200) × 100% = (1 - 0.9231) × 100% = 7.69%","difficulty":"难","category":"技经管理","explanation":""},{"id":"17","background":"","question":"某电厂2台机组装机容量为2×600兆瓦，两台机已完成低压缸零出力改造，单机最大供热能力约1500万平方米，当前供暖季期间承接热负荷2000万平方米。受制于热负荷原因，两台机组在供暖季期间顶峰能力不足，拟增设有效容积为2000立方米的储热水罐，供暖季期间可提高90兆瓦的顶峰能力，电厂所在地区供暖季时长4个月。\n机组平均供电煤耗为250克/千瓦时，平均到厂标煤价为800元/吨；电厂平均上网电价为0.3元/千瓦时（含税），尖峰期上网电价为0.7元/千瓦时，每年尖峰时长为60小时。根据当地政策，电厂所在地区容量电费为每年165元/兆瓦。本项目静态投资为5000万元。资金来源为：项目资本金20%，银行贷款80%，长期贷款利率3.5%，无流动资金，建设期6个月。\n问题1：请计算该项目的建设期利息。\n问题2：请计算该项目的含税销售收入。\n问题3：若本项目每年总成本为500万元（不含税），财务费用为100万元，请计算该项目的总投资收益率（ROI），\n问题4：本项目可能还存在什么收益。\n问题5：本项目做敏感性分析时应重点考虑哪些边界条件的变动？","answer":"问题1：请计算该项目的建设期利息。\n答案：建设期利息= 5000×80%×3.5%/2/2=35万元\n问题2：请计算该项目的含税销售收入。\n答案：供电成本=250×800=0.2元/千瓦时，新增顶峰收益=（0.7-0.2）×60小时×90兆瓦=270万元；\n新增容量电费（仅供暖季）=165元/兆瓦×90兆瓦/3=495万元\n总含税销售收入=270+495=765万元。\n问题3：若本项目每年总成本为500万元（不含税），财务费用为100万元，请计算该项目的总投资收益率（ROI）\n答案：ROI=息税前利润总额/项目总投资\n利润总额=（765/1.13)=677万元（不含税）\n息税前利润总额=677+100=777万元。\n项目总投资=静态投资+建设期利息=5000+35=5035万元\nROI=息税前利润总额/项目总投资=777/5035=15.4%\n问题4：本项目可能还存在什么收益。\n答案：两台机已完成低压缸零出力改造，单机最大供热能力约1500万平方米，当前供暖季期间承接热负荷2000万平方米。可知供暖季初末期，仅单台机切缸时即可满足供热需求，第二台机组为抽凝工况。改造后，热水罐进行储热时，可将第二台机组的抽凝运行方式改为切缸运行，为热水罐提供加热热源。因此，本项目实施后可新增由于机组切缸运行时带来的节煤、少发低价电减亏收益。\n问题5：本项目做敏感性分析时应重点考虑哪些边界条件的变动？\n（1）尖峰期上网电价波动时对收益率的影响。\n（2）当政策发生变化时，容量电费波动时对收益率的影响。","difficulty":"难","category":"技经管理","explanation":""},{"id":"18","background":"","question":"由于某地区上一年度3月底发布最新“两个细则”并开放了AGC辅助服务服务市场，为了适应电力市场辅助服务的需求，提高机组盈利能力，某电厂拟对1号机实施火储联合调频改造，配备5兆瓦超级电容，15兆瓦/30兆瓦时磷酸铁锂电化学储能，接入6千伏厂用电系统。考虑到机组停机、储能检修、消缺等每年运行时长为300天。改造前机组Kp值为0.8。表1为上一年度1号机AGC里程及出清价格统计数据。表2为上一年度AGC里程统计。\n表1 上一年度1号机AGC里程及出清价格统计\n\n\n\n\n\n\n\n\n表2上一年度1号机AGC指令分布\n\n\n\n\n\n\n\n\n\n\n问题1：在测算机组收益时，计算机组改造后的Kp值时应考虑哪些因素？\n问题2：若改造后机组的Kp值可提高至1.8请计算1号机每年新增AGC补偿收益。\n问题3：请计算1号机每年新增AGC考核减免收益\n问题4： 除去以上内容，在计算项目AGC有关的收益时还应该考虑哪部分内容，应该如何计算？\n问题5：计算AGC调频的用电成本时，应选取电厂度电成本还是上网电价，为什么？","answer":"问题1：在测算机组收益时，计算机组改造后的Kp值时应考虑哪些因素？\n答案：考虑调度倾向对调节容量较大的机组下发大较高指令，应区分配储容量内和配储容量外的两种工况进行计算，最终进行加权平均计算。\n问题2：若改造后机组的Kp值可提高至1.8请计算1号机每年新增AGC补偿收益。\n答案：新增AGC补偿收益=调频里程×综合性能指标提升值（Kp提升值）×出清价格\n改造前的历史数据应在项目所在地区的最新“两个细则”、AGC辅助服务市场开放日期时间节点之后选取并剔除数据的异常值，如机组检修、电网特殊调度指令等。因此，调频里程和出清价格应选取在3月之后，并剔除8月、11月的数据，即4、5、6、7、9、10、12月的均值。\n日均里程为1301兆瓦，出清价格为11.1元/兆瓦\n新增AGC补偿收益=1301兆瓦×（1.8-0.8）×11.1元/兆瓦×300=433万元\n问题3：请计算1号机每年新增AGC考核减免收益\n答案：本项目超级电容5兆瓦，电化学储能15兆瓦，共计20兆瓦，可完成20兆瓦以内的AGC指令。由表2可知20兆瓦以内的指令占比为99.14%，可免除99.14%的考核。根据上一问，在统计上一年度的考核金额数据时应采用4、5、6、7、9、10、12月的均值，平均值为81.85万元/月。\n新增AGC考核减免收益=81.85×10个月（300天）×99.14%=811.46万元。\n问题4： 除去以上内容，在计算项目AGC有关的收益时还应该考虑哪部分内容，应该如何计算？\n答案：应考虑AGC考核返还，按照“两个细则”和当地的政策文件确定全省（区域）考核金额和返还比例的计算规则，返还金额=全省（区域）考核金额×返还比例。改造后由于机组新增AGC补偿金额，返还比例可能发生变化，计算时应考虑改造前后的差异值。\n问题5：计算AGC调频的用电成本时，应选取电厂度电成本还是上网电价，为什么？\n答案：应选用上网电价。改造前后都要发出相同的电量，但改造后因为机组对储能系统充电参与调频，此时的电量并没有上网，减少了上网电价。","difficulty":"难","category":"技经管理","explanation":""},{"id":"19","background":"","question":"某电厂1、2号机组装机容量2×330兆瓦，两台机已完成低压缸零出力改造，单机供热能力为491兆瓦，（其中：冷、热再抽汽最大可提供工业蒸汽100吨/小时），当前两台机组工业供汽量60吨/小时，承接居民采暖700兆瓦。由于供暖季期间低电价时段较长，受制于热负荷机组无法进一步降低电出力，机组1号机已于去年完成高、低旁路改造，最大可降约15%电出力。今年电厂签订了《工业供汽协议》，新增工业蒸汽50吨/小时（焓值为2880千焦/千克，不回收蒸汽），年供汽时长7000小时，汽价195元/吨。为了提高机组抽汽量，在低电价时进一步降低电负荷，拟对2号机进行高、低旁路改造，供暖季期间可降低2号机最低电出力。到厂标煤单价为912元/吨，制水成本为15元/吨，供热煤耗40.5千克/吉焦。\n问题1：计算每年的新增的工业供汽收益。\n问题2：在计算本次改造项目内部收益率时，是否可以包含每年的新增的工业供汽利润。\n问题3：请构建本项目改造后的经济评价模型，包含主要成本和收入参数的选取原则。\n问题4：本项目做敏感性分析时应重点考虑哪些边界条件的变动？","answer":"问题1：计算每年的新增的工业供汽收益。\n答案：每吨蒸汽耗煤成本=蒸汽焓值×供热煤耗×标煤单价=2880千焦/千克×40.5千克/吉焦×912元/吨=106元/吨\n每吨蒸汽成本=每吨蒸汽耗煤成本+制水成本=106+15=121元/吨\n全年供汽量=50×7000=35万吨\n新增供热收益=35万吨×（195-121）元/吨=2590万元","difficulty":"难","category":"技经管理","explanation":""},{"id":"20","background":"","question":"某电厂1、2号机组装机容量2×300兆瓦供热机组，实际承接热负荷1400万平方米。1号机已完成低压缸零出力改造，最大供热能力1000万平方米。2号机采用打孔抽汽的方式进行供热，最大供热能力为600万平方米。两台机组共用一座供热首站，设计最大供热能力为1500万平方米。为拓展供热市场，电厂拟签订了东部新区供热协议，拟新增供热面积400万平方米。为提高全厂供热能力，本次拟进行供热能力提升改造项目，一是对2号机进行低压缸零出力改造，供热能力将提升至1000万平方米；二是对首站进行扩容改造，供热能力提升至1900万平方米。\n问题1：在计算本项目收益率时，如何计算新增供热收益并说明原因。\n问题2：在计算本项目收益率时，如何确定改造后2号机组的切缸时长？\n问题3：请构建本项目经济测算模型。\n问题4：本项目做敏感性分析时应重点考虑哪些边界条件的变动？","answer":"问题1：在计算本项目收益率时，如何计算新增供热收益并说明原因。\n答案：根据“有无对比”原则，改造前两台机最大供热能力1600万平方米，首站最大供热能力1500万平方米，当前实际承接热负荷1400万平方米，电厂还存在1500-1400=100万平方米的供热裕量。在计算新增400万平方米供热收益时，应剔除100万平方米的既有能力。因此只计算300万平方米的供热收益。\n问题2：在计算本项目收益率时，如何确定改造后2号机组的切缸时长？\n答案：根据电厂上一年度供暖季的供热延时曲线和每月热负荷情况，在满足热负荷需求的条件下，供暖季初期热负荷A较低，1、2号机采用抽凝方式；当热负荷提高至B时，1号机转为缸运行方式，2号机依然为抽凝运行方式；当热负荷提高至C时，1号机已达到切缸工况下的最大供热量，2号机进入切缸运行方式；随后热负荷提高至尖峰期后，逐渐降低D时，2号机退出切缸运行工况。（优先释放1号机的供热能力）。\n综上，从热负荷C调高至尖峰热负荷，逐步降低至热负荷D的总时长即为2号机的切缸时长。\n\n问题3：请构建本项目经济测算模型。\n答案：\n收益参数：\n①新增供热收益：新增300万平方米的供热收益。\n②煤耗降低：根据“问题2”确定的切缸时长，结合切缸工况相比抽凝工况供电煤耗降低值确定减少耗煤量，计算出煤耗降低收益。\n成本参数：\n①供热煤耗成本：根据新增供热量，结合机组供热煤耗、标煤价计算新增供热煤耗成本。\n②新增补水成本：新增供热量后将引起热补水量提高。\n③新增耗电成本：新增供热量后将引起热网循环水泵等电气耗电量提高。\n④新增保险费。\n⑤新增检修费。\n问题4：本项目做敏感性分析时应重点考虑哪些边界条件的变动？\n①考虑新增供热量的变动。\n②考虑煤价波动。","difficulty":"难","category":"技经管理","explanation":""}]};

function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

function getWrong(){try{return JSON.parse(localStorage.getItem(STORAGE_WRONG))||[]}catch(e){return[]}}
function saveWrong(l){localStorage.setItem(STORAGE_WRONG,JSON.stringify(l));updateHomeStats()}
function addWrong(q,type,ua){const b=getWrong();const k=type+'_'+q.id;if(!b.find(i=>i.key===k)){b.push({key:k,type,question:q,userAnswer:ua||'',time:Date.now()});saveWrong(b)}}
function removeWrong(k){let b=getWrong();b=b.filter(i=>i.key!==k);saveWrong(b)}

function getStat(){try{return JSON.parse(localStorage.getItem(STORAGE_STAT))||{answered:0,correct:0}}catch(e){return{answered:0,correct:0}}}
function saveStat(s){localStorage.setItem(STORAGE_STAT,JSON.stringify(s))}
function addStat(isCorrect){const s=getStat();s.answered++;if(isCorrect)s.correct++;saveStat(s)}

function updateHomeStats(){
  const total=QUESTIONS.single.length+QUESTIONS.multi.length+QUESTIONS.short.length+QUESTIONS.case.length;
  const s=getStat();
  const w=getWrong().length;
  $('#hTotal').textContent=total;
  $('#hAnswered').textContent=s.answered;
  $('#hRate').textContent=s.answered>0?Math.round(s.correct/s.answered*100)+'%':'0%';
  $('#hWrong').textContent=w;
  $('#quickWrongCount').textContent=w;
  $('#cntSingle').textContent=QUESTIONS.single.length;
  $('#cntMulti').textContent=QUESTIONS.multi.length;
  $('#cntShort').textContent=QUESTIONS.short.length;
  $('#cntCase').textContent=QUESTIONS.case.length;
}

function showView(name){
  $$('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+name).classList.add('active');
  window.scrollTo(0,0);
}

/* ===== 首页事件 ===== */
function initHome(){
  updateHomeStats();
  $$('#typeGrid .type-card').forEach(c=>{
    c.addEventListener('click',()=>{
      state.sheetType=c.dataset.type;
      state.sheetMode='sequential';
      state.sheetCount=10;
      state.isMock=false;
      openSheet(c.querySelector('h3').textContent);
    });
  });
  $('#wrongBtn').addEventListener('click',()=>{renderWrong();showView('wrong')});
  $('#quickWrong').addEventListener('click',()=>{renderWrong();showView('wrong')});
  $('#quickStat').addEventListener('click',()=>{
    const s=getStat();
    toast(`已答${s.answered}题，正确${s.correct}题，正确率${s.answered>0?Math.round(s.correct/s.answered*100):0}%`);
  });
  $('#mockBtn').addEventListener('click',()=>{
    state.isMock=true;
    startMock();
  });
  $('#resetBtn').addEventListener('click',()=>{
    if(confirm('确定要重置全部答题进度吗？这将清空已答题统计和错题本。')){
      localStorage.removeItem(STORAGE_STAT);
      localStorage.removeItem(STORAGE_WRONG);
      updateHomeStats();
      toast('已重置全部进度');
    }
  });
}

/* ===== 底部面板 ===== */
function openSheet(title){
  $('#sheetTitle').textContent=title+' - 开始练习';
  $$('#modeOpts .sheet-opt').forEach(b=>b.classList.toggle('selected',b.dataset.mode===state.sheetMode));
  $$('#countOpts .sheet-opt').forEach(b=>b.classList.toggle('selected',b.dataset.count==String(state.sheetCount)));
  $('#sheetMask').classList.add('active');
}
function closeSheet(){$('#sheetMask').classList.remove('active')}

function initSheet(){
  $('#sheetMask').addEventListener('click',e=>{if(e.target===$('#sheetMask'))closeSheet()});
  $$('#modeOpts .sheet-opt').forEach(b=>{
    b.addEventListener('click',()=>{
      $$('#modeOpts .sheet-opt').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      state.sheetMode=b.dataset.mode;
    });
  });
  $$('#countOpts .sheet-opt').forEach(b=>{
    b.addEventListener('click',()=>{
      $$('#countOpts .sheet-opt').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      state.sheetCount=b.dataset.count==='all'?'all':parseInt(b.dataset.count);
    });
  });
  $('#sheetStart').addEventListener('click',()=>{closeSheet();startQuiz()});
}

/* ===== 开始答题 ===== */
function startQuiz(){
  const type=state.sheetType;
  const mode=state.sheetMode;
  let source=[];
  if(mode==='wrong'){
    const book=getWrong().filter(i=>i.type===type);
    source=book.map(i=>Object.assign({},i.question,{_type:type}));
    if(source.length===0){toast('该题型暂无错题');return}
  }else{
    source=QUESTIONS[type].map(q=>Object.assign({},q,{_type:type}));
  }
  if(mode==='random')source=shuffle(source);
  let count=state.sheetCount;
  if(count==='all'||count>source.length)count=source.length;
  state.quizList=source.slice(0,count);
  if(state.quizList.length===0){toast('没有可练习的题目');return}
  state.currentIndex=0;state.correctCount=0;state.wrongCount=0;state.answers=[];state.multiSelected=[];
  showView('quiz');renderQuestion();
}

function startMock(){
  const singles=shuffle(QUESTIONS.single).slice(0,30).map(q=>Object.assign({},q,{_type:'single',_score:2}));
  const multis=shuffle(QUESTIONS.multi).slice(0,20).map(q=>Object.assign({},q,{_type:'multi',_score:3}));
  state.quizList=[...singles,...multis];
  state.currentIndex=0;state.correctCount=0;state.wrongCount=0;state.answers=[];state.multiSelected=[];
  showView('quiz');renderQuestion();
}

/* ===== 渲染题目 ===== */
function renderQuestion(){
  const q=state.quizList[state.currentIndex];
  const type=q._type;
  const total=state.quizList.length;
  const idx=state.currentIndex+1;
  const typeNames={single:'单选题',multi:'多选题',short:'简答题',case:'案例分析题'};
  $('#qProgress').style.width=(idx/total*100)+'%';
  $('#qProgressText').textContent=idx+' / '+total;
  $('#qCorrect').textContent=state.correctCount;
  $('#qWrong').textContent=state.wrongCount;
  state.multiSelected=[];
  let html='<div class="q-meta"><span class="q-tag">'+typeNames[type]+'</span><span class="q-diff diff-'+(q.difficulty||'中')+'">难度：'+(q.difficulty||'中')+'</span></div>';
  html+='<div class="q-card"><div class="q-num">第 '+idx+' 题 / 共 '+total+' 题</div>';
  if(type==='case'&&q.background)html+='<div class="q-bg">'+esc(q.background)+'</div>';
  html+='<div class="q-text">'+esc(q.question)+'</div>';
  if(type==='single'||type==='multi'){
    html+='<div class="options">';
    ['A','B','C','D','E'].forEach(l=>{
      if(q.options[l]){
        html+='<button class="option" data-l="'+l+'"><span class="option-letter">'+l+'</span><span class="option-text">'+esc(q.options[l])+'</span></button>';
      }
    });
    html+='</div>';
    if(type==='multi'){
      html+='<div class="multi-confirm"><span class="sel-label">已选：<b id="selLabel">无</b></span><button class="btn-primary" id="confirmMulti" disabled>提交答案</button></div>';
    }
  }else{
    html+='<div class="subjective-area"><textarea id="subAns" placeholder="请在此输入你的答案..."></textarea><div class="eval-row"><label>完成后查看参考答案：</label><button class="btn-primary" id="showAns">查看参考答案</button></div></div>';
  }
  html+='</div>';
  $('#quizBody').innerHTML=html;
  if(type==='single'){
    $$('#quizBody .option').forEach(o=>o.addEventListener('click',()=>handleSingle(o,q)));
  }else if(type==='multi'){
    $$('#quizBody .option').forEach(o=>o.addEventListener('click',()=>handleMultiSelect(o)));
    $('#confirmMulti').addEventListener('click',()=>handleMultiConfirm(q));
  }else{
    $('#showAns').addEventListener('click',()=>showSubjective(q,type));
  }
}

function handleSingle(item,q){
  const l=item.dataset.l;
  const ok=l===q.answer;
  $$('#quizBody .option').forEach(o=>o.classList.add('disabled'));
  if(ok){
    item.classList.add('correct');
    state.correctCount++;addStat(true);
    state.answers.push({q,type:q._type,userAnswer:l,isCorrect:true,correctAnswer:q.answer});
    setTimeout(nextQuestion,600);
  }else{
    item.classList.add('wrong');
    $$('#quizBody .option').forEach(o=>{if(o.dataset.l===q.answer)o.classList.add('correct')});
    state.wrongCount++;addStat(false);addWrong(q,q._type,l);
    state.answers.push({q,type:q._type,userAnswer:l,isCorrect:false,correctAnswer:q.answer});
    showExp(false,q.answer,q.explanation);
  }
  $('#qCorrect').textContent=state.correctCount;$('#qWrong').textContent=state.wrongCount;
}

function handleMultiSelect(item){
  const l=item.dataset.l;
  const i=state.multiSelected.indexOf(l);
  if(i>=0){state.multiSelected.splice(i,1);item.classList.remove('selected')}
  else{state.multiSelected.push(l);item.classList.add('selected')}
  state.multiSelected.sort();
  $('#selLabel').textContent=state.multiSelected.length?state.multiSelected.join('、'):'无';
  $('#confirmMulti').disabled=state.multiSelected.length===0;
}

function handleMultiConfirm(q){
  const ua=state.multiSelected.join('');
  const ok=ua===q.answer;
  $$('#quizBody .option').forEach(o=>o.classList.add('disabled'));
  $$('#quizBody .option').forEach(o=>{
    const l=o.dataset.l;
    if(q.answer.includes(l))o.classList.add('correct');
    else if(state.multiSelected.includes(l))o.classList.add('wrong');
  });
  if(ok){
    state.correctCount++;addStat(true);
    state.answers.push({q,type:q._type,userAnswer:ua,isCorrect:true,correctAnswer:q.answer});
    setTimeout(nextQuestion,800);
  }else{
    state.wrongCount++;addStat(false);addWrong(q,q._type,ua);
    state.answers.push({q,type:q._type,userAnswer:ua,isCorrect:false,correctAnswer:q.answer});
    showExp(false,q.answer,q.explanation);
  }
  $('#qCorrect').textContent=state.correctCount;$('#qWrong').textContent=state.wrongCount;
}

function showSubjective(q,type){
  const ua=$('#subAns').value.trim();
  let html='<div class="exp-panel"><div class="exp-header" style="color:var(--primary)">参考答案</div><div class="exp-text" style="margin-bottom:14px">'+esc(q.answer)+'</div>';
  if(q.explanation)html+='<div class="exp-header" style="color:var(--text-secondary);font-size:14px">解析</div><div class="exp-text">'+esc(q.explanation)+'</div>';
  html+='<div class="eval-row"><label>你的作答是否正确：</label><button class="eval-btn correct-eval" id="evC">我答对了</button><button class="eval-btn wrong-eval" id="evW">我答错了</button></div></div>';
  const old=$('#quizBody .exp-panel');if(old)old.remove();
  $('#quizBody .q-card').insertAdjacentHTML('beforeend',html);
  $('#showAns').disabled=true;$('#subAns').disabled=true;
  $('#evC').addEventListener('click',()=>{
    $$('.eval-btn').forEach(b=>b.classList.remove('selected'));$('#evC').classList.add('selected');
    state.correctCount++;addStat(true);
    state.answers.push({q,type,userAnswer:ua,isCorrect:true,correctAnswer:q.answer});
    $('#qCorrect').textContent=state.correctCount;addNextBtn();
  });
  $('#evW').addEventListener('click',()=>{
    $$('.eval-btn').forEach(b=>b.classList.remove('selected'));$('#evW').classList.add('selected');
    state.wrongCount++;addStat(false);addWrong(q,type,ua);
    state.answers.push({q,type,userAnswer:ua,isCorrect:false,correctAnswer:q.answer});
    $('#qWrong').textContent=state.wrongCount;addNextBtn();
  });
}

function showExp(ok,answer,exp){
  let html='<div class="exp-panel"><div class="exp-header '+(ok?'correct':'wrong')+'">'+(ok?'回答正确':'回答错误')+'</div><div class="exp-answer">正确答案：<strong>'+answer+'</strong></div>';
  if(exp)html+='<div class="exp-text">'+esc(exp)+'</div>';
  html+='</div>';
  const old=$('#quizBody .exp-panel');if(old)old.remove();
  $('#quizBody .q-card').insertAdjacentHTML('beforeend',html);
  addNextBtn();
}

function addNextBtn(){
  const last=state.currentIndex>=state.quizList.length-1;
  let html='<div class="next-row"><button class="btn-primary" id="nextBtn">'+(last?'查看结果':'下一题')+'</button></div>';
  const old=$('#quizBody .next-row');if(old)old.remove();
  $('#quizBody .q-card').insertAdjacentHTML('beforeend',html);
  $('#nextBtn').addEventListener('click',nextQuestion);
}

function nextQuestion(){
  state.currentIndex++;
  if(state.currentIndex>=state.quizList.length)showResult();
  else renderQuestion();
}

/* ===== 结果页 ===== */
function showResult(){
  const total=state.answers.length;
  const correct=state.correctCount;
  const wrong=state.wrongCount;
  let score;
  if(state.isMock){
    score=state.answers.reduce((s,a)=>s+(a.isCorrect?(a.q._score||2):0),0);
  }else{
    score=total>0?Math.round(correct/total*100):0;
  }
  const rate=total>0?Math.round(correct/total*100):0;
  $('#rScore').textContent=score;
  $('#rTotal').textContent=total;$('#rCorrect').textContent=correct;$('#rWrong').textContent=wrong;$('#rRate').textContent=rate+'%';
  const ring=$('#scoreRing');const circ=2*Math.PI*68;
  ring.style.strokeDasharray=circ;ring.style.strokeDashoffset=circ;
  const color=rate>=80?'var(--correct)':rate>=60?'var(--primary)':'var(--wrong)';
  ring.style.stroke=color;$('#rScore').style.color=color;
  setTimeout(()=>{ring.style.strokeDashoffset=circ*(1-rate/100)},100);
  let title,sub;
  if(rate>=90){title='优秀！';sub='掌握扎实，继续保持'}
  else if(rate>=80){title='良好';sub='基础不错，查漏补缺'}
  else if(rate>=60){title='及格';sub='仍需努力，重点复习错题'}
  else{title='继续加油';sub='建议回顾错题，巩固薄弱环节'}
  $('#rTitle').textContent=title;$('#rSub').textContent=sub;
  const list=$('#reviewList');list.innerHTML='';
  const tn={single:'单选',multi:'多选',short:'简答',case:'案例'};
  state.answers.forEach((a,i)=>{
    const div=document.createElement('div');div.className='review-item';
    div.innerHTML='<div class="review-head"><span class="q-tag" style="font-size:11px">'+tn[a.type]+'</span><span style="font-size:12px;color:'+(a.isCorrect?'var(--correct)':'var(--wrong)')+';font-weight:600">'+(a.isCorrect?'答对':'答错')+'</span><span style="font-size:12px;color:var(--text-muted);margin-left:auto">第'+(i+1)+'题</span></div><div class="q">'+esc(a.q.question)+'</div><div class="review-detail"><p><span class="lbl">你的答案：</span>'+esc(a.userAnswer||'（未作答）')+'</p><p><span class="lbl">正确答案：</span>'+esc(a.correctAnswer)+'</p>'+(a.q.explanation?'<p><span class="lbl">解析：</span>'+esc(a.q.explanation)+'</p>':'')+'</div>';
    div.addEventListener('click',()=>div.classList.toggle('open'));
    list.appendChild(div);
  });
  showView('result');
}

/* ===== 错题本 ===== */
function renderWrong(){
  const book=getWrong();
  const f=state.wrongFilter;
  const list=f==='all'?book:book.filter(i=>i.type===f);
  const container=$('#wrongList');
  if(list.length===0){
    container.innerHTML='<div class="empty"><div class="icon">📋</div><p>'+(book.length===0?'还没有错题，快去练习吧！':'该分类下暂无错题')+'</p></div>';
    return;
  }
  const tn={single:'单选题',multi:'多选题',short:'简答题',case:'案例题'};
  container.innerHTML='';
  list.forEach(item=>{
    const q=item.question;
    const div=document.createElement('div');div.className='wrong-item';
    let html='<div class="wrong-item-head"><span class="q-tag" style="font-size:12px">'+tn[item.type]+'</span><span class="q-diff diff-'+(q.difficulty||'中')+'" style="font-size:11px">难度：'+(q.difficulty||'中')+'</span></div>';
    if(item.type==='case'&&q.background)html+='<div class="q-bg" style="margin-bottom:8px">'+esc(q.background)+'</div>';
    html+='<div class="q">'+esc(q.question)+'</div><div class="ans"><span>你的答案：<span class="y">'+esc(item.userAnswer||'（未作答）')+'</span></span><span>正确答案：<span class="r">'+esc(q.answer)+'</span></span></div>';
    if(q.explanation)html+='<div class="exp">'+esc(q.explanation)+'</div>';
    html+='<div class="wrong-item-actions"><button class="btn btn-ghost" data-rm="'+item.key+'">已掌握，移除</button></div>';
    div.innerHTML=html;container.appendChild(div);
  });
  $$('#wrongList [data-rm]').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();removeWrong(b.dataset.rm);renderWrong()});
  });
}

/* ===== 事件绑定 ===== */
function bindEvents(){
  $('#quizBack').addEventListener('click',()=>{if(confirm('确定退出当前练习吗？进度将不会保存。'))showView('home')});
  $('#resultHome').addEventListener('click',()=>{updateHomeStats();showView('home')});
  $('#rHome').addEventListener('click',()=>{updateHomeStats();showView('home')});
  $('#rRetry').addEventListener('click',()=>{
    if(state.isMock)startMock();
    else startQuiz();
  });
  $('#wrongBack').addEventListener('click',()=>showView('home'));
  $$('#wrongFilters .wrong-filter').forEach(b=>{
    b.addEventListener('click',()=>{
      $$('#wrongFilters .wrong-filter').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');state.wrongFilter=b.dataset.wt;renderWrong();
    });
  });
  $('#practiceWrong').addEventListener('click',()=>{
    const f=state.wrongFilter;
    if(f==='all'){toast('请先选择具体题型');return}
    state.sheetType=f;state.sheetMode='wrong';state.sheetCount='all';state.isMock=false;
    startQuiz();
  });
  $('#clearWrong').addEventListener('click',()=>{
    if(confirm('确定清空所有错题吗？')){saveWrong([]);renderWrong()}
  });
}

document.addEventListener('DOMContentLoaded',()=>{
  initHome();initSheet();bindEvents();
});
</script>
</body>
</html>
