<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>火电专业题库 · 模拟考试训练</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root {
  --bg: #f0f2f5;
  --card: #ffffff;
  --text-primary: #1a1a2e;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --primary: #5b7cfa;
  --primary-dark: #4a6ae8;
  --primary-gradient: linear-gradient(135deg, #5b7cfa 0%, #7b5cfa 100%);
  --accent-gradient: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
  --correct: #10b981;
  --wrong: #ef4444;
  --border: #e5e7eb;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height:100%; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; }

/* ===== 顶部导航 ===== */
.topbar {
  position: sticky; top:0; z-index:100;
  background: #fff;
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.topbar-title { font-size: 17px; font-weight: 700; }
.topbar-right { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); transition: all 0.2s;
}
.icon-btn:active { transform: scale(0.92); }
.icon-btn svg { width: 20px; height: 20px; }

/* ===== 容器 ===== */
.container { max-width: 640px; margin: 0 auto; padding: 16px; }

/* ===== 视图切换 ===== */
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

/* ===== 首页：头部统计卡片 ===== */
.hero-card {
  background: var(--primary-gradient);
  border-radius: 20px;
  padding: 28px 20px 24px;
  color: #fff;
  text-align: center;
  box-shadow: 0 8px 24px rgba(91,124,250,0.35);
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.hero-card::before {
  content:''; position:absolute; top:-40px; right:-40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: rgba(255,255,255,0.08);
}
.hero-card::after {
  content:''; position:absolute; bottom:-60px; left:-30px;
  width: 140px; height: 140px; border-radius: 50%;
  background: rgba(255,255,255,0.06);
}
.hero-icon { font-size: 40px; margin-bottom: 8px; position: relative; z-index:1; }
.hero-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; position: relative; z-index:1; }
.hero-subtitle { font-size: 13px; opacity: 0.85; margin-bottom: 20px; position: relative; z-index:1; }
.hero-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  position: relative; z-index:1;
}
.hero-stat .num { font-size: 22px; font-weight: 800; }
.hero-stat .label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

/* ===== 区块标题 ===== */
.section-title {
  font-size: 16px; font-weight: 700;
  margin: 24px 0 14px;
  display: flex; align-items: center; gap: 6px;
}
.section-title .icon { font-size: 18px; }

/* ===== 题型卡片网格 ===== */
.type-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.type-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  box-shadow: var(--shadow);
  transition: all 0.2s;
  border: 2px solid transparent;
}
.type-card:active { transform: scale(0.97); }
.type-card.selected { border-color: var(--primary); background: #f0f3ff; }
.type-card .t-icon {
  width: 48px; height: 48px; border-radius: 12px;
  background: linear-gradient(135deg, #eef1ff, #e8ecff);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
  font-size: 20px; font-weight: 800; color: var(--primary);
}
.type-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.type-card p { font-size: 13px; color: var(--text-muted); }

/* ===== 快捷入口 ===== */
.quick-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.quick-btn {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow);
  font-size: 15px; font-weight: 600;
  transition: all 0.2s;
}
.quick-btn:active { transform: scale(0.97); }
.quick-btn .q-icon { font-size: 22px; }
.quick-btn .q-count { margin-left: auto; font-size: 13px; color: var(--text-muted); font-weight: 500; }

/* ===== 模拟考试大按钮 ===== */
.mock-btn {
  width: 100%;
  background: var(--accent-gradient);
  border-radius: 20px;
  padding: 28px 20px;
  color: #fff; text-align: center;
  box-shadow: 0 8px 24px rgba(255,107,107,0.3);
  transition: all 0.2s;
  position: relative; overflow: hidden;
}
.mock-btn:active { transform: scale(0.98); }
.mock-btn .m-icon { font-size: 36px; margin-bottom: 8px; }
.mock-btn h3 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.mock-btn p { font-size: 13px; opacity: 0.9; }

/* ===== 重置按钮 ===== */
.reset-btn {
  width: 100%; margin-top: 16px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  font-size: 14px; font-weight: 600;
  color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 0.2s;
}
.reset-btn:active { background: #f9fafb; }

/* ===== 底部弹出面板 ===== */
.sheet-mask {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.5);
  display: none; align-items: flex-end;
}
.sheet-mask.active { display: flex; animation: fadeIn 0.2s; }
.sheet {
  background: #fff;
  width: 100%; max-width: 640px; margin: 0 auto;
  border-radius: 20px 20px 0 0;
  padding: 20px 16px 32px;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.sheet-handle {
  width: 40px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 0 auto 16px;
}
.sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }
.sheet-section { margin-bottom: 18px; }
.sheet-label { font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; }
.sheet-options { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-opt {
  padding: 10px 18px; border-radius: 24px;
  border: 1.5px solid var(--border);
  font-size: 14px; font-weight: 500;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.sheet-opt.selected {
  border-color: var(--primary);
  background: #eef1ff;
  color: var(--primary);
  font-weight: 600;
}
.sheet-start {
  width: 100%; margin-top: 8px;
  background: var(--primary-gradient);
  color: #fff; font-size: 16px; font-weight: 700;
  padding: 15px; border-radius: 12px;
  box-shadow: 0 4px 16px rgba(91,124,250,0.3);
}
.sheet-start:active { transform: scale(0.98); }

/* ===== 答题页 ===== */
.quiz-topbar {
  position: sticky; top:0; z-index:100;
  background: #fff; padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
}
.back-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
}
.quiz-progress { flex:1; }
.quiz-progress-bar {
  height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden;
}
.quiz-progress-fill {
  height: 100%; background: var(--primary-gradient);
  border-radius: 3px; transition: width 0.3s;
}
.quiz-progress-text { font-size: 12px; color: var(--text-muted); text-align: right; margin-top: 4px; }
.quiz-score { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
.quiz-score .c { color: var(--correct); font-weight: 700; }
.quiz-score .w { color: var(--wrong); font-weight: 700; }

.quiz-body { max-width: 640px; margin: 0 auto; padding: 16px; }
.q-meta { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.q-tag {
  padding: 4px 12px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  background: #eef1ff; color: var(--primary);
}
.q-diff { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.diff-易 { background: rgba(16,185,129,0.12); color: var(--correct); }
.diff-中 { background: rgba(245,158,11,0.12); color: #f59e0b; }
.diff-难 { background: rgba(239,68,68,0.12); color: var(--wrong); }

.q-card {
  background: var(--card); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.q-num { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
.q-text { font-size: 16px; font-weight: 500; line-height: 1.8; }
.q-bg {
  margin-top: 12px; padding: 12px 14px;
  background: #f9fafb; border-left: 3px solid var(--primary);
  border-radius: 0 8px 8px 0;
  font-size: 14px; color: var(--text-secondary); line-height: 1.8;
  white-space: pre-wrap;
}

.options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.option {
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 12px;
  font-size: 15px; line-height: 1.6; text-align: left; width: 100%;
  transition: all 0.2s;
}
.option:active:not(.disabled) { transform: scale(0.99); }
.option.disabled { cursor: default; }
.option.correct { border-color: var(--correct); background: rgba(16,185,129,0.06); }
.option.wrong { border-color: var(--wrong); background: rgba(239,68,68,0.06); }
.option.selected { border-color: var(--primary); background: #f0f3ff; }
.option-letter {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg); border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: var(--text-secondary); flex-shrink: 0;
}
.option.correct .option-letter { background: var(--correct); border-color: var(--correct); color: #fff; }
.option.wrong .option-letter { background: var(--wrong); border-color: var(--wrong); color: #fff; }
.option.selected .option-letter { background: var(--primary); border-color: var(--primary); color: #fff; }
.option-text { flex: 1; padding-top: 2px; }

.multi-confirm {
  margin-top: 14px; display: flex; align-items: center; gap: 12px;
  background: var(--card); border-radius: 12px; padding: 12px 16px;
  box-shadow: var(--shadow);
}
.multi-confirm .sel-label { font-size: 14px; color: var(--text-secondary); flex: 1; }
.multi-confirm .sel-label b { color: var(--primary); }
.btn-primary {
  background: var(--primary-gradient); color: #fff;
  padding: 10px 24px; border-radius: 10px;
  font-size: 14px; font-weight: 700;
  box-shadow: 0 2px 10px rgba(91,124,250,0.25);
}
.btn-primary:disabled { opacity: 0.4; box-shadow: none; }
.btn-ghost {
  background: var(--bg); color: var(--text-secondary);
  padding: 10px 20px; border-radius: 10px;
  font-size: 14px; font-weight: 600;
}

.exp-panel {
  margin-top: 16px; background: var(--card);
  border-radius: 12px; padding: 18px;
  box-shadow: var(--shadow); animation: slideDown 0.25s ease;
}
@keyframes slideDown { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: translateY(0); } }
.exp-header { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-bottom: 10px; }
.exp-header.correct { color: var(--correct); }
.exp-header.wrong { color: var(--wrong); }
.exp-answer {
  font-size: 14px; color: var(--text-secondary); margin-bottom: 10px;
  padding: 8px 12px; background: var(--bg); border-radius: 8px;
}
.exp-answer strong { color: var(--primary); }
.exp-text { font-size: 14px; color: var(--text-secondary); line-height: 1.8; white-space: pre-wrap; }
.next-row { margin-top: 14px; display: flex; justify-content: flex-end; }

.subjective-area { margin-top: 16px; }
.subjective-area textarea {
  width: 100%; min-height: 120px;
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px;
  color: var(--text-primary); font-size: 14px; line-height: 1.7;
  resize: vertical; outline: none;
}
.subjective-area textarea:focus { border-color: var(--primary); }
.eval-row { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.eval-row label { font-size: 14px; color: var(--text-secondary); }
.eval-btn {
  padding: 8px 18px; border-radius: 20px;
  border: 1.5px solid var(--border); font-size: 14px; font-weight: 600;
  color: var(--text-secondary); transition: all 0.2s;
}
.eval-btn.correct-eval.selected { border-color: var(--correct); background: rgba(16,185,129,0.1); color: var(--correct); }
.eval-btn.wrong-eval.selected { border-color: var(--wrong); background: rgba(239,68,68,0.1); color: var(--wrong); }

/* ===== 结果页 ===== */
.result-hero { text-align: center; padding: 24px 0 16px; }
.score-ring {
  width: 160px; height: 160px; margin: 0 auto 16px; position: relative;
}
.score-ring svg { transform: rotate(-90deg); }
.score-ring-bg { fill: none; stroke: var(--bg); stroke-width: 12; }
.score-ring-fill { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.score-center {
  position: absolute; top:50%; left:50%; transform: translate(-50%,-50%);
  text-align: center;
}
.score-center .big { font-size: 38px; font-weight: 900; line-height: 1; }
.score-center .unit { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.result-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
.result-sub { font-size: 14px; color: var(--text-secondary); }

.result-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  margin: 20px 0;
}
.r-stat {
  background: var(--card); border-radius: 12px; padding: 14px 8px;
  text-align: center; box-shadow: var(--shadow);
}
.r-stat .val { font-size: 22px; font-weight: 800; }
.r-stat .lbl { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

.review-list { margin-top: 16px; }
.review-item {
  background: var(--card); border-radius: 12px; padding: 14px 16px;
  margin-bottom: 10px; box-shadow: var(--shadow); cursor: pointer;
}
.review-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.review-item .q {
  font-size: 14px; color: var(--text-secondary); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.review-detail {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  display: none;
}
.review-item.open .review-detail { display: block; }
.review-detail p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 6px; }
.review-detail .lbl { color: var(--primary); font-weight: 600; }

.result-actions { display: flex; gap: 10px; margin-top: 24px; }
.result-actions .btn { flex: 1; padding: 14px; font-size: 15px; border-radius: 12px; font-weight: 700; }

/* ===== 错题本 ===== */
.wrong-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
.wrong-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.wrong-filter {
  padding: 6px 14px; border-radius: 20px;
  font-size: 13px; border: 1.5px solid var(--border);
  color: var(--text-secondary); transition: all 0.2s;
}
.wrong-filter.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }

.wrong-actions { display: flex; gap: 10px; margin-bottom: 16px; }
.wrong-actions .btn { flex: 1; padding: 12px; font-size: 14px; border-radius: 10px; font-weight: 600; }

.wrong-item {
  background: var(--card); border-radius: 12px; padding: 16px;
  margin-bottom: 12px; box-shadow: var(--shadow);
}
.wrong-item-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.wrong-item .q { font-size: 15px; font-weight: 500; line-height: 1.7; margin-bottom: 8px; }
.wrong-item .ans { display: flex; gap: 14px; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; flex-wrap: wrap; }
.wrong-item .ans .y { color: var(--wrong); }
.wrong-item .ans .r { color: var(--correct); }
.wrong-item .exp {
  font-size: 13px; color: var(--text-muted); line-height: 1.7;
  padding: 10px 12px; background: var(--bg); border-radius: 8px; white-space: pre-wrap;
}
.wrong-item-actions { display: flex; gap: 8px; margin-top: 10px; }
.wrong-item-actions .btn { padding: 6px 14px; font-size: 13px; border-radius: 8px; }

.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty p { font-size: 15px; }

/* ===== Toast ===== */
.toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.8); color: #fff;
  padding: 12px 24px; border-radius: 10px;
  font-size: 14px; z-index: 999;
  display: none;
}
.toast.show { display: block; animation: fadeIn 0.2s; }
</style>
</head>
<body>

<!-- ===== 首页 ===== -->
<section class="view active" id="view-home">
  <header class="topbar">
    <div class="topbar-title">火电专业题库</div>
    <div class="topbar-right">
      <button class="icon-btn" id="wrongBtn" title="错题本">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5"/><polyline points="11 5 11 11 17 11"/><line x1="19" y1="3" x2="9" y2="13"/></svg>
      </button>
    </div>
  </header>
  <div class="container">
    <div class="hero-card">
      <div class="hero-icon">🔥</div>
      <div class="hero-title">火电专业题库训练</div>
      <div class="hero-subtitle">单选 · 多选 · 简答 · 案例分析 — 四大题型</div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="num" id="hTotal">0</div><div class="label">总题数</div></div>
        <div class="hero-stat"><div class="num" id="hAnswered">0</div><div class="label">已答题</div></div>
        <div class="hero-stat"><div class="num" id="hRate">0%</div><div class="label">正确率</div></div>
        <div class="hero-stat"><div class="num" id="hWrong">0</div><div class="label">错题</div></div>
      </div>
    </div>

    <div class="section-title"><span class="icon">📝</span>选择题型开始刷题</div>
    <div class="type-grid" id="typeGrid">
      <button class="type-card" data-type="single">
        <div class="t-icon">A</div>
        <h3>单选题</h3>
        <p><span id="cntSingle">0</span> 题</p>
      </button>
      <button class="type-card" data-type="multi">
        <div class="t-icon">ABC</div>
        <h3>多选题</h3>
        <p><span id="cntMulti">0</span> 题</p>
      </button>
      <button class="type-card" data-type="short">
        <div class="t-icon">文</div>
        <h3>简答题</h3>
        <p><span id="cntShort">0</span> 题</p>
      </button>
      <button class="type-card" data-type="case">
        <div class="t-icon">案</div>
        <h3>案例分析</h3>
        <p><span id="cntCase">0</span> 题</p>
      </button>
    </div>

    <div class="section-title"><span class="icon">⚡</span>快捷入口</div>
    <div class="quick-grid">
      <button class="quick-btn" id="quickWrong">
        <span class="q-icon">❌</span>错题本<span class="q-count" id="quickWrongCount">0</span>
      </button>
      <button class="quick-btn" id="quickStat">
        <span class="q-icon">📊</span>答题统计
      </button>
    </div>

    <div class="section-title"><span class="icon">🎯</span>模拟考试</div>
    <button class="mock-btn" id="mockBtn">
      <div class="m-icon">📝</div>
      <h3>模拟练习（50题）</h3>

<script>
const QUESTIONS = {"single":[{"id":"1","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），土石方定额中不包括（  ）的费用，发生时另行计算。","answer":"A","difficulty":"中","options":{"A":"施工降水、排水","B":"人力车、汽车在重车上坡时的降效","C":"人工清土、修坡","D":"工作面排水","E":""},"explanation":"预算定额中，土石方定额中不包括施工降水、排水的费用，发生时可按照降排水子目执行，无法参考时按照有关规定另行计算。"},{"id":"2","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），机械施工土方定额是按照（  ）类土质编制的，如实际土壤类别不同时，定额中的机械台班量按土质类别系数调整。","answer":"B","difficulty":"易","options":{"A":"Ⅱ、Ⅲ","B":"Ⅰ、Ⅱ","C":"Ⅲ、Ⅳ","D":"Ⅰ","E":""},"explanation":"预算定额中，机械施工土方定额是按照Ⅰ、Ⅱ类土质编制的，如实际土壤类别不同时，定额中的机械台班量按土质类别系数调整。"},{"id":"3","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），关于基坑、沟槽划分描述正确的有（ ）。","answer":"A","difficulty":"中","options":{"A":"底宽（设计图示垫层或基础的底宽，下同）≤7m且底长＞3倍底宽为沟槽","B":"底长≤3倍底宽，且底面积≤100m2为基坑","C":"底宽≤7m且底长＞3倍底宽为沟槽","D":"底长≤3倍底宽，且底面积≤150m2为基坑","E":""},"explanation":"沟槽、基坑、一般土石方的划分：底宽（设计图示垫层或基础的底宽，下同）≤7m且底长＞3倍底宽为沟槽；底长≤3倍底宽，且底面积≤150㎡为基坑；超出上述范围又非平整场地的，为一般土石方。"},{"id":"4","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），平整场地指建筑场地的就地挖、填及找平，厚度在（ ）。","answer":"C","difficulty":"中","options":{"A":"300mm以内","B":"300mm以上","C":"±300mm以内","D":"±300mm以上","E":""},"explanation":"平整场地工程量计算：建设场地挖、填土方厚度在±300mm以内时，按照平整场地计算工程量；挖填土方厚度超过300mm时，按照场地竖向布置挖填方计算工程量。"},{"id":"5","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），建筑物各类门、窗制作、安装的工程量均按（ ）计算。","answer":"B","difficulty":"中","options":{"A":"框外面积","B":"洞口面积","C":"扇外面积","D":"洞口面积除以1.03","E":""},"explanation":"各类门窗制作、安装按照设计图示门窗洞口面积计算工程量。"},{"id":"6","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），地面与地下设施定额中，包括建筑物、构筑物外墙外（ ）m以内沟道与隧道的费用。","answer":"C","difficulty":"易","options":{"A":"0.5","B":"0.8","C":"1","D":"1.5","E":""},"explanation":"地面与地下设施定额中，包括建筑物、构筑物外墙外1m以内沟道与隧道的费用。"},{"id":"7","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），标准砖的规格为（ ）。","answer":"A","difficulty":"易","options":{"A":"240mm×115mm×53mm","B":"240mm×115mm×90mm","C":"240mm×115mm×180mm","D":"240mm×240mm×90mm","E":""},"explanation":"标准砖的规格为240mm×115mm×53mm。"},{"id":"8","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），当基础与墙采用同一种材料时，基础与墙以（ ）分界。","answer":"D","difficulty":"易","options": 负责人","D":"项目法人","E":""},"explanation":"在实际工程中，项目是否需要进行后评价，由项目法人决定。"},{"id":"44","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，工程建设检测费中不包含（  ）费用。","answer":"C","difficulty":"难","options":{"A":"电力工程质量检测费","B":"特种设备安全监测费","C":"工程质量监督费用","D":"桩基检测费","E":""},"explanation":"工程建设检测费用中的工程质量监督费用由政府在财政预算中列支，而将电力工程质量检测费、特种设备安全监测费、环境监测及环境保护验收费、水土保持监测及验收费、桩基检测费列在本项费用中。"},{"id":"45","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，铺底流动资金应按照生产流动资金的（ ）计算。","answer":"C","difficulty":"易","options":{"A":"0.2","B":"0.25","C":"0.3","D":"0.35","E":""},"explanation":"铺底流动资金应按照生产流动资金的30%计算。"},{"id":"46","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），投标方安全防护、文明施工措施的报价,不得低于依据工程所在地工程造价管理机构测定费率计算所需费用总额的（  ）%。","answer":"C","difficulty":"难","options":{"A":"70","B":"80","C":"90","D":"100","E":""},"explanation":"投标方安全防护、文明施工措施的报价,不得低于依据工程所在地工程造价管理机构测定费率计算所需费用总额的90%。"},{"id":"47","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），合同中未作约定或约定不明的，合同工期在一年以内的，建设单位预付安全防护、文明施工揩施项目费用不得低于该费用总额的（  ）%。","answer":"B","difficulty":"易","options":{"A":"30","B":"50","C":"60","D":"80","E":""},"explanation":"合同中未作约定或约定不明的，合同工期在一年以内的，建设单位预付安全防护、文明施工揩施项目费用不得低于该费用总额的50%； 合同工期在一年以上的(含一年), 预付安全防护、文明施I措施费用不得低于该费用总额的30%，其余费用应当按照施工进度支付。"},{"id":"48","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），合同中未作约定或约定不明的，合同工期在一年以上的(含一年)，预付安全防护、文明施I措施费用不得低于该费用总额的（  ）%。","answer":"A","difficulty":"易","options":{"A":"30","B":"50","C":"60","D":"80","E":""},"explanation":"合同中未作约定或约定不明的，合同工期在一年以内的，建设单位预付安全防护、文明施工揩施项目费用不得低于该费用总额的50%； 合同工期在一年以上的(含一年), 预付安全防护、文明施I措施费用不得低于该费用总额的30%，其余费用应当按照施工进度支付。"},{"id":"49","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），当建设项目的初步设计概算由（  ）个单位编制时,主体编制单位应负责协调编制范围、价格水平，并负责编制汇总概算书。各编制单位应及时协调，避免漏项和重复编制。","answer":"A","difficulty":"易","options":{"A":"两个或两个以上","B":"三个或三个以上","C":"四个或四个以上","D":"四个或四个以上","E":""},"explanation":"当建设项目的初步设计概算由两个或两个以上单位编制时,主体编制单位应负责协调编制范围、价格水平，并负责编制汇总概算书。各编制单位应及时协调，避免漏项和重复编制。"},{"id":"50","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），火力发电工程初步设计概算编制说明中，造价水平包括（  ）内容。","answer":"A","difficulty":"易","options":{"A":"价格水平","B":"静态投资","C":"动态投资","D":"单位投资","E":""},"explanation":"造价水平:包括价格水平、静态投资及单位投资，动态投资及单位投资。"},{"id":"51","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），编制初步设计概算时，工程量应根据定额规定计算，不得将（  ）统计在建筑、安装工程量内。","answer":"C","difficulty":"中","options":{"A":"运输时材料损耗量","B":"场内运输材料损耗量","C":"材料损耗","D":"价格偏差值","E":""},"explanation":"编制初步设计概算时，工程量应根据定额规定计算，不得将材料损耗统计在建筑、安装工程量内。"},{"id":"52","question":"根据《火电工程限额设计参考造价指标》，是行业常用的造价参考指标。其编制单位是(   )。","answer":"B","difficulty":"易","options":{"A":"国家能源局","B":"电力规划设计总院","C":"水利水电规划设计总院","D":"电力工程造价与定额管理总站","E":""},"explanation":"《火电工程限额设计参考造价指标》是由国家能源局委托，电力规划设计总院组织编制。"},{"id":"53","question":"根据《火电工程限额设计参考造价指标》，以下（    ）不是《火电工程限额设计参考造价指标》的主要作用。","answer":"B","difficulty":"易","options":{"A":"作为设计部门编制可行性研究报告投资估算、初步设计概算及进行对比分析的参考","B":"作为电网公司审批接入系统的依据","C":"作为各发电公司编制宏观规划的参考资料","D":"作为政府主管部门核准项目投资的参考","E":""},"explanation":"《火电工程限额设计参考造价指标》的主要作用有：①作为动态管理的依据；②作为设计部门编制可行性研究报告投资估算、初步设计概算及进行对比分析的参考；③作为政府主管部门核准项目投资的参考；④作为各发电公司编制宏观规划的参考资料；⑤作为项目法人控制工程投资的参考。"},{"id":"54","question":"根据《火电工程限额设计参考造价指标》，建筑、安装工程主要材料价格采用（  ）地区价格水平。","answer":"B","difficulty":"易","options":{"A":"上海","B":"北京","C":"广州","D":"全国平均","E":""},"explanation":"《火电工程限额设计参考造价指标》的主要设备以中国电能成套设备有限公司提供的资料为基础，综合考虑各发电集团意见，同时参照实际工程招标情况做了部分修正；建筑、安装工程主要材料采用北京地区价格水平。"},{"id":"55","question":"根据《火电工程限额设计参考造价指标》，主要采用的是（  ）定额测算的","answer":"B","difficulty":"易","options":{"A":"电力建设工程预算定额","B":"电力建设工程概算定额","C":"全国统一安装工程预算定额","D":"项目所在地定额","E":""},"explanation":"《火电工程限额设计参考造价指标》主要采用国家能源局发布的《电力建设工程概算定额》测算。"},{"id":"56","question":"根据《火电工程限额设计参考造价指标》，下列描述价格水平较合理的是（   ）。","answer":"B","difficulty":"易","options":{"A":"价格水平贴近市场，采用中等偏高价格","B":"价格水平贴近市场，采用中等偏低价格","C":"价格水平贴近市场，采用能覆盖大部分工程价格","D":"价格水平贴近市场，采用平均最低中标价格","E":""},"explanation":"费用变化说明中，取价原则变化，价格水平贴近市场，采用中等偏低价格。"},{"id":"57","question":"根据《火电工程限额设计参考造价指标》，高压管道工程量计算边界条件是（   ）。","answer":"A","difficulty":"易","options":{"A":"锅炉 K1 柱外 1m","B":"锅炉 K1 柱外 2m","C":"锅炉 K1 柱外 3m","D":"锅炉 K1 柱外 0m","E":""},"explanation":"高压管道计量以锅炉K1柱外1m为界。"},{"id":"58","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，不同设计阶段基本预备费费率不同，可研、初设、施工图预算三阶段的基本预备费费率分别为（  ）","answer":"D","difficulty":"易","options":{"A":"3%、2%、1.5%","B":"4%、2%、1.5%","C":"5%、3%、2%","D":"5%、3%、1.5%","E":""},"explanation":"可研、初设、施工图预算三阶段的基本预备费费率分别为5%、3%、1.5%。"},{"id":"59","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），场地平整是指超出（  ）以上土方的平整，包括平衡土方的挖、运、填、碾压与夯实。","answer":"C","difficulty":"中","options":{"A":"±15cm","B":"±20cm","C":"±30cm","D":"±50cm","E":""},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），场地平整是指超出±30cm以上土方的平整，包括平衡土方的挖、运、填、碾压与夯实。"},{"id":"60","question":"根据《电力建设工程概算定额—建筑工程》（2018年版）规定，土石方体积按（   ）计算。","answer":"A","difficulty":"易","options":{"A":"天然密实体积","B":"虚方体积","C":"松散体积","D":"夯实体积","E":""},"explanation":"土石方体积按照挖掘前天然密实方计算，松散系数与压实系数影响的土石方量已在定额中考虑。"},{"id":"61","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），建筑物、构筑物基础土石方按照挖方体积计算工程量，不计算行驶坡道土石方开挖量。当土方挖深小于（   ）m是，不计算放坡挖方量。","answer":"B","difficulty":"中","options":{"A":"1","B":"1.2","C":"1.5","D":"2","E":""},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），建筑物、构筑物基础土石方按照挖方体积计算工程量，不计算行驶坡道土石方开挖量。当土方挖深小于1.2m是，不计算放坡挖方量。"},{"id":"62","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），厂（站）区场地平整标高在±300mm以内时，场地平整工程量计算正确的是（   ）。","answer":"C","difficulty":"中","options":{"A":"厂（站）区占地面积（㎡）×0.1m","B":"厂（站）区占地面积（㎡）×0.15m","C":"（厂（站）区占地面积-建筑物、构筑物面积）（㎡）×0.1m","D":"（厂（站）区占地面积-建筑物、构筑物面积）（㎡）×0.15m","E":""},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），厂（站）区场地平整标高在±300mm以内时，按照厂（站）区占地面积减去建筑物与构筑物（不含散水、台阶、坡道）占地面积乘以0.1m厚度计算场地平整工程量，执行机械施工土方场地平整定额。"},{"id":"63","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），建筑物、构筑物外墙外（   ）m以内沟管道的土石方开挖不计算工程量。","answer":"C","difficulty":"易","options":{"A":"0.5","B":"0.75","C":"1","D":"1.5","E":""},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），建筑物、构筑物外墙外1m以内沟管道的土石方开挖不计算工程量。"},{"id":"64","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），砌筑石或砖基础按照基础体积计算工程量，基础与墙分界是（   ）。","answer":"A","difficulty":"中","options":{"A":"室内地坪标高","B":"室外地坪标高","C":"材料分界线","D":"据材料分界线与室内地坪的位置而定","E":""},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），砌筑石或砖基础按照基础体积计算工程量，基础与抢、基础与柱均以室内地坪标高分界（不分材料是否相同）。"},{"id":"65","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），灌注桩按照灌注桩体积计算工程量，关于灌注桩工程量计算错误的是（   ）。","answer":"B","difficulty":"难","options":{"A":"桩体积=灌注桩设计桩截面面积×桩长","B":"桩长为设计长度，不含桩尖长度","C":"灌注桩截面面积不计算护壁面积","D":"充盈量及超高灌注量综合在定额中，不单独计算","E":""},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），灌注桩按照灌注桩体积计算工程量，桩体积=灌注桩设计桩截面面积×桩长，桩长为设计长度，计算桩尖长度。灌注桩截面面积不计算护壁面积；充盈量及超高灌注量综合在定额中，不单独计算。"},{"id":"66","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），锅炉平台按照锅炉运转层平台轴线面积计算工程量，其中算法错误的有（   ）。","answer":"A","difficulty":"易","options":{"A":"扣除楼梯所占面积","B":"不扣除支墩所占面积","C":"不扣除设备及其基础所占面积","D":"不扣除伸缩缝所占面积","E":""},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），锅炉平台按照锅炉运转层平台轴线面积计算工程量。不扣除楼梯、洞口、支墩、设备及设备基础、伸缩缝等所占面积。"},{"id":"67","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，以下不属于电力建设工程招标工程量清单文件其他项目清单的是（   ）。","answer":"D","difficulty":"易","options":{"A":"暂列金额","B":"暂估价","C":"计日工","D":"安全文明施工费","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，其他项目清单由暂列金额、暂估价、计日工、施工总承包服务费以及合同约定的其他项目组成。"},{"id":"68","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，不得作为竞争性费用的是（   )。","answer":"B","difficulty":"易","options":{"A":"人工费","B":"安全文明施工费","C":"材料费","D":"施工机具使用费","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，安全文明施工费、临时设施费必须按国家或省级、行业建设主管部门的规定计算，不得作为竞争性费用。"},{"id":"69","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当发包人要求检测承包人已具有合格证明的材料，经检测证明该材料符合合同约定的质量要求，由此增加的费用或工期延误由（   ）承担。","answer":"A","difficulty":"易","options":{"A":"发包人","B":"承包人","C":"发包人与承包人共同承担","D":"监理人","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，若承包人提供的材料和设备检测不符合合同约定的质量要求，发包人应立即要求承包人更换，由此增加的费用和(或)工期延误应由承包人承担。当发包人要求检测承包人已具有合格证明的材料、设备，但经检测证明该材料、设备符合合同约定的质量要求时，发包人应承担由此增加的费用和(或)工期延误。"},{"id":"70","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，采用总价合同的工程，其工程量的准确性和完整性由（   ）负责。","answer":"B","difficulty":"易","options":{"A":"招标人","B":"投标人","C":"招标人人与投标人共同负责","D":"设计人","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，采用单价合同的工程，其工程量清单的准确性和完整性由招标人负责；采用总价合同的工程，其工程量的准确性和完整性由投标人负责。"},{"id":"71","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，采用单价合同的工程，关于对招标文件和招标工程量清单的疑问或异议的说法正确的是（    ）。","answer":"B","difficulty":"易","options":{"A":"投标人对招标文件或招标工程量清单的疑问或意义未提请招标人澄清或修正的，由此增加的费用或延误的工期由招标人承担","B":"投标人对招标文件或招标工程量清单的疑问或意义未提请招标人澄清或修正的，由此增加的费用或延误的工期由承包人承担","C":"投标人对招标文件或招标工程量清单的疑问或意义未提请招标人澄清或修正的，由此增加的费用或延误的工期由发包人与承包人共同承担","D":"招标人未对投标人提出的疑问或异议进行澄清或修正的，施工过程中确实发生的，由此增加的费用由承包人承担","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，采用单价合同的工程，如投标人对招标文件和招标工程量清单的疑问或异议未提请招标人澄清或修正的，应自行承担由此增加的费用和(或)延误的工期；如招标人未对投标人提出的疑问或异议进行澄清或修正的，但施工过程确实发生的，招标人应承担由此导致投标人增加的费用和(或)延误的工期。"},{"id":"72","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，投标人在编制投标报价文件时，关于暂估价的计列正确的是（   ）。","answer":"C","difficulty":"易","options":{"A":"材料暂估价由投标人根据市场情况自行报价","B":"材料暂估价不必计入全费用综合单价","C":"专业工程暂估价应按招标工程量清单中列出的金额填写","D":"专业工程暂估价不计入投标总价","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，材料暂估价按招标工程量清单中列出的单价计入全费用综合单价；专业工程暂估价应按招标工程量清单中列出的金额填写。"},{"id":"73","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于总价合同工程的计量说法正确的是（  ）。","answer":"B","difficulty":"易","options":{"A":"工程量清单缺项引起工程量增减的，工程量予以调整","B":"工程量偏差引起工程量增减的，工程量不作调整","C":"工程变更引起工程量增减的，工程量不作调整","D":"总价合同各项目的工程量是承包人实际完成的工程量","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，总价合同工程的工程量应按以下规定计量:1.除按合同约定应予计量的工程变更以外，总价合同各项目的工程量应为承包人用于结算的最终工程量。由于工程量清单缺项、工程量偏差引起工程量增减的，工程量不作调整。2工程变更引起工程量增减的，应按承包人完成变更工程应予计量的工程量确定。"},{"id":"74","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，出现合同价格调整事项（不含工程量偏差、计日工、现场签证、索赔）后的（   ）天内，承包人应向发包人提交合同价格调增报告并附上相关资料；承包人为在规定时间内提交合同价款调增报告的，应视为承包人对该事项不存在调整价格请求。","answer":"C","difficulty":"易","options":{"A":"7","B":"10","C":"14","D":"28","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，出现合同价格调整事项（不含工程量偏差、计日工、现场签证、索赔）后的14天内，承包人应向发包人提交合同价格调增报告并附上相关资料；承包人为在14天内提交合同价款调增报告的，应视为承包人对该事项不存在调整价格请求。"},{"id":"75","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，招标工程一般以投标截止日前(   )天作为基准日期。","answer":"D","difficulty":"易","options":{"A":"合同签订前28天","B":"投标截止日后28天","C":"合同签订后28天","D":"投标截止日前28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，招标工程以投标截止日前 28 天、非招标工程以合同签订前 28 天为基准日，其后因法律法规与政策发生变化引起工程造价增减变化的，发承包双方应按照省级或行业建设主管部门或其授权的工程造价管理机构据此发布的规定调整合同价格。"},{"id":"76","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，人工费中未包括的内容是（   ）。","answer":"D","difficulty":"易","options":{"A":"辅助性工资","B":"劳动保护费","C":"职工福利费","D":"住房公积金","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，人工费是指支付给直接从事建筑安装工程施工作业的生产人员的各项费用。包括基本工资、工资性补贴、辅助工资、职工福利费、上产人员劳动保护费。"},{"id":"77","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，基本预备费的取费基数为（   ）。","answer":"C","difficulty":"易","options":{"A":"直接费+间接费+利润+税金","B":"建筑工程费+安装工程费","C":"建筑工程费+安装工程费+设备购置费+其他费用","D":"建筑工程费+安装工程费+设备购置费","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，基本预备费=（建筑工程费+安装工程费+设备购置费+其他费用）×费率。"},{"id":"78","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，现场施工人员调动工作、探亲、休假期间的工资包括在（   ）中。","answer":"B","difficulty":"易","options":{"A":"基本工资","B":"辅助工资","C":"企业管理费","D":"项目建设管理费","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，辅助工资是指生产人员年有效施工天数以外非作业天数的工资。包括职工学习、培训期间的工资，调动工作、探亲、休假期间的工作，因气候影响的停工工资，病假在六个月以内的工资，以及婚、丧假期间的工资。"},{"id":"79","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，编制施工图预算时，工程量的计算以（   ）为依据。","answer":"D","difficulty":"易","options":{"A":"初步设计图纸","B":"同类型工程施工图预算工程量","C":"专业设计人员的咨询提资数据","D":"施工图纸","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，施工图预算的编制工程量计算规则应以定额规定的工程量计算规则为准，以施工图纸为依据计算。"},{"id":"80","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，在办理土地征用时发生的勘测定界费应计入（   ） 。","answer":"C","difficulty":"易","options":{"A":"勘察费","B":"工程建设检测费","C":"土地征用费","D":"项目建设管理费","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，土地征用费是指按照《中华人民共和国土地管理法》及相关规定，建设项目法人单位为取得工程建设用地使用权而支付的费用。包括土地补偿费、安置补助费、耕地开垦费、勘测定界费、征地管理费、证书费、手续费以及各种基金和税金等。"},{"id":"81","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，项目法人单位负责招标订购的设备在到场之前所发生的催交催运费用应计入（   ）。","answer":"A","difficulty":"易","options":{"A":"项目法人管理费","B":"企业管理费","C":"设备材料监造费","D":"设备购置费","E":""},"explanation":"项目法人管理费是指项目法人在项目管理工作中发生的机构开办费及日常管理性费用，其中项目管理工作经费包括工作人员的基本工资、工资性补贴、辅助工资、职工福利费、劳动保护费、社会保险费、住房公积金，采暖及防暑降温费，日常办公费用，差旅交通费，技术图书资料费，教育及工会经费；固定资产使用费、工具用具使用费，水电费；工程档案管理费;合同订立与公证费、法律顾问费咨询费，工程信息化管理费，工程审计费；工程会议费，业务接待费;消防治安费，设备材料的催交、验货费，印花税、房产税、车船税费、车辆保险费：建设项目劳动安全验收评价费，工程竣工交付使用的清理费及验收费等。"},{"id":"82","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，关于建设预算项目划分，以下说法不正确的是（   ）。","answer":"A","difficulty":"易","options":{"A":"单位工程是能够独立组织施工，建成后能独立发挥生产能力或效益的工程","B":"分部工程是根据工程部位和专业性质的不同，将单位工程分解形成的工程项目单元","C":"单项工程是具有独立的设计文件，建成后能够独立发挥生产能力或效益的工程项目","D":"单位工程是能够独立组织施工，但不能独立发挥生产能力或效益的工程","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，单项工程是具有毒力的设计文件，建成后能独立发挥生产能力或小姨的工程项目。单位工程是具有独立设计文件，能够独立组织施工，但不能独立发挥生产能力或效益的工程项目，是单项工程的组成部分。分布工程师根据工程部位和专业性质等的不同，将单位工程分解形成的工程项目单元，是单位工程的组成部分。"},{"id":"83","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，可研估算文件编制过程中不属于项目法人提供的资料是（   ）。","answer":"D","difficulty":"易","options":{"A":"各投资方出资比例","B":"建设场地征地费","C":"业主外委设计项目的投资估算文件","D":"材料价格","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，可研估算文件编制过程中，项目法人应提供以下资料:  (1)项目开办及经营方式，各投资方出资比例，币种、分利方式及分利水平;融资方式、融资币种、融资利率、融资费用、还款方式、还款年限及宽限期等。\n(2) 建设场地的费用规定及依据文件。\n(3)外委设计项目的投资估、概算文件资料(如铁路、公路码头、航道等)。\n(4)估算编制中需提供的其他有关资料。"},{"id":"84","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用不属于项目建设管理费的有（   ）。","answer":"D","difficulty":"易","options":{"A":"工程保险费","B":"设备材料监造费","C":"项目法人管理费","D":"环境影响评价费","E":""},"explanation":"项目建设管理费是指建设项目经政府行政主管部门核准后自核准至本期工程全部机组商业运行的合理建设期内对工程进行组织、管理、协调、监督等工作所发生的费用。包括项目法人管理费、招标费、工程监理费、设备材料监造费、施工过程造价咨询及竣工结算审核费、工程保险费。"},{"id":"85","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下项目应计入安装工程费用的有（   ）。","answer":"A","difficulty":"易","options":{"A":"道路、屋外区域的照明","B":"建筑物的空调","C":"消防设施","D":"屋外配电装置的金属构架","E":""},"explanation":"建筑物的给排水、采暖、通风、空调、照明设置；消防设施以及屋外配电装置的金属构架、支架、避雷针塔、栏栅均应列入建筑工程费中；设备本体照明、道路、屋外（如变压器区、配电装置区、管道区、储煤场、油罐区等）的照明列入安装工程费。"},{"id":"86","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，不属于建筑工程费税金取费基数的是（   ）。","answer":"B","difficulty":"易","options":{"A":"直接费","B":"价差预备费","C":"间接费","D":"编制基准期价差","E":""},"explanation":"税金的计算公式为：税金=（直接费+间接费+利润+编制基准期价差）×税率，其取费基数不含价差预备费。"},{"id":"87","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，不属于规费内容的是（   ）。","answer":"C","difficulty":"易","options":{"A":"失业保险","B":"工伤保险","C":"休假期间工资","D":"住房公积金","E":""},"explanation":"规费是指按照国家行政主管部门或省级政府和省级有关权力部门规定必须缴纳并计入建筑安装工程造价的费用，包括社会保险费和住房公积金。社会保险费包括养老保险费、失业保险费、医疗保险费、生育保险费和工伤保险费。"},{"id":"88","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，灰场属于（   ）。","answer":"A","difficulty":"易","options":{"A":"单项工程","B":"单位工程","C":"分部工程","D":"分项工程","E":""},"explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，单项工程是具有毒力的设计文件，建成后能独立发挥生产能力或小姨的工程项目。灰场是与厂址有关的单项工程。"},{"id":"89","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，以下设备不属于特种设备安全监测费监测范围的设备是（   ）。","answer":"D","difficulty":"易","options":{"A":"电梯","B":"消防设备","C":"压力容器","D":"静电除尘器","E":""},"explanation":"特种设备安全监测费是指根据国务院《特种设备安全监察条例》规定，委托特种设备检验检测机构对工程所安装的特种设备(包括消防、电梯、锅炉、压力容器等) 进行检验、检测所发生的费用。"},{"id":"90","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，为推进电价市场化改革，国家在经营期电价的基础上，对新建发电项目实行按区域或省平均成本统一制定价的电价为（   ）。","answer":"B","difficulty":"易","options":{"A":"上网电价","B":"标杆电价","C":"调试电价","D":"居民电价","E":""},"explanation":"标杆电价是指为推进电价市场化改革，国家在经营期电价的基础上，对新建发电项目实行按区域或省平均成本统一定价的电价政策。"},{"id":"91","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用不属于建筑工程的是（  ）。","answer":"C","difficulty":"易","options":{"A":"冷却塔内部的淋水装置","B":"建筑物的防腐设施","C":"燃气-蒸汽联合循环电厂余热锅炉炉顶布置的余热锅炉烟囱及旁路烟道","D":"燃气-蒸汽联合循环电厂独立布置的余热锅炉烟囱","E":""},"explanation":"建（构）筑物的防腐设施，冷却塔内部的配水管、托架、淋水装置、除水装置及及结构；燃气-蒸汽联合循环电厂独立布置的余热锅炉烟囱均属于建筑工程；燃气-蒸汽联合循环电厂余热锅炉炉顶布置的余热锅炉烟囱及旁路烟道属于安装工程。"},{"id":"92","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列（   ）不是电力建设工程发承包及实施阶段计价活动应遵循的原则。","answer":"B","difficulty":"易","options":{"A":"客观","B":"公开","C":"公正","D":"公平","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，电力建设工程发承包及实施阶段计价活动应遵循客观、公正、公平的原则。"},{"id":"93","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程量偏差是指承包人按照合同工程的图纸实施，按照现行电力行业计算规范规定的工程量计算规则计算得到的完成合同工程项目应予计量的工程量与相应的（  ）列出的工程量之间的量差。","answer":"A","difficulty":"易","options":{"A":"招标工程量清单项目","B":"分部分项工程量清单项目","C":"措施项目清单项目","D":"其他项目清单项目","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，工程量偏差是指承包人按照合同工程的图纸实施，按照现行电力行业计算规范规定的工程量计算规则计算得到的完成合同工程项目应予计量的工程量与相应的招标工程量清单项目列出的工程量之间的量差。"},{"id":"94","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，基准价是投标时（   ）所在地建设工程造价管理部门发布的，且发包人确认的当期信息价。","answer":"A","difficulty":"易","options":{"A":"工程项目","B":"承包人公司","C":"发包人公司","D":"项目开标","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，基准价是投标时由电力行业定额（造价）管理机构或工程项目所在地建设工程造价管理部门发布的，且发包人确认的当期信息价。"},{"id":"95","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，承包人应按合同约定将采购材料和设备相关信息提交发包人确认，但以下（   ）信息除外。","answer":"D","difficulty":"易","options":{"A":"品种规格","B":"数量","C":"供货时间","D":"运输方式","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，承包人应按合同约定将采购材料和设备的供货人及品种、规格、数量和供货时间等提交发包人确认，负责提供材料和设备的质量证明文件，并应满足合同约定的质量要求。"},{"id":"96","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，招标人（   ）在招标时公布最高投标限价，同时将最高投标限价及有关资料报送有该工程管辖权的电力行业工程造价管理机构备案。","answer":"B","difficulty":"易","options":{"A":"无须","B":"应","C":"宜","D":"可以","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，招标人应在招标时公布最高投标限价的总价以及各单位工程总价。"},{"id":"97","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当最高投标限价复查结论与原公布的最高投标限价误差大于（  ）的，应当责成招标人改正。","answer":"B","difficulty":"易","options":{"A":"±3%","B":"±5%","C":"±10%","D":"±15%","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，当最高投标限价经有关招标监督部门或有该工程管辖权的电力工程造价管理机构复查，其结论与原公布的最高投标限价误差超过士5%时，招标人应当改正。"},{"id":"98","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，投标总价应当与分部分项工程费、措施项目费、其他项目费、（   ）的合计金额一致。","answer":"A","difficulty":"易","options":{"A":"投标人采购设备费","B":"投标人采购材料费","C":"招标人采购设备费","D":"招标人采购材料费","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，投标总价应当与分部分项工程费、措施项目费、其他项目费、投标人采购设备费的合计金额一致。"},{"id":"99","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，建设规模较小，技术难度较低，工期较短，且施工图设计已审查完备的建设工程可以采用（  ）。","answer":"B","difficulty":"易","options":{"A":"单价合同","B":"总价合同","C":"成本加酬金合同","D":"全费用合同","E":""},"explanation":"实行工程量清单计价的工程，应采用单价合同。建设规模较小，技术难度较低，工期较短，且施工图设计已审查批准的建设工程可采用总价合同；紧急抢险、救灾以及施工技术特别复杂的建设工程可采用成本加酬金合同。"},{"id":"100","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在调整工程价款进行工程计算时，（   ）应依据同口径原则，采用对应阶段的现行电力行业工程量清单计算规范。","answer":"C","difficulty":"易","options":{"A":"工程量","B":"计量单位","C":"工程量计算规则","D":"全费用综合单价","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，在进行合同价格调整时，工程量计算规则应依据同口径原则，采用对应阶段的现行电力行业工程量清单计算规范。"},{"id":"101","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，承包人在合同履行期间，出现设计图纸（含设计变更）与招标工程量清单任一（   ）描述不符，且该变化引起该项目的工程造价增减变化的，按照实际施工的项目特征重新确定相应工程量清单项目的全费用综合单价，调整合同价款。","answer":"A","difficulty":"易","options":{"A":"项目特征","B":"计量单位","C":"工程数量","D":"工程内容","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，承包人应按照发包人提供的设计图纸实施合同工程，若在合同履行期间，出现设计图纸（含设计变更）与招标工程量清单任一项目的特征描述不符，且该变化引起该项目的工程造价增减变化的，按照实际施工的项目特征重新确定相应工程量清单项目的全费用综合单价，调整合同价款。"},{"id":"102","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，现场签证工作完成后的（   ）内，承包人应按照现场签证内容计算价款，报送发包人确认后，作为增加合同价款，与工程进度款同期支付。","answer":"B","difficulty":"易","options":{"A":"24h","B":"7天","C":"14天","D":"28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，现场签证工作完成后的7天内，承包人应按照现场签证内容计算价款，报送发包人确认后，作为增加合同价款，与工程进度款同期支付。"},{"id":"103","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人没有按时支付安全文明施工费、临时设施费的，承包人可以催告发包人支付发包人在付款期满后的（   ）内仍未支付的，若发生安全事故的，发包人应承担连带责任。","answer":"B","difficulty":"易","options":{"A":"24h","B":"7天","C":"14天","D":"28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，发包人没有按时支付安全文明施工费、临时设施费的，承包人可以催告发包人支付发包人在付款期满后的7天内仍未支付的，若发生安全事故的，发包人应承担连带责任。"},{"id":"104","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，承包人在收到发包人提出的核实意见后的（   ）内,不确认也未提出异议的,应视为发包人提出的核实意见已被承包人认可，竣工结算办理完毕。","answer":"D","difficulty":"易","options":{"A":"24h","B":"7天","C":"14天","D":"28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，承包人在收到发包人提出的核实意见后的28天内,不确认也未提出异议的,应视为发包人提出的核实意见已被承包人认可，竣工结算办理完毕。"},{"id":"105","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人应在收到最终结清支付申请后的（   ）内予以核实，向承包人签发最终结清支付证书。","answer":"C","difficulty":"易","options":{"A":"24h","B":"7天","C":"14天","D":"28天","E":""},"explanation":"根据《电力建设工程工程量清单计价规范》（2021版）的规定，发包人应在收到承包人提交的最终结清申请单后 14天内完成审批并向承包人签发最终结清支付证书。"},{"id":"106","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），关于人工单价的说法，正确的是（   ）。","answer":"C","difficulty":"易","options":{"A":"普通工34元/工日，建筑技术工48元/工日，安装技术工53元/工日","B":"普通工34元/工日，建筑技术工98元/工日，安装技术工107元/工日","C":"普通工70元/工日，建筑技术工98元/工日，安装技术工107元/工日","D":"普通工70元/工日，建筑技术工55元/工日，安装技术工112元/工日","E":""},"explanation":"《电力建设工程概算定额》（2018年版）中，建筑普通工70元/工日，建筑技术工98元/工日，安装技术工107元/工日"},{"id":"107","question":"根据《电力建设工程概算定额—热力设备安装工程》（2018年版），随锅炉本体扩大供货的烟、风、煤管道的安装应（   ）。","answer":"C","difficulty":"易","options":{"A":"套用相应锅炉出力的炉本体安装子目","B":"套用相应锅炉出力的钢炉架安装子目","C":"套用相应锅炉出力的烟风煤管道安装子目","D":"套用相应烟风煤管道预算定额安装子目","E":""},"explanation":"定额中，锅炉本体、除尘器本体扩大供货的烟、风、煤管道安装属于烟、风、煤管道安装子目。"},{"id":"108","question":"根据《电力建设工程概算定额—热力设备安装工程》（2018年版），关于热力系统汽水管道，下面说法错误的是（   ）。","answer":"B","difficulty":"易","options":{"A":"管道安装定额中包括了热处理及无损检验","B":"管道安装定额中包括了蒸汽管道的蒸汽吹洗及四大管道水压试验","C":"主蒸汽管及旁路蒸汽管安装定额中还包括了其疏水和放气管道的安装","D":"管道的煨弯加工费及煨弯的热处理费用包含在装置性材料费中","E":""},"explanation":"《电力建设工程概算定额》（2018年版）中，管道、管件、阀门、支吊架、阀门传动装置等的安装。热处理及无损检验，并包括管道的冲洗。"},{"id":"109","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，关于变压器安装下列说法错误的是（   ）。","answer":"D","difficulty":"易","options":{"A":"变压器安装包括了安装后整体密封试验，接地，补漆及单体调试","B":"按变压器容量套用相应定额，三相变压器安装以“台”为计量单位，三相为一台","C":"单相变压器、消弧线圈安装以“台/单相”为计量单位，单相为一台","D":"定额安装中包括了绝缘油样的取样和试验","E":""},"explanation":"《电力建设工程概算定额》（2018年版）中，变压器安装包括本体安装，端子箱安装、控制箱安装、设备本体电缆安装，引下线安装，铁构件制作安装，有过滤，接地，单体调试。定额中未考虑绝缘油样的取样和试验，发生时执行《电力建设工程概算定额（2018年版）第六册 调试工程》相应定额子目。"},{"id":"110","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），地面与地下设施工程中，复杂地面是指（   ）的建筑物、构筑物地面。","answer":"B","difficulty":"易","options":{"A":"无设备基础或生产性沟道","B":"含设备基础或生产性沟道","C":"地下设施为特殊防腐处理","D":"地面做特殊防水处理","E":""},"explanation":"根据《电力建设工程概算定额》（2018年版）规定，复杂地面是指含设备基础或生产性沟道的建筑物、构筑物地面。"},{"id":"111","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），楼面与屋面工程中的楼板面积按照楼板铺设部位的（   ）计算，不扣除楼梯间、洞口、支墩、设备基础、伸缩缝等所占的面积。","answer":"C","difficulty":"易","options":{"A":"建筑外边线尺寸","B":"实际铺设面积","C":"建筑轴线尺寸","D":"建筑轴线尺寸面积扩大3%","E":""},"explanation":"根据《电力建设工程概算定额 第三册电气设备安装工程》（2018年版）规定，楼面与屋面工程中的楼板面积按照楼板铺设部位的建筑轴线尺寸计算，不扣除楼梯间、洞口、支墩、设备基础、伸缩缝等所占的面积。"},{"id":"112","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），输煤地道应计算底板、侧壁、顶板混凝土体积，地面及皮带支架基础及垫层不计算体积。地道的断面面积按照垂直于地道斜长断面计算，地道的长度按照地道（   ）计算。","answer":"C","difficulty":"易","options":{"A":"垂直投影长度","B":"轴线长度","C":"斜长","D":"轴线净长度","E":""},"explanation":"根据《电力建设工程概算定额—建筑工程》（2018年版），输煤地道应计算底板、侧壁、顶板混凝土体积，地面及皮带支架基础及垫层不计算体积。地道的断面面积按照垂直于地道斜长断面计算，地道的长度按照地道斜长计算。"},{"id":"113","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），厂区性建筑工程支架定额适用于（   ）。","answer":"D","difficulty":"易","options":{"A":"变配电构支架","B":"烟道支架","C":"输煤栈桥支架","D":"建筑室外管道、电缆等单层或多层支架","E":""},"explanation":"根据《电力建设工程概算定额》（2018年版）中，支架定额子目适用于全厂（站）建筑室外及厂（站）区外管道、电缆等单层或多层支架，不适用于烟道支架、输煤栈桥支架、9m高以上厂（站）区支架及变配电构支架。"},{"id":"114","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于工程量清单中分部分项工程量清单的编制，下列说法中错误的是（   ）。","answer":"A","difficulty":"易","options":{"A":"招标人只负责项目编码、项目名称、计量单位和工程量四项内容的填写","B":"同一招标工程的项目编码不得有重码","C":"工程量清单项目及计算规则分初步设计和施工图两个阶段，作为不同阶段发承包的编制依据","D":"当清单计算规范附录中有两个计量单位时，应根据实际情况选择其中一个","E":""},"explanation":"根据《电力建设工程工程量清单计算规范》（2021版） 规定，分部分项工程量清单应根据附录规定的项目编码、项目名称、项目特征、计量单位和工程量计算规则进行编制。"},{"id":"115","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于招标工程量清单中分部分项工程量清单的编制，下面不属于招标工程量清单编制依据的是（   ）。","answer":"C","difficulty":"易","options":{"A":"国家标准","B":"行业标准","C":"可行性研究报告","D":"施工现场实际情况","E":""},"explanation":"根据《电力建设工程工程量清单计算规范》（2021版） 规定，招标工程量清单编制依据主要有：（1）电力建设工程工程量清单计算规范；（2）国家、电力行业建设主管部门颁发的计价依据和办法；(3)电力建设工程设计文件、初步设计图纸等；（4）电力建设工程项目有关的标准、规范、技术资料；（5）拟定的招标文件；（6）施工现场情况、工程特点及常规施工方案；（7）其他相关资料。"},{"id":"116","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列属于招标工程量清单编制依据的是（   ）。","answer":"B","difficulty":"易","options":{"A":"分部分项工程清单","B":"拟定的招标文件","C":"最高投标限价","D":"潜在招标人的潜质和能力","E":""},"explanation":"根据《电力建设工程工程量清单计算规范》（2021版） 规定，招标工程量清单编制依据主要有：（1）电力建设工程工程量清单计算规范；（2）国家、电力行业建设主管部门颁发的计价依据和办法；(3)电力建设工程设计文件、初步设计图纸等；（4）电力建设工程项目有关的标准、规范、技术资料；（5）拟定的招标文件；（6）施工现场情况、工程特点及常规施工方案；（7）其他相关资料。"},{"id":"117","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，造价管理主要目标（）。","answer":"B","difficulty":"易","options":{"A":"控制在项目核准阶段批准的可研估算内，行业对标领先，不发生投资损失和浪费。","B":"控制在项目投资决策阶段批准的概算投资以内，行业对标领先，不发生投资损失和浪费。","C":"控制在项目初步设计阶段批准的初设概算内，行业对标领先，不发生投资损失和浪费。","D":"控制在项目管理概算阶段批准的管理概算内，行业对标领先，不发生投资损失和浪费。","E":""},"explanation":"第四条造价管理主要目标。控制在项目投资决策阶段批准的概算投资以内（以下简称批准投资），行业对标领先，不发生投资损失和浪费。"},{"id":"118","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，二级单位、项目单位的责任分别是（）。","answer":"A","difficulty":"易","options":{"A":"管理的责任主体、执行的责任主体","B":"职能管理单位、实施的责任主体","C":"监督的责任主体、执行的责任主体","D":"监督的责任主体、管理的责任主体","E":""},"explanation":"第十条二级单位是火电工程造价管理的责任主体…...第十一条项目单位是火电工程造价执行的责任主体"},{"id":"119","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，管理概算需在设计概算基础上，综合考虑市场行情、企业标准和管理成果，遵循客观合理、先进适度的原则\n编制。管理概算应控制在（）之内。","answer":"A","difficulty":"易","options":{"A":"设计概算","B":"可研估算","C":"概算投资","D":"资金预算","E":""},"explanation":"第十四条管理概算需在设计概算基础上，综合考虑市场行情、企业标准和管理成果，遵循客观合理、先进适度的原则编制。管理概算应控制在设计概算之内。"},{"id":"120","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，二级单位应在审批（）前报技经中心复核，根据复核意见修改完善后办理批复，报集团公司备案。","answer":"B","difficulty":"易","options":{"A":"设计概算","B":"管理概算","C":"概算投资","D":"资金预算","E":""},"explanation":"第十五条二级单位应在审批管理概算前报技经中心复核，根据复核意见修改完善后办理批复，报集团公司备案。"},{"id":"121","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，项目单位应建立（），定期分析概算执行情况，并定期以OA 邮件方式报集团公司。","answer":"A","difficulty":"易","options":{"A":"概算执行动态管理台账","B":"资金管理管理台账","C":"概算执行管理台账","D":"项目管理管理台账","E":""},"explanation":"第十六条项目单位应建立概算执行动态管理台账，定期分析概算执行情况，并定期以OA 邮件方式报集团公司。"},{"id":"122","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，项目单位应依据审定的初步设计确定采购范围、数量和标准。设备材料标应根据（）、经审定的招标技术规范书合理确定对应概算，报二级单位审核后履行采购程序，对应概算超出设计概算的应理由充足并提供单项说明；工程标应编制工程量清单，核定标段对应概算，经二级单位初审后，报集团公司审核。","answer":"A","difficulty":"易","options":{"A":"设计概算","B":"管理概算","C":"可研估算","D":"设计预算","E":""},"explanation":"第十七条项目单位应依据审定的初步设计确定采购范围、数量和标准。设备材料标应根据设计概算、经审定的招标技术规范书合理确定对应概算，报二级单位审核后履行采购程序，对应概算超出设计概算的应理由充足并提供单项说明；工程标应编制工程量清单，核定标段对应概算，经二级单位初审后，报集团公司审核。"},{"id":"123","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，项目单位应依据审定的初步设计确定采购范围、数量和标准。设备材料标应根据设计概算、经审定的招标技术规范书合理确定对应概算，报二级单位审核后履行采购程序，对应概算超出（）的应理由充足并提供单项说明；工程标应编制工程量清单，核定标段对应概算，经二级单位初审后，报集团公司审核。","answer":"D","difficulty":"易","options":{"A":"设计预算","B":"管理概算","C":"可研估算","D":"设计概算","E":""},"explanation":"第十七条项目单位应依据审定的初步设计确定采购范围、数量和标准。设备材料标应根据设计概算、经审定的招标技术规范书合理确定对应概算，报二级单位审核后履行采购程序，对应概算超出设计概算的应理由充足并提供单项说明；工程标应编制工程量清单，核定标段对应概算，经二级单位初审后，报集团公司审核。"},{"id":"124","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，项目单位应依据审定的初步设计确定采购范围、数量和标准。设备材料标应根据设计概算、经审定的招标技术规范书合理确定对应概算，报二级单位审核后履行采购程序，对应概算超出设计概算的应理由充足并提供单项说明；工程标应编制工程量清单，核定标段（），经二级单位初审后，报集团公司审核。","answer":"A","difficulty":"易","options":{"A":"对应概算","B":"招标概算","C":"招标预算","D":"对应预算","E":""},"explanation":"第十七条项目单位应依据审定的初步设计确定采购范围、数量和标准。设备材料标应根据设计概算、经审定的招标技术规范书合理确定对应概算，报二级单位审核后履行采购程序，对应概算超出设计概算的应理由充足并提供单项说明；工程标应编制工程量清单，核定标段对应概算，经二级单位初审后，报集团公司审核。"},{"id":"125","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，对于竞争性不充分的标段，应设立（）。","answer":"D","difficulty":"易","options":{"A":"最低投标价","B":"最低投标限价","C":"最高投标价","D":"最高投标限价","E":""},"explanation":"第十八条对于竞争性不充分的标段，应设立最高投标限价。集团公司一级集采项目设置最高投标限价时，项目单位组织编制，二级单位初审并提出推荐意见，报技经中心出具复核意见后，集团公司工程部履行审批程序。"},{"id":"126","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，集团公司一级集采项目设置最高投标限价时，项目单位负责（）。","answer":"A","difficulty":"易","options":{"A":"组织编制","B":"组织审核","C":"出具复核意见","D":"提出推荐意见","E":""},"explanation":"第十八条对于竞争性不充分的标段，应设立最高投标限价。集团公司一级集采项目设置最高投标限价时，项目单位组织编制，二级单位初审并提出推荐意见，报技经中心出具复核意见后，集团公司工程部履行审批程序。"},{"id":"127","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，集团公司一级集采项目设置最高投标限价时，二级单位负责（）。","answer":"B","difficulty":"易","options":{"A":"组织编制及审核","B":"初审并提出推荐意见","C":"出具复核意见","D":"履行审批程序","E":""},"explanation":"第十八条对于竞争性不充分的标段，应设立最高投标限价。集团公司一级集采项目设置最高投标限价时，项目单位组织编制，二级单位初审并提出推荐意见，报技经中心出具复核意见后，集团公司工程部履行审批程序。"},{"id":"128","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，招标文件应按照批准的设计方案和建设标准执行，设备材料招标应按照（）执行。","answer":"B","difficulty":"易","options":{"A":"编制的技术规范书","B":"经审定的技术规范书","C":"技术规范书范本","D":"经审定的设备材料清单","E":""},"explanation":"第二十条招标文件应按照批准的设计方案和建设标准执行，设备材料招标应按照经审定的技术规范书执行。"},{"id":"129","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》， 合同（或预中标）金额原则上应控制在（）以内，如超概，二级单位应组织项目单位对合同（或预中标）价格的合理性及超概原因作出分析说明。","answer":"C","difficulty":"易","options":{"A":"招标概算","B":"对应预算","C":"对应概算","D":"招标预算","E":""},"explanation":"第二十一条合同（或预中标）金额原则上应控制在对应概算以内，如超概，二级单位应组织项目单位对合同（或预中标）价格的合理性及超概原因作出分析说明。"},{"id":"130","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》， 合同价款支付应严格遵守合同支付条件和（），变更合同范围及价款应履行原合同审批程序，重大变更事项报集团公司审批。","answer":"D","difficulty":"易","options":{"A":"实际完成投资","B":"计划完成投资","C":"计划完成进度","D":"实际完成进度","E":""},"explanation":"第二十二条 合同价款支付应严格遵守合同支付条件和实际完成进度，变更合同范围及价款应履行原合同审批程序，重大变更事项报集团公司审批。"},{"id":"131","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，工程结算实行分级审批管理。集团公司技经中心审核重大政策性调整结算原则并出具审核意见，工程部负责审批；二级单位指导、监督火电工程结算工作，负责审批（）的结算；项目单位具体负责工程结算工作。","answer":"A","difficulty":"易","options":{"A":"一级、二级集采合同","B":"一级集采合同","C":"二级集采合同","D":"所有合同","E":""},"explanation":"第二十四条工程结算实行分级审批管理。集团公司技经中心审核重大政策性调整结算原则并出具审核意见，工程部负责审批；二级单位指导、监督火电工程结算工作，负责审批一级、二级集采合同的结算；项目单位具体负责工程结算工作。"},{"id":"132","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》， 工程结算实行分级审批管理。集团公司技经中心审核重大政策性调整结算原则并出具审核意见，工程部负责审批；二级单位指导、监督火电工程结算工作，负责审批一级、二级集采合同的结算；项目单位具体负责工程（）工作。","answer":"B","difficulty":"易","options":{"A":"建设","B":"结算","C":"审核","D":"付款","E":""},"explanation":"第二十四条工程结算实行分级审批管理。集团公司技经中心审核重大政策性调整结算原则并出具审核意见，工程部负责审批；二级单位指导、监督火电工程结算工作，负责审批一级、二级集采合同的结算；项目单位具体负责工程结算工作。"},{"id":"133","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，二级单位和项目单位应积极推行过程结算促进工程建设，为按时完成竣工结算创造条件。项目投产（）个月内应完成竣工结算；尾工项目在验收后（）个月内应完成结算。","answer":"C","difficulty":"易","options":{"A":"3，1","B":"3，3","C":"6，3","D":"6，6","E":""},"explanation":"第二十五条二级单位和项目单位应积极推行过程结算促进工程建设，为按时完成竣工结算创造条件。项目投产6 个月内应完成竣工结算；尾工项目在验收后3 个月内应完成结算。项目单位应每月组织召开结算专题会，建设过程中对有关变更或调整事项应事先确定结算原则，对结算争议问题及时提出处理意见。"},{"id":"134","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，项目单位应（）组织召开结算专题会，建设过程中对有关变更或调整事项应事先确定结算原则，对结算争议问题及时提出处理意见。","answer":"A","difficulty":"易","options":{"A":"每月","B":"每季度","C":"每年度","D":"根据结算进度不定期","E":""},"explanation":"第二十五条二级单位和项目单位应积极推行过程结算促进工程建设，为按时完成竣工结算创造条件。项目投产6 个月内应完成竣工结算；尾工项目在验收后3 个月内应完成结算。项目单位应每月组织召开结算专题会，建设过程中对有关变更或调整事项应事先确定结算原则，对结算争议问题及时提出处理意见。"},{"id":"135","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，（）负责编制竣工结算报告，分析概算执行情况，二级单位审核后报集团公司备案。若竣工结算投资超过集团公司批准的设计概算，竣工结算报告应报集团公司技经中心组织审查并提出审核意见，工程部履行审批程序。","answer":"A","difficulty":"易","options":{"A":"项目单位","B":"造价咨询单位","C":"监理单位","D":"施工单位","E":""},"explanation":"第二十六条项目单位负责编制竣工结算报告，分析概算执行情况，二级单位审核后报集团公司备案。若竣工结算投资超过集团公司批准的设计概算，竣工结算报告应报集团公司技经中心组织审查并提出审核意见，工程部履行审批程序。"},{"id":"136","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，（）作为竣工财务决算和收尾项目投资预算的依据。","answer":"D","difficulty":"易","options":{"A":"验收报告","B":"竣工报告","C":"结算报告","D":"竣工结算报告","E":""},"explanation":"第二十七条竣工结算报告作为竣工财务决算和收尾项目投资预算的依据。未按规定完成竣工结算报告备案的，原则上不予下达收尾项目投资预算。竣工结算金额超过集团公司批准设计概算，未经审批的以批准设计概算作为投资、资金预算上限，已经审批的按审批金额作为投资、资金预算上限。"},{"id":"137","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，竣工结算金额超过集团公司批准设计概算，未经审批的以（）作为投资、资金预算上限，已经审批的按审批金额作为投资、资金预算上限。","answer":"A","difficulty":"易","options":{"A":"批准设计概算","B":"竣工决算报告","C":"竣工结算备案报告","D":"竣工结算报告","E":""},"explanation":"第二十七条竣工结算报告作为竣工财务决算和收尾项目投资预算的依据。未按规定完成竣工结算报告备案的，原则上不予下达收尾项目投资预算。竣工结算金额超过集团公司批准设计概算，未经审批的以批准设计概算作为投资、资金预算上限，已经审批的按审批金额作为投资、资金预算上限。"},{"id":"138","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，（）是集团公司内部造价控制目标，是造价控制、预算下达、造价绩效考核、竣工决算、竣工决算审计、管理评价、绩效考核和竣工验收的依据。","answer":"A","difficulty":"易","options":{"A":"管理概算","B":"设计概算","C":"可研估算","D":"竣工结算","E":""},"explanation":"第三条本细则所称管理概算是在设计概算基础上，综合考虑市场行情、企业标准和管理成果计算的工程投资。管理概算是集团公司内部造价控制目标，是造价控制、预算下达、造价绩效考核、竣工决算、竣工决算审计、管理评价、绩效考核和竣工验收的依据。"},{"id":"139","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，（）是火电工程概算执行的责任主体，参与可研概（估）算及设计概算审核，负责组织设计单位编制设计概算，组织管理概算编制，编制概算执行分析报告。","answer":"A","difficulty":"易","options":{"A":"项目单位","B":"建设单位","C":"监理单位","D":"施工单位","E":""},"explanation":"第九条项目单位是火电工程概算执行的责任主体，参与可研概（估）算及设计概算审核，负责组织设计单位编制设计概算，组织管理概算编制，编制概算执行分析报告；项目单位应设立造价管理部门，负责概算归口管理工作。"},{"id":"140","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，项目单位应设立（）管理部门，负责概算归口管理工作。","answer":"B","difficulty":"易","options":{"A":"预算","B":"造价","C":"概算","D":"资金","E":""},"explanation":"第九条项目单位是火电工程概算执行的责任主体，参与可研概（估）算及设计概算审核，负责组织设计单位编制设计概算，组织管理概算编制，编制概算执行分析报告；项目单位应设立造价管理部门，负责概算归口管理工作。"},{"id":"141","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，设计概算应控制在集团公司（）投资以内。","answer":"B","difficulty":"易","options":{"A":"项目核准投资","B":"项目投资决策批复","C":"项目可研估算","D":"项目管理概算","E":""},"explanation":"第十条设计概算应控制在集团公司项目投资决策批复投资以内。"},{"id":"142","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，二级单位委托具备资质的咨询单位组织设计概算外部评审，在初步设计外审后（）个月内完成设计概算收口并报集团公司。","answer":"B","difficulty":"易","options":{"A":"3","B":"6","C":"12","D":"24","E":""},"explanation":"第十三条二级单位委托具备资质的咨询单位组织设计概算外部评审（设计概算与初步设计同步，下同），在初步设计外审后6 个月内完成设计概算收口并报集团公司。"},{"id":"143","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，设计概算批复后（）个月内完成管理概算编制。","answer":"B","difficulty":"易","options":{"A":"1","B":"2","C":"3","D":"6","E":""},"explanation":"第十五条在设计概算批复后2 个月内完成管理概算编制。"},{"id":"144","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算计列标准中：已招标的建安工程费按（）。","answer":"B","difficulty":"难","options":{"A":"招标价格计列（含备用金及暂定金额）","B":"招标价格计列（不计备用金及暂定金额）","C":"预计结算金额","D":"设计概算","E":""},"explanation":"第十七条管理概算计列标准\n（一）设备购置费。已招标的设备按招标价格计列，未招标的设备原则上按设计概算计列。\n（二）建安工程费。已完工的按结算金额（或预计结算金额）计列；已招标的按招标价格计列（不计备用金及暂定金额），未招标的按设计概算下浮5％计列。综合考虑设计概算、招标价格、设计变更等因素，建筑、安装主体工程预留费用分别按不超过招标价的10％和5％计列。"},{"id":"145","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算计列标准中：未招标建安工程费的按设计概算下浮（）计列。","answer":"D","difficulty":"难","options":{"A":"0.01","B":"0.02","C":"0.03","D":"0.05","E":""},"explanation":"第十七条管理概算计列标准\n（一）设备购置费。已招标的设备按招标价格计列，未招标的设备原则上按设计概算计列。\n（二）建安工程费。已完工的按结算金额（或预计结算金额）计列；已招标的按招标价格计列（不计备用金及暂定金额），未招标的按设计概算下浮5％计列。综合考虑设计概算、招标价格、设计变更等因素，建筑、安装主体工程预留费用分别按不超过招标价的10％和5％计列。"},{"id":"146","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算计列标准中：建安工程费需综合考虑设计概算、招标价格、设计变更等因素，建筑、安装主体工程预留费用分别按不超过招标价的（）和（）计列。","answer":"C","difficulty":"难","options":{"A":"5％，5％","B":"5％，10％","C":"10％，5％","D":"10％，10％","E":""},"explanation":"第十七条管理概算计列标准\n（一）设备购置费。已招标的设备按招标价格计列，未招标的设备原则上按设计概算计列。\n（二）建安工程费。已完工的按结算金额（或预计结算金额）计列；已招标的按招标价格计列（不计备用金及暂定金额），未招标的按设计概算下浮5％计列。综合考虑设计概算、招标价格、设计变更等因素，建筑、安装主体工程预留费用分别按不超过招标价的10％和5％计列。"},{"id":"147","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，管理概算计列标准中，基本预备费：法人管理费和生产职工培训及提前进厂，综合考虑建设管理机构、建设规模、建设地点、建设性质等实际情况，新建工程项目2×1000M
