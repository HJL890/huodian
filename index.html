:"一般设计变更","E":"特大设计变更"},"explanation":"设计变更指初步设计文件批复后，由设计单位提出有关设计方案的变更；变更设计指由项目单位或施工单位提出有关设计的变更，以上统称设计变更。设计变更按性质划分为重大设计变更、 重要设计变更和一般设计变更。"},{"id":"242","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，招标时，下列（  ）材料适合以暂估价方式采购。","answer":"AC","difficulty":"中","options":{"A":"地板砖","B":"电缆桥架","C":"卫生洁具","D":"中压汽水管道","E":"电缆附件"},"explanation":"门窗（含防火门）、地板砖（不限于瓷砖类）、墙面砖（包括金属墙板、非金属墙板等，不限于瓷砖类）、智能照明灯具、卫生洁具等建筑材料，在具备建筑材料基本的使用功能同时，还需要与项目建（构）筑物功能、整体装饰装修效果、项目单位未来企业文化方向等相匹配。市场货源充足、种类繁多、相同品牌或不同品牌之间的材料质量也参差不齐，在招标阶段很难通过有关描述确定材料表征和标准，各投标单位报价差异也很大，给工程实施和工程结算带来极大困难。建议在编制招标文件及工程量清单时，确定为暂估价材料，在工程量清单中明确“暂估单价”，在醒目位置提醒“**材料为暂估单价，按照实际采购单价及面积结算”。"},{"id":"243","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，火电工程，一般性设计变更和工程量增减费用，在（   ）列支。重大设计变更和概算外新增项目须履行相应的变更管理程序后方可计列。","answer":"AB","difficulty":"易","options":{"A":"预留费","B":"基本预备费","C":"价差预备费","D":"调整后的设计概算","E":"竣工结算金额"},"explanation":"一般性设计变更和工程量增减费用，在预留费和基本预备费列支。重大、重要设计变更和概算外新增项目须履行相应的变更管理程序后方可计列。"},{"id":"244","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），对于电力安装工程而言，直接工程费中属于定额直接费的是（  ）。","answer":"ACD","difficulty":"易","options":{"A":"定额人工费","B":"定额材料费","C":"定额机械使用费","D":"材料费中已进入定额计价的消耗性材料费","E":"间接费"},"explanation":"对于电力安装工程而言，直接工程费中属于定额直接费的是定额人工费、材料费中已进入定额计价的消耗性材料费、施工机械使用费。"},{"id":"245","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，二级单位是火电工程造价管理的责任主体。负责组织投资估算、（  ）初审；组织招标文件、技术规范书、标段对应概算、投标限价审核，属于一级集采范围内的报集团公司；组织审核、审批管理概算，并报集团公司备案（备案前需报集团公司复核）；负责项目实施过程的造价控制管理，（  ）项目概算执行情况分析报告、核定项目竣工结算报告并报集团公司备案；督导项目建设单位开展过程结算、竣工结算。","answer":"BD","difficulty":"易","options":{"A":"初设概算","B":"设计概算","C":"核定","D":"审批","E":"审核"},"explanation":"《中国华能集团有限公司火电工程造价管理工作指引》\n第五部分 中国华能集团有限公司火电工程造价管理工作指引\n二级单位是火电工程造价管理的责任主体。负责组织投资估算、设计概算初审；组织招标文件、技术规范书、标段对应概算、投标限价审核，并报集团公司备案（备案前需报集团公司复核）；负责项目实施过程的造价控制管理，审批项目概算执行情况分析报告、核定项目竣工结算报告并报集团公司备案；督导项目建设单位开展过程结算、竣工结算。"},{"id":"246","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，经集团公司投资决策机构批准的项目，在项目开工前发生下列哪几种情况的，应重新提请投委会审议、报原决策机构批准（  ）。","answer":"ABC","difficulty":"中","options":{"A":"两年内未开工建设，项目原决策边界条件发生较大变化。","B":"项目建设规模发生实质性变化。","C":"项目设计或建设方案出现重大变更。","D":"未按管理权限履行程序，擅自扩大规模、提高标准、变更方案增加投资的。","E":"基本预备费可以解决增加投资的。"},"explanation":"根据《中国华能集团有限公司基本建设项目投资决策管理规定》，经集团公司投资决策机构批准的项目，在项目开工前发生下列情况的，应重新提请投委会审议、报原决策机构批准：\n1.两年内未开工建设，项目原决策边界条件发生较大变化。\n2.项目建设规模发生实质性变化。\n3.项目设计或建设方案出现重大变更。"},{"id":"247","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，管理概算应在集团公司批复设计概算之内，综合考虑市场行情、行业标准和管理成果，遵循（  ）、（  ）的原则。","answer":"BD","difficulty":"易","options":{"A":"系统优化","B":"客观合理","C":"配置合理","D":"先进适度","E":"经济适用"},"explanation":"根据《中国华能集团有限公司火电工程造价管理工作指引》，管理概算应在集团公司批复设计概算之内，综合考虑市场行情、行业标准和管理成果，遵循客观合理、先进适度的原则。"},{"id":"248","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，对建设工期2年以内项目，项目建设单位须分别在初设收口后（  ）、（  ）后编制概算执行分析报告。","answer":"AD","difficulty":"易","options":{"A":"1个月","B":"3个月","C":"首台（套）机组投产","D":"全部机组投产","E":""},"explanation":"根据《中国华能集团有限公司火电工程造价管理工作指引》，对建设工期2年以内项目，项目建设单位须分别在初设收口后1个月、全部机组投产后编制概算执行分析报告。"},{"id":"249","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，初设收口（  ）后或（  ），概算执行分析报告需增加实施情况或预测量价与管理概算的对比分析，并增加造价动态管理台账、设计变更台账等内容（包括附表和专项分析表）。","answer":"BD","difficulty":"易","options":{"A":"3个月","B":"6个月","C":"每年6月底","D":"每年9月底","E":""},"explanation":"根据《中国华能集团有限公司火电工程造价管理工作指引》，初设收口6个月后或每年9月底，概算执行分析报告需增加实施情况或预测量价与管理概算的对比分析，并增加造价动态管理台账、设计变更台账等内容（包括附表和专项分析表）。"},{"id":"250","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，发生下列情况之一，对工程投资影响较大并超出基本预备费，集团公司结合概算执行的总体情况可调整设计概算（  ）。","answer":"BCDE","difficulty":"中","options":{"A":"由于勘察、设计、施工、制造、监理等单位过失、管理不善、失职渎职等原因增加投资的。","B":"国家政策、法律法规发生变化。","C":"发生不可抗力因素。","D":"工程建设条件、方案、标准和规模发生重大变化。","E":"集团公司批复的专题专项费用。"},"explanation":"根据《中国华能集团有限公司火电工程造价管理工作指引》，发生下列情况之一，对工程投资影响较大并超出基本预备费，集团公司结合概算执行的总体情况可调整设计概算：\n1.国家政策、法律法规发生变化。\n2.发生不可抗力因素。\n3.工程建设条件、方案、标准和规模发生重大变化。\n4.集团公司批复的专题专项费用。"},{"id":"251","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，项目建设单位不得以（  ）、（  ）、（  ）等方式规避集团公司采购制度规定的招标。","answer":"ACD","difficulty":"中","options":{"A":"零星委托项目","B":"分包项目","C":"现场签证","D":"肢解项目","E":"转包项目"},"explanation":"根据《中国华能集团有限公司火电工程造价管理工作指引》，项目建设单位不得以零星委托项目、现场签证、肢解项目等方式规避集团公司采购制度规定的招标。"},{"id":"252","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，合同签字盖章后（  ）内，乙方向甲方提交合同总价（  ）的履约银行保函，合同正式生效。","answer":"AC","difficulty":"易","options":{"A":"10日","B":"14日","C":"0.05","D":"0.1","E":""},"explanation":"根据《中国华能集团有限公司火电工程造价管理工作指引》，合同签字盖章后10日内，乙方向甲方提交合同总价5%的履约银行保函，合同正式生效。"},{"id":"253","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，按月完成工程款的扣减预付款，当工程进度款支付到合同总价的（  ）时，开始扣回预付款，并支付到合同总价的（  ）时扣完预付款。","answer":"BC","difficulty":"易","options":{"A":"0.1","B":"0.3","C":"0.8","D":"0.9","E":""},"explanation":"根据《中国华能集团有限公司火电工程造价管理工作指引》，按月完成工程款的扣减预付款，当工程进度款支付到合同总价的30%时，开始扣回预付款，并支付到合同总价的80%时扣完预付款。"},{"id":"254","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），安全文明施工费包括哪些内容？(   )","answer":"ABC","difficulty":"易","options":{"A":"安全生产费用","B":"文明施工费用","C":"环境保护费用","D":"企业管理费","E":"生产准备费"},"explanation":"出自《火力发电工程建设预算编制与计算规定使用指南（2018年版）》4.3.1  安全文明施工费包括：安全生产费用、文明施工费用、环境保护费用。"},{"id":"255","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），间接费由哪些费用构成？(  )","answer":"ACE","difficulty":"易","options":{"A":"规费","B":"税金","C":"企业管理费","D":"利润","E":"施工企业配合调试费"},"explanation":"出自《火力发电工程建设预算编制与计算规定使用指南（2018年版）》4.3.2  间接费包括规费、企业管理费和施工企业配合调试费。"},{"id":"256","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），以下哪些费用应归入建筑工程费？（  ）","answer":"ACD","difficulty":"中","options":{"A":"厂房基础施工","B":"锅炉砌筑工程","C":"烟囱施工","D":"冷却塔施工","E":"设备维护平台及扶梯"},"explanation":"出自《火力发电工程建设预算编制与计算规定使用指南（2018年版）》5.1  建设预算费用性质划分分为建筑与安装工程费用性质划分和设备与材料费用性质划分。具体费用性质划分参考5.1和5.2。锅炉砌筑工程和设备维护平台及扶梯属于安装工程费。"},{"id":"257","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），建设预算编制方法包含哪些阶段？（  ）","answer":"ABD","difficulty":"易","options":{"A":"投资估算","B":"初步设计概算","C":"竣工决算","D":"施工图预算","E":"管理概算"},"explanation":"出自《火力发电工程建设预算编制与计算规定使用指南（2018年版）》第七章 建设预算编制方法，建设预算编制方法包括投资估算、初步设计概算和施工图预算等阶段的编制规则。"},{"id":"258","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），建设预算文件一般包括（  ）。","answer":"ABC","difficulty":"易","options":{"A":"投资估算书","B":"初步设计概算书","C":"施工图预算书","D":"施工图概算","E":"总平面设计图"},"explanation":"建设预算文件一般包括投资估算书、初步设计概算书\n、施工图预算书。"},{"id":"259","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），根据特殊地区施工增加费的定义，以下属于特殊地区的是（  ）。","answer":"ACE","difficulty":"中","options":{"A":"新疆吐鲁番地区","B":"名胜风景区","C":"北纬45度以北地区","D":"平均海拔高度2500米\n的地区","E":"平均海拔高度3500米\n的地区"},"explanation":"特殊地区包括：高海拔地区（平均海拔高度3000米以\n上的地区），高纬度寒冷地区（即北纬45度以北地\n区），酷热地区（面积在1万k㎡以上的沙漠地区，以\n及新疆吐鲁番地区）"},{"id":"260","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），临时设施费包括（  ）费用。","answer":"ABC","difficulty":"中","options":{"A":"施工企业职工宿舍","B":"工棚","C":"厂区围墙范围内的\n临时施工道路","D":"进场施工铁路专用线","E":"施工、生活用380V变\n压器高压侧以外的装\n置及路线"},"explanation":"临时设施包括:职工宿舍，办公、生活、文化、福利等\n公用房屋，仓库、加工厂、工棚、围墙等建、构筑\n物，厂区围墙范围内的临时施工道路及水、电(含380V\n降压变压器)、通信的分支管线，建设期间的临时隔墙"},{"id":"261","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），《火电发电工程建设预算编制与计算规定》中，设备材料建造费中，属于材料监造的是（  ）。","answer":"AE","difficulty":"易","options":{"A":"四大管道及管件","B":"高压加热器","C":"循环水泵","D":"磨煤机","E":"钢结构"},"explanation":"设备材料建造费中，属于材料监造的是四大管道及管\n件、钢结构、6kV以上电缆。"},{"id":"262","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），下列选项中，不属于建设工程项目静态投资的有（  ）。","answer":"CD","difficulty":"易","options":{"A":"基本预备费","B":"因工程量误差所增加\n的工程造价","C":"涨价预备费","D":"建设期贷款利息","E":"设备购置费"},"explanation":"静态投资包括:建筑安装工程费、设备和工器具购置费\n、工程建设其他费、基本预备费，以及因工程量误差\n而引起的工程造价增减值等。"},{"id":"263","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），下列建筑安装工程费中，为不可竞争性费用的是（  ）。","answer":"BCD","difficulty":"易","options":{"A":"人工费","B":"税金","C":"规费","D":"安全文明施工费","E":"材料费"},"explanation":"建筑安装工程费中，为不可竞争性费用的是税金、规\n费、安全文明施工费。"},{"id":"264","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），下列费用中，属于基本预备费的是（ ）。","answer":"ABD","difficulty":"易","options":{"A":"因设计变更（含施工过程中工程量增减、设备改型、材料代用）而增加的费用","B":"一般自然灾害可能造成的损失","C":"建设期间由于价格等变化引起工程造价变化的预测预留费用","D":"预防自然灾害所采取的临时措施费用","E":"编制基准期价差"},"explanation":"基本预备费是指为因设计变更(含施工过程中工程量增减、设备改型、材料代用)增加的费用、一般自然灾害可能造成的损失和预防自然灾害所采取的临时措施费用，以及其他不确定因素可能造成的损失而预留的工程费用。"},{"id":"265","question":"依据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），下列费用包括在勘察设计费中的是（  ）。","answer":"BCD","difficulty":"易","options":{"A":"可行性研究设计费","B":"初步设计概算编制费","C":"施工图预算编制费","D":"竣工图文件编制费","E":"竣工结算审核费"},"explanation":"勘察设计费是指对工程建设项目进行勘察设计所发生的费用，包括项目的各项勘探、勘察费用，初步设计费、施工图设计费、竣工图文件编制费，施工图预算编制费，以及设计代表的现场技术服务费。"},{"id":"266","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），设备基础工程包括的工作内容有（  ）。","answer":"ABCD","difficulty":"中","options":{"A":"预埋螺栓孔","B":"浇制基础","C":"配合安装螺栓固定架","D":"二次灌浆","E":"弹簧支座"},"explanation":"设备基础工程包括清理基层、浇制混凝土垫层、浇制基础、预埋螺栓孔、配合安装螺栓固定支架、铁件制作与预埋、二次灌浆、安拆脚手架等工作内容。设备基础中不含弹簧支座。"},{"id":"267","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，当出现（   ）产生的计价风险，应由发包人承担并应及时调整相应合同价款工期。","answer":"ABCD","difficulty":"难","options":{"A":"法律法规发生变化","B":"政策发生变化","C":"工程变更","D":"发包人要求提前竣工的","E":"发生不可抗力"},"explanation":"根据《电力建设工程工程量清单计价规范（2021版）相关规定,下列因素出现产生的计价风险,应由发包人承担,并应及时调整相应的合同价款和工期。1.法律法规与政策发生变化；2.工程变更；3.发包人要求提前竣工的。"},{"id":"268","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，发包人提供的材料和设备(以下简称甲供材料)应在招标文中按照规定填写《招标人采购材料及设备表》，写明甲供材料的（   ）等。","answer":"ABCE","difficulty":"中","options":{"A":"材料（设备）名称","B":"型号规格","C":"交货方式","D":"质量证明文件","E":"数量"},"explanation":"根据《电力建设工程工程量清单计价规范（2021版）相关规定，发包人提供的材料和设备(以下简称甲供材料)应在招标文中按照规定填写《招标人采购材料及设备表》，写明甲供材料的名称、规格、数量、交货方式、交货地点、交货时间等。"},{"id":"269","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），适用于新建、扩建的单机容量50MW~1000MW级机组燃煤发电工程及燃气-蒸汽联合循环发电工程（    ）阶段的计价活动。","answer":"CDE","difficulty":"中","options":{"A":"预可研阶段","B":"可行性研究阶段","C":"初步设计阶段","D":"施工图设计阶段","E":"项目实施阶段"},"explanation":"《电力建设工程工程量清单计算规范火力发电工程》（2021版）用于新建扩建的单机容50MW~1000MW组燃煤发电程及气-汽联合1.0.2循环发电工程初步设计、施工图设计两阶的发承包及其实施阶段的工程量清单编制的计价活动。"},{"id":"270","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用属于项目工程建设检测费的有（   ）。","answer":"BCD","difficulty":"易","options":{"A":"设备材料监造费","B":"电力工程质量检测费","C":"特种设备安全监测费","D":"桩基检测费","E":"试桩费"},"explanation":"工程建设检测费是指根据国家行政主管部门及电力行业的有关规定，对工程质量、环境保护、水土保持设施、特种设备(消防、电梯、锅炉、压力容器等) 安装进行检验、检测所发生的费用。包括电力工程质量检测费、特种设备安全监测费、环境监测及环境保护验收费、水土保持监测及验收费、桩基检测费。"},{"id":"271","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建筑安装工程费包括建筑工程费和安装工程费，下列属于建筑安装工程费的组成部分的是（   ）。","answer":"ABDE","difficulty":"难","options":{"A":"税金","B":"利润","C":"价差预备费","D":"直接费","E":"间接费"},"explanation":"建筑安装工程费包括建筑工程费和安装工程费，由直接费、间接费、利润和税金组成。"},{"id":"272","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，配套的定额有（  ）。","answer":"ABE","difficulty":"难","options":{"A":"电力建设工程预算定额","B":"电力建设工程概算定额","C":"项目所在地定额","D":"水电定额","E":"电力建设工程估算指标"},"explanation":"《火力发电工程建设预算编制与计算规定》是火力发电工程投资估算、初步设计概算、施工图预算、工程量清单编制和费用计算的依据，应与电力建设工程估算指标、概算定额、预算定额配套使用。"},{"id":"273","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，项目法人管理费的计费基数包括（    ）。","answer":"AB","difficulty":"中","options":{"A":"建筑工程费","B":"安装工程费","C":"设备购置费","D":"其他费用","E":"建设期贷款利息"},"explanation":"项目法人管理费=（建筑工程费+安装工程费）*费率"},{"id":"274","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，下列费用中，属于建筑安装工程费用企业管理费的有（ ）。","answer":"BD","difficulty":"易","options":{"A":"施工机械保险费","B":"劳动保险费","C":"工伤保险费","D":"财产保险费","E":"工程保险费"},"explanation":"企业管理费包括：（1）管理人员工资；（2）办公费；（3）差旅交通费；（4）固定资产使用费；（5）工具用具使用费；（6）劳动保险和职工福利费；（7）劳动保护费；（8）检验试验费；（9）工会经费；（10）职工教育经费；（11）财产保险费；（12）财务费；（13）税金；（14）其他管理费。选项 A 错误，施工机械保险费属于施工机械台班单价中其他费用；选项 C 错误，工伤保险费属于规费中社会保险费；选项 E 错误，工程保险费属于工程建设其他费。"},{"id":"275","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在工程量清单编制中，关于其他项目清单的编制，下列说法正确的有（ ）。","answer":"BDE","difficulty":"易","options":{"A":"采用费率方式计价的暂列金额，可直接填写“暂定金额”","B":"专业工程暂估价应按招标文件的说明分专业列项","C":"发包人提供材料、专业分包工程总承包服务费按费率计量的，应以暂估价作为计价基","D":"直接发包的专业工程的总承包服务费宜以项计量","E":"发包人提供材料的总承包服务费可按承包人负责安装和承包人不负责安装分别列"},"explanation":"选项 A 错误，由招标人填写“暂定金额”总额，采用费率计价方式计算暂定金额的， 应分别填“计算基础”“费率”，并计算填写“暂定金额”；采用总价计价方式计算暂定金额的， 可直接填写“暂定金额”；选项 C 错误，发包人提供材料、专业分包工程总承包服务费按费率计量 的，宜以暂估价作为计价基础。"},{"id":"276","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，属于生产准备费的（）","answer":"AC","difficulty":"易","options":{"A":"管理车辆购置费","B":"生产家具购置费","C":"生产职工培训及提前进场费","D":"水土保持监测及验收费","E":"工程保险费"},"explanation":"生产准备费包括：管理车辆购置费、工器具及办公家具购置费、生产职工培训及提前进场费"},{"id":"277","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，编制及送审初步设计概算时，项目法人应提供的资料有（）","answer":"ABCD","difficulty":"易","options":{"A":"主要设备、材料的供货价格及供货范围","B":"建设场地征用及清理费的费用规定及依据文件","C":"项目前期工作的各项费用","D":"当期购电单价","E":"编制基准期的价格水平文件"},"explanation":"编制及送审初步设计概算时，项目法人应提供的资料有主要设备、材料的供货价格及供货范围，建设场地征用及清理费的费用规定及依据文件，外委设计项目的正式概算，项目前期工作的各项费用，当期购电单价，初步设计概算编制中需要提供的其他有关资料"},{"id":"278","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，工程概算须报集团公司审批的事项为（ ）","answer":"ACD","difficulty":"中","options":{"A":"重大设计变更","B":"单项增加投资1000万元以下的生产性概算项目","C":"单项增加投资1000万元以上的生产性概算项目","D":"任何非生产性概算外项目","E":"任何非生产性概算项目"},"explanation":"《中国华能集团有限公司火电基本建设工程概算管理细则》中，须报集团公司审批的事项为\n（一）重大设计变更\n（二）单项增加投资1000万元以上的生产性概算项目\n（三）任何非生产性概算外项目"},{"id":"279","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，发生下列情况之一，对工程投资影响较大并超出基本预备费，结合概算执行的总体情况可调整设计概算：","answer":"BCDE","difficulty":"中","options":{"A":"重大设计变更","B":"国家政策、法律法规发生变化","C":"发生不可抗力因素","D":"工程建设条件、方案、标准和规模发生重大变化","E":"集团公司批复的专题专项费用"},"explanation":"《中国华能集团有限公司火电基本建设工程概算管理细则》中，发生下列情况之一，对工程投资影响较大并超出基本预备费，结合概算执行的总体情况可调整设计概算\n（一）国家政策、法律法规发生变化\n（二）发生不可抗力因素\n（三）工程建设条件、方案、标准和规模发生重大变化\n（四）集团公司批复的专题专项费用"},{"id":"280","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，发生下列情况之一，不予调整设计概算：","answer":"ACD","difficulty":"中","options":{"A":"未按管理权限履行程序，擅自扩大规模、提高标准、变更方案增加投资的","B":"发生不可抗力因素","C":"由于勘察、设计、施工、制造、监理等单位过失、管理不善、失职渎职等原因增加投资的","D":"基本预备费可以解决增加投资","E":"工程建设条件、方案、标准和规模发生重大变化"},"explanation":"《中国华能集团有限公司火电基本建设工程概算管理细则》中，发生下列情况之一，不予调整设计概算：\n（一）未按管理权限履行程序，擅自扩大规模、提高标准、变更方案增加投资的\n（二）由于勘察、设计、施工、制造、监理等单位过失、管理不善、失职渎职等原因增加投资的\n（三）基本预备费可以解决增加投资"},{"id":"281","question":"根据《电力工程造价从业人员职业能力培训教材—发电建筑工程》（2021版），火力发电厂建筑工程按功能可分为（  ）。","answer":"ABCD","difficulty":"中","options":{"A":"主体建筑工程","B":"辅助建筑工程","C":"屋外配电装置建筑工程","D":"附属建筑工程","E":"临时建筑工程"},"explanation":"根据《发电建筑工程（2021版）》，火力发电厂建筑工程按功能分为主体建筑工程、辅助建筑工程、屋外配电装置建筑工程、附属建筑工程四类。临时建筑工程属于施工临时设施，不属于正式建筑工程范畴。"},{"id":"282","question":"根据《电力工程造价从业人员职业能力培训教材—热力设备安装工程》（2021版），锅炉安装工程的工作内容包括（  ）。","answer":"ABCD","difficulty":"中","options":{"A":"锅炉本体安装","B":"锅炉附属设备安装","C":"锅炉本体管道安装","D":"锅炉水压试验","E":"锅炉燃料供应系统安装"},"explanation":"根据《热力设备安装工程（2021版）》，锅炉安装工程包括锅炉本体安装、锅炉附属设备安装、锅炉本体管道安装、锅炉水压试验、锅炉烘炉、煮炉、蒸汽严密性试验等工作内容。锅炉燃料供应系统安装属于输煤系统或燃油燃气系统安装工程，单独计算。"},{"id":"283","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，电力建设工程预算中的建筑工程费包括（  ）。","answer":"ABCE","difficulty":"难","options":{"A":"各类建筑物、构筑物的工程费用","B":"设备基础、支架、梯子平台等工程费用","C":"建筑工程相关的金属结构工程费用","D":"设备安装工程费用","E":"建筑工程相关的防腐、保温、油漆工程费用"},"explanation":"根据《火力发电工程建设预算编制与计算规定（2018年版）》，建筑工程费是指构成建筑工程实体的各类建筑物、构筑物、设备基础、支架、梯子平台、金属结构以及与其相关的防腐、保温、油漆、装饰等工程费用。设备安装工程费用属于安装工程费范畴，单独计算。"},{"id":"284","question":"根据《电力建设工程预算定额—建筑工程》（2018年版），定额中的材料消耗量包括（  ）。","answer":"ABCD","difficulty":"难","options":{"A":"主要材料消耗量","B":"辅助材料消耗量","C":"周转材料摊销量","D":"材料施工损耗量","E":"材料运输损耗量"},"explanation":"根据《电力建设工程预算定额（2018年版）》编制说明，定额中的材料消耗量包括主要材料、辅助材料、周转材料摊销量和施工损耗量。材料运输损耗量已包含在材料预算价格中，不单独在定额消耗量中体现。"},{"id":"285","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），电力建设项目财务评价的基本报表包括（  ）。","answer":"ABCE","difficulty":"难","options":{"A":"现金流量表","B":"利润与利润分配表","C":"资产负债表","D":"项目总投资使用计划与资金筹措表","E":"借款还本付息计划表"},"explanation":"根据导则3.2.1，基本报表含现金流量表、利润与利润分配表、财务计划现金流量表和资产负债表。总成本费用表为辅助报表。"},{"id":"286","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程量清单应由（  ）组成。","answer":"ABCD","difficulty":"中","options":{"A":"分部分项工程量清单","B":"措施项目清单","C":"其他项目清单","D":"规费项目清单和税金项目清单","E":"工程量清单编制说明"},"explanation":"根据《电力建设工程工程量清单计价规范 火力发电工程》，工程量清单应由分部分项工程量清单、措施项目清单、其他项目清单、规费项目清单和税金项目清单组成。工程量清单编制说明是工程量清单的组成部分，但不属于清单表格本身。"},{"id":"287","question":"根据《火力发电工程初步设计概算编制导则》（DL/T 5464-2021），初步设计概算的编制依据包括（  ）。","answer":"ABCE","difficulty":"中","options":{"A":"国家有关法律法规和行业规章制度","B":"初步设计文件及相关资料","C":"现行的概算定额和费用标准","D":"企业定额","E":"有关合同和协议"},"explanation":"根据《火力发电工程初步设计概算编制导则》，初步设计概算的编制依据包括：（1）国家有关法律法规和行业规章制度；（2）初步设计文件及相关资料；（3）现行的概算定额、概算指标和费用标准；（4）设备和材料价格资料；（5）有关合同和协议；（6）其他相关资料。"},{"id":"288","question":"根据《电力建设工程概算定额》（2018年版），概算定额的作用包括（  ）。","answer":"ABCE","difficulty":"中","options":{"A":"编制初步设计概算的依据","B":"编制可行性研究报告投资估算的依据","C":"进行设计方案比选和优化的依据","D":"编制施工图预算的依据","E":"控制工程造价的依据"},"explanation":"根据《电力建设工程概算定额（2018年版）》编制说明，概算定额的作用包括：（1）编制初步设计概算的依据；（2）编制可行性研究报告投资估算的依据（结合概算指标）；（3）进行设计方案比选和优化的依据；（4）控制工程造价的依据。编制施工图预算的依据是预算定额，不是概算定额。"},{"id":"289","question":"根据《电力建设工程施工机械台班费用定额》（2018年版），施工机械台班单价中的第二类费用包括（  ）。","answer":"BCE","difficulty":"难","options":{"A":"折旧费","B":"人工费","C":"燃料动力费","D":"大修理费","E":"其他费用"},"explanation":"根据《电力建设工程施工机械台班费用定额（2018年版）》，施工机械台班费用分为第一类费用（不变费用）和第二类费用（可变费用）。第一类费用包括折旧费、大修理费、经常修理费、安拆费及场外运费；第二类费用包括人工费、燃料动力费、其他费用。"},{"id":"290","question":"根据《电力建设工程装置性材料综合预算价格（2018年版）》，装置性材料综合预算价格的编制原则包括（  ）。","answer":"ABCD","difficulty":"中","options":{"A":"市场导向原则","B":"公平合理原则","C":"科学严谨原则","D":"动态调整原则","E":"政府定价原则"},"explanation":"根据《电力建设工程装置性材料综合预算价格（2018年版）》编制说明，装置性材料综合预算价格的编制原则包括市场导向原则、公平合理原则、科学严谨原则、动态调整原则。装置性材料价格实行市场调节价，不是政府定价。"},{"id":"291","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》，不得列入建设成本和竣工决算的费用包括（   ）。","answer":"ABC","difficulty":"中","options":{"A":"未审批变更","B":"设计概算外项目","C":"不符合财务制度费用","D":"合同内合规费用","E":"临时设施费用"},"explanation":"项目单位应严格控制建设成本的范围和标准。未按规定履行审批程序的变更、设计概算外项目以及不符合《中国华能集团有限公司基本建设财务管理办法》等有关制度的费用不得列入建设成本和竣工决算。"},{"id":"292","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，可调整设计概算的情形包括（   ）。","answer":"ABC","difficulty":"易","options":{"A":"国家政策法规变化","B":"不可抗力","C":"工程方案重大变化","D":"擅自提高标准","E":"勘察设计过失"},"explanation":"发生下列情况之一，对工程投资影响较大并超出基本预备费，结合概算执行的总体情况可调整设计概算：（一）国家政策、法律法规发生变化。（二）发生不可抗力因素。（三）工程建设条件、方案、标准和规模发生重大变化。（四）集团公司批复的专题专项费用"},{"id":"293","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》规定，须报集团公司审批的事项有（   ）。","answer":"ABC","difficulty":"易","options":{"A":"重大设计变更","B":"单项增投1000万元以上生产性概算外项目","C":"任何非生产性概算外项目","D":"一般设计变更","E":"工程量正常增减"},"explanation":"须报集团公司审批的事项如下：1.重大设计变更。2.单项增加投资1000万元以上的生产性概算外项目。3.任何非生产性概算外项目。"},{"id":"294","question":"根据《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》相关规定，全员劳动生产率的计算中包含应发工资总额、（   ）、（   ）、（   ）和平均从业人数等数据。","answer":"ABD","difficulty":"中","options":{"A":"营业盈余","B":"固定资产折旧额","C":"利润总额","D":"生产税净额","E":"净利润"},"explanation":"《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》中经济评价指标：全员劳动生产率是指反映一个地区所有从业者在一定时期内创造的劳动成果与其相适应的劳动消耗量的比值，计算公式为：全员劳动生产率=（应发工资总额+固定资产折旧额+营业盈余+生产税净额）/平均从业人数"},{"id":"295","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，单项合同结算书应包含的内容有（   ）。","answer":"ABCE","difficulty":"中","options":{"A":"结算汇总表","B":"工程量清单资料","C":"变更签字文件","D":"监理月报","E":"上级审批文件、会议纪要"},"explanation":"单项合同结算书包含（不限于）以下内容：（一）单项合同完工结算书。（二）经监理、项目建设管理单位认可的完工工程量清算资料验收。（三）变更、签证、联系单等支持性文件。（四）监理、项目建设管理单位关于单项合同结算审批资料。（五）涉及结算事项的上级公司审批文件、会议纪要等材料。不含监理月报"},{"id":"296","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》规定，合同结算审核内容包括（   ）。","answer":"ABCE","difficulty":"中","options":{"A":"资料完备性、有效性","B":"项目范围与合同一致性","C":"工程量计算准确性","D":"施工单位人员资质是否齐全有效","E":"变更签证真实合法"},"explanation":"审核单项合同结算首先是按合同约定执行，审核内容包括：（一）审查结算的递交资料的完备性 （二）审查与结算有关的各项内容1.审查结算项目范围、内容与合同约定的项目范围、内容一致性；2.审查工程量计算的准确性、工程量计算规则与计价规范或定额保持一致性；3.审查结算单价是否严格执行合同约定或现行的计价原则、方法。4.审查变更签证凭据的真实性、合法性、有效性，审核变更工程费用。不含施工单位人员资质是否齐全有效"},{"id":"297","question":"根据《中国华能集团有限公司火电基本建设施工准备及开工管理办法》中规定，火电工程开工条件包含（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"项目已核准、初设及概算已审查","B":"四证及环评、节能文件齐全","C":"资金、材料、设备、外部条件落实","D":"监理、施工合同已签订","E":"已制定开工准备工作计划"},"explanation":"项目开工条件\n（一）项目已获得核准，初步设计及概算已审查，已列入\n集团公司年度开工计划，已批复年度投资预算。\n（二）项目已取得国有土地使用权证、建设用地规划许可\n证、建设工程规划许可证、建筑工程施工许可证（可分批取得）、\n环评报告及节能审查意见等合法性文件。\n（三）项目建设管理组织机构已建立，人员配置齐全。\n（四）项目需要的资金、材料、设备、电力供应、外部协\n作条件以及送出等同步配套工程已经落实，当年需要的投资、\n材料能满足连续施工的要求。（五）施工图能满足工程进度的需要，设计单位已提交开\n工所需的施工图纸及交图计划，满足连续施工需要。\n（六）项目已与监理单位和施工单位签订合同。\n（七）项目建设用地已交付使用，现场施工准备工作已经\n完成。\n（八）施工组织设计或主要施工方案已经编制完成（在开工后1个月内完成施工组织总设计审查）。\n（九）基建现场视频、门禁、设计出图、设备供货、进度\n管理等信息已接入基建工程智慧建设管理系统。"},{"id":"298","question":"根据《中国华能集团有限公司火电基本建设施工准备及开工管理办法》中规定，火电工程开工需取得的合法文件包括（   ）。","answer":"ABCD","difficulty":"易","options":{"A":"国有土地使用权证","B":"建设用地规划许可证","C":"建设工程规划许可证","D":"建筑工程施工许可证","E":"进度管理计划"},"explanation":"项目已取得国有土地使用权证、建设用地规划许可证、建设工程规划许可证、建筑工程施工许可证（可分批取得）、环评报告及节能审查意见等合法性文件。"},{"id":"299","question":"根据《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》中规定，经济评价辅助指标中“一利五率”包括（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"年均利润总额","B":"净资产收益率","C":"营业收现率","D":"资产负债率","E":"总投资"},"explanation":"一利五率包括：年均利润总额、净资产收益率、营业收现率、资产负债率、全员劳动生产率，不含总投资。"},{"id":"300","question":"根据《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》中规定，增值税适用税率正确的有（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"电力产品13%","B":"热力产品9%","C":"煤炭13%","D":"自来水9%","E":"脱硫剂9%"},"explanation":"增值税税率：电力产品13%，热力产品9%，煤炭13%，天然气9%，燃料运费6%，自来水/中水9%，材料13%，脱硫剂13%，脱硝剂13%。"},{"id":"301","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列属于土石方工程清单项目的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"平整场地","B":"挖一般土方","C":"挖基坑土方","D":"挖沟槽土方","E":"地基处理"},"explanation":"规范附录A土石方工程包括：平整场地、挖一般土方、挖基坑土方、挖沟槽土方等。地基处理为单独分部。"},{"id":"302","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列项目中，以“m³”为计量单位的有（ ）。","answer":"ABDE","difficulty":"中","options":{"A":"挖基坑土方","B":"回填方","C":"厂区道路面层","D":"砖基础","E":"现浇混凝土柱"},"explanation":"挖基坑土方、回填方、砖基础、现浇混凝土柱均以“m³”计量；厂区道路面层以“㎡”计量。"},{"id":"303","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），在混凝土及钢筋混凝土工程量计算时，下列不扣除的有（ ）。","answer":"ABCE","difficulty":"中","options":{"A":"预埋铁件","B":"螺栓孔洞","C":"钢筋","D":"单个面积0.5㎡的孔洞","E":"单个面积0.2㎡的孔洞"},"explanation":"规范规定，不扣除构件内钢筋、预埋铁件和螺栓孔洞所占体积；孔洞面积大于0.3㎡时应扣除。"},{"id":"304","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），钢筋工程清单项目包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"现浇构件钢筋","B":"预制构件钢筋","C":"钢筋网片","D":"钢筋笼","E":"连接钢筋"},"explanation":"规范附录混凝土及钢筋混凝土工程中钢筋工程包含以上所有项目。包含先张法预应力钢筋，不包含连接钢筋"},{"id":"305","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），屋面及防水工程清单项目包括（ ）。","answer":"ABDE","difficulty":"难","options":{"A":"屋面卷材防水","B":"屋面涂膜防水","C":"屋面排水管","D":"屋面刚性防水","E":"墙面防水"},"explanation":"规范附录屋面及防水工程包括屋面卷材、涂膜、刚性防水及墙面防水等；屋面排水管单独列项，但不属于防水层项目。"},{"id":"306","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列属于厂区道路工程清单项目的有（ ）。","answer":"ACD","difficulty":"中","options":{"A":"路基整形","B":"石灰稳定土基层","C":"水泥混凝土面层","D":"路缘石","E":"道路照明"},"explanation":"规范附录厂区道路工程包括路基、基层、面层、路缘石等；道路照明属于电气工程。"},{"id":"307","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），锅炉机组安装工程清单项目包括（ ）。","answer":"ABCE","difficulty":"难","options":{"A":"锅炉本体钢结构","B":"锅炉受热面","C":"锅炉汽水系统","D":"锅炉基础","E":"锅炉烟风煤管道"},"explanation":"锅炉安装包括钢结构、受热面、汽水系统、烟风煤管道等；锅炉基础属于土建工程。"},{"id":"308","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），汽轮发电机安装工程清单项目包括（ ）。","answer":"ABCD","difficulty":"难","options":{"A":"汽轮机本体安装","B":"发电机本体安装","C":"油系统设备安装","D":"附属机械设备安装","E":"汽轮机基础"},"explanation":"汽轮发电机安装包含本体、油系统、附属机械等；基础属于土建工程。"},{"id":"309","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），电力电缆安装工程清单项目包括（ ）。","answer":"ABCE","difficulty":"难","options":{"A":"电力电缆敷设","B":"电缆保护管敷设","C":"电缆桥架安装","D":"电缆沟土方","E":"电缆防火"},"explanation":"电缆安装包括电缆敷设、保护管、桥架、防火等；电缆沟土方属于土石方工程。"},{"id":"310","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），接地装置安装工程清单项目包括（ ）。","answer":"ABCE","difficulty":"难","options":{"A":"接地极制作安装","B":"接地母线敷设","C":"接地跨接线","D":"避雷针安装","E":"接地电阻测试"},"explanation":"接地装置包括接地极、母线、跨接线、避雷针等；接地电阻测试属于措施或检测，不单独列项。"},{"id":"311","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列以“t”为计量单位的有（ ）。","answer":"ABD","difficulty":"中","options":{"A":"锅炉钢结构","B":"高压管道","C":"电缆","D":"烟风煤管道","E":"汽轮发电机"},"explanation":"锅炉钢结构、高压管道、烟风煤管道均以“t”计量；电缆以“m”计量；汽轮发电机以“台”计量。"},{"id":"312","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），关于工程量清单项目名称描述，应包括的内容有（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"项目特征","B":"材质","C":"规格","D":"安装方式","E":"工艺"},"explanation":"规范规定，项目名称应结合项目特征详细描述，包括但不限于材质、规格、安装方式、施工方法等。"},{"id":"313","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列属于措施项目清单的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"安全文明施工费","B":"脚手架","C":"模板","D":"大型机械进出场费","E":"暂列金额"},"explanation":"措施项目包括安全文明施工费、脚手架、模板、大型机械进出场等；暂列金额属于其他项目。"},{"id":"314","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），工程量清单编制时，下列关于暂估价表述正确的有（ ）。","answer":"BCE","difficulty":"难","options":{"A":"投标人确定暂估价","B":"招标人在工程量清单中提供的","C":"用于必然发生但暂时不能确定价格的材料","D":"用于竞争性报价","E":"用于专业工程"},"explanation":"暂估价由招标人提供，用于必然发生但暂不能确定价格的材料、设备或专业工程。"},{"id":"315","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），工程量清单的组成部分包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"分部分项工程量清单","B":"措施项目清单","C":"其他项目清单","D":"规费和税金项目清单","E":"施工组织设计"},"explanation":"规范规定，工程量清单由分部分项、措施项目、其他项目、规费和税金项目清单组成。"},{"id":"316","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列关于工程量清单编制依据的说法正确的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"本规范","B":"工程设计文件","C":"施工现场情况","D":"有关标准规范","E":"施工合同"},"explanation":"编制依据包括规范、设计文件、现场情况、标准规范；施工合同是结算依据，不是清单编制阶段依据。"},{"id":"317","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），烟囱工程清单项目包括（ ）。","answer":"ACDE","difficulty":"中","options":{"A":"烟囱基础","B":"烟囱内筒","C":"烟囱内衬","D":"烟囱隔热层","E":"烟囱爬梯"},"explanation":"烟囱基础（土建）、筒身、内衬、隔热层、爬梯均为烟囱工程内容；但基础为混凝土结构，按基础列项。"},{"id":"318","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），关于清单项目工程量计算的有效位数，下列说法正确的有（ ）。","answer":"BCE","difficulty":"中","options":{"A":"以“t”为单位，应保留小数点后两位","B":"以“t”为单位，应保留小数点后三位","C":"以“m³”为单位，应保留小数点后两位","D":"以“m³”为单位，应保留小数点后三位","E":"以“台”、“套”为单位，应取整数"},"explanation":"规范规定，以“t”为单位保留三位小数，以“m³”为单位保留两位小数，以“台”、“套”为单位取整数。"},{"id":"319","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），下列属于其他项目清单内容的有（ ）。","answer":"ABDE","difficulty":"中","options":{"A":"暂列金额","B":"暂估价","C":"规费","D":"计日工","E":"总承包服务费"},"explanation":"其他项目清单包括暂列金额、暂估价、计日工、总承包服务费；规费单独列项。"},{"id":"320","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），关于工程量清单计价规范与计算规范的配合使用，下列说法正确的有（ ）。","answer":"ABCE","difficulty":"难","options":{"A":"计算规范规定工程量计算规则","B":"计价规范规定计价方法和程序","C":"两者应配套使用","D":"计价规范替代计算规范","E":"工程量清单应同时满足两本规范"},"explanation":"计算规范管“算量”，计价规范管“计价”，两者配套使用，缺一不可。"},{"id":"321","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，造价管理是自火电基建项目开展前期工作至竣工验收为止的全过程、全方位、全要素的管理工作，主要包括（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"投资估算管理","B":"概算管理","C":"合同管理","D":"结算管理","E":"施工组织设计管理"},"explanation":"指引“三、总体要求”第2条：造价管理主要包括投资估算管理、概算管理、合同管理、结算管理、设计定（限）额管理等内容。"},{"id":"322","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，下列属于项目建设单位造价管理组织机构中计划部职责的有（ ）。","answer":"ABCE","difficulty":"中","options":{"A":"组织编制、报送管理概算","B":"组织编制工程、服务类标段招标文件","C":"负责设计变更、合同外的零星委托项目等费用的动态管理","D":"负责甲供物资核销","E":"负责编制、报送项目竣工结算报告"},"explanation":"指引“三、项目建设单位造价管理体系”第（一）条计划部职责包括A、B、C、E；D项甲供物资核销属于物资部职责。"},{"id":"323","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，发生下列情况之一，对工程投资影响较大并超出基本预备费，结合概算执行的总体情况可调整设计概算的有（ ）。","answer":"ABCD","difficulty":"难","options":{"A":"国家政策、法律法规发生变化","B":"发生不可抗力因素","C":"工程建设条件、方案、标准和规模发生重大变化","D":"集团公司批复的专题专项费用","E":"由于勘察、设计、施工等单位过失增加投资的"},"explanation":"指引“四、概（估）算管理”第2.2条：发生下列情况之一...可调整设计概算，包括A、B、C、D；E项属于不予调整情形。"},{"id":"324","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，关于工程量清单编制，下列说法正确的有（ ）。","answer":"ACDE","difficulty":"中","options":{"A":"工程量清单应包含准确的项目编码、项目名称、项目特征、计量单位和工程量等内容","B":"设置材料暂估价无需在工程量清单中特别注明","C":"存在甲供物资的标段，需在工程量清单中醒目位置予以明确","D":"造价咨询单位负责复核设计单位提交的工程量清单","E":"计划部组织设计单位和造价咨询单位共同修正工程量清单"},"explanation":"指引“五、合同管理”第2.1条：工程量清单编制要求，B项错误，暂估价需在清单中醒目位置明确。"},{"id":"325","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，下列属于设计变更按性质划分类型的有（ ）。","answer":"ABC","difficulty":"易","options":{"A":"重大设计变更（单项变更费用增减超过1000万元等）","B":"重要设计变更（单项变更引起费用变化超过200万元及以上）","C":"一般设计变更","D":"紧急设计变更","E":"计划内设计变更"},"explanation":"指引“五、合同管理”第2.1条：设计变更按性质划分为重大设计变更（单项变更费用增减超过1000万元等）、重要设计变更（单项变更引起费用变化超过200万元及以上）和一般设计变更。"},{"id":"326","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，关于过程结算，下列说法正确的有（ ）。","answer":"ABCE","difficulty":"中","options":{"A":"过程结算原则上按单位工程进行结算","B":"单位工程或分部工程验收后35天内完成过程结算","C":"施工单位应在验收合格后14天内提交过程结算文件","D":"监理单位应在收到过程结算文件后14天内完成审核","E":"过程结算书作为合同完工结算书的组成部分，完工结算不应对其重新计量、计价"},"explanation":"指引“五、合同管理”第2条：监理单位应在收到过程结算文件后7天内完成审核，D项14天错误；A、B、C、E正确。"},{"id":"327","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，关于竣工结算，下列说法正确的有（ ）。","answer":"BD","difficulty":"中","options":{"A":"项目投产三个月内应完成竣工结算","B":"项目投产六个月内应完成竣工结算","C":"项目建设单位物资部负责编制竣工结算报告","D":"项目建设单位计划部负责牵头完成工程竣工结算工作","E":"二级单位审批竣工结算报告后无需备案"},"explanation":"指引“六、竣工结算管理”：项目投产六个月内完成竣工结算（A错B对）；计划部负责牵头完成竣工结算工作（C错D对）；二级单位审批后向集团公司技经中心和工程部备案（E错）。"},{"id":"328","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，关于合同价款调整，下列属于可调整事项的有（ ）。","answer":"ABCE","difficulty":"中","options":{"A":"法律法规变化","B":"工程变更","C":"工程量偏差","D":"提前竣工（赶工补偿）","E":"价格变化"},"explanation":"指引附录“第三部分：工程量清单”附录A.1.1，提前竣工（赶工补偿）为“不调整”，其他A、B、C、E均为可调整。"},{"id":"329","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，下列属于安全文明施工费使用管理要求的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"施工单位进场施工30日内，提供安全文明施工费用使用计划","B":"预付本年度安全文明施工费用的50%","C":"提报安全文明施工费支付申请时需提交发票等投入证明材料","D":"按照“投入多少支付多少”的原则验收合格后支付","E":"安全文明施工费作为可竞争性费用"},"explanation":"指引附录附件18第6条：安全文明施工费用为专项费用，不得低于规定标准，E项错误；A、B、C、D均正确。"},{"id":"330","question":"根据《中国华能集团有限公司火电工程造价管理工作指引》，关于风险包干费，下列说法正确的有（ ）。","answer":"ABD","difficulty":"难","options":{"A":"风险包干费在报价表中无论有无填写，均认为包含在总报价中，不再调整","B":"风险包干费包括由于施工图工程量比招标工程量增加或减少对综合单价的影响","C":"风险包干费包括人工费价格变化超过5%的部分","D":"风险包干费包括可能出现的由于设计、图纸等造成的连续56天以内的停工、窝工损失费","E":"风险包干费包括不可抗力造成的损失"},"explanation":"指引附录“第三部分：工程量清单”附录B.1.4，C项人工费调整有专门办法，不属于风险包干费范畴；E项不可抗力有专门调整规定；A、B、D正确。"},{"id":"331","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，本工作指引的编制依据主要包括（ ）。","answer":"BCDE","difficulty":"中","options":{"A":"工作手册","B":"行业有关标准规范","C":"集团公司相关制度","D":"火电行业有关标准规范","E":"电力行业有关标准规范"},"explanation":"指引“前言”及“第三部分 工作程序”审查依据中明确，编制依据包括国家法律法规、行业标准规范、电力行业标准规范、火电行业标准规范及集团公司相关制度，无工作手册。"},{"id":"332","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，工程技经中心在招标文件审查工作中的职责包括（ ）。","answer":"ABCE","difficulty":"中","options":{"A":"确定审查方式，筹建审查团队","B":"组织审查招标文件，形成会议纪要","C":"复核二级单位提出的最高投标限价设置意见并提交工程部","D":"未经审查的招标文件提交工程部","E":"审定项目建设单位对投标单位标前澄清的回复"},"explanation":"指引“第二部分 工作职责”第一条第1至5款完整列出了工程技经中心的五项职责。未经审查的招标文件提交工程部错误"},{"id":"333","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，招标文件审查应遵循的原则包括（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"依法合规","B":"实事求是","C":"科学合理","D":"客观公正","E":"低价优先"},"explanation":"指引“第四部分 审查要求”第1条：遵循“依法合规、实事求是、科学合理、客观公正”的原则。"},{"id":"334","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，招标文件审查会参会人员应包括（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"工程技经中心","B":"二级单位","C":"项目建设单位","D":"设计单位","E":"项目经理"},"explanation":"指引“第四部分 审查要求”第3条：参会人员应包括工程技经中心、二级单位、项目建设单位、设计单位、造价咨询单位、审查专家等相关人员。E项审查专家包含在内，不包含项目经理。"},{"id":"335","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，关于勘察设计招标文件审查，下列属于评分因素分组的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"总交土建组","B":"机务组（机炉部分）","C":"机务组（输煤、除灰、脱硫、脱硝部分）","D":"电气热控组","E":"采购组"},"explanation":"指引“第五部分 审查要点”第（一）条第1款第6项明确列出了以上5个评分因素分组，此外还有化学组，不含采购组。"},{"id":"336","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，下列属于勘察设计招标文件要求投标单位通过专题报告形式呈现的优化设计专题的有（ ）。","answer":"ABDE","difficulty":"难","options":{"A":"厂区总平面布置优化","B":"主机选型","C":"四大管道检测","D":"DCS一体化研究","E":"智慧电厂"},"explanation":"指引“第五部分 审查要点”第（一）条第2款第4项列举了30余个专题，以上选项均为其中内容。不包含四大管道检测。"},{"id":"337","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，关于施工标招标文件商务部分审查要点，下列说法正确的有（ ）。","answer":"ABCE","difficulty":"中","options":{"A":"招标范围应明确，标段划分和施工分界应清晰","B":"项目工期、里程碑节点应准确，符合集团公司要求","C":"投标人资质等级、业绩要求应设置合理","D":"评标专家确定方式、中标候选人数量不应明确","E":"工程量清单应符合初步设计成果，无缺、漏、错项"},"explanation":"指引“第五部分 审查要点”第（三）条第1款第1、2、3、7项中均有规定，A、B、C、E均为正确表述。D选项评标专家确定方式、中标候选人数量应明确。"},{"id":"338","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，关于施工标招标文件安全管理部分审查要点，下列说法正确的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"应明确安全目标，建立完善的安全生产责任体系","B":"安全管理人员、特种作业人员的资质要求应明确","C":"危大工程、高危作业的安全管控应符合规程规范要求","D":"安全文明措施费的提取比例、日常使用要求应明确","E":"安全生产管理协议应结合项目公司最新安全管理要求拟定"},"explanation":"指引“第五部分 审查要点”第（三）条第2款第1项第（1）至（5）款完整列出了安全管理审查要点。选项E应结合集团公司最新安全管理要求拟定。"},{"id":"339","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，关于施工标招标文件质量管理部分审查要点，下列说法正确的有（ ）。","answer":"ABDE","difficulty":"中","options":{"A":"质量标准、达标创优、科技研发成果要求应明确","B":"引用国家、行业的质量标准及验收规范应准确、全面","C":"满足工程建设标准","D":"缺陷的处理要求、处理期限和验收标准等应明确","E":"对工程验收、资料归档的要求应具体、明确"},"explanation":"指引“第五部分 审查要点”第（三）条第2款第2项第（1）至（5）款完整列出了质量管理审查要点。选项C应为样板工程建设标准应明确。"},{"id":"340","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，关于监理服务标招标文件审查，下列说法正确的有（ ）。","answer":"ABDE","difficulty":"中","options":{"A":"招标范围应包含项目全过程监理","B":"总监理工程师、专职安全副总监等关键人员的资格要求应设置合理","C":"监理考核细则中应减少考核金额","D":"暂定监理服务期内人月数应按工程规模、建设工期合理设置","E":"需要监理旁站的项目应根据工程实际需求设置"},"explanation":"指引“第五部分 审查要点”第（二）条第1款和第2款中均有相关规定，A、B、D、E均为正确表述。选项C应为监理考核细则中考核金额应合理、可执行"},{"id":"341","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，关于招标文件审查后的修改完善，下列说法正确的有（ ）。","answer":"BCD","difficulty":"难","options":{"A":"项目单位应在审查会结束后10个工作日内完成招标文件修改","B":"项目单位应以修订模式或清晰标示出修改的内容","C":"二级单位确认修改后的招标文件后报送工程技经中心复审","D":"工程技经中心在5个工作日内出具复审意见","E":"复审不合格需重新从初审开始履行全部审查程序"},"explanation":"指引“第三部分 工作程序”第（四）条：修改时间为5个工作日（A错）；以修订模式修改（B对）；二级单位确认后报送复审（C对）；复审5个工作日（D对）；复审直至符合要求，不一定是重新初审（E错）。"},{"id":"342","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，关于施工标招标文件技术管理部分审查要点，下列说法正确的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"对重要施工方案、工艺的要求应全面、准确","B":"工区气象环境信息、工程地质勘察试验成果等基础资料应完备、准确","C":"乙供材料品牌短名单应明确，原则上不少于三家","D":"品牌选择应符合国家和集团公司供应链管理有关规定","E":"乙供材料品牌由招标人指定唯一供应商"},"explanation":"指引“第五部分 审查要点”第（三）条第2款第4项：乙供材料品牌短名单原则上不少于三家（C对），品牌选择应符合供应链管理规定（D对），不得指定唯一供应商（E错）；A、B也均为正确表述。"},{"id":"343","question":"根据《中国华能集团有限公司火电建设项目工程及服务类招标文件审查工作指引（试行）》，关于招标文件审查过程中的保密和合规要求，下列说法正确的有（ ）。","answer":"ABCD","difficulty":"中","options":{"A":"招标文件审查时应坚持职业操守","B":"严格遵循工程技经中心“高压线”规定","C":"避免为特定投标人设定专项条款","D":"不得设置不合理条件限制、排斥潜在供应商","E":"可以适当设置倾向性条款以优选供应商"},"explanation":"指引“第四部分 审查要求”第4条：坚持职业操守，严格遵循“高压线”规定，避免为特定投标人设定专项条款，不得设置不合理条件限制、排斥潜在供应"},{"id":"344","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），火力发电工程计量活动，除应遵守本规范外，尚应符合（  ）现行有关标准的规定。","answer":"AB","difficulty":"易","options":{"A":"国家","B":"行业","C":"地方","D":"企业","E":"国际"},"explanation":"根据规范1.0.4条，火力发电工程计量活动，除应遵守本规范外，尚应符合国家、行业现行有关标准的规定。"},{"id":"345","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），初步设计阶段工程量计算的依据包括以下哪些（  ）。","answer":"ABC","difficulty":"中","options":{"A":"本规范各项规定","B":"经审定通过的初步设计图纸及其说明","C":"经审定通过的其他有关技术经济文件","D":"经审定通过的施工组织设计或施工方案","E":"经审定通过的施工图设计图纸"},"explanation":"根据规范3.0.2条，初步设计阶段工程量计算除依据本规范各项规定外，尚应依据以下文件：1经审定通过的初步设计图纸及其说明。2经审定通过的其他有关技术经济文件。"},{"id":"346","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），火力发电工程，施工图阶段工程量计算的依据包括以下哪些（  ）。","answer":"ABCD","difficulty":"中","options":{"A":"本规范各项规定","B":"经审定通过的施工图设计图纸及其说明","C":"经审定通过的施工组织设计或施工方案","D":"经审定通过的其他有关技术经济文件","E":"经审定通过的初步设计图纸"},"explanation":"根据规范3.0.3条，施工图阶段工程量计算除依据本规范各项规定外，尚应依据以下文件：1经审定通过的施工图设计图纸及其说明。2经审定通过的施工组织设计或施工方案。3经审定通过的其他有关技术经济文件。"},{"id":"347","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），工程量清单的项目编码共分为五级，以下哪些属于五级编码的组成部分（  ）。","answer":"ABDE","difficulty":"中","options":{"A":"工程专业码","B":"项目划分码","C":"通用码","D":"清单项目码","E":"清单项目特征序码"},"explanation":"根据规范4.2.2条，工程量清单的项目编码共分为五级：第一级工程专业码由一位数字与一位字母组成；第二级项目划分码由四位字母组成；第三级为阶段码，初设阶段编码用C表示，施工图阶段编码用S表示；第四级为清单项目码；第五级为清单项目特征序码，顺序码共两位。"},{"id":"348","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），火力发电工程，编制工程量清单出现附录中未包括的项目，编制人应做补充，并报电力工程造价与定额总站备案。补充的工程量清单需附有以下哪些内容（  ）。","answer":"BCDE","difficulty":"中","options":{"A":"项目","B":"项目特征","C":"计量单位","D":"工程量计算规则","E":"工作内容"},"explanation":"根据规范4.1.4条，编制工程量清单出现附录中未包括的项目，编制人应做补充，并报电力工程造价与定额总站备案。补充的工程量清单需附有补充项目名称、项目特征、计量单位、工程量计算规则、工作内容。"},{"id":"349","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），以下哪些属于本规范建筑工程初步设计阶段清单项目已包含的工作内容，不得另行计算（  ）。","answer":"ABCD","difficulty":"中","options":{"A":"施工中水平运输","B":"施工中垂直运输","C":"建筑物超高施工","D":"施工用脚手架安、拆","E":"超过1km的材料运输"},"explanation":"根据规范4.2.8条，本规范建筑工程初步设计阶段清单项目均包括施工中水平运输、垂直运输、建筑物超高施工等因素，不得另行计算。4.2.9条规定，本规范建筑工程初步设计阶段清单项目均包括施工用脚手架安、拆等工作内容，不得另行计算。"},{"id":"350","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），火力发电工程，以下关于土方工程量计算的说法，正确的有（  ）。","answer":"ABDE","difficulty":"难","options":{"A":"挖、填、运土方工程量，均以挖掘前的自然密实体积计算","B":"建筑物、构筑物基础土方计算工程量，不计算行驶坡道土石方开挖量","C":"当土方挖深小于30m时，不计算放坡挖方量","D":"干土、湿土的划分，以地质勒测资料的地下常水位为准","E":"土方施工综合考虑了平整场地、挖湿土、桩间挖土等因素"},"explanation":"根据规范附录A A.1.1条的注释内容，所有选项的说法均正确。应为当土方挖深小于12m时，不计算放坡挖方量。"},{"id":"351","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），火力发电工程销售收入包括（）","answer":"ABC","difficulty":"易","options":{"A":"售电收入","B":"供热收入","C":"其他产品收入","D":"补贴收入","E":"投资收益"},"explanation":"根据导则3.1.1，销售收入 = 售电收入 + 供热收入 + 其他产品收入"},{"id":"352","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），财务评价的不确定性分析包括（）","answer":"AB","difficulty":"中","options":{"A":"盈亏平衡分析","B":"敏感性分析","C":"概率分析","D":"风险分析","E":"情景分析"},"explanation":"根据导则3.3.1，不确定性分析包括盈亏平衡分析和敏感性分析"},{"id":"353","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），盈利能力分析主要指标包括（）","answer":"ABCD","difficulty":"难","options":{"A":"财务内部收益率","B":"财务净现值","C":"投资回收期","D":"总投资收益率","E":"资产负债率"},"explanation":"根据导则3.2.6，盈利能力指标含财务内部收益率（FIRR）、财务净现值（FNPV)、项目投资回收期、总投资收益率（ROI）、项目资本金净利润率(ROE）。资产负债率属于偿债能力指标。"},{"id":"354","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），财务评价基本报表包括（）","answer":"ABCD","difficulty":"中","options":{"A":"现金流量表","B":"利润与利润分配表","C":"财务计划现金流量表","D":"资产负债表","E":"总成本费用估算表"},"explanation":"根据导则3.2.1，基本报表含现金流量表、利润与利润分配表、财务计划现金流量表和资产负债表。总成本费用表为辅助报表。"},{"id":"355","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），火力发电工程支出包括（）","answer":"ABC","difficulty":"易","options":{"A":"投资","B":"成本费用","C":"税金","D":"补贴","E":"收益"},"explanation":"根据导则3.1.4，工程支出包括投资、成本费用和税金。"},{"id":"356","question":"根据《火力发电工程经济评价导则》（DLT5435-2019），偿债能力分析主要指标包括（）","answer":"ABCD","difficulty":"中","options":{"A":"利息备付率","B":"偿债备付率","C":"资产负债率","D":"流动比率","E":"财务净现值"},"explanation":"根据导则3.2.7， 偿债能力分析的主要指标应包括利息备付率(ICR）、偿债备付率(DSCR)、资产负债率(LOAR）、流动比率和速动比率。"},{"id":"357","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），施工机械按其性能及价值划分为（  ）类。","answer":"BCDE","difficulty":"易","options":{"A":"重要型","B":"特型","C":"大型","D":"中型","E":"小型"},"explanation":"施工机械按其性能及价值划分为特型、大型、中型和小型4类。"},{"id":"358","question":"根据《电力建设工程施工机械台班费用定额》（2018年版），施工机械台班单价包括（  ）类机械 。","answer":"ABCD","difficulty":"中","options":{"A":"水平运输机械","B":"混凝土及砂浆机械","C":"地下工程机械","D":"泵类机械","E":"热力机械"},"explanation":"施工机械台班单价包括土石方及筑路机械、桩工机械、起重机械、水平运输机械、垂直运输机械、混凝土及砂浆机械、加工机械、泵类机械、焊接机械、动力机械、地下工程机械、其他机械、专用机械共计十三类 573 个子目。"},{"id":"359","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），属于编制最高投标限价的计价依据的是（  ）。","answer":"ABCD","difficulty":"易","options":{"A":"国家、行业或地方相关管理部门颁发的计价定额和计价办法","B":"工程造价管理机构发\n布的工程造价信息；\n没有发布的参照市场\n价","C":"与建设项目相关的\n标准、规范、技术\n资料","D":"施工现场情况、工程\n特点及常规施工方案","E":"为项目重大节点可能\n提前实现的特殊赶工\n措施方案"},"explanation":"根据《电力建设工程工程量清单计价规范》\n（2021版）规定，最高投标限价应根据下列依据进行\n编制与复核:\n（1）本规范和现行电力行业工程清单计算规范；\n（2）国家或省级、行业建设主管部门颁发的计价依据及其计价办法； \n（3）电力建设工程设计文件及相关资料；\n（4）拟定的招标文件及招标工程量清单；\n（5）与电力建设项目相关的标准、规范、技术资料；\n（6）施工现场情况、工程特点及常规施工方案；\n（7）工程造价信息或市场价格信息；\n（8）其他的相关资料。"},{"id":"360","question":"根据《电力建设工程工程量清单计算规范 火力发电工程》（DL/T 5369-2021），编制工程竣工结算的依据有（  ）。","answer":"ABCE","difficulty":"易","options":{"A":"现行电力行业工程量清单计价规范","B":"工程合同","C":"招标文件","D":"承包人已确认的工\n程量和追加的合同\n价款","E":"投标文件"},"explanation":"根据《电力建设工程工程量清单计算规范》\n（2021版） 竣工结算按照下列依据进行编制与复核:\n(1)本规范和现行电力行业工程量清单计算规范。\n(2)工程合同及补充协议。\n(3)发承包双方已确认的施工过程结算价款。\n(4)发承包双方实施过程中已确认的工程量及其结算的合同价款。\n(5)发承包双方实施过程中已确认调整后追加 (减)的合同价款\n（6）建设工程设计文件及相关资料。\n（7）工程招投标文件。\n（8）其他相关依据。"},{"id":"361","question":"根据《电力工程造价从业人员职业能力培训教材—发电建筑工程》（2021版），发电建筑工程中建筑工程量计算规则通常考虑的因素包括（ ）。","answer":"ABCE","difficulty":"中","options":{"A":"施工图纸标注尺寸","B":"工程实际做法、设计变更","C":"定额规定的计量单位","D":"现场施工环境","E":"规范标准中的计算原则"},"explanation":"根据《发电建筑工程》教材，建筑工程量计算需综合考虑施工图设计尺寸、设计变更、定额计量单位要求、规范标准中的计算原则（如计算基数、扣除开口部位等）以及工程实际做法。五者均是准确计算工程量的关键因素。"},{"id":"362","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版）的规定，建设项目总投资估算中，属于动态部分的费用项目有（ ）。","answer":"CD","difficulty":"中","options":{"A":"工程费用","B":"流动资金","C":"价差预备费","D":"建设期利息","E":"工程建设其他费用"},"explanation":"动态投资部分包括价差预备费和建设期利息两部分。"},{"id":"363","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程计价的依据有多种不同类型，其中工程单价的计算依据有（ ）。","answer":"ACD","difficulty":"中","options":{"A":"材料价格","B":"投资估算指标","C":"机械台班费","D":"人工单价","E":"概算定额"},"explanation":"本题考查计价依据的复杂性。其中工程单价计算依据。包括人工单价、材料价格、材料运杂费、机械台班费等。而人工、材料、机械等实物消耗量计算依据，包括投资估算指标、概算定额、预算定额等。"},{"id":"364","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，关于列入建设工程概算的安全作业环境及安全施工措施所需的费用，施工方应当用于（ ）。","answer":"ACE","difficulty":"易","options":{"A":"安全生产条件改善","B":"专职安全管理人员工资发展","C":"施工安全设施更新","D":"安全事故损失赔付","E":"施工安全防护用具采购"},"explanation":"应当用于施工安全防护用具及设施的采购和更新、安全施工措施的落实、安全生产条件的改善，不得挪做他用。"},{"id":"365","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列关于造价构成中，属于设备运杂费的有（ ）。","answer":"BCDE","difficulty":"中","options":{"A":"进口设备由出口国口岸运至进口国口岸的运费","B":"在设备原价中没有包含为运输而进行的包装支出的各种费用","C":"设备供销部门手续费","D":"国产设备由设备制造厂交货地点起至施工现场的运费","E":"设备检验试验费"},"explanation":"本题考查的是进口设备原价的构成及计算。设备运杂费通常由下列各项构成：运费和装卸费；包装费；设备供销部门的手续费；采购与仓库保管费。选项A,国外采购设备自到岸港运至工地仓库或指定堆放地点发生的采购、运输、运输保险、保管、装卸等费用；选项D,国产设备由设备制造厂交货地点起至工地仓库的运费。"},{"id":"366","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，下列各项中，可以作为工程计量依据的是（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"合同图纸","B":"工程变更令","C":"技术规范","D":"质量合格证书","E":"工程接收证书"},"explanation":"工程计量的依据包括：  工程量清单及说明、合同图纸、工程变更令及其修订的工程量清单、合同条件、技术规范、有关计量的补充协议、质量合格证书等。"},{"id":"367","question":"根据《电力建设工程概算定额—建筑工程》（2018年版），建筑工程给排水（含常规水消防）中，属于材料的是（  ）。","answer":"ABCD","difficulty":"易","options":{"A":"水表","B":"阀门","C":"水泵接合器","D":"生活消防水箱","E":"水泵"},"explanation":"建筑工程给排水（含常规水消防）  中，水表、流量计、压力表、阀门、卫生器具、室内消火栓、水泵接合器、生活消防水箱等定义为材料；水泵、稳压器、水处理装置、水处理装置、水净化装置定义为设备。"},{"id":"368","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，在工程量清单编制中，关于其他项目清单的编制，下列说法正确的有（ ）。","answer":"BDE","difficulty":"易","options":{"A":"采用费率方式计价的暂列金额，可直接填写“暂定金额”","B":"专业工程暂估价应按招标文件的说明分专业列项","C":"发包人提供材料、专业分包工程总承包服务费按费率计量的，应以暂估价作为计价基","D":"直接发包的专业工程的总承包服务费宜以项计量","E":"发包人提供材料的总承包服务费可按承包人负责安装和承包人不负责安装分别列"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，选项 A 错误，由招标人填写“暂定金额”总额，采用费率计价方式计算暂定金额的， 应分别填“计算基础”“费率”，并计算填写“暂定金额”；采用总价计价方式计算暂定金额的， 可直接填写“暂定金额”；选项 C 错误，发包人提供材料、专业分包工程总承包服务费按费率计量 的，宜以暂估价作为计价基础。"},{"id":"369","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，66kV、154kV 定额调整说法正确的有（   ）。","answer":"AB","difficulty":"中","options":{"A":"66kV 按 110kV×0.88","B":"154kV 按 220kV×0.9","C":"66kV 按 110kV×0.9","D":"154kV 按 220kV×0.88","E":"均不调整"},"explanation":"《电力建设工程概算定额》（2018年版），总说明规定：66KV没有相应定额子目的可按110KV相应定额子目乘以系数0.88，154KV可按220KV相应定额子目乘以系数0.9."},{"id":"370","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，变压器安装中可调整系数的情形有（   ）。","answer":"ABC","difficulty":"中","options":{"A":"带负荷调压","B":"户内安装","C":"散热器分体","D":"油浸式","E":"干式"},"explanation":"《电力建设工程概算定额》（2018年版），分别 ×1.1、×1.3、×1.1"},{"id":"371","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，发电机电气工作内容包括（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"本体接线","B":"静态励磁","C":"接地","D":"单体调试","E":"出口断路器"},"explanation":"《电力建设工程概算定额》（2018年版），不含出口断路器"},{"id":"372","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，电抗器安装工作内容包括（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"本体安装","B":"油过滤","C":"接地","D":"单体调试","E":"干燥"},"explanation":"《电力建设工程概算定额》（2018年版），不含干燥"},{"id":"373","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，GIS 安装工作内容包括（   ）。","answer":"ABDE","difficulty":"中","options":{"A":"本体安装","B":"抽真空","C":"测绝缘","D":"接地","E":"单体调试"},"explanation":"《电力建设工程概算定额》（2018年版），第 3 章全部包含"},{"id":"374","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，断路器安装工作内容包括（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"本体安装","B":"接地","C":"油 / SF6 处理","D":"单体调试","E":"支架制作"},"explanation":"《电力建设工程概算定额》（2018年版），不含支架"},{"id":"375","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，隔离开关安装工作内容包括（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"本体安装","B":"引下线","C":"接地","D":"单体调试","E":"支架制作"},"explanation":"《电力建设工程概算定额》（2018年版），不含支架"},{"id":"376","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，装置性材料包括（   ）。","answer":"ABDE","difficulty":"中","options":{"A":"设备引下线","B":"金具","C":"计价材料","D":"电缆","E":"绝缘子"},"explanation":"《电力建设工程概算定额》（2018年版），装置性 = 未计价材料"},{"id":"377","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，接地安装材质说法正确的有（   ）。","answer":"ABC","difficulty":"中","options":{"A":"500kV 及以下按扁钢","B":"750kV 及以上按铜接地","C":"直流设备按铜接地","D":"均按扁钢","E":"均按铜接地"},"explanation":"《电力建设工程概算定额》（2018年版），总说明规定"},{"id":"378","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，SF6 全封闭组合电器（GIS）计量规则包括（   ）。","answer":"ABC","difficulty":"中","options":{"A":"带断路器按断路器台数","B":"不带断路器按互感器 + 避雷器组数","C":"预留间隔按 1 台","D":"按电压等级","E":"按间隔数"},"explanation":"《电力建设工程概算定额》（2018年版），第 3 章说明"},{"id":"379","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，高压电抗器按电压等级包括（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"110kV","B":"330kV","C":"500kV","D":"750kV","E":"220V"},"explanation":"《电力建设工程概算定额》（2018年版），第 2 章子目全覆盖"},{"id":"380","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，建设工程施工发承包造价由（   ）组成。","answer":"ABCD","difficulty":"中","options":{"A":"分部分项工程费","B":"措施项目费","C":"其他项目费","D":"规费","E":"税率"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第3.1.1 条，建设工程施工发承包造价由分部分项工程费、措施项目费、其他项目费、规费和税金组成"},{"id":"381","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程量清单包括（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"分部分项清单","B":"措施项目清单","C":"其他项目清单","D":"规费清单","E":"增值税"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第 4.1.4 条，工程量清单应由分部分项工程量清单、措施项目清单、其他项目清单、规费项目清单、税金项目清单组成"},{"id":"382","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，其他项目清单包含（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"暂列金额","B":"暂估价","C":"计日工","D":"总承包服务费","E":"现场签证"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第 4.4.1 条，其他项目清单应按照下列内容列项： 1 暂列金额； 2 暂估价：包括材料暂估单价、工程设备暂估单价、专业工程暂估价； 3 计日工； 4 总承包服务费。"},{"id":"383","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，规费项目清单包含（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"工程排污费","B":"社会保障费","C":"住房公积金","D":"工伤保险","E":"营业税"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第4.5.1 条，规费项目清单应按照下列内容列项： 1 工程排污费； 2 社会保障费：包括养老保险费、失业保险费、医疗保险费； 3 住房公积金； 4 工伤保险"},{"id":"384","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，合同价款调整事项包括（   ）。","answer":"ABCE","difficulty":"中","options":{"A":"法律法规变化","B":"工程变更","C":"物价变化","D":"合同价款","E":"工期延误"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第9.1.1 条，以下事项（但不限于）发生，发承包双方应当按照合同约定调整合同价款： 1．法律法规变化；2．工程变更； 3．项目特征描述不符； 4．工程量清单缺项；5．工程量偏差； 6．物价变化； 7．暂估价； 8．计日工； 9．现场签证；10．不可抗力；11．提前竣工（赶工补偿）； \n12．误期赔偿；13．施工索赔； 14．暂列金额； 15．发承包双方约定的其他调整事项。"},{"id":"385","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，不可抗力导致的费用，由发包人承担的有（   ）。","answer":"ABD","difficulty":"中","options":{"A":"工程本身损害","B":"第三方损失","C":"承包人设备损坏","D":"清理修复费用","E":"承包人人员伤亡"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第9.11.1 条，因不可抗力事件导致的费用，发、承包双方应按以下原则分别承担并调整工程价款。 １．工程本身的损害、因工程损害导致第三方人员伤亡和财产损失以及运至施工场地用于施工的材料和待安装的设备的损害，由发包人承担； ２．发包人、承包人人员伤亡由其所在单位负责，并承担相应费用； ３．承包人的施工机械设备损坏及停工损失，由承包人承担； ４．停工期间，承包人应发包人要求留在施工场地的必要的管理人员及保卫人员的费用由发包人承担； ５．工程所需清理、修复费用，由发包人承担；"},{"id":"386","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，投标报价编制依据包括（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"企业定额","B":"招标文件","C":"设计文件","D":"市场价格","E":"中标价"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第6.2.1 条，投标报价应根据下列依据编制和复核： 1 本规范； 2 国家或省级、行业建设主管部门颁发的计价办法； \n3 企业定额，国家或省级、行业建设主管部门颁发的计价定额； 4 招标文件、工程量清单及其补充通知、答疑纪要； \n5 建设工程设计文件及相关资料； 6 施工现场情况、工程特点及拟定的投标施工组织设计或施工方案； 7 与建设项目相关的标准、规范等技术资料；8 市场价格信息或工程造价管理机构发布的工程造价信息； 9 其他的相关资料。"},{"id":"387","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程计量方式包括（    ）。","answer":"AB","difficulty":"中","options":{"A":"按月计量","B":"按形象进度计量","C":"按季度计量","D":"按年度计量","E":"按节点计量"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第8.1.2 条，工程计量可选择按月或按工程形象进度分段计量，具体计量周期在合同中约定"},{"id":"388","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，暂估价分为（    ）。","answer":"ABC","difficulty":"中","options":{"A":"材料暂估单价","B":"工程设备暂估单价","C":"专业工程暂估价","D":"服务暂估价","E":"人工暂估价"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第2.0.7 条，招标人在工程量清单中提供的用于支付必然发生但暂时不能确定价格的材料、工程设备的单价以\n及专业工程的金额。"},{"id":"389","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，计日工包含（    ）。","answer":"ABC","difficulty":"中","options":{"A":"人工","B":"材料","C":"施工机械","D":"税金","E":"利润"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第2.0.18 条，“计日工”是对零星项目或工作采取的一种计价方式，包括完成作业所需的人工、材料、施工机械及其费用的计价，类似于定额计价中的签证记工。"},{"id":"390","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，现场签证的适用情形有（    ）。","answer":"ABE","difficulty":"中","options":{"A":"合同外零星项目","B":"非承包人责任事件","C":"工程变更","D":"现场返工","E":"发包人指令"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第9.8.1 条，承包人应发包人要求完成合同以外的零星项目、非承包人责任事件等工作的，发包人应及时以书面形式向承包人发出指令，提供所需的相关资料；承包人在收到指令后，应及时向发包人提出现场签证要求。"},{"id":"391","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，工程款中期支付包括（    ）。","answer":"ABCD","difficulty":"中","options":{"A":"预付款","B":"安全文明施工费","C":"总承包服务费","D":"进度款","E":"结算款"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第 10 章，中期支付含四项，结算款为竣工支付"},{"id":"392","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，竣工结算与支付包括（   ）。","answer":"ABCD","difficulty":"中","options":{"A":"竣工结算","B":"结算款支付","C":"质量保证金","D":"最终结清","E":"预付款"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第11 章，竣工结算含四项内容"},{"id":"393","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，合同价款争议解决方式有（    ）。","answer":"BCDE","difficulty":"中","options":{"A":"讨论","B":"调解","C":"仲裁","D":"诉讼","E":"造价鉴定"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第 13 章，包含协商、调解、仲裁、诉讼、造价鉴定争议解决方式"},{"id":"394","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，不可竞争性费用包括（    ）。","answer":"ABC","difficulty":"中","options":{"A":"安全文明施工费","B":"规费","C":"税金","D":"暂列金额","E":"暂估价"},"explanation":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，第3.2.6，安全文明施工费、临时设施费必须按国家或省级、行业建设主管部门的规定计算,不得作为竞争性费用。3.1.5 规费和税金应按国家或省级、行业建设主管部门的规定计算，不得作为竞争性费用。"},{"id":"395","question":"根据《电力建设工程施工机械台班费用定额》（2018年版），定额台班单价由两类费用组成，其中第一类费用包括（  ）。","answer":"ACD","difficulty":"中","options":{"A":"折旧费","B":"人工费","C":"维护费","D":"安拆费及场外运费","E":"燃料动力费"},"explanation":"《电力建设工程施工机械台班费用定额》（2018年版），定额台班单价由两类费用组成，其中第一类费用包括折旧费、检修费、维护费、安拆费及场外运费。"},{"id":"396","question":"根据《电化学储能电站经济评价导则》（DL/T 2919-2025）和《压缩空气储能电站经济评价导则》（DL/T 2921-2025），下列哪些运营期成本、税费是压缩空气储能电站独有的（  ）。","answer":"CDE","difficulty":"中","options":{"A":"土地使用税","B":"更换电池费用","C":"补热费用","D":"储气库租赁费用","E":"生产用水费用"},"explanation":"结合储能的工作原理，补热、用水、储气库租赁是压缩空气储能独有的费用"},{"id":"397","question":"根据《国家发展改革委 国家能源局关于建立煤电容量电价机制的通知》（发改价格〔2023〕1501号），关于纳入受电省份电力电量平衡的跨省跨区外送煤电机组的容量电费，以下说法正确的有（  ）。","answer":"ABDE","difficulty":"难","options":{"A":"送受双方应当签订年度及以上中长期合同，明确煤电容量电费分摊比例和履约责任等内容","B":"配套煤电机组原则上执行受电省份容量电价，容量电费由受电省份承担。","C":"配套煤电机组原则上执行送电省份容量电价，容量电费由受电省份承担。","D":"配套煤电机组向多个省份送电的，容量电费可暂按受电省份分电比例分摊，鼓励探索按送电容量比例分摊。","E":"配套每单机组以外的其他煤电机组，原则上执行送电省份容量电价，容量电费由送、受方合理分摊，分摊比例考虑送电省份外送电量占比、高峰时段保障受电省份用电情况等因素协商确定。"},"explanation":"根据《国家发展改革委 国家能源局关于建立煤电容量电价机制的通知》（发改价格〔2023〕1501号），对纳入受电省份电力电量平衡的跨省跨区外送煤电机组，送受双方应当签订年度及以上中长期合同，明确煤电容量电费分摊比例和履约责任等内容。其中：（1）配套煤电机组，原则上执行受电省份容量电价，容量电费由受电省份承担。向多个省份送电的，容量电费可暂按受电省份分电比例分摊，鼓励探索按送电容量比例分摊。（2）其他煤电机组，原则上执行送电省份容量电价，容量电费由送、受方合理分摊，分摊比例考虑送电省份外送电量占比、高峰时段保障受电省份用电情况等因素协商确定。"},{"id":"398","question":"根据《电力建设工程工程量清单计价规范》（DL/T 5745-2021）中规定，全费用综合单价中包括的内容是（ ）。","answer":"ABCD","difficulty":"易","options":{"A":"人工费和材料费","B":"施工机具使用费","C":"企业管理费和利润","D":"规费和税金","E":"甲供材料费"},"explanation":"全费用综合单价是指完成一个合同约定目标的工程量清单项目所需的人工费、材料费（不包甲供材）、施工机具使用费和措施费、企业管理费、规费、利润及增值税。"}],"short":[{"id":"1","question":"根据《中国华能集团有限公司火电基本建设工程造价管理细则》（HN-03-HDXM042-2024）中规定，管理概算编制的原则和控制要求是什么？","answer":"管理概算需在设计概算基础上，综合考虑市场行情、企业标准和管理成果，遵循客观合理、先进适度的原则编制。管理概算应控制在设计概算之内。","difficulty":"易","category":"基建造价管理","explanation":"管理概算需在设计概算基础上，综合考虑市场行情、企业标准和管理成果，遵循客观合理、先进适度的原则编制。管理概算应控制在设计概算之内。"},{"id":"2","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》（HN-03-HDXM043-2024）中规定，设计概算和管理概算的核心区别是什么？","answer":"设计概算是按初步设计与行业规定计算的投资，是竣工结算、审计、验收的根据；管理概算是在设计概算基础上结合市场、企业标准编制的内部造价控制目标，用于内控、预算、考核。","difficulty":"易","category":"基建估（概）算","explanation":"设计概算是指按照初步设计方案和《火力发电工程建设预算编制与计算规定》等计算的工程投资。设计概算是项目竣工决算、竣工决算审计和竣工验收的根据。管理概算是在设计概算基础上，综合考虑市场行情、企业标准和管理成果计算的工程投资。管理概算是集团公司内部造价控制目标，是造价控制、预算下达、造价绩效考核、竣工决算、竣工决算审计、管理评价、绩效考核和竣工验收的根据。"},{"id":"3","question":"根据《中国华能集团有限公司火电基本建设工程结算管理细则》（HN-03-HDXM055-2024）中规定，工程变更中合同规定允许调整的工程变更费用的估价原则是什么？","answer":"1.合同有适用项目，按合同单价执行；2.无适用，有类似项目，参考类似项目单价；3.无类似项目，按合同约定定额、取费、下浮系数组价；","difficulty":"易","category":"基建结算管理","explanation":"工程变更引起的费用变化，合同规定不允许调整的部分已在合同价格结算中一并考虑，不再另行调整结算；合同规定允许调整的部分，除合同另有约定外，按照以下原则调整结算：\n1.合同清单中有适用于变更工作的项目时，应以合同中规定的单价（价格）进行结算；\n2.合同清单中无适用于变更工作的项目时，应在合理的范围内参考类似项目单价（价格）进行估价，经协商确定后进行结算；\n3.合同清单中无类似项目可供参考时，应根据施工图工程量，按施工合同约定的预算定额、综合取费费率和下浮系数进行结算，其中人材机取费标准按合同基准日执行；合同双方应严格履行工程变更的管理程序，并在实施前明确具体的估价原则，同时确保已含在合同价格内的变更费用不重复结算。"},{"id":"4","question":"根据《电力建设工程概算定额—电气设备安装工程》（2018年版）中，人工分为哪两类？单价分别是多少？","answer":"分为安装普通工和安装技术工两类。安装普通工 70 元 / 工日，安装技术工 107 元 / 工日","difficulty":"中","category":"概算定额","explanation":"总说明第九条：关于人工：（1）人工用量包括施工基本用工和辅助用工，分为安装普通工和安装技术工。（2）工日为8小时工作制，安装普通工单价为70元/工日，安装技术工单价为107元/工日。"},{"id":"5","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：简述工程量清单的定义。","answer":"载明建设工程的分部分项工程项目、措施项目、其他项目的名称和相应数量等的明细清单","difficulty":"易","category":"清单计价规范","explanation":"《电力建设工程工程量清单计价规范》DL/T5475-2021 2.0.1 条术语定义，工程量清单：载明建设工程的分部分项工程项目、措施项目、其他项目的名称和相应数量等的明细清单。"},{"id":"6","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：简述全费用综合单价的构成。","answer":"完成一个规定清单项目所需的人工费、材料费（不含甲供材）、施工机械使用费和措施费、企业管理费、规费、利润、税金以及约定范围内的风险费用。","difficulty":"易","category":"清单计价规范","explanation":"《电力建设工程工程量清单计价规范》DL/T5475-2021 2.0.5 条完成一个规定清单项目所需的人工费、材料费（不含甲供材）、施工机械使用费和措施费、企业管理费、规费、利润、税金以及约定范围内的风险费用。"},{"id":"7","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：招标工程量清单的编制责任由谁承担？","answer":"由具有编制能力的招标人或受其委托，具有相应资质的工程造价咨询人或招标代理人编制，准确性和完整性由招标人负责","difficulty":"易","category":"清单计价规范","explanation":"《电力建设工程工程量清单计价规范》DL/T5475-2021 4.1.1条，招标工程量清单应由具有编制能力的招标人或受其委托，具有相应资质的工程造价咨询人或招标代理人编制。规范4.1.2 条，招标工程量清单必须作为招标文件的组成部分，其准确性和完整性由招标人负责。"},{"id":"8","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：合同价款约定的主要内容有哪些?","answer":"1. 预付工程价款；2. 安全文明施工费及临时设施费；3. 进度款；4. 合同价款的调整；5. 索赔和现场签证；6.合同工程风险分担；7.施工过程结算；8.竣工结算；9. 工程质量保证金；10工程担保；11. 违约责任及合同争议；12.工期奖惩；13.不可抗力；14.其他事项","difficulty":"中","category":"清单计价规范","explanation":"《电力建设工程工程量清单计价规范》DL/T5475-2021版7.2.1   发承包双方应在合同条款中对下列事项进行约定 ：\n1.预付工程价款的比例或金额 、支付时间 、扣回方式及其时限 。\n2.安全文明施工费 、临时设施费的使用要求 、支付计划 、抵扣方式及其时限 。\n3.进度款的计量、计价、支付时间、程序和方法 。\n4.合同价款的调整因素、方法、程序、支付及时间 。\n5.索赔与现场签证的程序 、金额确定与支付时间 。\n6.合同工程风险分担的内容、范围 （幅度）以及超出约定时的调整办法 。\n7.施工过程结算、计量、计价的原则和方式 ，支付及时间 。\n8.竣工结算、计量、计价的原则、方式、支付及时间 。\n9.工程质量保证金的数额、保证方式、预留方式及其时间 。\n10.工程担保的方式、种类、提供时间及相关费用 责任、返回时间 。\n11.违约责任以及发生合同价格争议的解决方法及其时限 。\n12.工期提前或延后的奖惩办法。\n13.不可抗力的事件约定、费用承担说明及计价办法 。\n14 与履行合同、支付价款的其他相关事项 。"},{"id":"9","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：工程量偏差调整的原则是什么?","answer":"工程量增加 15% 以上时，增加部分的综合单价调低；工程量减少 15% 以上时，减少后剩余部分的综合单价调高","difficulty":"易","category":"清单计价规范","explanation":"《电力建设工程工程量清单计价规范》DL/T5475-2021版 9.6.2 条,对于任一招标工程量清单项目，如果因本条规定的工程量偏差和第 9.3 条规定的工程变更\n等原因导致工程量偏差超过 15%，调整的原则为：当工程量增加 15%以上时，其增加部分的工程量的综\n合单价应予调低；当工程量减少 15%以上时，减少后剩余部分的工程量的综合单价应予调高。"},{"id":"10","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：物价波动风险分担原则是什么?","answer":"1.合同有约定按约定执行；2.合同无约定的材料设备超基准价±5%，机械超基准价±10%，超出部分予以调整，人工费按国家相关管理机构发布人工成本信息进行调整。","difficulty":"易","category":"清单计价规范","explanation":"《电力建设工程工程量清单计价规范》DL/T5475-2021                                                                                                   9.9.1 合同履行期间，因人工、材料、设备、施工机械台班价格波动影响合同价款时，发承包双方应按照合同约定调整合同价款，由承包人提出，发包人复核、确认调整的单价和数量 。作为 调 整合同价款差额的依据 ，调整金额计入结算计价表8.6《人工、材料（设备）、机械台班价格调整计价表》。\n1 人工费按照国家或省级、行业建设主管部门或其授权的工程造价管理机构发布的人工成本信息 进行调整 。\n2 施工机械使用费可按照国家或省级、行业建设主管部门或其授权的工程造价管理机构发布的信息价格进行调整计列，发承包双方应在合同中约定施工机械使用费变化的范围或幅度，如没有约定，施工机械使用费的变化超过基准价±10%（不含±10%）时，超过部分给予调整 。\n3 承包人采购材料设备的 ，应在合同中约定材料 、设备价格变化的范围或幅度 ，如没有约定 ， 则材料、设备单价变化超过基准价±5%（不含±5%），超过部分给予调整 。\n4 可调的材料及机械台班种类应在合同中约定，合同未约定的，可参照电力工程造价与定额管理总站发布的可调材料及施工机械台班种类执行。"},{"id":"11","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：承包人索赔的程序是什么?","answer":"1.索赔事件发生28天内向发包人提交索赔意向通知书；2.提交意向通知书后28天内向发包人提交正式索赔通知书；3.连续事件提交延续通知；4.索赔事件影响结束后28天内向发包人提交最终索赔通知书。","difficulty":"中","category":"清单计价规范","explanation":"《电力建设工程工程量清单计价规范》DL/T5475-2021  9.14.2 条,根据合同约定，承包人认为非承包人原因发生的事件造成了承包人的损失，应按以下程序向发包人提出索赔： \n1.承包人应在索赔事件发生后28天内，向发包人提交索赔意向通知书，说明发生索赔事件的事由。承包人逾期未发出索赔意向通知书的，丧失索赔的权利； \n2．承包人应在发出索赔意向通知书后28天内，向发包人正式提交索赔通知书。索赔通知书应详细说明索赔理由和要求，并附必要的记录和证明材料； \n3．索赔事件具有连续影响的，承包人应继续提交延续索赔通知，说明连续影响的实际情况和记录； \n4．在索赔事件影响结束后的28天内，承包人应向发包人提交最终索赔通知书，说明最终索赔要求，并附必要的记录和证明材料；"},{"id":"12","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：安全文明施工费支付规定?","answer":"1. 开工28天内预付当年施工进度计划的安全文明施工总额60%~80%。；2. 其余与进度款同期支付；3.专款专用，不得挪用。","difficulty":"易","category":"清单计价规范","explanation":"根据《电力建设工程工程量清单计价规范》DL/T5475-2021规定，本节对安全文明施工、临时设施费的用途及支付作了规定。1.安全文明施工、临时设施费的内容:应符合国家或省级、行业建设主管部门的有关文件和相应的计算规范的规定\n2 安全文明施工、临时设施费的支付:发包人应在工程开工后的28天内预付占当年施工进度计划的安全文明施工总额的60%~80%。其余部分与进度款同期支付。\n3 未按时支付安全文明施工、临时设施费的后果:发包人在付款期满后的7天内仍未支付的，若发生安全事故的，发包人应承担连带责任。\n4 安全文明施工、临时设施费的使用:承包人应对安全文明施工、临时设施费专款专用，在财务账目中单独列项各查，不得挪作他用，否则发包人有权要求其限期改正，逾期未改正的，造成的损失和(或)延误的工期由承包人承担。"},{"id":"13","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：竣工结算的办理程序?","answer":"1.合同工程完工后，承包人在合同约定的时间内提交竣工结算文件；2.发包人收到竣工结算文件28天内审核；3.无异议7天内签字确认；4.按结算文件支付价款","difficulty":"易","category":"清单计价规范","explanation":"《电力建设工程工程量清单计价规范》DL/T5475-2021：11.3.3 合同工程完工后，承包人应在经发承包双方确认的施工过程结算的基础上江总编制完成竣上结算文件，并在提交竣工验收申请的同时向发包人提交竣工结算文件。承包人未在合同约定的时间内提交工程竣工结算文件，经发包人催告后14天内仍未提交或没有明确答复的，发包人有权根据己有资料编制竣工结算文件，作为办理竣工结算和支付结算款的依据 ，承包人应予以认可 。\n《电力建设工程工程量清单计价规范》DL/T5475-202111.3.4 发包人应在收到承包人提交的竣工结算文件后的28天内核对。发包人经核实 ，认为承包人还应进 一步补充资料和修改结算文件 ，应在上述时限内向承包人提出核实意见 ，承包人在收到核实意见后的28天内，按照发包人提出的合理要求补充资料，修改竣工结算文件，并应再次提交给发包人复核后批准。 11.3.5 发包人应在收到承包人再次提交的竣工结算文件后的28天内予以复核 ，将复核结果通知承包人，井应遵守下列规定 ：\n1 发包人、承包人对复核结果无异议的，应在7天内在竣工结算文件上签字确认 ，竣工结算办理完毕。\n2 发包人或承包人对复核结果认为有误的，尤异议部分按照本条第1款规定办理不完全竣工结算；有异议部分由发承包双方协商解决；协商不成的，应按照合同约定的争议解决方式处理 。\n11.3.6 发包人在收到承包人竣工结算文件后的28天内，不核对竣工结算或未提出核对意见的，应视为承包人提交的竣工结算文件已被发包人认叫竣工结算办理完毕 。\n11.3.7 承包人在收到发包人提出的核实意见后的28天内，不确认也未提出异议的，应视为发包人提出的核实意见己被承包人认可，竣工结算办理完毕 。"},{"id":"14","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：质量保证金返还规定?","answer":"在合同约定的缺陷责任期终止后，发包人将剩余质量保证金返还承包人。","difficulty":"易","category":"清单计价规范","explanation":"根据《电力建设工程工程量清单计价规范》DL/T5475-2021，11.6.5 条,在合同约定的缺陷责任期终止后，发包人将剩余的质量保证金返还承包人。"},{"id":"15","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：招标控制价投诉处理程序?","answer":"1.投标截止10天前向招标人提出异议；2.招标人3天内作出答复；3.误差超±5%招标人应改正。","difficulty":"易","category":"清单计价规范","explanation":"根据《电力建设工程工程量清单计价规范》DL/T5475-2021，5.3 异议和修正\n5.3.1 投标人经复核认为招标人公布的最高投标限价未按照招标文件的规定进行编制或存在不合理的，可在投标截止时间10天前向招标人提出异议 。\n5.3.2 招标人应当自收到异议之日起3天内作出答复 ，招标人不回复或投标人在得到招标人的异议回复后，认为最高投标限价仍然未按照招标文件的规定进行编制或存在不合理的，可以向招标监督部门或有该工程管辖权的电力行业工程造价管理机构投诉 \n5.3.3 当最高投标限价经有关招标监督部门或有该工程管辖权的电力工程造价管理机构复查，其结论与原公布的最高投标限价误差超过±5%时，招标人应当改正 。\n5.3.4 招标人根据最高投标限价复查结论需要重新公布最高投标限价的，应根据相关要求和程序重新公布。"},{"id":"16","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：工程变更价款确定原则？","answer":"1. 有适用项目采用原综合单价；2.有类似项目在参照类似综合单价；3.无适用无类似由承包人根据合同约定计价原则报价，发包人确认；","difficulty":"易","category":"清单计价规范","explanation":"根据《电力建设工程工程量清单计价规范》DL/T5475-2021，9.3.1 因工程变更引起己标价工程量清单项目或其工程数量发生变化时 ，应按照下列规定调整 ：\n1 己标价工程量清单中有适用于变更工程项目的，应采用该项目的全费用综合单价；但当工程变更导致该清单项目的工程量发生变化，且工程量变化超过±15%时，该项目全费用综合单价应按照本规范第9.6.2条的规定调整 。\n2 己标价工程量清单中没有适用，但有类似于变更工程项目的，可在合理范围内参照类似项目的全费用综合单价 。\n3 己标价工程量清单中没有适用也没有类似于变更工程项目的，由承包人根据变更工程资料、计量规则和计价办法、工程造价管理机构发布的信息价格和承包人报价浮动率提出变更工程项目的全费用综合单价，报发包人确认后调整。\n4 己标价工程量清单中没有适用也没有类似于变更工程项目，且工程造价管理机构发布的信息价 格缺价的，由承包人根据变更工程资料、计量规则、计价办法和通过市场调查等取得有 合法依据的市场价格，提出变更工程项目的全费用综合单价，报发包人确认后调整。"},{"id":"17","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：发包人通知承包人以计日工方式实施的零星工作的计价与支付？","answer":"1. 按发包人通知实施；2. 每天提交报表和有关凭证送发包人复核；3. 工作结束 24 小时内提交汇总的现场签证报告；4. 与进度款同期支付","difficulty":"易","category":"清单计价规范","explanation":"根据《电力建设工程工程量清单计价规范》DL/T5475-2021，9.7 计 日 工\n9.7.1 发包人通知承包人以计日工方式实施的零星项目，承包人应予执行 。\n9.7.2 采用计日工计价的任何一项变更工作，承包人应在该项变更工作实施过程中 ，按合同约定提交 下列报表和有关凭证报送发包人复核 ：\n1 工作名称、内容和数量。\n2 投入该工作所有人员的姓名、工种、级别和耗用工时 。\n3 投入该工作的材料名称、类别和数量 。\n4 投入该工作的施工设备型号、台数和耗用台时。\n5 发包人要求提交的其他资料和凭证 。\n9.7.3 任一计日工项目持续进行时，承包人应在该项工作实施结束后的24小时内 ，向发包人提交有计日工记录汇总的计日工签证报告，一式三份。发包人在收到承包人提交计日工签证报告后的2天内予 以确认，并将其中一份返还给承包人 ，作为计日工计价和支付的依据 。发包人逾期未确认也未提出修 改意见的 ，应视为承包人提交的计日工签证报告己被发包人认可 。\n9.7.4 任一计日工项目实施结束后，承包人应按照确认的计日工签证报告核实该类项目的工程数量， 并应根据核实的工程数量和承包人己标价工程量清单中的计日工单价计算，提出应付价款：己标价工 程量清单中没有该类计日工单价的，由发承包双方按本规范第9.3节的规定商定计日工单价计算 。\n9.7.5 每个支付期末，承包人应按照本规范第10.3节的规定向发包人提交本期间所有计日工记录的签证汇总表，并应说明本期间自己认为有权得到的计日工金额 ，调整合同价格，列入进度款和施工过程结算款支付 。"},{"id":"18","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：现场签证的办理要求？","answer":"1. 发包人指令后 7 天内承包人提交现场签证报告（所需的人工、材料和施工机械台班的消耗量等）；2. 发包人收到报告后的48 小时内核实；3. 未经签证擅自施工费用自理","difficulty":"易","category":"清单计价规范","explanation":"根据《电力建设工程工程量清单计价规范》DL/T5475-2021，9.8现场签证\n9.8.1 承包人应发包人要求完成合同以外的零星项目 、非承包人贡任事件等工作的，发包人应及时以 书面形式向承包人发出指令，提供所需的相关资料：承包人在收到指令后，应及时向发包人提出现场 签证要求。\n9.8.2 承包人应在收到发包人指令后的7天内，向发包人提交现场签证报告，发包人应在收到现场签证报告后的48小时内对报告内容进行核实，予以确认或提出修改意见。发包人在收到承包人现场签证报告后的48小时内未确认也未提出修改意见的，视为承包人提交的现场签证报告己被发包人认可 。\n9.8.3 现场签证的工作如已有相应的计日工单价 ，则现场签证中应列明完成该类项目所需的人工、材料和施工机械台班的数量 。\n9.8.4 合同工程发生现场签证事项，未经发包人签证确认，承包人擅自施工的，此项费用由承包人承担。\n9.8.5 现场签证工作完成后的7天内，承包人应按照现场签证内容计算价款，报送发包人确认后，作为增加合同价款，与工程进度款和施工过程结算款同期支付 。\n9.8.6 承包人在施工过程中，若发现合同工程内容因场地条件、地质水文、与发包人要求等不一致时，应提供所需的相关资料，提交发包人签证认可，作为工程价款调整的依据 。"},{"id":"19","question":"根据《电力建设工程工程量清单计价规范》（DL/T5745-2021）中：工程造价文件归档要求？","answer":"1. 对具有保存价值的各种载体的计价文件，均应收集齐全整理立卷；2. 保存期不宜少于 5 年；3. 含纸质原件与电子文件；4.向接受单位移交档案时，应编制移交清单双方签字盖章","difficulty":"易","category":"清单计价规范","explanation":"根据《电力建设工程工程量清单计价规范》DL/T5475-2021，发承包双方以及工程造价咨询人对具有保存价值的各种载体的计价文件，均应收集齐全，整理立卷后归档。工程造价咨询人归档的计价文件，保存期不宜少于五年。 归档的工程计价成果文件应包括纸质原件和电子文件。向接受单位移交档案时，应编制移交清单，双方签字、盖章后方可交接。"},{"id":"20","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版），简述火电（含供热）建设项目计划总投资的费用构成。","answer":"项目计划总投资由项目建设总费用（工程动态投资）和铺底流动资金构成。项目建设总费用由建筑工程费、安装工程费、设备购置费、其他费用、基本预备费和动态费用工程构成。其中动态费用包括价差预备费和建设期贷款利息。","difficulty":"易","category":"基建估（概）算","explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版），项目计划总资金由项日建设总费用和铺底流动资金构成。\n项目建设总费用由建筑工程费、安装工程费、设备购置费、其他费用、基本预备费和动态费用构成。其中动态费用包括价差预备费和建设期贷款利息。"},{"id":"21","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），简述火电建设项目其他费用构成","answer":"建设场地征用及清理费、项目建设管理费、项目建设技术服务费、整套启动试运费、生产准备费、大件运输措施费。","difficulty":"易","category":"基建估（概）算","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），设备购置费由设备原价、设备运杂费、运输保险费、采购及保管费等组成。"},{"id":"22","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），请列举措施项目费的内容。","answer":"（1）安全文明施工费（含环境保护、文明施工、安全施工、临时设施）；（2）夜间施工增加费；（3）二次搬运费；（4）冬雨季施工增加费；（5）已完工程及设备保护费；（6）脚手架工程费；（7）模板及支架费；（8）大型机械设备进出场及安拆费；（9）施工排水、降水费；（10）垂直运输费。","difficulty":"中","category":"基建估（概）算","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），设备购置费由设备原价、设备运杂费、运输保险费、采购及保管费等组成。"},{"id":"23","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），简述火电工程概算中国产设备购置费的构成。","answer":"设备购置费由设备原价、设备运杂费、运输保险费、采购及保管费等组成。","difficulty":"中","category":"基建估（概）算","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），设备购置费由设备原价、设备运杂费、运输保险费、采购及保管费等组成。"},{"id":"24","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），简述基本预备费的概念？","answer":"是指为因设计变更（含施工过程中工程量增减、设备改型、材料代用）而增加费用，一般自然灾害可能造成的损失和预防自然灾害所采取的临时设施费用，以及其他不确定因素可能造成的损失而预留的工程建设资金。","difficulty":"中","category":"基建估（概）算","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），是指为因设计变更（含施工过程中工程量增减、设备改型、材料代用）而增加费用，一般自然灾害可能造成的损失和预防自然灾害所采取的临时设施费用，以及其他不确定因素可能造成的损失而预留的工程建设资金。\n基本预备费=(工程费用+工程建设其他费用)*基本预备费费率或\n基本预备费=(建筑工程费+工程费用+设备购置费+其他费用)*基本预备费费率"},{"id":"25","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》（HN-03-HDXM043-2024）中规定，阐述火电工程管理概算的主要编制根据？","answer":"（1）批准设计概算及审查意见。\n（2）主机、主要辅机和主体工程施工合同。\n（3）集团公司批准的重大设计变更和专项费用。\n（4）集团公司工程造价指标和费用标准。\n（5）二级单位批准的重要设计变更。","difficulty":"易","category":"基建估（概）算","explanation":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》，火电工程管理概算的主要编制：（1）批准设计概算及审查意见。\n（2）主机、主要辅机和主体工程施工合同。\n（3）集团公司批准的重大设计变更和专项费用。\n（4）集团公司工程造价指标和费用标准。\n（5）二级单位批准的重要设计变更。"},{"id":"26","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》（HN-03-HDXM043-2024）中规定，管理概算编制时，已招标与未招标的设备及建安工程在管理概算中应如何分别计列？","answer":"（1）设备购置费。已招标的设备按招标价格计列，未招标的设备原则上按设计概算计列。\n（2）建安工程费。已完工的按结算金额（或预计结算金额）计列；已招标的按招标价格计列（不计备用金及暂定金额），未招标的按设计概算下浮5％计列。\n综合考虑设计概算、招标价格、设计变更等因素，建筑、安装主体工程预留费用分别按不超过招标价的 10％和 5％计列。","difficulty":"中","category":"基建估（概）算","explanation":"根据根据《中国华能集团有限公司火电基本建设工程概算管理细则》（HN-03-HDXM043-2024），管理概算计列标准：\n（1）设备购置费。已招标的设备按招标价格计列，未招标的设备原则上按设计概算计列。\n（2）建安工程费。已完工的按结算金额（或预计结算金额）计列；已招标的按招标价格计列（不计备用金及暂定金额），未招标的按设计概算下浮5％计列。\n综合考虑设计概算、招标价格、设计变更等因素，建筑、安装主体工程预留费用分别按不超过招标价的 10％和 5％计列。"},{"id":"27","question":"根据《中国华能集团有限公司火电基本建设工程施工准备及开工管理办法》（HN-03-HDXM044-2024），火电主机设备招标需具备哪些条件？","answer":"（1）项目已获得核准；\n（2）已列入集团公司年度投资计划；\n（3）已取得集团公司投资决策批复；\n（4）初步设计原则已通过集团公司内审；\n（5）已取得集团公司生产环保部关于燃用煤（气）质批复；\n（6）采购需求已列入集团公司年度一级集采计划。","difficulty":"中","category":"基建施工管理","explanation":"根据《中国华能集团有限公司火电基本建设工程施工准备及开工管理办法》（HN-03-HDXM044-2024），主机招标条件：\n（1）项目已获得核准；\n（2）已列入集团公司年度投资计划；\n（3）已取得集团公司投资决策批复；\n（4）初步设计原则已通过集团公司内审；\n（5）已取得集团公司生产环保部关于燃用煤（气）质批复；\n（6）采购需求已列入集团公司年度一级集采计划。"},{"id":"28","question":"根据《中国华能集团有限公司火电基本建设工程施工准备及开工管理办法》（HN-03-HDXM044-2024），火电工程正式开工前需满足一系列的前置条件。","answer":"（1）项目已获得核准，初步设计及概算已审查，已列入集团公司年度开工计划，已批复年度投资预算。\n（2）项目已取得国有土地使用权证、建设用地规划许可证、建设工程规划许可证、建筑工程施工许可证（可分批取得）、环评报告及节能审查意见等合法性文件。\n（3）项目建设管理组织机构已建立，人员配置齐全。\n（4）项目需要的资金、材料、设备、电力供应、外部协作条件以及送出等同步配套工程已经落实，当年需要的投资、材料能满足连续施工的要求。\n（5）施工图能满足工程进度的需要，设计单位已提交开工所需的施工图纸及交图计划，满足连续施工需要。\n（6）项目已与监理单位和施工单位签订合同。\n（7）项目建设用地已交付使用，现场施工准备工作已经完成。\n（8）施工组织设计或主要施工方案已经编制完成（在开工后1个月内完成施工组织总设计审查）。\n（9）基建现场视频、门禁、设计出图、设备供货、进度管理等信息已接入基建工程智慧建设管理系统。","difficulty":"中","category":"基建施工管理","explanation":"根据《中国华能集团有限公司火电基本建设工程施工准备及开工管理办法》（HN-03-HDXM044-2024），项目开工条件：\n（1）项目已获得核准，初步设计及概算已审查，已列入：集团公司年度开工计划，已批复年度投资预算。\n（2）项目已取得国有土地使用权证、建设用地规划许可证、建设工程规划许可证、建筑工程施工许可证（可分批取得）、环评报告及节能审查意见等合法性文件。\n（3）项目建设管理组织机构已建立，人员配置齐全。\n（4）项目需要的资金、材料、设备、电力供应、外部协作条件以及送出等同步配套工程已经落实，当年需要的投资、材料能满足连续施工的要求。\n（5）施工图能满足工程进度的需要，设计单位已提交开工所需的施工图纸及交图计划，满足连续施工需要。\n（6）项目已与监理单位和施工单位签订合同。\n（7）项目建设用地已交付使用，现场施工准备工作已经完成。\n（8）施工组织设计或主要施工方案已经编制完成（在开工后1个月内完成施工组织总设计审查）。\n（9）基建现场视频、门禁、设计出图、设备供货、进度管理等信息已接入基建工程智慧建设管理系统。"},{"id":"29","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），什么是建设预算？主要包括哪些内容？","answer":"建设预算是指以具体的建设工程项目为对象，根据不同阶段设计，根据预规及相应的估算指标、概算定额、预算定额等计价根据，对工程各项费用的预测和计算。建设预算的内容包括：投资估算、初步设计概算和施工图预算。","difficulty":"中","category":"概算定额","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），建设预算是指以具体的建设工程项目为对象，根据不同阶段设计，根据预规及相应的估算指标、概算定额、预算定额等计价根据，对工程各项费用的预测和计算。建设预算的内容包括：投资估算、初步设计概算和施工图预算。"},{"id":"30","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），什么是铺底流动资金？","answer":"铺底流动资金是指建设项目投产初期所需，为保证项目建成后进行试运转和初期正常生产运行所必需的流动资金。铺底流动资金主要用于购买燃料、生产消耗材料、生产用备品备件和支付工资所需的周转性自有资金。","difficulty":"中","category":"概算定额","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），铺底流动资金是指建设项目投产初期所需，为保证项目建成后进行试运转和初期正常生产运行所必需的流动资金。铺底流动资金主要用于购买燃料、生产消耗材料、生产用备品备件和支付工资所需的周转性自有资金。"},{"id":"31","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），什么是静态投资？它与动态投资有何区别？","answer":"静态投资是指建筑工程费、安装工程费、设备购置费、其他费用和基本预备费。静态投资与动态投资的区别在于，动态投资是在静态投资的基础上还包含价差预备费和建设期贷款利息。","difficulty":"易","category":"概算定额","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），静态投资是指建筑工程费、安装工程费、设备购置费、其他费用和基本预备费。静态投资与动态投资的区别在于，动态投资是在静态投资的基础上还包含价差预备费和建设期贷款利息。"},{"id":"32","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），一利五率具体指的是什么？","answer":"“一利”是利润总额，“五率”分别指资产负债率、净资产收益率、营业现金比率、研发投入强度和全员劳动生产率。","difficulty":"易","category":"概算定额","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），“一利”是利润总额，“五率”分别指资产负债率、净资产收益率、营业现金比率、研发投入强度和全员劳动生产率。"},{"id":"33","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），其他费用项目划分包括哪些主要类别？","answer":"其他费用是指为完成工程项目建设所必需的，但不属于建筑工程费、安装工程费、设备购置费、基本预备费的其他相关费用，包括建设场地征用及清理费、项目建设管理费、项目建设技术服务费、整套启动试运费、生产准备费、大件运输措施费。","difficulty":"易","category":"概算定额","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），其他费用是指为完成工程项目建设所必需的，但不属于建筑工程费、安装工程费、设备购置费、基本预备费的其他相关费用，包括建设场地征用及清理费、项目建设管理费、项目建设技术服务费、整套启动试运费、生产准备费、大件运输措施费。"},{"id":"34","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），什么是生产准备费？主要包含哪些项目？","answer":"生产准备费是指为保证工程竣工验收合格后能够正常投产运行提供技术保证和资源配备所发生的费用。包括管理车辆购置费、工器具及办公家具购置费、生产职工培训及提前进厂费。","difficulty":"易","category":"概算定额","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），生产准备费是指为保证工程竣工验收合格后能够正常投产运行提供技术保证和资源配备所发生的费用。包括管理车辆购置费、工器具及办公家具购置费、生产职工培训及提前进厂费。"},{"id":"35","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），编制基准期价差主要包括哪些？","answer":"编制基准期价差主要包括人工费价差、材料价差、施工机械使用费价差。","difficulty":"易","category":"概算定额","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），编制基准期价差主要包括人工费价差、材料价差、施工机械使用费价差。"},{"id":"36","question":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），项目建设管理费具体包含哪些？","answer":"项目建设管理费包括项目法人管理费、招标费、工程监理费、设备材料监造费、施工过程造价咨询及竣工结算审核费、工程保险费。","difficulty":"易","category":"概算定额","explanation":"根据《火力发电工程建设预算编制与计算规定使用指南》（2018年版），项目建设管理费包括项目法人管理费、招标费、工程监理费、设备材料监造费、施工过程造价咨询及竣工结算审核费、工程保险费。"},{"id":"37","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》（HN-03-HDXM043-2024）中规定，简述火电设计概算及管理概算的定义及作用。","answer":"1.设计概算是指按照初步设计方案和《火力发电工程建设预算编制与计算规定》等计算的工程投资。设计概算是项目竣工决算、竣工决算审计和竣工验收的根据。\n2.管理概算是在设计概算基础上，综合考虑市场行情、企业标准和管理成果计算的工程投资。管理概算是集团公司内部造价控制目标，是造价控制、预算下达、造价绩效考核、竣工决算、竣工决算审计、管理评价、绩效考核和竣工验收的根据。","difficulty":"易","category":"基建估（概）算","explanation":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》，\n1.设计概算是指按照初步设计方案和《火力发电工程建设预算编制与计算规定》等计算的工程投资。设计概算是项目竣工决算、竣工决算审计和竣工验收的根据。\n2.管理概算是在设计概算基础上，综合考虑市场行情、企业标准和管理成果计算的工程投资。管理概算是集团公司内部造价控制目标，是造价控制、预算下达、造价绩效考核、竣工决算、竣工决算审计、管理评价、绩效考核和竣工验收的根据。\""},{"id":"38","question":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》（HN-03-HDXM043-2024）中规定，简述什么情况下可调整设计概算？什么情况下不予调整设计概算？","answer":"《中国华能集团有限公司火电基本建设工程概算管理细则》\n发生下列情况之一，对工程投资影响较大并超出基本预备费，结合概算执行的总体情况可调整设计概算：\n（一）国家政策、法律法规发生变化。\n（二）发生不可抗力因素。\n（三）工程建设条件、方案、标准和规模发生重大变化。\n（四）集团公司批复的专题专项费用。\n 发生下列情况之一，不予调整设计概算：\n（一）未按管理权限履行程序，擅自扩大规模、提高标准、变更方案增加投资的。\n（二）由于勘察、设计、施工、制造、监理等单位过失、管理不善、失职渎职等原因增加投资的。\n（三）基本预备费可以解决增加投资的。","difficulty":"中","category":"基建估（概）算","explanation":"根据《中国华能集团有限公司火电基本建设工程概算管理细则》，发生下列情况之一，对工程投资影响较大并超出基本预备费，结合概算执行的总体情况可调整设计概算：\n（一）国家政策、法律法规发生变化。\n（二）发生不可抗力因素。\n（三）工程建设条件、方案、标准和规模发生重大变化。\n（四）集团公司批复的专题专项费用。\n 发生下列情况之一，不予调整设计概算：\n（一）未按管理权限履行程序，擅自扩大规模、提高标准、变更方案增加投资的。\n（二）由于勘察、设计、施工、制造、监理等单位过失、管理不善、失职渎职等原因增加投资的。\n（三）基本预备费可以解决增加投资的。"},{"id":"39","question":"根据《火力发电工程建设预算编制与计算规定》（2018年版），预备费分哪几类，请分别说明其含义。","answer":"预备费分为基本预备费和价差预备费。\n基本预备费是指为因设计变更（含施工过程中工程量增减、设备改型、材料代用）增加的费用、一般自然灾害可能造成的损失和预防自然灾害所采取的临时措施费用，以及其他不确定因素可能造成的损失而预留的工程建设资金。\n价差预备费是指建设工程项目在建设期间由于价格等变化引起工程造价变化的预测预留费用。","difficulty":"中","category":"概算定额","explanation":"根据《火力发电工程建设预算编制与计算规定》（2018年版），预备费分为基本预备费和价差预备费。\n基本预备费是指为因设计变更（含施工过程中工程量增减、设备改型、材料代用）增加的费用、一般自然灾害可能造成的损失和预防自然灾害所采取的临时措施费用，以及其他不确定因素可能造成的损失而预留的工程建设资金。\n价差预备费是指建设工程项目在建设期间由于价格等变化引起工程造价变化的预测预留费用。"}],"case":[{"id":"1","background":"某火电项目为集团一级集采工程标段，市场竞争不充分，项目单位直接编制最高投标限价并发布招标，\n合同预中标金额超出对应概算，项目单位未做分析说明即签订合同。","question":"背景：某火电项目为集团一级集采工程标段，市场竞争不充分，项目单位直接编制最高投标限价并发布招标。\n问题：最高投标限价编制审批流程是否合规？正确流程是什么？","answer":"1、不合规。正确流程：项目单位编制，二级单位初审并提推荐意见，技经中心复核，集团工程部审批。\n2、不合规。合同（预中标）超概的，二级单位应组织项目单位对价格合理性及超概原因作出分析说明。","difficulty":"易","category":"技经管理","explanation":"《中国华能集团有限公司火电基本建设工程造价管理细则》中规定，对于竞争性不充分的标段，应设立最高投标限价。集团公司一级集采项目设置最高投标限价时，项目单位组织编制，二级单位初审并提出推荐意见，报技经中心出具复核意见后，集团公司工程部履行审批程序。合同（或预中标）金额原则上应控制在对应概算以内，如超概，二级单位应组织项目单位对合同（预中标）价格的合理性及超概原因作出分析说明。"},{"id":"2","background":"","question":"背景：某火电工程全部机组投产14个月，竣工结算金额超过集团审批概算，项目单位直接按竣工结算金额上报资金预算，未履行审批程序。\n问题：请指出该案例中存在哪些错误做法？并分析原因。","answer":"1.未按期完成竣工结算，项目投产六个月内应完成竣工结算。\n2.竣工结算金额超过集团审批概算：（1）未经审批，以批准设计概算为投资与资金预算上限；（2）已经审批，按审批金额作为投资、资金预算上限。","difficulty":"易","category":"技经管理","explanation":"竣工结算报告是考核造价管理和计列收尾投资计划的依据。竣工结算金额超过集团公司批准设计概算，未经审批的以批准设计概算作为投资、资金预算上限，已经审批的按审批金额作为投资、资金预算上限。项目单位编制的竣工结算报告报送二级单位核定，二级单位审批后报集团公司备案。"},{"id":"3","background":"某2*660MW新建煤电项目，可研全投资税前收益率8.2%；复核发现：1、发电标煤耗直接采用设计值 2、利用小时前五年按4800小时测算 3、修理费按2%计取 4、资本金按30%计取，无依据。","question":"背景：某2*660MW新建煤电项目，可研全投资税前收益率8.2%；复核发现：1、发电标煤耗直接采用设计值 2、利用小时前五年按4800小时测算 3、修理费按2%计取 4、资本金按30%计取，无依据。\n问题：请指出该四项取值是否合规。 如不合规请写出正确合规取值要求。","answer":"四项均不合规。正确取值：1.标煤耗应上浮5%；2.利用小时应≤4500h；3.660MW修理费应1.5%；4.资本金原则上按20%计取。","difficulty":"中","category":"技经管理","explanation":"依据《中国华能集团有限公司煤电基本建设项目经济评价复核工作指引》HNJJ-ZY09-2025 \n1、发电标煤耗原则上按照可研设计100%负荷率工况发电标煤耗上浮5%、可研可研设计50%负荷率工况发电标煤耗孰高原则取值。如有同类型可参考机组，也可参考实际发电标煤耗取值。\n2、经营期前五年，应根据可研报告项目所在省份电力电量平衡确定，原则上不高于4500小时，经营期后十五年利用小时数逐年下降，原则上后十年利用小时数不高于3500小时，经营期前五年不高于3500小时，可不考虑下降。若集团公司相关业务归口部门出具了明确的项目利用小时数意见，则以集团公司相关业务归口部门意见为准。\n3、修理费30万机组2%，60万机组1.5%，100万机组1.5%，以固定资产原值（扣除建设期利息）为基数。\n4、原则上按照20%计列，若高于20%，需由项目单位提供依据，并征求集团公司相关部门意见。若集团公司调整资本金比例要求，按照最新要求计列。"},{"id":"4","background":"","question":"背景：某火电项目施工合同约定：“合同工期超过一年，因人工、材料价格波动影响合同价款时应进行调整。主要材料价格变化超过5%时，超过部分予以调整。可调材料包括钢材、商品混凝土，其余材料不调整。”合同采用单价合同，调差公式为：价差＝调整基数×(施工期价格－基准期价格×1.05)。施工期间，钢筋由4300元/吨涨至4800元/吨，商品混凝土由520元/m³涨至570元/m³。经审批的钢筋累计用量1580吨，商品混凝土8500m³。\n事件（甲供材料核销问题）： 工程竣工结算时，发现甲供材料（保温材料、电缆、电缆桥架）实际领用量远超设计概算工程量，施工单位未能提供完整的变更签证和退库记录。建设单位物资部台账显示出入库数据混乱，无法与设计工程量及结算工程量对应。\n问题：\n1. 计算钢筋和商品混凝土的应调价差金额（保留两位小数）。\n2. 针对甲供材料核销中暴露的问题，列出至少4项加强过程管理的具体措施。","answer":"1.1 钢筋调差：基准价×1.05=4300×1.05=4515元/吨；超过部分=4800-4515=285元/吨；调差金额=1580×285=450300元=45.03万元。\n1.2 商品混凝土调差：基准价×1.05=520×1.05=546元/m³；超过部分=570-546=24元/m³；调差金额=8500×24=204000元=20.40万元。答：钢筋调差45.03万元，商品混凝土调差20.40万元。\n2. 措施：①建立完整甲供物资台账，记录出入库退库数据，确保“账、物、卡”相符；②定期开展量价对比分析，对比概算工程量、甲供使用量、已完实物量差异；③严格执行变更签证制度，变更增量必须先行审批，严禁先领用后补签；④落实退库闭环管理，完工后办理退库，超定额损耗由施工单位承担；⑤应用信息化系统，实现物资全流程线上管理。","difficulty":"难","category":"技经管理","explanation":"问题1考查物价波动引起的合同价款调整。注意公式中“超过5%的部分”应理解为：只调整超出基准价105%的差额，而非全部价差。这是风险分担的典型方式。\n问题2考查甲供材料管理。结合华能火电工程造价管理工作指引中“物资部应建立甲供物资台账”“造价咨询单位对比分析三者差异”“过程结算不重新计量”等要求，突出过程管控和信息化手段的重要性。"},{"id":"5","background":"","question":"背景：某在建660MW火电项目因国家环保政策调整（要求进一步降低氮氧化物排放），需增加部分工程内容。该变更属重大设计变更，设计单位提出技术方案及概算：建筑工程费580万元，安装工程费650万元。变更导致锅炉安装关键路径工序推迟45天。总承包单位提出索赔：费用1280万元（含建安费、管理费增加及现场窝工损失），工期索赔45天。合同约定：变更计价执行电力定额及取费标准，并按投标下浮系数5%下浮；风险包干费包含连续停工56天以内的窝工损失。\n问题：1. 根据《中国华能集团有限公司火电工程造价管理工作指引》，简述重大设计变更应履行的审批程序。\n2. 分析建设单位应如何核定该变更费用？工期索赔45天是否成立？现场窝工损失是否应补偿？\n3. 该变更增加的费用超出基本预备费时，应如何处理？","answer":"1. 审批程序：①设计单位提出技术方案、图纸及预算；②二级单位组织初审，确认变更原因及必要性；③工程技经中心复核变更方案及概算，出具复核意见；④集团公司工程部按照“三重一大”决策要求履行审批程序。\n2.费用核定：按合同计价原则计算。建安工程费采用定额取费后下浮。管理费已含在间接费中，不再单独计列。工期索赔45天成立（非承包人原因，影响关键路径）。窝工损失不补偿（风险包干费已覆盖56天以内停工）。\n3. 超出基本预备费时，应申请调整设计概算：二级单位组织编制调整概算报告，专题说明变化原因，经技经中心复核后，集团公司工程部履行审批程序。因国家政策变化引起的超概属可调整情形。","difficulty":"难","category":"技经管理","explanation":"本题聚焦重大设计变更的管理流程和合同经济处理。程序上强调“设计→二级单位→技经中心→集团公司”的闭环，体现“三重一大”管控要求。\n费用核定必须回归合同约定，不能因变更性质而改变计价原则。\n窝工损失是否补偿取决于合同约定。风险包干费已覆盖56天以内的停工，体现了风险合理分配——发包人承担政策风险（工期顺延及直接费用），但不承担短期窝工损失（已含在包干费中）。\n超基本预备费时需申请概算调整，但前提是变更原因符合可调整情形（如国家政策变化），若因管理过失导致则不予调整。"},{"id":"6","background":"","question":"背景：华能集团某二级单位新建一台660MW超超临界燃煤发电机组工程项目，采用单价合同形式，工程量清单计价，计价依据为《DL/T 5369-2021 电力建设工程工程量清单计算规范 火力发电工程》及配套定额。施工过程中发生以下事件：\n事件一（土方工程计量争议）： 在主体厂房基础施工中，设计图纸要求基础开挖深度为-6.5m（含垫层），施工单位实际施工时，因发现地下障碍物，经监理和建设单位同意，开挖深度增加至-7.2m，超挖0.7m。施工单位主张超挖部分应计入土方工程量，建设单位和监理认为超出部分属施工单位原因造成的额外工程，不应计量。经调查，地下障碍物属于勘察报告未提示的未知情况，不在招标文件风险范围内。\n事件二（措施项目费争议）： 施工单位在施工过程中，为加快进度，主动增加了主厂房区域夜间照明措施，额外增加措施费28万元。结算时，施工单位主张该项费用应按实际发生计入措施项目费。招标工程量清单中仅列有“安全文明施工费”一项措施项目，未单独列明夜间施工增加费。合同约定措施项目费采用总价包干方式，除设计变更外不予调整。\n事件三（工程量偏差结算）： 该工程锅炉钢结构安装分项，招标工程量清单中工程量为1280吨，合同综合单价为8600元/吨。结算时，经竣工图复核，实际安装工程量为1450吨，超出清单工程量170吨，超出幅度为13.28%。合同约定：工程量偏差超过15%时，超过部分的综合单价可协商调整；偏差在15%以内的，按原合同单价执行。\n事件四（甲供材核销差异）： 工程竣工结算时，建设单位物资部提供的甲供物资台账与施工单位申报的领用记录存在差异：电缆台账出库数量为42500米，施工单位申报领用数量为41200米，差异1300米；保温材料台账出库数量为860立方米，施工单位申报领用数量为780立方米，差异80立方米。施工单位解释称，部分领用材料已用于工程，但未及时办理领用手续。\n问题：\n1. 事件一中，超挖0.7m的土方工程量应如何处理？请分析责任归属及费用承担原则。\n2. （5分）事件二中，施工单位增加的夜间施工措施费28万元是否应予计量？请说明理由。\n3. 事件三中，请计算锅炉钢结构安装分项的结算金额。如果工程量超出幅度达到16%，超出部分的单价应如何调整？\n4. 事件四中，针对甲供物资台账与施工单位领用记录的差异，建设单位应采取哪些措施确保甲供材核销准确？请列出至少4项措施。","answer":"1. 地下障碍物属勘察报告未提示的未知情况，非承包人可预见风险。超挖经监理和建设单位同意，属于工程变更性质，超挖部分应计入结算工程量，增加的费用由建设单位承担。施工单位应提供经监理、建设单位确认的超挖工程量签证单作为结算依据。（依据：DL/T 5369-2021第3章）\n2. 不应计量。理由：①合同约定措施项目费总价包干，除设计变更外不予调整；②夜间施工增加费属于施工措施费，施工单位为加快进度主动增加，非合同或规范强制要求，不属于设计变更；③施工单位自主采取的施工组织措施，相关费用已包含在投标报价的风险因素中，由施工单位自行承担。（依据：DL/T 5369-2021第4.3节）\n3. 结算金额：1450吨×8600元/吨=1247万元。超出幅度13.28%＜15%，综合单价不调整。若超出幅度达到16%（即实际量1485吨），则15%以内部分（1280×115%=1472吨）按原单价8600元/吨计算，超出15%部分（1485-1472=13吨）综合单价可协商调整，一般参照投标报价水平按下浮系数执行。（依据：DL/T 5369-2021第4章）\n4. 措施：①建立全流程甲供材领用审批制度，领用前经监理、建设单位审核；②实行“领用—消耗—节超”闭环管理，按月对比分析设计量、领用量与实体消耗量；③严格执行退库核销制度，完工后清理剩余材料并办理退库；④利用信息化系统（如火电基建MIS）实现物资全流程在线管理；⑤建立月度三方对账机制，物资部、计划部、施工单位共同核对领用台账，差异超1%专题分析。","difficulty":"难","category":"技经管理","explanation":"问题1考查不可预见的现场条件变化（地下障碍物）的工程量计量原则。非承包人原因引起的工程量变化应计入结算，由发包人承担。实务中需保留经监理、建设单位确认的签证资料。\n问题2考查措施项目费的总价包干原则。施工单位自主增加的夜间施工费，若非建设单位原因引起，不予计量。若系建设单位要求赶工，则需另行计价。\n问题3考查工程量偏差超过合同约定幅度时的价款调整方法。注意15%以内不调整单价，超出15%的部分可协商调整。计算时需区分正常偏差和超额部分。\n问题4考查甲供材料核销管理，这是竣工结算的关键环节。华能火电工程造价管理指引重点强调“领用—消耗—节超”闭环管理，做到过程可追溯、差异可分析。"},{"id":"7","background":"","question":"背景：集团公司某二级单位拟新建一台1000MW超超临界燃煤发电机组工程，已获得集团公司投资决策批复，核准文件已取得，列入集团公司年度投资计划。项目初步设计原则已通过集团公司工程部评审，初步设计方案已完成编制。项目建设单位组织设计单位编制初步设计方案及概算，初步设计概算静态投资25.8亿元，略高于集团公司投资决策批复的可研估算（25.5亿元），超出约3000万元，超出幅度1.18%。设计单位提出需调整厂区总平面布置，增加一座综合办公楼（建筑面积3200平方米），同时拟采用进口三大主机设备方案（较国产设备增加投资约8000万元）。项目进入初步设计评审阶段，发生以下事件：\n事件一（评审准备）： 二级单位组织内部初评审，发现初步设计方案存在以下问题：（1）设计概算超出可研估算3000万元；（2）厂区竖向布置采用全平坡式布置，填方量较大；（3）综合办公楼面积超出《华能设计导则》标准约800平方米；（4）设备选型推荐进口方案，但未进行充分的技术经济比选。二级单位要求项目建设单位组织设计单位修改完善初步设计方案，确保设计概算控制在可研估算以内。\n问题：\n1. 事件一中，初步设计方案存在哪些不符合集团公司管理要求的问题？二级单位应如何督促项目建设单位整改？\n\n背景：事件二（概算对标分析）： 项目建设单位要求设计单位编制造价对标分析专题报告。设计单位选取了《火电工程限额设计参考造价指标》（2025年版）和一个同期在建的同类型项目作为对标对象。对标结果显示：本项目单位造价为2580元/kW，同期对标项目单位造价为2450元/kW，限额指标为2420元/kW。主要差异原因：进口设备费增加约6000万元、厂区土石方工程量偏大约1200万元、综合办公楼增加约2400万元、生活福利设施标准偏高等。经对比，《集团设计导则》中限定全厂辅助及附属建筑物建筑面积标准，本项目超出设计导则限额约5%。\n问题：2. 事件二中，造价对标分析应包含哪些主要内容？请列明对标分析的要点。本项目单位造价超出对标项目和限额指标，请分析可能的原因及控制措施。\n\n背景：事件三（概算复核）： 工程技经中心组织初步设计方案内审会，提出以下审查意见：（1）设计概算超过可研估算，原则不符合集团公司要求；（2）进口设备方案未经充分比选，应补充国产方案的技术经济对比；（3）综合办公楼超标准建设，应予核减；（4）厂区竖向布置土石方工程量偏大，应优化；（5）概算编制中存在部分工程量偏大、单价偏高等问题。\n问题：3. 事件三中，工程技经中心组织初步设计方案内审会的参会单位包括哪些？概算复核中发现的工程量偏大、单价偏高等问题应如何核实和修正？\n\n背景：事件四（概算收口）： 初步设计方案外审后，项目建设单位组织设计单位根据内审、外审意见进行修改完善，进入收口阶段。修改后的初步设计收口方案概算调整为25.6亿元（控制在可研估算以内），综合办公楼面积压减至标准以内，设备方案调整为国产设备（经比选，国产设备可满足生产要求，投资节约6000万元）。\n问题：4. 事件四中，初步设计收口方案应重点补充哪些内容？若初步设计收口概算仍超出可研估算，应如何处理？","answer":"1. 存在问题：①设计概算超出投资决策批复可研估算；②综合办公楼面积超出设计导则标准；③全平坡式竖向布置导致填方量大，未优化；④进口设备方案未进行技术经济比选。\n2.整改措施：二级单位要求项目单位组织设计单位逐条修改，对超估算部分通过限额设计压缩投资；核减办公楼面积至标准以内；优化竖向布置，平衡土石方；补充国产与进口设备比选，优先采用国产设备。\n2. 对标分析内容：与可研估算对比；与限额指标对比；与同期同地区同类优秀项目对比；与设计导则及典型设计对标；分析差异项原因。本项目造价偏高原因：进口设备方案、土石方工程量偏大、办公楼超标准、生活福利设施标准偏高。控制措施：加强限额设计，各专业工程量不高于导则和限额；强化方案比选；严格控制非生产性设施标准；将对标限额作为各分项上限。\n3. 参会单位：集团公司工程部及有关部门、工程技经中心（二部、四部、五部）、二级单位、项目单位、设计单位、造价咨询单位。核实修正方法：工程量核实——组织各专业交叉复核，参考同类工程施工图工程量，重点核实主厂房、锅炉钢结构、主要管道等关键指标，与导则、限额指标差异超±10%的进一步分析。单价核实——核实材料价格是否按信息价或预算价计列，价差是否单独列示；设备价格按合同价或限额指标、同类合同价核实；检查定额套用和系数调整是否有依据。\n4. 收口方案重点补充：设计方案变更部分详细说明；送外审版与收口版概算对比表及变化原因；内审、外审意见逐条落实情况报告。若收口概算仍超出可研估算：若因客观原因（政策调整、建设条件重大变化）需突破，应按规定程序申请调整可研估算或重新履行投资决策程序，经集团公司审批后方可执行。","difficulty":"难","category":"技经管理","explanation":"问题1考查初步设计评审的核心要求——设计概算不得超过投资决策批复可研估算，这是集团公司“概算控制”的红线。同时涉及华能设计导则对建筑面积的限制要求，体现了“功能适配、投资节约”的原则。\n问题2考查造价对标分析的方法和要点，这是初步设计阶段控制造价的重要工具。要求理解工程量偏差（土石方）和单价偏差（设备、材料）两类差异的区分，以及限额设计指标的约束作用。\n问题3考查概算审查的具体方法，涉及工程量核实和单价核实两个维度。工程量核实应“按专业分段、横向对比”，单价核实则需检查取价依据的合理性。\n问题4考查概算收口阶段的管理要求，强调收口阶段必须对比送外审版与收口版的概算变化，做到变化有依据、程序有闭环。同时明确收口概算仍超概算的处理路径——按程序报批，不得擅自突破。"},{"id":"8","background":"","question":"题目背景：某电厂机组供热改造项目为固定单价合同，合同约定按《电力建设工程工程量清单计价规范》执行，施工单位报送结算资料：①清单内工程量超原清单12%；②无审批手续新增3项工作内容；③安全文明施工费下浮10%；④材料价格上涨18%，要求建设单位全额承担。\n问题：1.工程量超出原清单12%，应如何进行调整？2.无审批新增内容可否计价？3.安全文明施工费下浮是否合规？4.材料价差应如何调整？","answer":"1.按合同约定执行，工程量超原清单12%，按《电力建设工程工程量清单计价规范》未超15%不予调整。2.不予计价，工程变更必须先审批后实施。3.不合规，安全文明施工费为不可竞争费用，严禁下浮。4.按合同风险分担执行，约定幅度内由施工单位承担，超出部分按造价信息调整。","difficulty":"中","category":"技经管理","explanation":"坚持程序合规、量价有据、不可竞争费用不调整。"},{"id":"9","background":"","question":"某火电企业对现有2×300MW燃煤发电机组进行灵活性改造项目，项目总投资约8亿元，采用公开招标方式选择施工总承包单位，招标控制价为7.8亿元。项目实施过程中发生如下事件：\n事件1：项目招标过程中，共有A、B、C、D、E五家单位提交投标文件，开标后评标委员会发现，A单位的投标文件未加盖单位公章，也无法定代表人或其授权代理人的签字；B单位的投标报价为7.9亿元，超出了招标控制价7.8亿元；C单位的投标文件中，已标价工程量清单的总价与各分项合价汇总金额不一致，总价低于分项合价汇总金额；D单位和E单位的投标文件均符合招标文件要求。\n事件2：评标委员会完成评标后，推荐D单位为第一中标候选人，E单位为第二中标候选人，公示期为3日。公示期间，有投标人对评标结果提出异议，认为评标委员会在评标过程中存在违规行为，招标人收到异议后，未在规定时间内作出答复，直接向D单位发出了中标通知书。\n事件3：D单位中标后，与招标人签订了固定总价合同，合同总价为7.2亿元，合同约定，除设计变更和不可抗力外，合同总价不作调整。项目施工过程中，因国家环保政策调整，需要新增烟气脱硝的改造内容，由此增加工程费用3000万元，D单位向招标人提出了费用索赔和工期延期申请。\n事件4：项目竣工后，招标人委托第三方造价咨询单位对竣工结算进行审核，审核过程中发现，D单位提交的结算资料中，有部分现场签证没有监理单位和建设单位的签字确认，涉及金额约500万元，审核单位对该部分签证费用不予认可，D单位对此提出异议，认为该部分签证内容已经实际施工，应当予以计量。\n\n问题：\n1. 针对事件1，评标委员会应如何处理A、B、C三家单位的投标文件？说明理由。\n2. 针对事件2，招标人的行为存在哪些违规之处？说明理由。\n3. 针对事件3，D单位提出的费用索赔和工期延期申请是否成立？说明理由。\n4. 针对事件4，审核单位对无签字确认的现场签证费用不予认可是否合理？说明理由。","answer":"1. 评标委员会对三家单位投标文件的处理方式及理由：\n① A单位的投标文件：评标委员会应当否决其投标。\n理由：根据《招标投标法实施条例》，投标文件未经投标单位盖章和单位负责人签字的，评标委员会应当否决其投标。A单位的投标文件未加盖单位公章，也无法定代表人或其授权代理人的签字，符合否决投标的法定情形。\n② B单位的投标文件：评标委员会应当否决其投标。\n理由：根据《招标投标法实施条例》，投标报价高于招标文件设定的最高投标限价的，评标委员会应当否决其投标。B单位的投标报价7.9亿元，超出了招标控制价7.8亿元，符合否决投标的法定情形。\n③ C单位的投标文件：评标委员会应当要求C单位对投标文件的总价与分项合价不一致的情况进行书面澄清、说明，根据澄清结果再进行处理。\n理由：根据《招标投标法实施条例》，投标文件中有含义不明确的内容、明显文字或者计算错误，评标委员会认为需要投标人作出必要澄清、说明的，应当书面通知该投标人。C单位的投标文件中，总价与各分项合价汇总金额不一致，属于明显的计算错误，评标委员会应当先要求C单位进行澄清，根据澄清结果判断是否存在低于成本报价等情形，再决定是否否决其投标。\n2. 招标人行为的违规之处及理由：\n① 招标人未在规定时间内对投标人的异议作出答复，属于违规行为。\n理由：根据《招标投标法实施条例》，投标人或者其他利害关系人对依法必须进行招标的项目的评标结果有异议的，应当在中标候选人公示期间提出。招标人应当自收到异议之日起3日内作出答复；作出答复前，应当暂停招标投标活动。本事件中，招标人收到异议后，未在3日内作出答复，也未暂停招标投标活动，直接发出中标通知书，违反了上述规定。\n② 招标人在异议处理期间直接发出中标通知书，属于违规行为。\n理由：根据《招标投标法实施条例》，招标人作出异议答复前，应当暂停招标投标活动，不得发出中标通知书。本事件中，招标人在异议未处理完毕的情况下，直接向D单位发出中标通知书，违反了上述规定，中标通知书的发出程序不合法。\n3. D单位提出的费用索赔和工期延期申请成立。\n理由：根据《民法典》和建设工程合同相关规定，因国家政策调整导致合同内容发生重大变化，属于不可抗力或情势变更的情形，当事人可以请求变更或解除合同。本事件中，因国家环保政策调整，需要新增烟气脱硝的改造内容，属于合同签订时无法预见的、非不可抗力造成的不属于商业风险的重大变化，继续履行合同对于D单位明显不公平，D单位有权向招标人提出费用索赔和工期延期申请，招标人应当根据政策调整的内容，对合同价款和工期进行相应调整。\n4. 审核单位对无签字确认的现场签证费用不予认可的行为合理。\n理由：根据建设工程工程量清单计价规范和竣工结算审核的相关规定，现场签证必须有施工单位、监理单位、建设单位三方的签字确认，才能作为竣工结算的依据。没有签字确认的现场签证，无法证明签证内容的真实性、准确性和合规性，审核单位有权不予认可。D单位主张签证内容已经实际施工，应当补充提供监理单位和建设单位的签字确认资料，或提供其他能够证明签证内容真实发生的有效证据，否则审核单位对该部分费用不予认可的行为是合理的。","difficulty":"难","category":"技经管理","explanation":"本案例围绕火电灵活性改造项目的招投标、合同管理、索赔管理、竣工结算审核等核心考点，综合考察了招投标合规性、合同责任划分、索赔管理、结算审核等火电企业技经工作的核心内容，贴合火电企业技改项目的实际管理场景，是火电基建技经人员必须掌握的核心业务能力。"},{"id":"10","background":"","question":"某火电厂一台600MW机组拟进行超低排放改造，改造投资2000万元，当年完成并投用。改造后每年可节约燃料成本和排污费合计400万元，同时新增设备维护费50万元，净增年效益350万元。改造后机组可继续运行12年，基准收益率7%，无残值回收。\n问题：\n\n1. 计算该技术改造方案的增量投资财务净现值（ΔFNPV），并判断方案是否可行。\n2. 采用内插法估算增量投资内部收益率（ΔFIRR），并基于收益率基准再次判断方案可行性。\n   （已知：(P/A,7%,12)=7.9427，(P/A,13%,12)=5.9176，(P/A,14%,12)=5.6603）",
